name: Build Apex Turbo F1 Release APK

on:
push:
branches: [ main, master ]
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
- name: Checkout Code
  uses: actions/checkout@v4

- name: Set up Java
  uses: actions/setup-java@v4
  with:
    distribution: 'zulu'
    java-version: '17'

- name: Set up Flutter
  uses: subosito/flutter-action@v2
  with:
    flutter-version: '3.22.x'
    channel: 'stable'

- name: Write Clean pubspec.yaml
  run: |
    cat << 'EOF' > pubspec.yaml
    name: apexturbof1
    description: Apex Turbo F1 & GT - Android 10+ Edition
    publish_to: 'none'
    version: 2.0.0+2

    environment:
      sdk: '>=3.0.0 <4.0.0'

    dependencies:
      flutter:
        sdk: flutter
      webview_flutter: ^4.8.0
      google_mobile_ads: ^5.1.0
      url_launcher: ^6.3.0

    flutter:
      uses-material-design: true
      assets:
        - assets/index.html
    EOF

- name: Recreate Android Project Structure
  run: |
    flutter create . --org com.govindgupta --project-name apexturbof1

- name: Fix Android Gradle Properties & Wrapper
  run: |
    echo "android.useAndroidX=true" > android/gradle.properties
    echo "android.enableJetifier=true" >> android/gradle.properties
    echo "org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError" >> android/gradle.properties
    
    mkdir -p android/gradle/wrapper
    cat << 'EOF' > android/gradle/wrapper/gradle-wrapper.properties
    distributionBase=GRADLE_USER_HOME
    distributionPath=wrapper/dists
    distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
    networkTimeout=10000
    validateDistributionUrl=true
    zipStoreBase=GRADLE_USER_HOME
    zipStorePath=gradle/wrapper
    EOF

- name: Write Clean lib/main.dart (Landscape Mode & AdMob Bridge)
  run: |
    mkdir -p lib
    cat << 'EOF' > lib/main.dart
    import 'dart:async';
    import 'package:flutter/material.dart';
    import 'package:flutter/services.dart';
    import 'package:webview_flutter/webview_flutter.dart';
    import 'package:google_mobile_ads/google_mobile_ads.dart';
    import 'package:url_launcher/url_launcher.dart';

    void main() async {
      WidgetsFlutterBinding.ensureInitialized();
      await MobileAds.instance.initialize();
      await SystemChrome.setPreferredOrientations([
        DeviceOrientation.landscapeLeft,
        DeviceOrientation.landscapeRight,
      ]);
      await SystemChrome.setEnabledSystemUIMode(SystemUiMode.immersiveSticky);
      runApp(const MaterialApp(
        debugShowCheckedModeBanner: false,
        home: ApexTurboRacingApp(),
      ));
    }

    class ApexTurboRacingApp extends StatefulWidget {
      const ApexTurboRacingApp({super.key});

      @override
      State<ApexTurboRacingApp> createState() => _ApexTurboRacingAppState();
    }

    class _ApexTurboRacingAppState extends State<ApexTurboRacingApp> {
      late final WebViewController _controller;
      BannerAd? _bannerAd;
      bool _isBannerReady = false;
      RewardedAd? _rewardedAd;
      InterstitialAd? _interstitialAd;

      final String _realBannerId = 'ca-app-pub-1590363558146928/9630631281';
      final String _realInterstitialId = 'ca-app-pub-1590363558146928/7196039630';
      final String _realRewardedId = 'ca-app-pub-1590363558146928/2274885449';

      @override
      void initState() {
        super.initState();
        _loadBannerAd();
        _loadInterstitialAd();
        _loadRewardedAd();

        _controller = WebViewController()
          ..setJavaScriptMode(JavaScriptMode.unrestricted)
          ..setBackgroundColor(const Color(0xFF030712))
          ..setNavigationDelegate(
            NavigationDelegate(
              onNavigationRequest: (NavigationRequest request) async {
                if (request.url.contains('youtube.com') || request.url.contains('youtu.be')) {
                  final Uri uri = Uri.parse(request.url);
                  if (await canLaunchUrl(uri)) {
                    await launchUrl(uri, mode: LaunchMode.externalApplication);
                  }
                  return NavigationDecision.prevent;
                }
                return NavigationDecision.navigate;
              },
            ),
          )
          ..addJavaScriptChannel(
            'AdMobBridge',
            onMessageReceived: (JavaScriptMessage message) {
              if (message.message == 'showInterstitial') {
                _showInterstitialAd();
              } else if (message.message == 'showRewarded') {
                _showRewardedAd();
              }
            },
          );

        _initWebView();
      }

      Future<void> _initWebView() async {
        await _controller.clearCache();
        await _controller.loadFlutterAsset('assets/index.html');
      }

      void _loadBannerAd() {
        _bannerAd = BannerAd(
          adUnitId: _realBannerId,
          request: const AdRequest(),
          size: AdSize.banner,
          listener: BannerAdListener(
            onAdLoaded: (ad) { setState(() { _isBannerReady = true; }); },
            onAdFailedToLoad: (ad, err) {
              ad.dispose();
              setState(() { _isBannerReady = false; });
              Future.delayed(const Duration(seconds: 6), _loadBannerAd);
            },
          ),
        )..load();
      }

      void _loadInterstitialAd() {
        InterstitialAd.load(
          adUnitId: _realInterstitialId,
          request: const AdRequest(),
          adLoadCallback: InterstitialAdLoadCallback(
            onAdLoaded: (ad) { _interstitialAd = ad; },
            onAdFailedToLoad: (error) { _interstitialAd = null; Future.delayed(const Duration(seconds: 6), _loadInterstitialAd); },
          ),
        );
      }

      void _showInterstitialAd() {
        if (_interstitialAd != null) {
          _interstitialAd!.fullScreenContentCallback = FullScreenContentCallback(
            onAdDismissedFullScreenContent: (ad) { ad.dispose(); _interstitialAd = null; _loadInterstitialAd(); },
            onAdFailedToShowFullScreenContent: (ad, error) { ad.dispose(); _interstitialAd = null; _loadInterstitialAd(); },
          );
          _interstitialAd!.show();
          _interstitialAd = null;
        } else {
          _loadInterstitialAd();
        }
      }

      void _loadRewardedAd() {
        RewardedAd.load(
          adUnitId: _realRewardedId,
          request: const AdRequest(),
          rewardedAdLoadCallback: RewardedAdLoadCallback(
            onAdLoaded: (ad) { _rewardedAd = ad; },
            onAdFailedToLoad: (error) { _rewardedAd = null; Future.delayed(const Duration(seconds: 5), _loadRewardedAd); },
          ),
        );
      }

      void _showRewardedAd() {
        if (_rewardedAd != null) {
          _rewardedAd!.fullScreenContentCallback = FullScreenContentCallback(
            onAdDismissedFullScreenContent: (ad) { ad.dispose(); _rewardedAd = null; _loadRewardedAd(); },
            onAdFailedToShowFullScreenContent: (ad, error) { ad.dispose(); _rewardedAd = null; _loadRewardedAd(); },
          );
          _rewardedAd!.show(
            onUserEarnedReward: (AdWithoutView ad, RewardItem reward) {
              _controller.runJavaScript('if(window.resolveAdReward) window.resolveAdReward();');
            },
          );
          _rewardedAd = null;
        } else {
          _loadRewardedAd();
        }
      }

      @override
      void dispose() {
        _bannerAd?.dispose();
        _interstitialAd?.dispose();
        _rewardedAd?.dispose();
        super.dispose();
      }

      @override
      Widget build(BuildContext context) {
        return Scaffold(
          backgroundColor: const Color(0xFF030712),
          body: SafeArea(
            child: Stack(
              children: [
                Positioned.fill(
                  child: WebViewWidget(controller: _controller),
                ),
                if (_isBannerReady && _bannerAd != null)
                  Align(
                    alignment: Alignment.bottomCenter,
                    child: Container(
                      color: Colors.black87,
                      width: _bannerAd!.size.width.toDouble(),
                      height: _bannerAd!.size.height.toDouble(),
                      child: AdWidget(ad: _bannerAd!),
                    ),
                  ),
              ],
            ),
          ),
        );
      }
    }
    EOF

- name: Create Apex Turbo F1 HTML Game Asset
  run: |
    mkdir -p assets
    cat << 'EOF' > assets/index.html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
      <title>Apex Turbo F1 & GT - Android 10+ Edition</title>
      <script src="https://cdn.tailwindcss.com"></script>
      <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
      <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
      <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; touch-action: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #030712; font-family: 'Inter', system-ui, sans-serif; }
        #gameContainer { position: relative; width: 100vw; height: 100vh; background: #030712; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; }
        .screen { position: absolute; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; background: radial-gradient(circle at center, rgba(15, 23, 42, 0.88) 0%, rgba(3, 7, 18, 0.96) 100%); backdrop-filter: blur(12px); }
        #homeScreen { background: radial-gradient(circle at center, rgba(9, 13, 22, 0.42) 0%, rgba(3, 7, 18, 0.88) 100%); backdrop-filter: blur(3px); }
        @keyframes glowPulse {
          0%, 100% { text-shadow: 0 0 20px rgba(239, 68, 68, 0.85), 0 0 40px rgba(245, 158, 11, 0.6), 0 4px 12px rgba(0,0,0,0.95); transform: scale(1); }
          50% { text-shadow: 0 0 35px rgba(245, 158, 11, 1), 0 0 70px rgba(239, 68, 68, 0.95); transform: scale(1.03); }
        }
        @keyframes floatCar {
          0%, 100% { transform: translateY(0px) rotate(0deg); }
          50% { transform: translateY(-6px) rotate(1deg); }
        }
        .title-animated { font-size: clamp(28px, 5vw, 54px); font-weight: 900; letter-spacing: 3px; color: #facc15; text-transform: uppercase; animation: glowPulse 2.5s infinite ease-in-out; text-align: center; font-style: italic; }
        .live-hero-car { animation: floatCar 2.4s infinite ease-in-out; }
        .mood-pill { background: rgba(15, 23, 42, 0.88); border: 1.5px solid #475569; color: #cbd5e1; padding: 6px 13px; border-radius: 999px; font-size: 11px; font-weight: 900; cursor: pointer; transition: all 0.15s ease; display: inline-flex; align-items: center; gap: 5px; text-transform: uppercase; }
        .mood-pill.active { background: linear-gradient(135deg, #ef4444 0%, #d97706 100%); color: #ffffff; border-color: #fde047; box-shadow: 0 0 16px rgba(245, 158, 11, 0.65); transform: scale(1.05); }
        .arcade-btn { background: linear-gradient(180deg, #f59e0b 0%, #b45309 100%); border: 2px solid #fde047; color: #fff; font-size: 14px; font-weight: 900; padding: 11px 26px; border-radius: 999px; cursor: pointer; box-shadow: 0 5px 0 #78350f, 0 10px 20px rgba(0,0,0,0.8); text-transform: uppercase; transition: all 0.1s ease; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
        .arcade-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #78350f; }
        .btn-green { background: linear-gradient(180deg, #10b981 0%, #047857 100%); border-color: #6ee7b7; box-shadow: 0 5px 0 #064e3b, 0 10px 20px rgba(0,0,0,0.8); }
        .btn-blue { background: linear-gradient(180deg, #0284c7 0%, #0369a1 100%); border-color: #7dd3fc; box-shadow: 0 5px 0 #0c4a6e, 0 10px 20px rgba(0,0,0,0.8); }
        .btn-purple { background: linear-gradient(180deg, #8b5cf6 0%, #6d28d9 100%); border-color: #c4b5fd; box-shadow: 0 5px 0 #4c1d95, 0 10px 20px rgba(0,0,0,0.8); }
        .btn-red-yt { background: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%); border-color: #fca5a5; box-shadow: 0 5px 0 #7f1d1d, 0 10px 20px rgba(0,0,0,0.8); }
        .hud-bar { position: absolute; top: 12px; left: 18px; right: 18px; display: none; justify-content: space-between; align-items: stretch; z-index: 30; pointer-events: none; gap: 10px; }
        .hud-cluster { display: flex; align-items: center; gap: 10px; }
        .hud-card { background: linear-gradient(135deg, rgba(15, 23, 42, 0.92) 0%, rgba(3, 7, 18, 0.96) 100%); border: 1.5px solid rgba(56, 189, 248, 0.35); border-bottom: 3px solid #0284c7; color: #f8fafc; padding: 6px 14px; border-radius: 16px; display: flex; align-items: center; gap: 10px; box-shadow: 0 8px 20px rgba(0,0,0,0.75); backdrop-filter: blur(10px); }
        .hud-card-gold { border-color: rgba(245, 158, 11, 0.45); border-bottom-color: #d97706; }
        .hud-card-emerald { border-color: rgba(16, 185, 129, 0.45); border-bottom-color: #059669; }
        .hud-card-purple { border-color: rgba(168, 85, 247, 0.45); border-bottom-color: #7c3aed; }
        .hud-label { font-size: 9px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; color: #94a3b8; line-height: 1; }
        .hud-val { font-size: 17px; font-weight: 900; font-family: monospace; line-height: 1.1; }
        .hud-home-btn { pointer-events: auto; cursor: pointer; background: linear-gradient(180deg, #ef4444 0%, #991b1b 100%); border: 2px solid #fca5a5; color: #fff; padding: 0 14px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; font-weight: 900; }
        .gamepad { position: absolute; bottom: 48px; left: 20px; right: 20px; display: none; justify-content: space-between; align-items: flex-end; z-index: 30; pointer-events: none; }
        .pad-cluster { display: flex; gap: 14px; pointer-events: auto; align-items: flex-end; }
        .horn-btn { width: 58px; height: 58px; border-radius: 16px; background: radial-gradient(circle, #f59e0b 0%, #b45309 100%); border: 2.5px solid #fde047; color: #fff; font-size: 24px; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 0 #78350f; cursor: pointer; margin-bottom: 8px; }
        .gear-lever-box { width: 62px; height: 128px; background: linear-gradient(180deg, #0f172a 0%, #020617 100%); border: 2px solid #475569; border-radius: 16px; padding: 6px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; margin-bottom: 4px; position: relative; }
        .gear-slot-track { width: 10px; height: 64px; background: #1e293b; border-radius: 99px; border: 1px solid #334155; position: relative; display: flex; justify-content: center; }
        .gear-knob { width: 38px; height: 24px; border-radius: 8px; background: linear-gradient(180deg, #ef4444 0%, #991b1b 100%); border: 2px solid #fca5a5; color: #fff; font-size: 10px; font-weight: 900; display: flex; align-items: center; justify-content: center; position: absolute; left: -15px; top: 20px; cursor: pointer; }
        .gear-shift-tap { width: 100%; height: 22px; background: #1e293b; border: 1px solid #475569; border-radius: 6px; color: #38bdf8; font-size: 10px; font-weight: 900; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        #adMobBannerBar { position: absolute; bottom: 0; left: 0; right: 0; height: 36px; background: linear-gradient(90deg, #020617 0%, #0f172a 50%, #020617 100%); border-top: 1.5px solid #334155; z-index: 60; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 0 14px; font-size: 11px; color: #cbd5e1; pointer-events: auto; }
        .ad-badge { background: #f59e0b; color: #030712; font-weight: 900; font-size: 9px; padding: 1px 5px; border-radius: 4px; text-transform: uppercase; }
        .car-pedal { position: relative; border-radius: 12px; cursor: pointer; transition: transform 0.08s ease; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 12px 6px; box-shadow: 0 10px 25px rgba(0,0,0,0.9); }
        .pedal-accel { width: 64px; height: 135px; background: linear-gradient(180deg, #475569 0%, #1e293b 50%, #0f172a 100%); border: 3px solid #94a3b8; transform-origin: bottom center; }
        .pedal-accel.pressed { transform: perspective(300px) rotateX(22deg) scaleY(0.92); border-color: #10b981; }
        .pedal-brake-real { width: 78px; height: 92px; background: linear-gradient(180deg, #475569 0%, #1e293b 60%, #0f172a 100%); border: 3px solid #94a3b8; transform-origin: bottom center; margin-bottom: 4px; }
        .pedal-brake-real.pressed { transform: perspective(300px) rotateX(22deg) scaleY(0.92); border-color: #ef4444; }
        .pedal-grip { width: 80%; height: 8px; background: #090d16; border-radius: 4px; }
        #steeringHandleWrap { width: 145px; height: 145px; position: relative; display: flex; align-items: center; justify-content: center; touch-action: none; cursor: grab; }
        #steeringWheelSVG { width: 100%; height: 100%; transition: transform 0.05s linear; }
        .steer-btn { width: 68px; height: 68px; border-radius: 50%; background: radial-gradient(circle, #334155 0%, #0f172a 100%); border: 3px solid #64748b; color: #fff; font-size: 26px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .garage-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 14px; max-height: 58vh; overflow-y: auto; width: 100%; max-width: 920px; padding: 12px; touch-action: pan-y; }
        .car-card { background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%); border: 2px solid #334155; border-radius: 18px; padding: 12px; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
        .car-card.selected { border-color: #f59e0b; background: linear-gradient(180deg, #292524 0%, #0f172a 100%); }
        #customModal { position: absolute; inset: 0; background: rgba(3, 7, 18, 0.92); z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(10px); }
        .theme-card { background: linear-gradient(180deg, rgba(30, 41, 59, 0.9) 0%, rgba(15, 23, 42, 0.95) 100%); border: 2px solid #334155; border-radius: 20px; padding: 16px; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .theme-card.active { border-color: #f59e0b; }
      </style>
    </head>
    <body>
      <div id="gameContainer">
        <div id="homeScreen" class="screen">
          <div class="flex flex-wrap items-center justify-center gap-3 mb-1">
            <div class="flex items-center gap-2 px-3.5 py-1 rounded-full bg-slate-950/95 border-2 border-red-500/80">
