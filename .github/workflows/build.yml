              <div class="glass-card p-4 flex items-center justify-between border-l-4 border-l-emerald-400">
                <div class="flex items-center gap-3">
                  <div class="w-12 h-12 rounded-2xl bg-emerald-500/20 flex items-center justify-center text-xl font-black text-emerald-400">30s</div>
                  <div>
                    <div class="font-black text-sm text-white">30 Sec Ad Task</div>
                    <div class="text-[11px] text-slate-400">Get 0.001% Ad Share</div>
                    <div class="text-xs font-black text-emerald-400 mt-0.5">+10 Coins (₹0.010)</div>
                  </div>
                </div>
                <button onclick="startAdWatchTask(30)" class="emerald-gradient btn-press text-white font-black text-xs px-4 py-2.5 rounded-xl">▶️ WATCH</button>
              </div>
              <div class="glass-card p-4 flex items-center justify-between border-l-4 border-l-amber-400">
                <div class="flex items-center gap-3">
                  <div class="w-12 h-12 rounded-2xl bg-amber-500/20 flex items-center justify-center text-xl font-black text-amber-400">60s</div>
                  <div>
                    <div class="font-black text-sm text-white">60 Sec Mega Ad Task</div>
                    <div class="text-[11px] text-slate-400">Double Sponsor Share</div>
                    <div class="text-xs font-black text-amber-400 mt-0.5">+25 Coins (₹0.025)</div>
                  </div>
                </div>
                <button onclick="startAdWatchTask(60)" class="gold-gradient btn-press text-slate-950 font-black text-xs px-4 py-2.5 rounded-xl">▶️ WATCH</button>
              </div>
            </div>

            <div id="tabSpin" style="display:none;" class="flex flex-col items-center gap-3">
              <div class="glass-card p-5 w-full text-center relative">
                <h3 class="text-base font-black text-amber-400 mb-1">🎡 LUCKY SPIN & WIN</h3>
                <p class="text-[11px] text-slate-300 mb-4">Spin the wheel! Watch ad before every spin.</p>
                <div class="relative w-64 h-64 mx-auto my-2">
                  <canvas id="wheelCanvas" width="260" height="260" class="w-full h-full transition-transform duration-[4000ms] cubic-bezier(0.15, 0.85, 0.12, 1)"></canvas>
                  <div class="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-2 w-0 h-0 border-x-[10px] border-x-transparent border-t-[18px] border-t-amber-400 z-20"></div>
                </div>
                <button onclick="triggerSpinWheel()" class="w-full mt-4 gold-gradient btn-press text-slate-950 font-black py-3 rounded-xl text-sm uppercase shadow-lg">🎯 SPIN NOW (WATCH AD)</button>
                <div id="spinResultMsg" class="text-xs font-bold text-amber-300 mt-2 min-h-[20px]"></div>
              </div>
            </div>

            <div id="tabRefer" style="display:none;" class="flex flex-col gap-3">
              <div class="glass-card p-5 text-center">
                <div class="text-4xl mb-2">🎁</div>
                <h3 class="text-lg font-black text-amber-400">REFER FRIENDS & EARN</h3>
                <div class="bg-slate-900 border-2 border-dashed border-amber-400 rounded-2xl p-3 my-4">
                  <div id="uiMyRefCode" class="text-2xl font-black text-amber
