name: Build Car Racing Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Write Clean pubspec.yaml
        run: |
          cat << 'EOF' > pubspec.yaml
          name: speedracer
          description: Apex Turbo F1 Highway Racing Portrait
          publish_to: 'none'
          version: 1.0.2+3

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            webview_flutter: ^4.8.0
            webview_flutter_android: ^3.16.0
            google_mobile_ads: ^5.1.0

          flutter:
            uses-material-design: true
            assets:
              - assets/index.html
          EOF

      - name: Recreate Android Project Structure
        run: flutter create . --org com.rahulgupta --project-name speedracer

      - name: Apply New Apex Turbo Logo as Official Launcher Icon
        run: |
          pip install Pillow
          python3 -c "
          import os, glob, shutil
          from PIL import Image, ImageDraw

          anydpi_dir = 'android/app/src/main/res/mipmap-anydpi-v26'
          if os.path.exists(anydpi_dir):
              shutil.rmtree(anydpi_dir, ignore_errors=True)

          candidates = []
          for ext in ('*.png', '*.jpg', '*.jpeg', '*.webp', '**/*.png', '**/*.jpg', '**/*.jpeg', '**/*.webp'):
              for f in glob.glob(ext, recursive=True):
                  norm = f.replace('\\\\', '/')
                  if any(x in norm for x in ('android/', 'build/', 'ios/', 'web/', 'linux/', 'macos/', 'windows/')):
                      continue
                  if f not in candidates:
                      candidates.append(f)

          non_rb = [f for f in candidates if 'red' not in os.path.basename(f).lower() and 'bull' not in os.path.basename(f).lower()]

          source_img = None
          for f in non_rb:
              low = os.path.basename(f).lower()
              if any(k in low for k in ('apex', 'turbo', 'watermarked', 'logo', 'icon', 'f1')):
                  source_img = f
                  break

          if not source_img and non_rb:
              non_rb.sort(key=lambda x: os.path.getmtime(x), reverse=True)
              source_img = non_rb[0]

          print(f'Selected Apex Turbo Icon File: {source_img}')

          sizes = {'mipmap-mdpi': 48, 'mipmap-hdpi': 72, 'mipmap-xhdpi': 96, 'mipmap-xxhdpi': 144, 'mipmap-xxxhdpi': 192}
          for folder, size in sizes.items():
              d_path = f'android/app/src/main/res/{folder}'
              os.makedirs(d_path, exist_ok=True)
              if source_img and os.path.exists(source_img):
                  img = Image.open(source_img).convert('RGBA').resize((size, size), Image.Resampling.LANCZOS)
              else:
                  img = Image.new('RGBA', (size, size), (11, 18, 35, 255))
                  dr = ImageDraw.Draw(img)
                  m = int(size * 0.06)
                  dr.rounded_rectangle([m, m, size - m, size - m], radius=int(size * 0.2), fill=(15, 23, 42, 255), outline=(56, 189, 248, 255), width=max(2, int(size * 0.04)))
                  dr.polygon([(int(size*0.2), int(size*0.65)), (int(size*0.5), int(size*0.22)), (int(size*0.8), int(size*0.65))], fill=(245, 158, 11, 255))
              img.save(f'{d_path}/ic_launcher.png')
              img.save(f'{d_path}/ic_launcher_round.png')
          "

      - name: Fix Android Gradle Properties & Wrapper
        run: |
          echo "android.useAndroidX=true" > android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError" >> android/gradle.properties
          mkdir -p android/gradle/wrapper
          cat << 'EOF' > android/gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=gradle/wrapper
          EOF

      - name: Write lib/main.dart in Portrait Mode with AdMob
        run: |
          mkdir -p lib
          cat << 'EOF' > lib/main.dart
          import 'dart:async';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          import 'package:webview_flutter_android/webview_flutter_android.dart';
          import 'package:google_mobile_ads/google_mobile_ads.dart';

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await MobileAds.instance.initialize();
            SystemChrome.setPreferredOrientations([
              DeviceOrientation.portraitUp,
              DeviceOrientation.portraitDown,
            ]);
            SystemChrome.setEnabledSystemUIMode(SystemUiMode.immersiveSticky);
            runApp(const MaterialApp(
              debugShowCheckedModeBanner: false,
              home: CarRacingApp(),
            ));
          }

          class CarRacingApp extends StatefulWidget {
            const CarRacingApp({super.key});
            @override
            State<CarRacingApp> createState() => _CarRacingState();
          }

          class _CarRacingState extends State<CarRacingApp> {
            late final WebViewController _controller;
            BannerAd? _bannerAd;
            bool _isBannerReady = false;
            RewardedAd? _rewardedAd;
            InterstitialAd? _interstitialAd;

            final String _realBannerId = 'ca-app-pub-1590363558146928/9630631281';
            final String _realInterstitialId = 'ca-app-pub-1590363558146928/7196039630';
            final String _realRewardedId = 'ca-app-pub-1590363558146928/2274885449';

            @override
            void initState() {
              super.initState();
              _loadBannerAd();
              _loadInterstitialAd();
              _loadRewardedAd();

              _controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setBackgroundColor(const Color(0xFF090D16))
                ..addJavaScriptChannel(
                  'AdMobBridge',
                  onMessageReceived: (JavaScriptMessage message) {
                    if (message.message == 'showInterstitial') {
                      _showInterstitialAd();
                    } else if (message.message == 'showRewarded') {
                      _showRewardedAd();
                    }
                  },
                );

              if (_controller.platform is AndroidWebViewController) {
                (_controller.platform as AndroidWebViewController)
                    .setMediaPlaybackRequiresUserGesture(false);
              }

              _initWebView();
            }

            Future<void> _initWebView() async {
              await _controller.clearCache();
              await _controller.loadFlutterAsset('assets/index.html');
            }

            void _loadBannerAd() {
              _bannerAd?.dispose();
              _bannerAd = BannerAd(
                adUnitId: _realBannerId,
                request: const AdRequest(),
                size: AdSize.banner,
                listener: BannerAdListener(
                  onAdLoaded: (ad) {
                    if (mounted) setState(() => _isBannerReady = true);
                  },
                  onAdFailedToLoad: (ad, err) {
                    ad.dispose();
                    if (mounted) setState(() => _isBannerReady = false);
                    Future.delayed(const Duration(seconds: 4), _loadBannerAd);
                  },
                ),
              )..load();
            }

            void _loadInterstitialAd() {
              InterstitialAd.load(
                adUnitId: _realInterstitialId,
                request: const AdRequest(),
                adLoadCallback: InterstitialAdLoadCallback(
                  onAdLoaded: (ad) => _interstitialAd = ad,
                  onAdFailedToLoad: (err) {
                    _interstitialAd = null;
                    Future.delayed(const Duration(seconds: 4), _loadInterstitialAd);
                  },
                ),
              );
            }

            void _showInterstitialAd() {
              if (_interstitialAd != null) {
                _interstitialAd!.fullScreenContentCallback = FullScreenContentCallback(
                  onAdDismissedFullScreenContent: (ad) {
                    ad.dispose();
                    _interstitialAd = null;
                    _loadInterstitialAd();
                  },
                  onAdFailedToShowFullScreenContent: (ad, err) {
                    ad.dispose();
                    _interstitialAd = null;
                    _loadInterstitialAd();
                  },
                );
                _interstitialAd!.show();
                _interstitialAd = null;
              } else {
                _loadInterstitialAd();
              }
            }

            void _loadRewardedAd() {
              RewardedAd.load(
                adUnitId: _realRewardedId,
                request: const AdRequest(),
                rewardedAdLoadCallback: RewardedAdLoadCallback(
                  onAdLoaded: (ad) => _rewardedAd = ad,
                  onAdFailedToLoad: (err) {
                    _rewardedAd = null;
                    Future.delayed(const Duration(seconds: 4), _loadRewardedAd);
                  },
                ),
              );
            }

            void _showRewardedAd() {
              if (_rewardedAd != null) {
                _rewardedAd!.fullScreenContentCallback = FullScreenContentCallback(
                  onAdDismissedFullScreenContent: (ad) {
                    ad.dispose();
                    _rewardedAd = null;
                    _loadRewardedAd();
                  },
                  onAdFailedToShowFullScreenContent: (ad, err) {
                    ad.dispose();
                    _rewardedAd = null;
                    _controller.runJavaScript("if(window.onAdNotLoaded) window.onAdNotLoaded();");
                    _loadRewardedAd();
                  },
                );
                _rewardedAd!.show(
                  onUserEarnedReward: (AdWithoutView ad, RewardItem reward) {
                    _controller.runJavaScript('if(window.onRewardedAdReward) window.onRewardedAdReward();');
                  },
                );
                _rewardedAd = null;
              } else {
                _controller.runJavaScript("if(window.onAdNotLoaded) window.onAdNotLoaded();");
                _loadRewardedAd();
              }
            }

            @override
            void dispose() {
              _bannerAd?.dispose();
              _interstitialAd?.dispose();
              _rewardedAd?.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF090D16),
                body: SafeArea(
                  child: Column(
                    children: [
                      Expanded(child: WebViewWidget(controller: _controller)),
                      Container(
                        width: double.infinity,
                        height: 50,
                        color: const Color(0xFF090D16),
                        alignment: Alignment.center,
                        child: (_isBannerReady && _bannerAd != null)
                            ? SizedBox(
                                width: _bannerAd!.size.width.toDouble(),
                                height: _bannerAd!.size.height.toDouble(),
                                child: AdWidget(ad: _bannerAd!),
                              )
                            : const Text(
                                'SPONSORED AD BANNER ACTIVE',
                                style: TextStyle(color: Color(0xFF94A3B8), fontSize: 10, fontWeight: FontWeight.bold, letterSpacing: 1.2),
                              ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

      - name: Create Portrait & Colourful Apex Turbo F1 HTML Engine
        run: |
          mkdir -p assets
          cat << 'EOF' > assets/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
          <title>Apex Turbo F1 Portrait</title>
          <script src="https://cdn.tailwindcss.com"></script>
          <style>
          * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; touch-action: none; }
          html, body { width: 100%; height: 100%; overflow: hidden; background: #090d16; font-family: system-ui, -apple-system, sans-serif; }
          #gameContainer { position: relative; width: 100vw; height: 100vh; background: #090d16; overflow: hidden; }
          canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; }

          /* VIBRANT COLOURFUL HOME SCREEN */
          .screen {
            position: absolute; inset: 0; z-index: 40;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            padding: 16px 14px;
            background: linear-gradient(145deg, rgba(88, 28, 135, 0.86) 0%, rgba(15, 23, 42, 0.88) 42%, rgba(12, 74, 110, 0.88) 78%, rgba(124, 45, 18, 0.86) 100%);
            backdrop-filter: blur(10px);
          }

          .rainbow-badge {
            background: linear-gradient(90deg, #ec4899, #8b5cf6, #06b6d4, #10b981, #f59e0b);
            padding: 2px; border-radius: 999px;
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.6);
          }
          .rainbow-badge-inner {
            background: #090d16; padding: 5px 14px; border-radius: 999px;
            display: flex; align-items: center; gap: 6px;
          }

          .title-animated {
            font-size: clamp(28px, 7.5vw, 42px);
            font-weight: 900; letter-spacing: 1.5px;
            background: linear-gradient(90deg, #fde047 0%, #fb923c 35%, #f43f5e 70%, #38bdf8 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-transform: uppercase; font-style: italic;
            filter: drop-shadow(0 4px 12px rgba(244, 63, 94, 0.65));
            text-align: center; line-height: 1.05;
          }

          .podium-box {
            position: relative; width: 155px; height: 155px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.35) 0%, rgba(236, 72, 153, 0.25) 55%, rgba(15, 23, 42, 0.1) 100%);
            border: 3px solid rgba(253, 224, 71, 0.7);
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.55), inset 0 0 25px rgba(236, 72, 153, 0.45);
            display: flex; align-items: center; justify-content: center;
          }

          .colour-panel {
            width: 100%; max-width: 400px;
            background: linear-gradient(180deg, rgba(30, 27, 75, 0.9) 0%, rgba(15, 23, 42, 0.92) 100%);
            border: 2px solid rgba(168, 85, 247, 0.6);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.65), 0 0 18px rgba(139, 92, 246, 0.35);
            border-radius: 22px; padding: 12px;
          }

          .theme-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }

          .choice-chip {
            border: 2px solid rgba(255,255,255,0.25); color: #fff;
            font-size: 11px; font-weight: 900; padding: 9px 8px;
            border-radius: 14px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 5px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            transition: transform 0.15s, box-shadow 0.15s;
          }
          .chip-desert { background: linear-gradient(135deg, #f59e0b 0%, #ea580c 100%); }
          .chip-jungle { background: linear-gradient(135deg, #10b981 0%, #15803d 100%); }
          .chip-city { background: linear-gradient(135deg, #ec4899 0%, #6366f1 100%); }
          .chip-snow { background: linear-gradient(135deg, #38bdf8 0%, #1d4ed8 100%); }

          .chip-sunny { background: linear-gradient(135deg, #facc15 0%, #f97316 100%); color: #090d16; text-shadow: none; }
          .chip-night { background: linear-gradient(135deg, #312e81 0%, #0f172a 100%); }
          .chip-rain { background: linear-gradient(135deg, #0284c7 0%, #0f766e 100%); }
          .chip-storm { background: linear-gradient(135deg, #7c3aed 0%, #be123c 100%); }

          .choice-chip.active-pick {
            border: 3px solid #ffffff;
            box-shadow: 0 0 16px #fde047, 0 4px 10px rgba(0,0,0,0.7);
            transform: scale(1.04);
          }

          .arcade-btn {
            background: linear-gradient(180deg, #f59e0b 0%, #b45309 100%);
            border: 2.5px solid #fde047; color: #fff;
            font-size: 13px; font-weight: 900; padding: 12px 20px;
            border-radius: 999px; cursor: pointer;
            box-shadow: 0 4px 0 #78350f, 0 8px 16px rgba(0,0,0,0.75);
            text-transform: uppercase; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
          }
          .arcade-btn:active { transform: translateY(3px); }
          .btn-green { background: linear-gradient(135deg, #22c55e 0%, #059669 100%); border-color: #bbf7d0; box-shadow: 0 4px 0 #064e3b, 0 0 20px rgba(34, 197, 94, 0.5); }
          .btn-blue { background: linear-gradient(135deg, #06b6d4 0%, #2563eb 100%); border-color: #bae6fd; box-shadow: 0 4px 0 #1e3a8a; }
          .btn-purple { background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%); border-color: #f5d0fe; box-shadow: 0 4px 0 #701a75; }
          .btn-red { background: linear-gradient(135deg, #f43f5e 0%, #dc2626 100%); border-color: #fecdd3; box-shadow: 0 4px 0 #881337; }

          /* PORTRAIT HUD BAR */
          .hud-bar {
            position: absolute; top: 8px; left: 10px; right: 10px;
            display: none; flex-direction: column; gap: 6px;
            z-index: 30; pointer-events: none;
          }
          .hud-row { display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 6px; }
          .hud-card {
            background: rgba(15, 23, 42, 0.92); border: 1.5px solid rgba(56, 189, 248, 0.5);
            border-bottom: 3px solid #0284c7; color: #f8fafc;
            padding: 4px 10px; border-radius: 12px;
            display: flex; align-items: center; gap: 5px; font-size: 12px;
          }
          .hud-exit-btn {
            pointer-events: auto; cursor: pointer;
            background: linear-gradient(180deg, #ef4444 0%, #991b1b 100%);
            border: 2px solid #fca5a5; color: #fff; font-weight: 900;
            font-size: 11px; padding: 6px 12px; border-radius: 10px;
          }

          /* PORTRAIT GAMEPAD */
          .gamepad {
            position: absolute; bottom: 10px; left: 10px; right: 10px;
            display: none; justify-content: space-between; align-items: flex-end;
            z-index: 30; pointer-events: none;
          }
          .pad-cluster { display: flex; gap: 10px; pointer-events: auto; align-items: flex-end; }
          .horn-btn {
            width: 52px; height: 52px; border-radius: 50%;
            background: radial-gradient(circle, #facc15 0%, #ea580c 100%);
            border: 3px solid #fef08a; color: #fff; font-size: 21px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 5px 0 #7c2d12; cursor: pointer; margin-bottom: 6px;
          }
          .car-pedal {
            position: relative; border-radius: 12px; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            padding: 9px 5px; box-shadow: 0 8px 18px rgba(0,0,0,0.9);
          }
          .pedal-accel { width: 52px; height: 110px; background: linear-gradient(180deg, #475569 0%, #0f172a 100%); border: 3px solid #34d399; }
          .pedal-accel.pressed { transform: scaleY(0.92); border-color: #10b981; box-shadow: 0 0 18px #10b981; }
          .pedal-brake-real { width: 60px; height: 78px; background: linear-gradient(180deg, #475569 0%, #0f172a 100%); border: 3px solid #f87171; }
          .pedal-brake-real.pressed { transform: scaleY(0.92); border-color: #ef4444; box-shadow: 0 0 18px #ef4444; }
          .pedal-grip { width: 80%; height: 6px; background: #090d16; border-radius: 4px; }
          #steeringHandleWrap { width: 124px; height: 100px; position: relative; display: flex; align-items: center; justify-content: center; touch-action: none; }
          .steer-btn { width: 54px; height: 54px; border-radius: 50%; background: #1e293b; border: 3px solid #38bdf8; color: #fff; font-size: 20px; display: flex; align-items: center; justify-content: center; }

          .garage-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; max-height: 70vh; overflow-y: auto; width: 100%; max-width: 400px; padding: 6px; touch-action: pan-y; }
          .car-card { background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%); border: 2px solid #475569; border-radius: 16px; padding: 10px; text-align: center; display: flex; flex-direction: column; align-items: center; }
          .car-card.selected { border-color: #facc15; box-shadow: 0 0 16px rgba(250, 204, 21, 0.55); }
          #customModal { position: absolute; inset: 0; background: rgba(3, 7, 18, 0.92); z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
          </style>
          </head>
          <body>
          <div id="gameContainer">
          <!-- PORTRAIT CANVAS 720x1280 -->
          <canvas id="gameCanvas" width="720" height="1280"></canvas>

          <!-- COLOURFUL PORTRAIT HOME SCREEN -->
          <div id="homeScreen" class="screen">
            <div class="flex flex-col items-center w-full gap-1">
              <div class="rainbow-badge">
                <div class="rainbow-badge-inner">
                  <span class="text-[11px] font-black tracking-widest text-amber-300 uppercase">🔥 APEX TURBO GRAND PRIX 🔊</span>
                </div>
              </div>
              <div class="title-animated mt-1">APEX TURBO<br>F1 & GT</div>
            </div>

            <!-- Glowing Car Showcase Podium -->
            <div class="podium-box my-1">
              <div id="homeCarPreview" class="flex items-center justify-center filter drop-shadow-[0_10px_18px_rgba(250,204,21,0.65)]"></div>
            </div>

            <!-- Colourful Track & Weather Selector Box -->
            <div class="colour-panel flex flex-col gap-2.5">
              <div class="text-[11px] font-black text-amber-300 uppercase tracking-wider text-center">🌍 SELECT RACING WORLD</div>
              <div class="theme-grid" id="themeButtonsWrap">
                <button class="choice-chip chip-desert active-pick" onclick="selectTheme(0)">🏜️ SAHARA DESERT</button>
                <button class="choice-chip chip-jungle" onclick="selectTheme(1)">🌴 AMAZON JUNGLE</button>
                <button class="choice-chip chip-city" onclick="selectTheme(2)">🌃 CYBER CITY</button>
                <button class="choice-chip chip-snow" onclick="selectTheme(3)">🏔️ HIMALAYA SNOW</button>
              </div>

              <div class="text-[11px] font-black text-sky-300 uppercase tracking-wider text-center mt-1">🌦️ SELECT WEATHER MOOD</div>
              <div class="theme-grid" id="moodButtonsWrap">
                <button class="choice-chip chip-sunny active-pick" onclick="selectMood(0)">☀️ SUNNY DAY</button>
                <button class="choice-chip chip-night" onclick="selectMood(1)">🌙 MIDNIGHT</button>
                <button class="choice-chip chip-rain" onclick="selectMood(2)">🌧️ HEAVY RAIN</button>
                <button class="choice-chip chip-storm" onclick="selectMood(3)">⛈️ THUNDER STORM</button>
              </div>
            </div>

            <!-- Vibrant Action Buttons -->
            <div class="flex flex-col items-center gap-2.5 w-full max-w-[400px]">
              <button class="arcade-btn btn-green w-full text-base py-3.5" onclick="startGameSession()">🏁 START HIGHWAY RACE</button>
              <div class="grid grid-cols-2 gap-2.5 w-full">
                <button class="arcade-btn btn-blue w-full" onclick="openGarage()">🏎️ 50 CARS</button>
                <button class="arcade-btn btn-purple w-full" onclick="openSettings()">⚙️ CONTROLS</button>
              </div>
              <a href="https://youtube.com/@thegovindgupta?si=kD0pUJB_E5iTp2_Z" target="_blank" class="arcade-btn btn-red w-full" style="text-decoration:none;">▶️ SUBSCRIBE @THEGOVINDGUPTA</a>
            </div>
          </div>

          <!-- PORTRAIT GARAGE SCREEN -->
          <div id="garageScreen" class="screen" style="display:none;">
            <div class="flex items-center justify-between w-full max-w-[400px] mb-2">
              <button class="arcade-btn" style="padding:7px 14px;" onclick="closeGarage()">◀ BACK</button>
              <div class="title-animated" style="font-size:20px;">50 CARS GARAGE</div>
              <div class="hud-card"><span class="text-emerald-400 font-black">🪙 <span id="garageCoins">1200</span></span></div>
            </div>
            <div id="garageGrid" class="garage-grid"></div>
          </div>

          <!-- PORTRAIT SETTINGS SCREEN -->
          <div id="settingsScreen" class="screen" style="display:none; justify-content:center; gap:20px;">
            <div class="title-animated" style="font-size:26px;">COCKPIT & AUDIO</div>
            <div class="colour-panel flex flex-col gap-4">
              <div class="flex justify-between items-center text-white font-bold text-sm"><span>🛞 STEERING</span><button id="controlModeBtn" class="arcade-btn btn-blue" style="padding:7px 14px; font-size:11px;" onclick="cycleControlMode()">F1 YOKE HANDLE</button></div>
              <div class="flex justify-between items-center text-white font-bold text-sm"><span>🔊 LOUD SOUND</span><button id="audioToggleBtn" class="arcade-btn btn-green" style="padding:7px 14px; font-size:11px;" onclick="toggleAudio()">ON</button></div>
            </div>
            <button class="arcade-btn" onclick="closeSettings()">◀ BACK TO HOME</button>
          </div>

          <!-- PORTRAIT HUD -->
          <div id="hudBar" class="hud-bar">
            <div class="hud-row">
              <button class="hud-exit-btn" onclick="backToHome()">◀ HOME</button>
              <div class="hud-card"><span class="text-sky-400 font-black text-sm" id="uiSpeed">0</span><span class="text-[10px] text-slate-300">KM/H</span><div class="w-10 h-2 bg-slate-800 rounded-full overflow-hidden"><div id="uiSpeedBar" class="h-full bg-sky-400" style="width:0%;"></div></div></div>
              <div class="hud-card"><span class="text-[10px] text-slate-300">GEAR</span><span id="uiGear" class="text-amber-400 font-black text-sm">1</span></div>
            </div>
            <div class="hud-row">
              <div class="hud-card"><span class="text-[10px] text-slate-300">PASS</span><span id="uiOvertakes" class="text-purple-400 font-black text-sm">0</span></div>
              <div class="hud-card"><span id="uiDist" class="text-amber-300 font-black text-sm">0</span><span class="text-[10px] text-slate-300">m</span></div>
              <div class="hud-card">🪙 <span id="uiCoins" class="text-emerald-400 font-black text-sm">1200</span></div>
            </div>
          </div>

          <!-- PORTRAIT GAMEPAD -->
          <div id="gamepad" class="gamepad">
            <div class="pad-cluster">
              <div id="steeringHandleWrap">
                <svg id="steeringWheelSVG" viewBox="0 0 140 110" class="w-full h-full">
                  <rect x="10" y="18" width="120" height="74" rx="18" fill="none" stroke="#0f172a" stroke-width="12"/>
                  <rect x="10" y="28" width="18" height="54" rx="6" fill="#ef4444"/>
                  <rect x="112" y="28" width="18" height="54" rx="6" fill="#ef4444"/>
                  <rect x="36" y="42" width="68" height="28" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
                  <circle cx="55" cy="56" r="4" fill="#10b981"/><circle cx="70" cy="56" r="4" fill="#f59e0b"/><circle cx="85" cy="56" r="4" fill="#ef4444"/>
                </svg>
              </div>
              <div id="buttonSteerWrap" style="display:none; gap:8px;">
                <div class="steer-btn" onpointerdown="setSteer(-1)" onpointerup="setSteer(0)" onpointerleave="setSteer(0)">◀</div>
                <div class="steer-btn" onpointerdown="setSteer(1)" onpointerup="setSteer(0)" onpointerleave="setSteer(0)">▶</div>
              </div>
              <div id="hornBtnEl" class="horn-btn" onpointerdown="triggerCarHorn(true)" onpointerup="triggerCarHorn(false)">📢</div>
            </div>
            <div class="pad-cluster">
              <div id="brakePedalEl" class="car-pedal pedal-brake-real" onpointerdown="setBrake(true)" onpointerup="setBrake(false)" onpointerleave="setBrake(false)"><div class="w-3 h-3 rounded-full bg-red-500"></div><div class="pedal-grip"></div><div class="pedal-grip"></div></div>
              <div id="accelPedalEl" class="car-pedal pedal-accel" onpointerdown="setGas(true)" onpointerup="setGas(false)" onpointerleave="setGas(false)"><div class="w-3 h-3 rounded-full bg-emerald-400"></div><div class="pedal-grip"></div><div class="pedal-grip"></div><div class="pedal-grip"></div></div>
            </div>
          </div>

          <!-- GAME OVER -->
          <div id="gameOverScreen" class="screen" style="display:none; justify-content:center;">
            <div class="colour-panel border-2 border-red-500 p-6 max-w-sm w-full text-center flex flex-col items-center">
              <div class="text-5xl mb-2">💥</div>
              <div class="title-animated" style="font-size:28px;">HIGHWAY CRASH!</div>
              <div class="text-slate-200 text-xs font-bold my-3 bg-slate-950 px-4 py-2 rounded-xl">🏁 DIST: <span id="crashDistText" class="text-amber-400">0m</span> • 🏎️ PASSES: <span id="crashOvertakeText" class="text-purple-400">0</span></div>
              <button class="arcade-btn btn-purple w-full my-2" onclick="watchAdToRevive()">🎬 WATCH AD & REVIVE</button>
              <div class="flex gap-3 w-full mt-2">
                <button class="arcade-btn btn-green flex-1" onclick="startGameSession()">🔄 RETRY</button>
                <button class="arcade-btn flex-1" onclick="backToHome()">🏠 HOME</button>
              </div>
            </div>
          </div>

          <!-- AD MODAL -->
          <div id="customModal">
            <div class="colour-panel border-2 border-amber-400 p-6 text-center max-w-xs w-full">
              <div id="modalTitle" class="text-amber-300 font-black text-lg mb-2">SPONSORED REWARD AD</div>
              <div id="modalMsg" class="text-slate-200 text-xs mb-3">Loading AdMob Video...</div>
              <div class="flex gap-3 justify-center mt-3">
                <button id="modalCloseBtn" class="arcade-btn btn-red" onclick="closeModal()">✖ CLOSE</button>
              </div>
            </div>
          </div>
          </div>

          <script>
          const canvas = document.getElementById('gameCanvas');
          const ctx = canvas.getContext('2d');
          let coins = parseInt(localStorage.getItem('apex_coins_v9') || '1200');
          let activeCarIndex = parseInt(localStorage.getItem('apex_car_v9') || '0');
          let unlockedCars = JSON.parse(localStorage.getItem('apex_unlocked_v9') || '[0]');
          let audioEnabled = true, controlMode = 'handle', isRunning = false;

          // PORTRAIT HIGHWAY GEOMETRY (720x1280)
          const lanePositions = [158, 293, 428, 562];
          let playerX = lanePositions[1], playerWorldY = 0, totalDistanceMeters = 0, overtakeCount = 0, cameraWorldY = -920;
          let speed = 0, gear = 1, steerInput = 0, gasPressed = false, brakePressed = false;
          let trafficCars = [], sceneryItems = [], hornWaves = [], weatherParticles = [], lightningAlpha = 0;

          const worldThemes = [
            { id: 'desert', ground1: '#d97706', ground2: '#b45309', road: '#1e293b', shoulder: '#92400e', kerb1: '#ef4444', kerb2: '#fef08a' },
            { id: 'jungle', ground1: '#15803d', ground2: '#14532d', road: '#1e293b', shoulder: '#3f6212', kerb1: '#ef4444', kerb2: '#f8fafc' },
            { id: 'city', ground1: '#090d16', ground2: '#311042', road: '#0f172a', shoulder: '#0284c7', kerb1: '#38bdf8', kerb2: '#f43f5e' },
            { id: 'snow', ground1: '#e2e8f0', ground2: '#cbd5e1', road: '#334155', shoulder: '#64748b', kerb1: '#ef4444', kerb2: '#ffffff' }
          ];
          let currentThemeIdx = 0, currentMoodIdx = 0;

          const vehicleCategories = [
            { typeId: 2, className: 'F1 HYPERCAR', prefix: 'Apex Formula X', scaleW: 1.0, scaleH: 1.05, halfW: 26, halfH: 60, baseSpd: 58 },
            { typeId: 3, className: 'GT SUPERCAR', prefix: 'Turbo GT-R', scaleW: 1.0, scaleH: 1.0, halfW: 26, halfH: 58, baseSpd: 52 },
            { typeId: 1, className: 'SUPERBIKE', prefix: 'HyperBlade 1000', scaleW: 0.75, scaleH: 0.85, halfW: 15, halfH: 42, baseSpd: 55 },
            { typeId: 0, className: 'RACING CYCLE', prefix: 'Pro Sprinter', scaleW: 0.65, scaleH: 0.75, halfW: 12, halfH: 34, baseSpd: 26 },
            { typeId: 4, className: 'LUXURY BUS', prefix: 'Metro Express', scaleW: 1.12, scaleH: 1.4, halfW: 32, halfH: 85, baseSpd: 38 },
            { typeId: 5, className: 'HEAVY TRUCK', prefix: 'Titan Hauler', scaleW: 1.15, scaleH: 1.45, halfW: 33, halfH: 88, baseSpd: 34 }
          ];

          const carPalettes = [
            { body: '#0284c7', stripe: '#fde047', accent: '#f43f5e' },
            { body: '#ef4444', stripe: '#ffffff', accent: '#facc15' },
            { body: '#8b5cf6', stripe: '#38bdf8', accent: '#ec4899' },
            { body: '#10b981', stripe: '#fef08a', accent: '#064e3b' },
            { body: '#f59e0b', stripe: '#0f172a', accent: '#ef4444' },
            { body: '#ec4899', stripe: '#fde047', accent: '#1e1b4b' }
          ];

          let carsData = [];
          for (let i = 0; i < 50; i++) {
            let pal = carPalettes[i % carPalettes.length];
            let cat = vehicleCategories[i % 3];
            carsData.push({ id: i, name: cat.prefix + ' #' + (i + 1), categoryLabel: cat.className, bodyStyle: cat.typeId, scaleW: cat.scaleW, scaleH: cat.scaleH, halfW: cat.halfW, halfH: cat.halfH, topSpeed: 215 + i * 3, accel: 1.35 + i * 0.025, bodyColor: pal.body, stripeColor: pal.stripe, accentColor: pal.accent, price: i === 0 ? 0 : i * 350 });
          }

          function initScenery() {
            sceneryItems = [];
            for (let i = 0; i < 36; i++) {
              let isLeft = (i % 2 === 0);
              sceneryItems.push({ x: isLeft ? (18 + Math.random() * 44) : (658 + Math.random() * 44), worldY: -i * 105, size: 18 + Math.random() * 14, variant: i % 3 });
            }
          }
          initScenery();

          // LOUD WEB AUDIO ENGINE
          let audioCtx = null, masterComp = null, engineOsc1 = null, engineOsc2 = null, engineGain = null, musicTimer = null, musicStep = 0;
          function ensureAudio() {
            try {
              if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                masterComp = audioCtx.createDynamicsCompressor();
                masterComp.threshold.setValueAtTime(-12, audioCtx.currentTime);
                masterComp.knee.setValueAtTime(10, audioCtx.currentTime);
                masterComp.ratio.setValueAtTime(4, audioCtx.currentTime);
                masterComp.connect(audioCtx.destination);
              }
              if (audioCtx.state === 'suspended') audioCtx.resume();
            } catch (e) {}
          }

          function startEngineAudio() {
            if (!audioEnabled) return;
            try {
              ensureAudio();
              if (engineOsc1) return;
              engineOsc1 = audioCtx.createOscillator();
              engineOsc2 = audioCtx.createOscillator();
              engineGain = audioCtx.createGain();
              engineOsc1.type = 'sawtooth';
              engineOsc2.type = 'square';
              engineOsc1.frequency.value = 62;
              engineOsc2.frequency.value = 31;
              engineGain.gain.value = 0.01;
              engineOsc1.connect(engineGain);
              engineOsc2.connect(engineGain);
              engineGain.connect(masterComp);
              engineOsc1.start();
              engineOsc2.start();
            } catch (e) {}
          }

          function updateEngineAudio() {
            if (!engineOsc1 || !engineGain || !audioCtx) return;
            if (!isRunning || !audioEnabled) {
              engineGain.gain.setTargetAtTime(0.0001, audioCtx.currentTime, 0.08);
              return;
            }
            let gearMod = (speed % 42) * 2.2;
            let rpmFreq = 58 + (speed * 0.75) + gearMod + (gasPressed ? 35 : 0);
            let vol = gasPressed ? 0.42 : (speed > 5 ? 0.22 : 0.10);
            engineOsc1.frequency.setTargetAtTime(rpmFreq, audioCtx.currentTime, 0.04);
            engineOsc2.frequency.setTargetAtTime(rpmFreq * 0.5, audioCtx.currentTime, 0.04);
            engineGain.gain.setTargetAtTime(vol, audioCtx.currentTime, 0.05);
          }

          function playCrashSound() {
            if (!audioEnabled) return;
            try {
              ensureAudio();
              const now = audioCtx.currentTime;
              const bufSize = audioCtx.sampleRate * 0.55;
              const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
              const data = buf.getChannelData(0);
              for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * 0.18));
              const noise = audioCtx.createBufferSource();
              noise.buffer = buf;
              const ng = audioCtx.createGain();
              ng.gain.setValueAtTime(0.75, now);
              noise.connect(ng); ng.connect(masterComp);
              noise.start(now);

              const osc = audioCtx.createOscillator();
              const g = audioCtx.createGain();
              osc.type = 'sawtooth';
              osc.frequency.setValueAtTime(160, now);
              osc.frequency.exponentialRampToValueAtTime(24, now + 0.5);
              g.gain.setValueAtTime(0.65, now);
              g.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
              osc.connect(g); g.connect(masterComp);
              osc.start(now); osc.stop(now + 0.5);
            } catch (e) {}
          }

          function startHomeMusic() {
            stopHomeMusic();
            if (!audioEnabled || isRunning) return;
            ensureAudio();
            const bassNotes = [110, 110, 130.81, 146.83, 110, 110, 164.81, 146.83];
            const leadNotes = [220, 261.63, 329.63, 440, 392, 329.63, 293.66, 261.63];
            musicTimer = setInterval(() => {
              if (isRunning || !audioEnabled) return;
              try {
                ensureAudio();
                if (audioCtx.state !== 'running') return;
                const now = audioCtx.currentTime;
                const bOsc = audioCtx.createOscillator();
                const bG = audioCtx.createGain();
                bOsc.type = 'sawtooth';
                bOsc.frequency.setValueAtTime(bassNotes[musicStep % bassNotes.length], now);
                bG.gain.setValueAtTime(0.28, now);
                bG.gain.exponentialRampToValueAtTime(0.01, now + 0.16);
                bOsc.connect(bG); bG.connect(masterComp);
                bOsc.start(now); bOsc.stop(now + 0.16);

                const lOsc = audioCtx.createOscillator();
                const lG = audioCtx.createGain();
                lOsc.type = 'square';
                lOsc.frequency.setValueAtTime(leadNotes[musicStep % leadNotes.length], now);
                lG.gain.setValueAtTime(0.20, now);
                lG.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                lOsc.connect(lG); lG.connect(masterComp);
                lOsc.start(now); lOsc.stop(now + 0.15);
                musicStep++;
              } catch (e) {}
            }, 175);
          }
          function stopHomeMusic() { if (musicTimer) { clearInterval(musicTimer); musicTimer = null; } }
          window.addEventListener('pointerdown', () => { ensureAudio(); if (!isRunning && !musicTimer) startHomeMusic(); });

          function createCarSVG(car, w = 78, h = 122) {
            return '<svg width=\"' + w + '\" height=\"' + h + '\" viewBox=\"0 0 90 150\" xmlns=\"http://www.w3.org/2000/svg\">' +
              '<rect x=\"8\" y=\"28\" width=\"10\" height=\"26\" rx=\"4\" fill=\"#090d16\"/>' +
              '<rect x=\"72\" y=\"28\" width=\"10\" height=\"26\" rx=\"4\" fill=\"#090d16\"/>' +
              '<rect x=\"8\" y=\"98\" width=\"10\" height=\"28\" rx=\"4\" fill=\"#090d16\"/>' +
              '<rect x=\"72\" y=\"98\" width=\"10\" height=\"28\" rx=\"4\" fill=\"#090d16\"/>' +
              '<path d=\"M22 14 Q45 8 68 14 L74 38 L74 124 Q45 132 16 124 L16 38 Z\" fill=\"' + car.bodyColor + '\" stroke=\"' + car.stripeColor + '\" stroke-width=\"2.5\"/>' +
              '<rect x=\"39\" y=\"12\" width=\"12\" height=\"116\" fill=\"' + car.stripeColor + '\"/>' +
              '<path d=\"M24 46 Q45 38 66 46 L62 96 Q45 102 28 96 Z\" fill=\"#0f172a\" stroke=\"#38bdf8\" stroke-width=\"1.5\"/>' +
              '<rect x=\"20\" y=\"16\" width=\"12\" height=\"6\" rx=\"3\" fill=\"#fef08a\"/>' +
              '<rect x=\"58\" y=\"16\" width=\"12\" height=\"6\" rx=\"3\" fill=\"#fef08a\"/>' +
            '</svg>';
          }

          function updateGlobalUI() {
            document.getElementById('uiCoins').innerText = coins;
            document.getElementById('garageCoins').innerText = coins;
            document.getElementById('homeCarPreview').innerHTML = createCarSVG(carsData[activeCarIndex], 86, 132);
            localStorage.setItem('apex_coins_v9', coins);
            localStorage.setItem('apex_car_v9', activeCarIndex);
            localStorage.setItem('apex_unlocked_v9', JSON.stringify(unlockedCars));
          }

          window.selectTheme = function(idx) {
            currentThemeIdx = idx;
            ensureAudio();
            document.querySelectorAll('#themeButtonsWrap .choice-chip').forEach((b, i) => b.classList.toggle('active-pick', i === idx));
          };
          window.selectMood = function(idx) {
            currentMoodIdx = idx;
            ensureAudio();
            document.querySelectorAll('#moodButtonsWrap .choice-chip').forEach((b, i) => b.classList.toggle('active-pick', i === idx));
          };

          window.triggerCarHorn = function(pressed) {
            if (!pressed) return;
            hornWaves.push({ x: playerX, y: playerWorldY - 45, radius: 18, alpha: 1.0 });
            if (audioEnabled) {
              try {
                ensureAudio();
                const now = audioCtx.currentTime;
                [415, 520].forEach(f => {
                  const o = audioCtx.createOscillator();
                  const g = audioCtx.createGain();
                  o.type = 'sawtooth';
                  o.frequency.setValueAtTime(f, now);
                  g.gain.setValueAtTime(0.55, now);
                  g.gain.exponentialRampToValueAtTime(0.01, now + 0.38);
                  o.connect(g); g.connect(masterComp);
                  o.start(now); o.stop(now + 0.38);
                });
              } catch (e) {}
            }
            trafficCars.forEach((t, idx) => {
              let distAhead = playerWorldY - t.worldY;
              if (distAhead > 70 && distAhead < 650 && Math.abs(t.x - playerX) < 75) {
                let candidates = [t.lane - 1, t.lane + 1].filter(l => l >= 0 && l <= 3);
                for (let alt of candidates) {
                  if (isLaneSafeForTraffic(alt, t.worldY, idx)) {
                    t.lane = alt; t.targetX = lanePositions[alt];
                    break;
                  }
                }
              }
            });
          };

          function isLaneSafeForTraffic(targetLane, worldY, ignoreIdx = -1) {
            let targetX = lanePositions[targetLane];
            if (Math.abs(targetX - playerX) < 82 && Math.abs(worldY - playerWorldY) < 240) {
              return false;
            }
            for (let i = 0; i < trafficCars.length; i++) {
              if (i === ignoreIdx) continue;
              let other = trafficCars[i];
              if (other.lane === targetLane && Math.abs(other.worldY - worldY) < 250) {
                return false;
              }
            }
            return true;
          }

          function createTrafficVehicle(lane, worldY) {
            let pal = carPalettes[Math.floor(Math.random() * carPalettes.length)];
            let cat = vehicleCategories[Math.floor(Math.random() * vehicleCategories.length)];
            let spd = cat.baseSpd + Math.random() * 16;
            let startX = lanePositions[lane];
            return {
              lane, x: startX, targetX: startX, worldY, speed: spd, maxSpeed: spd,
              bodyColor: pal.body, stripeColor: pal.stripe, accentColor: pal.accent,
              bodyStyle: cat.typeId, scaleW: cat.scaleW, scaleH: cat.scaleH,
              halfW: cat.halfW, halfH: cat.halfH,
              changeTimer: 90 + Math.floor(Math.random() * 120)
            };
          }

          function spawnTrafficAhead() {
            trafficCars = [];
            for (let i = 0; i < 7; i++) {
              let lane = i % 4;
              let wy = playerWorldY - 360 - (i * 270);
              trafficCars.push(createTrafficVehicle(lane, wy));
            }
          }

          window.startGameSession = function() {
            ensureAudio();
            stopHomeMusic();
            startEngineAudio();
            document.getElementById('homeScreen').style.display = 'none';
            document.getElementById('gameOverScreen').style.display = 'none';
            document.getElementById('hudBar').style.display = 'flex';
            document.getElementById('gamepad').style.display = 'flex';
            playerX = lanePositions[1];
            playerWorldY = 0; totalDistanceMeters = 0; overtakeCount = 0; speed = 0; gear = 1;
            setGas(false); setBrake(false);
            spawnTrafficAhead();
            initScenery();
            isRunning = true;
          };

          window.backToHome = function() {
            isRunning = false;
            updateEngineAudio();
            startHomeMusic();
            document.getElementById('gameOverScreen').style.display = 'none';
            document.getElementById('hudBar').style.display = 'none';
            document.getElementById('gamepad').style.display = 'none';
            document.getElementById('homeScreen').style.display = 'flex';
            updateGlobalUI();
            if (window.AdMobBridge) { try { window.AdMobBridge.postMessage('showInterstitial'); } catch (e) {} }
          };

          window.openGarage = function() {
            ensureAudio();
            document.getElementById('homeScreen').style.display = 'none';
            document.getElementById('garageScreen').style.display = 'flex';
            renderGarageGrid();
          };
          window.closeGarage = function() {
            document.getElementById('garageScreen').style.display = 'none';
            document.getElementById('homeScreen').style.display = 'flex';
            updateGlobalUI();
          };
          window.openSettings = function() {
            ensureAudio();
            document.getElementById('homeScreen').style.display = 'none';
            document.getElementById('settingsScreen').style.display = 'flex';
          };
          window.closeSettings = function() {
            document.getElementById('settingsScreen').style.display = 'none';
            document.getElementById('homeScreen').style.display = 'flex';
          };

          function renderGarageGrid() {
            const grid = document.getElementById('garageGrid');
            grid.innerHTML = '';
            carsData.forEach(car => {
              let unlocked = unlockedCars.includes(car.id);
              let selected = activeCarIndex === car.id;
              let d = document.createElement('div');
              d.className = 'car-card ' + (selected ? 'selected' : '');
              d.innerHTML = '<div class=\"text-[9px] text-amber-300 font-bold\">' + car.categoryLabel + '</div>' + createCarSVG(car, 56, 86) + '<div class=\"text-white font-black text-xs mt-1\">' + car.name + '</div><div class=\"text-sky-400 text-[10px] font-bold\">⚡ ' + car.topSpeed + ' KM/H</div><div class=\"mt-2 w-full\">' + (selected ? '<span class=\"text-amber-400 font-black text-xs\">✔ ACTIVE</span>' : unlocked ? '<button class=\"arcade-btn btn-green w-full\" style=\"padding:5px 8px;font-size:10px;\" onclick=\"selectCar(' + car.id + ')\">SELECT</button>' : '<button class=\"arcade-btn btn-blue w-full mb-1\" style=\"padding:5px;font-size:10px;\" onclick=\"unlockWithCoins(' + car.id + ')\">🪙 ' + car.price + '</button><button class=\"arcade-btn btn-purple w-full\" style=\"padding:5px;font-size:10px;\" onclick=\"unlockWithAd(' + car.id + ')\">🎬 WATCH AD</button>') + '</div>';
              grid.appendChild(d);
            });
          }

          window.selectCar = function(id) { activeCarIndex = id; updateGlobalUI(); renderGarageGrid(); };
          window.unlockWithCoins = function(id) {
            if (coins >= carsData[id].price) { coins -= carsData[id].price; unlockedCars.push(id); activeCarIndex = id; updateGlobalUI(); renderGarageGrid(); }
            else window.unlockWithAd(id);
          };

          let adPurpose = null, pendingUnlockCarId = null;
          window.unlockWithAd = function(id) { adPurpose = 'unlock'; pendingUnlockCarId = id; showRealAdModal('UNLOCK ' + carsData[id].name); };
          window.watchAdToRevive = function() { adPurpose = 'revive'; showRealAdModal('REVIVE & CONTINUE'); };
          function showRealAdModal(title) {
            document.getElementById('customModal').style.display = 'flex';
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMsg').innerText = 'Opening Google AdMob Video... Complete ad to get reward.';
            if (window.AdMobBridge) { try { window.AdMobBridge.postMessage('showRewarded'); } catch (e) {} }
          }
          window.onAdNotLoaded = function() {
            document.getElementById('modalMsg').innerText = 'Ad abhi load nahi hua! Bina ad dekhe reward nahi milega. 2 second baad try karein.';
          };
          window.onRewardedAdReward = function() {
            document.getElementById('customModal').style.display = 'none';
            if (adPurpose === 'unlock' && pendingUnlockCarId !== null) {
              if (!unlockedCars.includes(pendingUnlockCarId)) unlockedCars.push(pendingUnlockCarId);
              activeCarIndex = pendingUnlockCarId; updateGlobalUI(); renderGarageGrid();
            } else if (adPurpose === 'revive') {
              document.getElementById('gameOverScreen').style.display = 'none';
              document.getElementById('hudBar').style.display = 'flex';
              document.getElementById('gamepad').style.display = 'flex';
              trafficCars.forEach((t, idx) => { t.worldY = playerWorldY - 550 - idx * 270; });
              speed = 70; isRunning = true;
            }
          };
          window.closeModal = function() { document.getElementById('customModal').style.display = 'none'; };
          window.toggleAudio = function() {
            audioEnabled = !audioEnabled;
            document.getElementById('audioToggleBtn').innerText = audioEnabled ? 'ON' : 'OFF';
            if (!audioEnabled) stopHomeMusic(); else startHomeMusic();
          };
          window.cycleControlMode = function() {
            controlMode = controlMode === 'handle' ? 'buttons' : 'handle';
            document.getElementById('controlModeBtn').innerText = controlMode === 'handle' ? 'F1 YOKE HANDLE' : 'BUTTONS (◀ ▶)';
            document.getElementById('steeringHandleWrap').style.display = controlMode === 'handle' ? 'flex' : 'none';
            document.getElementById('buttonSteerWrap').style.display = controlMode === 'buttons' ? 'flex' : 'none';
          };

          window.setSteer = function(d) { steerInput = d; };
          window.setGas = function(v) { gasPressed = v; ensureAudio(); startEngineAudio(); document.getElementById('accelPedalEl').classList.toggle('pressed', v); };
          window.setBrake = function(v) { brakePressed = v; document.getElementById('brakePedalEl').classList.toggle('pressed', v); };

          const handleWrap = document.getElementById('steeringHandleWrap');
          const wheelSVG = document.getElementById('steeringWheelSVG');
          let draggingWheel = false;
          handleWrap.addEventListener('pointerdown', e => { draggingWheel = true; handleWrap.setPointerCapture(e.pointerId); });
          handleWrap.addEventListener('pointermove', e => {
            if (!draggingWheel) return;
            const r = handleWrap.getBoundingClientRect();
            let deg = Math.atan2(e.clientX - (r.left + r.width / 2), -(e.clientY - (r.top + r.height / 2))) * (180 / Math.PI);
            deg = Math.max(-75, Math.min(75, deg));
            wheelSVG.style.transform = 'rotate(' + deg + 'deg)';
            steerInput = deg / 55;
          });
          const relWheel = () => { draggingWheel = false; wheelSVG.style.transform = 'rotate(0deg)'; steerInput = 0; };
          handleWrap.addEventListener('pointerup', relWheel); handleWrap.addEventListener('pointercancel', relWheel);

          for (let i = 0; i < 65; i++) weatherParticles.push({ x: Math.random() * 720, y: Math.random() * 1280, len: 22 + Math.random() * 20, vy: 16 + Math.random() * 9 });
          spawnTrafficAhead();

          function drawSceneryObject(item, sy) {
            ctx.save(); ctx.translate(item.x, sy);
            ctx.fillStyle = 'rgba(0,0,0,0.28)';
            ctx.beginPath(); ctx.ellipse(3, 5, item.size * 0.85, item.size * 0.55, 0, 0, Math.PI * 2); ctx.fill();
            if (currentThemeIdx === 0) {
              ctx.fillStyle = item.variant === 0 ? '#15803d' : '#78350f';
              ctx.beginPath(); ctx.arc(0, 0, item.size * 0.75, 0, Math.PI * 2); ctx.fill();
            } else if (currentThemeIdx === 1) {
              ctx.fillStyle = '#14532d'; ctx.beginPath(); ctx.arc(0, 0, item.size, 0, Math.PI * 2); ctx.fill();
              ctx.fillStyle = '#22c55e'; ctx.beginPath(); ctx.arc(-3, -3, item.size * 0.65, 0, Math.PI * 2); ctx.fill();
            } else if (currentThemeIdx === 2) {
              ctx.fillStyle = '#0f172a'; ctx.fillRect(-item.size * 0.6, -item.size * 0.6, item.size * 1.2, item.size * 1.2);
              ctx.strokeStyle = item.variant === 0 ? '#38bdf8' : '#ec4899'; ctx.lineWidth = 2.5; ctx.strokeRect(-item.size * 0.6, -item.size * 0.6, item.size * 1.2, item.size * 1.2);
            } else {
              ctx.fillStyle = '#f8fafc'; ctx.beginPath(); ctx.arc(0, 0, item.size * 0.85, 0, Math.PI * 2); ctx.fill();
            }
            ctx.restore();
          }

          function drawVehicle(sx, sy, v, isPlayer, tilt) {
            ctx.save(); ctx.translate(sx, sy); ctx.rotate(tilt);

            if (currentMoodIdx >= 1 && v.bodyStyle !== 0) {
              let g = ctx.createLinearGradient(0, -50, 0, -220);
              g.addColorStop(0, 'rgba(254, 240, 138, 0.45)'); g.addColorStop(1, 'rgba(254, 240, 138, 0)');
              ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(-18, -50); ctx.lineTo(-55, -220); ctx.lineTo(55, -220); ctx.lineTo(18, -50); ctx.fill();
            }

            if (v.bodyStyle === 0) {
              ctx.fillStyle = '#090d16';
              ctx.fillRect(-3, -34, 6, 18); ctx.fillRect(-3, 16, 6, 18);
              ctx.strokeStyle = v.stripeColor; ctx.lineWidth = 3;
              ctx.beginPath(); ctx.moveTo(0, -24); ctx.lineTo(0, 24); ctx.moveTo(-12, -14); ctx.lineTo(12, -14); ctx.stroke();
              ctx.fillStyle = v.bodyColor; ctx.beginPath(); ctx.roundRect(-11, -8, 22, 18, 6); ctx.fill();
              ctx.fillStyle = '#facc15'; ctx.beginPath(); ctx.arc(0, -4, 7, 0, Math.PI * 2); ctx.fill();
            } else if (v.bodyStyle === 1) {
              ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.roundRect(-16, -44, 32, 88, 10); ctx.fill();
              ctx.fillStyle = '#090d16'; ctx.fillRect(-5, -46, 10, 20); ctx.fillRect(-6, 26, 12, 20);
              ctx.fillStyle = v.bodyColor; ctx.beginPath(); ctx.roundRect(-13, -34, 26, 68, 12); ctx.fill();
              ctx.fillStyle = v.stripeColor; ctx.fillRect(-3, -34, 6, 68);
              ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 3;
              ctx.beginPath(); ctx.moveTo(-18, -16); ctx.lineTo(18, -16); ctx.stroke();
              ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.roundRect(-12, -6, 24, 24, 8); ctx.fill();
              ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(0, 2, 8, 0, Math.PI * 2); ctx.fill();
              ctx.fillStyle = '#fef08a'; ctx.fillRect(-5, -42, 10, 4);
            } else if (v.bodyStyle === 4) {
              ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.beginPath(); ctx.roundRect(-34, -88, 68, 176, 12); ctx.fill();
              ctx.fillStyle = v.bodyColor; ctx.beginPath(); ctx.roundRect(-31, -86, 62, 172, 10); ctx.fill();
              ctx.strokeStyle = v.stripeColor; ctx.lineWidth = 2.5; ctx.strokeRect(-31, -86, 62, 172);
              ctx.fillStyle = '#0f172a'; ctx.fillRect(-26, -78, 52, 22);
              ctx.fillStyle = '#e2e8f0'; ctx.fillRect(-15, -44, 30, 25); ctx.fillRect(-15, 10, 30, 25);
              ctx.fillStyle = '#fef08a'; ctx.fillRect(-26, -86, 11, 5); ctx.fillRect(15, -86, 11, 5);
              ctx.fillStyle = '#ef4444'; ctx.fillRect(-26, 82, 13, 4); ctx.fillRect(13, 82, 13, 4);
            } else if (v.bodyStyle === 5) {
              ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.beginPath(); ctx.roundRect(-35, -92, 70, 184, 8); ctx.fill();
              ctx.fillStyle = v.bodyColor; ctx.beginPath(); ctx.roundRect(-30, -90, 60, 50, 8); ctx.fill();
              ctx.fillStyle = '#0f172a'; ctx.fillRect(-24, -80, 48, 18);
              ctx.fillStyle = '#cbd5e1'; ctx.beginPath(); ctx.roundRect(-32, -35, 64, 122, 6); ctx.fill();
              ctx.fillStyle = v.accentColor; ctx.fillRect(-9, -35, 18, 122);
              ctx.fillStyle = '#fef08a'; ctx.fillRect(-26, -90, 11, 5); ctx.fillRect(15, -90, 11, 5);
              ctx.fillStyle = '#ef4444'; ctx.fillRect(-28, 84, 13, 4); ctx.fillRect(15, 84, 13, 4);
            } else {
              ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.beginPath(); ctx.roundRect(-30, -60, 60, 122, 15); ctx.fill();
              ctx.fillStyle = '#090d16';
              ctx.fillRect(-33, -44, 7, 21); ctx.fillRect(26, -44, 7, 21);
              ctx.fillRect(-33, 19, 7, 21); ctx.fillRect(26, 19, 7, 21);
              ctx.fillStyle = v.bodyColor; ctx.beginPath(); ctx.roundRect(-26, -58, 52, 116, 15); ctx.fill();
              ctx.strokeStyle = v.stripeColor; ctx.lineWidth = 2; ctx.stroke();
              ctx.fillStyle = v.stripeColor; ctx.fillRect(-5, -56, 10, 112);
              ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.roundRect(-19, -25, 38, 48, 9); ctx.fill();
              ctx.fillStyle = v.accentColor; ctx.fillRect(-24, 48, 48, 6);
              ctx.fillStyle = '#fef08a'; ctx.fillRect(-20, -58, 9, 4); ctx.fillRect(11, -58, 9, 4);
              ctx.fillStyle = (isPlayer && brakePressed) ? '#ff0000' : '#ef4444';
              ctx.fillRect(-20, 54, 11, 4); ctx.fillRect(9, 54, 11, 4);
            }
            ctx.restore();
          }

          function masterLoop() {
            const activeCar = carsData[activeCarIndex];
            const theme = worldThemes[currentThemeIdx];
            if (isRunning) {
              if (gasPressed) speed = Math.min(activeCar.topSpeed, speed + activeCar.accel);
              else speed = Math.max(0, speed - 0.6);
              if (brakePressed) speed = Math.max(0, speed - 4.4);
              gear = speed < 2 ? 'N' : Math.min(6, 1 + Math.floor(speed / 42));
              let step = speed * 0.25;
              playerWorldY -= step;
              if (speed > 0.5) totalDistanceMeters += step / 12;
              if (speed > 1) playerX += steerInput * (5.6 + speed * 0.018);
              playerX = Math.max(122, Math.min(598, playerX));
            } else {
              speed = 75; playerWorldY -= 12;
            }
            updateEngineAudio();
            let playerScreenY = 930 - (gasPressed ? Math.min(90, speed * 0.3) : 20);
            cameraWorldY = playerWorldY - playerScreenY;

            // Portrait Ground & Patches (720x1280)
            ctx.fillStyle = theme.ground1; ctx.fillRect(0, 0, 720, 1280);
            ctx.fillStyle = theme.ground2;
            let patchStart = Math.floor(cameraWorldY / 200) * 200;
            for (let wy = patchStart; wy < cameraWorldY + 1450; wy += 200) {
              let sy = wy - cameraWorldY;
              ctx.beginPath(); ctx.ellipse(38, sy, 32, 65, 0, 0, Math.PI * 2); ctx.fill();
              ctx.beginPath(); ctx.ellipse(682, sy + 100, 32, 65, 0, 0, Math.PI * 2); ctx.fill();
            }

            // Portrait Highway Shoulder & Road (x: 90 to 630, width: 540)
            ctx.fillStyle = theme.shoulder; ctx.fillRect(72, 0, 576, 1280);
            ctx.fillStyle = theme.road; ctx.fillRect(90, 0, 540, 1280);

            let dashStart = Math.floor(cameraWorldY / 90) * 90;
            for (let wy = dashStart; wy < cameraWorldY + 1400; wy += 90) {
              let sy = wy - cameraWorldY;
              ctx.fillStyle = theme.kerb1; ctx.fillRect(76, sy, 14, 45); ctx.fillRect(630, sy, 14, 45);
              ctx.fillStyle = theme.kerb2; ctx.fillRect(76, sy + 45, 14, 45); ctx.fillRect(630, sy + 45, 14, 45);
              ctx.fillStyle = '#fde047';
              ctx.fillRect(222, sy, 6, 48); ctx.fillRect(357, sy, 6, 48); ctx.fillRect(492, sy, 6, 48);
            }

            for (let s = 0; s < sceneryItems.length; s++) {
              let item = sceneryItems[s];
              let sy = item.worldY - cameraWorldY;
              if (sy > 1360) {
                item.worldY = cameraWorldY - 120 - Math.random() * 220;
                item.x = (s % 2 === 0) ? (18 + Math.random() * 44) : (658 + Math.random() * 44);
              }
              drawSceneryObject(item, item.worldY - cameraWorldY);
            }

            for (let i = 0; i < trafficCars.length; i++) {
              let t = trafficCars[i];
              t.speed += (t.maxSpeed - t.speed) * 0.05;

              for (let j = 0; j < trafficCars.length; j++) {
                if (i === j) continue;
                let other = trafficCars[j];
                if (t.lane === other.lane && t.worldY > other.worldY) {
                  let minSafeDist = t.halfH + other.halfH + 48;
                  let gap = t.worldY - other.worldY;
                  if (gap < minSafeDist) {
                    let moved = false;
                    let adjLanes = [t.lane - 1, t.lane + 1].filter(l => l >= 0 && l <= 3);
                    for (let nl of adjLanes) {
                      if (isLaneSafeForTraffic(nl, t.worldY, i)) {
                        t.lane = nl; t.targetX = lanePositions[nl];
                        moved = true; break;
                      }
                    }
                    if (!moved) {
                      t.speed = Math.min(t.speed, other.speed * 0.95);
                      t.worldY = other.worldY + minSafeDist;
                    }
                  }
                }
              }

              t.changeTimer--;
              if (t.changeTimer <= 0) {
                t.changeTimer = 140 + Math.floor(Math.random() * 140);
                let distFromPlayer = Math.abs(t.worldY - playerWorldY);
                if (distFromPlayer > 280) {
                  let nl = t.lane + (Math.random() < 0.5 ? -1 : 1);
                  if (nl >= 0 && nl <= 3 && isLaneSafeForTraffic(nl, t.worldY, i)) {
                    t.lane = nl; t.targetX = lanePositions[nl];
                  }
                }
              }

              t.worldY -= t.speed * 0.14;
              t.x += (t.targetX - t.x) * 0.12;
              let sy = t.worldY - cameraWorldY;

              if (sy > 1380) {
                if (isRunning) { coins += 25; overtakeCount++; }
                let chosenLane = Math.floor(Math.random() * 4);
                let nwy = playerWorldY - 1050 - Math.random() * 420;
                for (let attempt = 0; attempt < 4; attempt++) {
                  if (isLaneSafeForTraffic((chosenLane + attempt) % 4, nwy, i)) {
                    chosenLane = (chosenLane + attempt) % 4;
                    break;
                  }
                }
                trafficCars[i] = createTrafficVehicle(chosenLane, nwy);
                continue;
              }

              drawVehicle(t.x, sy, t, false, (t.targetX - t.x) * 0.008);

              let hitW = (activeCar.halfW || 25) + (t.halfW || 25) - 8;
              let hitH = (activeCar.halfH || 56) + (t.halfH || 56) - 12;
              if (isRunning && Math.abs(playerX - t.x) < hitW && Math.abs(playerScreenY - sy) < hitH) {
                isRunning = false; setGas(false); setBrake(false); playCrashSound(); updateGlobalUI();
                document.getElementById('crashDistText').innerText = Math.floor(totalDistanceMeters) + 'm';
                document.getElementById('crashOvertakeText').innerText = overtakeCount;
                document.getElementById('hudBar').style.display = 'none';
                document.getElementById('gamepad').style.display = 'none';
                document.getElementById('gameOverScreen').style.display = 'flex';
                if (window.AdMobBridge) { try { window.AdMobBridge.postMessage('showInterstitial'); } catch (e) {} }
              }
            }

            for (let h = hornWaves.length - 1; h >= 0; h--) {
              let hw = hornWaves[h]; hw.radius += 7; hw.alpha -= 0.04;
              ctx.strokeStyle = 'rgba(253, 224, 71, ' + hw.alpha + ')'; ctx.lineWidth = 4;
              ctx.beginPath(); ctx.arc(hw.x, hw.y - cameraWorldY, hw.radius, -Math.PI * 0.85, -Math.PI * 0.15); ctx.stroke();
              if (hw.alpha <= 0) hornWaves.splice(h, 1);
            }

            drawVehicle(playerX, playerScreenY, activeCar, true, steerInput * 0.12);

            if (currentMoodIdx >= 1) { ctx.fillStyle = 'rgba(2, 6, 23, 0.42)'; ctx.fillRect(0, 0, 720, 1280); }
            if (currentMoodIdx >= 2) {
              ctx.strokeStyle = 'rgba(186, 230, 253, 0.55)'; ctx.lineWidth = 2;
              weatherParticles.forEach(p => {
                p.y += p.vy; p.x -= 2.5; if (p.y > 1280) { p.y = -20; p.x = Math.random() * 720; }
                ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - 4, p.y + p.len); ctx.stroke();
              });
              if (currentMoodIdx === 3 && Math.random() < 0.012) lightningAlpha = 0.8;
              if (lightningAlpha > 0) { ctx.fillStyle = 'rgba(255,255,255,' + lightningAlpha + ')'; ctx.fillRect(0, 0, 720, 1280); lightningAlpha -= 0.08; }
            }

            if (isRunning) {
              document.getElementById('uiSpeed').innerText = Math.floor(speed);
              let speedBar = document.getElementById('uiSpeedBar');
              if (speedBar) speedBar.style.width = Math.min(100, (speed / activeCar.topSpeed) * 100) + '%';
              document.getElementById('uiGear').innerText = gear;
              document.getElementById('uiCoins').innerText = coins;
              document.getElementById('uiDist').innerText = Math.floor(totalDistanceMeters);
              document.getElementById('uiOvertakes').innerText = overtakeCount;
            }
            requestAnimationFrame(masterLoop);
          }
          updateGlobalUI();
          requestAnimationFrame(masterLoop);
          </script>
          </body>
          </html>
          EOF

      - name: Configure Gradle & SDK 34
        run: |
          cat << 'EOF' > android/app/build.gradle
          plugins {
              id 'com.android.application'
              id 'kotlin-android'
              id 'dev.flutter.flutter-gradle-plugin'
          }

          android {
              namespace = 'com.rahulgupta.speedracer'
              compileSdk = 34
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_1_8
                  targetCompatibility = JavaVersion.VERSION_1_8
              }

              kotlinOptions {
                  jvmTarget = '1.8'
              }

              defaultConfig {
                  applicationId = 'com.rahulgupta.speedracer'
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 3
                  versionName = '1.0.2'
                  multiDexEnabled = true
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.debug
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }

          flutter {
              source = '../..'
          }
          EOF

      - name: Configure App Name, Portrait Lock & AdMob in AndroidManifest
        run: |
          python3 -c "
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          s = s.replace('android:label=\"speedracer\"', 'android:label=\"Apex Turbo F1\"')
          if 'android:screenOrientation' not in s:
              s = s.replace('<activity', '<activity android:screenOrientation=\"portrait\"', 1)
          perms = '<uses-permission android:name=\"android.permission.INTERNET\"/>\n    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\"/>\n    <uses-permission android:name=\"com.google.android.gms.permission.AD_ID\"/>'
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<application', perms + '\n    <application', 1)
          meta = '<meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"ca-app-pub-1590363558146928~3904943143\"/>'
          if 'com.google.android.gms.ads.APPLICATION_ID' not in s:
              s = s.replace('</application>', '    ' + meta + '\n    </application>', 1)
          open(p, 'w').write(s)
          "

      - name: Fix Kotlin & Gradle Versions
        run: |
          find android -name 'settings.gradle' -exec sed -i 's/id \"org.jetbrains.kotlin.android\" version \"[^"]*\"/id \"org.jetbrains.kotlin.android\" version \"1.9.24\"/g' {} +
          find android -name 'build.gradle' -exec sed -i "s/ext.kotlin_version = '[^']*'/ext.kotlin_version = '1.9.24'/g" {} +

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apex-turbo-f1-portrait-apk
          path: build/app/outputs/flutter-apk/app-release.apk
