        window.startAdModal = function(seconds, titleText) {
          const modal = document.getElementById('customModal');
          const title = document.getElementById('modalTitle');
          const countdownEl = document.getElementById('adCountdown');
          const actionBtn = document.getElementById('modalActionBtn');
          modal.style.display = 'flex';
          title.innerText = titleText;
          actionBtn.style.display = 'none';
          let left = seconds;
          countdownEl.innerText = left + 's';
          if (adTimerInterval) clearInterval(adTimerInterval);
          adTimerInterval = setInterval(() => {
            left--;
            if (left > 0) {
              countdownEl.innerText = left + 's';
            } else {
              clearInterval(adTimerInterval);
              countdownEl.innerText = '✔ READY';
              actionBtn.style.display = 'inline-flex';
            }
          }, 1000);
        };

        window.resolveAdReward = function() {
          if (adTimerInterval) clearInterval(adTimerInterval);
          document.getElementById('customModal').style.display = 'none';
          if (adPurpose === 'unlock' && pendingUnlockCarId !== null) {
            if (!unlockedCars.includes(pendingUnlockCarId)) unlockedCars.push(pendingUnlockCarId);
            activeCarIndex = pendingUnlockCarId;
            pendingUnlockCarId = null;
            window.updateGlobalUI();
            window.renderGarageGrid();
          } else if (adPurpose === 'revive') {
            window.revivePlayerCar();
          }
          adPurpose = null;
        };

