            btns.forEach((b, i) => b.classList.toggle('active-mood', i === idx));
          };

          // ==================== SMART NON-OVERLAPPING TRAFFIC AI ====================
          function canVehicleEnterLane(selfIdx, targetLane, wy, ignorePlayer = false) {
            if (targetLane < 0 || targetLane > 3) return false;
            const targetX = lanePositions[targetLane];

            // 1. Check against all other traffic vehicles so they NEVER overlap
            for (let j = 0; j < trafficCars.length; j++) {
              if (j === selfIdx) continue;
              const other = trafficCars[j];
              const sameOrEnteringLane = (other.lane === targetLane) || (Math.abs(other.x - targetX) < 65);
              if (sameOrEnteringLane) {
                const minGap = ((trafficCars[selfIdx] ? trafficCars[selfIdx].h : 130) + other.h) * 0.5 + 75;
                if (Math.abs(other.worldY - wy) < minGap) {
                  return false;
                }
              }
            }

            // 2. Check against Player Car so traffic NEVER side-swipes or cuts into the player!
            if (!ignorePlayer && isRunning) {
              const lateralDistToPlayer = Math.abs(targetX - playerX);
              const longitudinalDistToPlayer = Math.abs(wy - playerWorldY);
              if (lateralDistToPlayer < 95 && longitudinalDistToPlayer < 290) {
                return false;
              }
            }
            return true;
          }

          function createTrafficVehicle(lane, worldY) {
            let pal = carPalettes[Math.floor(Math.random() * carPalettes.length)];
            // Pick vehicle blueprint (Cycles prefer outer lanes 0 or 3)
            let bpIndex = Math.floor(Math.random() * trafficBlueprints.length);
            if (bpIndex === 0 && lane !== 0 && lane !== 3) {
              lane = Math.random() < 0.5 ? 0 : 3;
            }
            let bp = trafficBlueprints[bpIndex];
            let baseSpd = bp.minSpd + Math.random() * (bp.maxSpd - bp.minSpd);
            let startX = lanePositions[lane];
            return {
              lane: lane,
              x: startX,
              targetX: startX,
              worldY: worldY,
              speed: baseSpd,
              desiredSpeed: baseSpd,
              vKind: bp.vKind,
              w: bp.w,
              h: bp.h,
              bodyColor: pal.body,
              stripeColor: pal.stripe,
              accentColor: pal.accent,
              changeCooldown: 90 + Math.floor(Math.random() * 140),
              turnSignal: 0,
              signalTimer: 0
            };
          }

          function spawnTrafficAhead() {
            trafficCars = [];
            for (let i = 0; i < 7; i++) {
              let lane = i % 4;
              let wy = playerWorldY - 340 - (i * 270);
              trafficCars.push(createTrafficVehicle(lane, wy));
            }
          }

