{
"name": "Generate Project & Build Release APK",
"run": "cat << 'EOF' > pubspec.yaml\nname: apexturbof1\ndescription: Apex Turbo F1 & GT - Android 10+ Edition\npublish_to: 'none'\nversion: 2.0.0+2\n\nenvironment:\n  sdk: '>=3.0.0 <4.0.0'\n\ndependencies:\n  flutter:\n    sdk: flutter\n  webview_flutter: ^4.8.0\n  google_mobile_ads: ^5.1.0\n  url_launcher: ^6.3.0\n\nflutter:\n  uses-material-design: true\n  assets:\n    - assets/index.html\nEOF\n\nflutter create . --org com.govindgupta --project-name apexturbof1\n\necho "android.useAndroidX=true" > android/gradle.properties\necho "android.enableJetifier=true" >> android/gradle.properties\necho "org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError" >> android/gradle.properties\n\nmkdir -p android/gradle/wrapper\ncat << 'EOF' > android/gradle/wrapper/gradle-wrapper.properties\ndistributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip\nnetworkTimeout=10000\nvalidateDistributionUrl=true\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=gradle/wrapper\nEOF\n\nmkdir -p lib\ncat << 'EOF' > lib/main.dart\nimport 'dart:async';\nimport 'package:flutter/material.dart';\nimport 'package:flutter/services.dart';\nimport 'package:webview_flutter/webview_flutter.dart';\nimport 'package:google_mobile_ads/google_mobile_ads.dart';\nimport 'package:url_launcher/url_launcher.dart';\n\nvoid main() async {\n  WidgetsFlutterBinding.ensureInitialized();\n  await MobileAds.instance.initialize();\n  await SystemChrome.setPreferredOrientations([\n    DeviceOrientation.landscapeLeft,\n    DeviceOrientation.landscapeRight,\n  ]);\n  await SystemChrome.setEnabledSystemUIMode(SystemUiMode.immersiveSticky);\n  runApp(const MaterialApp(\n    debugShowCheckedModeBanner: false,\n    home: ApexTurboRacingApp(),\n  ));\n}\n\nclass ApexTurboRacingApp extends StatefulWidget {\n  const ApexTurboRacingApp({super.key});\n  @override\n  State createState() => _ApexTurboRacingAppState();\n}\n\nclass _ApexTurboRacingAppState extends State {\n  late final WebViewController _controller;\n  BannerAd? _bannerAd;\n  bool _isBannerReady = false;\n  RewardedAd? _rewardedAd;\n  InterstitialAd? _interstitialAd;\n\n  final String _realBannerId = 'ca-app-pub-1590363558146928/9630631281';\n  final String _realInterstitialId = 'ca-app-pub-1590363558146928/7196039630';\n  final String _realRewardedId = 'ca-app-pub-1590363558146928/2274885449';\n\n  @override\n  void initState() {\n    super.initState();\n    _loadBannerAd();\n    _loadInterstitialAd();\n    _loadRewardedAd();\n\n    _controller = WebViewController()\n      ..setJavaScriptMode(JavaScriptMode.unrestricted)\n      ..setBackgroundColor(const Color(0xFF030712))\n      ..setNavigationDelegate(\n        NavigationDelegate(\n          onNavigationRequest: (NavigationRequest request) async {\n            if (request.url.contains('youtube.com') || request.url.contains('youtu.be')) {\n              final Uri uri = Uri.parse(request.url);\n              if (await canLaunchUrl(uri)) {\n                await launchUrl(uri, mode: LaunchMode.externalApplication);\n              }\n              return NavigationDecision.prevent;\n            }\n            return NavigationDecision.navigate;\n          },\n        ),\n      )\n      ..addJavaScriptChannel(\n        'AdMobBridge',\n        onMessageReceived: (JavaScriptMessage message) {\n          if (message.message == 'showInterstitial') {\n            _showInterstitialAd();\n          } else if (message.message == 'showRewarded') {\n            _showRewardedAd();\n          }\n        },\n      );\n\n    _initWebView();\n  }\n\n  Future _initWebView() async {\n    await _controller.clearCache();\n    await _controller.loadFlutterAsset('assets/index.html');\n  }\n\n  void _loadBannerAd() {\n    _bannerAd = BannerAd(\n      adUnitId: _realBannerId,\n      request: const AdRequest(),\n      size: AdSize.banner,\n      listener: BannerAdListener(\n        onAdLoaded: (ad) { setState(() { _isBannerReady = true; }); },\n        onAdFailedToLoad: (ad, err) {\n          ad.dispose();\n          setState(() { _isBannerReady = false; });\n          Future.delayed(const Duration(seconds: 6), _loadBannerAd);\n        },\n      ),\n    )..load();\n  }\n\n  void _loadInterstitialAd() {\n    InterstitialAd.load(\n      adUnitId: _realInterstitialId,\n      request: const AdRequest(),\n      adLoadCallback: InterstitialAdLoadCallback(\n        onAdLoaded: (ad) { _interstitialAd = ad; },\n        onAdFailedToLoad: (error) { _interstitialAd = null; Future.delayed(const Duration(seconds: 6), _loadInterstitialAd); },\n      ),\n    );\n  }\n\n  void _showInterstitialAd() {\n    if (_interstitialAd != null) {\n      _interstitialAd!.fullScreenContentCallback = FullScreenContentCallback(\n        onAdDismissedFullScreenContent: (ad) { ad.dispose(); _interstitialAd = null; _loadInterstitialAd(); },\n        onAdFailedToShowFullScreenContent: (ad, error) { ad.dispose(); _interstitialAd = null; _loadInterstitialAd(); },\n      );\n      _interstitialAd!.show();\n      _interstitialAd = null;\n    } else {\n      _loadInterstitialAd();\n    }\n  }\n\n  void _loadRewardedAd() {\n    RewardedAd.load(\n      adUnitId: _realRewardedId,\n      request: const AdRequest(),\n      rewardedAdLoadCallback: RewardedAdLoadCallback(\n        onAdLoaded: (ad) { _rewardedAd = ad; },\n        onAdFailedToLoad: (error) { _rewardedAd = null; Future.delayed(const Duration(seconds: 5), _loadRewardedAd); },\n      ),\n    );\n  }\n\n  void _showRewardedAd() {\n    if (_rewardedAd != null) {\n      _rewardedAd!.fullScreenContentCallback = FullScreenContentCallback(\n        onAdDismissedFullScreenContent: (ad) { ad.dispose(); _rewardedAd = null; _loadRewardedAd(); },\n        onAdFailedToShowFullScreenContent: (ad, error) { ad.dispose(); _rewardedAd = null; _loadRewardedAd(); },\n      );\n      _rewardedAd!.show(\n        onUserEarnedReward: (AdWithoutView ad, RewardItem reward) {\n          _controller.runJavaScript('if(window.resolveAdReward) window.resolveAdReward();');\n        },\n      );\n      _rewardedAd = null;\n    } else {\n      _loadRewardedAd();\n    }\n  }\n\n  @override\n  void dispose() {\n    _bannerAd?.dispose();\n    _interstitialAd?.dispose();\n    _rewardedAd?.dispose();\n    super.dispose();\n  }\n\n  @override\n  Widget build(BuildContext context) {\n    return Scaffold(\n      backgroundColor: const Color(0xFF030712),\n      body: SafeArea(\n        child: Stack(\n          children: [\n            Positioned.fill(\n              child: WebViewWidget(controller: _controller),\n            ),\n            if (_isBannerReady && _bannerAd != null)\n              Align(\n                alignment: Alignment.bottomCenter,\n                child: Container(\n                  color: Colors.black87,\n                  width: _bannerAd!.size.width.toDouble(),\n                  height: _bannerAd!.size.height.toDouble(),\n                  child: AdWidget(ad: _bannerAd!),\n                ),\n              ),\n          ],\n        ),\n      ),\n    );\n  }\n}\nEOF\n\nmkdir -p assets\ncat << 'EOF' > assets/index.html\n\n<html lang="en">\n\n  <meta charset="UTF-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">\n  Apex Turbo F1 & GT - Android 10+ Edition\n  <script src="https://cdn.tailwindcss.com">\n  \n    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; touch-action: none; }\n    html, body { width: 100%; height: 100%; overflow: hidden; background: #030712; font-family: system-ui, sans-serif; }\n    #gameContainer { position: relative; width: 100vw; height: 100vh; background: #030712; overflow: hidden; display: flex; align-items: center; justify-content: center; }\n    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; }\n    .screen { position: absolute; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; background: radial-gradient(circle at center, rgba(15, 23, 42, 0.88) 0%, rgba(3, 7, 18, 0.96) 100%); backdrop-filter: blur(12px); }\n    #homeScreen { background: radial-gradient(circle at center, rgba(9, 13, 22, 0.42) 0%, rgba(3, 7, 18, 0.88) 100%); backdrop-filter: blur(3px); }\n    .title-animated { font-size: clamp(28px, 5vw, 54px); font-weight: 900; letter-spacing: 3px; color: #facc15; text-transform: uppercase; text-align: center; font-style: italic; text-shadow: 0 0 25px rgba(239, 68, 68, 0.85); }\n    .mood-pill { background: rgba(15, 23, 42, 0.88); border: 1.5px solid #475569; color: #cbd5e1; padding: 6px 13px; border-radius: 999px; font-size: 11px; font-weight: 900; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; text-transform: uppercase; }\n    .mood-pill.active { background: linear-gradient(135deg, #ef4444 0%, #d97706 100%); color: #ffffff; border-color: #fde047; }\n    .arcade-btn { background: linear-gradient(180deg, #f59e0b 0%, #b45309 100%); border: 2px solid #fde047; color: #fff; font-size: 14px; font-weight: 900; padding: 11px 26px; border-radius: 999px; cursor: pointer; box-shadow: 0 5px 0 #78350f; text-transform: uppercase; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }\n    .btn-green { background: linear-gradient(180deg, #10b981 0%, #047857 100%); border-color: #6ee7b7; box-shadow: 0 5px 0 #064e3b; }\n    .btn-blue { background: linear-gradient(180deg, #0284c7 0%, #0369a1 100%); border-color: #7dd3fc; box-shadow: 0 5px 0 #0c4a6e; }\n    .btn-purple { background: linear-gradient(180deg, #8b5cf6 0%, #6d28d9 100%); border-color: #c4b5fd; box-shadow: 0 5px 0 #4c1d95; }\n    .btn-red-yt { background: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%); border-color: #fca5a5; box-shadow: 0 5px 0 #7f1d1d; }\n    .hud-bar { position: absolute; top: 12px; left: 18px; right: 18px; display: none; justify-content: space-between; align-items: stretch; z-index: 30; pointer-events: none; gap: 10px; }\n    .hud-cluster { display: flex; align-items: center; gap: 10px; }\n    .hud-card { background: rgba(15, 23, 42, 0.92); border: 1.5px solid rgba(56, 189, 248, 0.35); border-bottom: 3px solid #0284c7; color: #f8fafc; padding: 6px 14px; border-radius: 16px; display: flex; align-items: center; gap: 10px; }\n    .hud-card-gold { border-color: rgba(245, 158, 11, 0.45); border-bottom-color: #d97706; }\n    .hud-card-emerald { border-color: rgba(16, 185, 129, 0.45); border-bottom-color: #059669; }\n    .hud-card-purple { border-color: rgba(168, 85, 247, 0.45); border-bottom-color: #7c3aed; }\n    .hud-label { font-size: 9px; font-weight: 800; text-transform: uppercase; color: #94a3b8; }\n    .hud-val { font-size: 17px; font-weight: 900; font-family: monospace; }\n    .hud-home-btn { pointer-events: auto; cursor: pointer; background: linear-gradient(180deg, #ef4444 0%, #991b1b 100%); border: 2px solid #fca5a5; color: #fff; padding: 0 14px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; }\n    .gamepad { position: absolute; bottom: 48px; left: 20px; right: 20px; display: none; justify-content: space-between; align-items: flex-end; z-index: 30; pointer-events: none; }\n    .pad-cluster { display: flex; gap: 14px; pointer-events: auto; align-items: flex-end; }\n    .horn-btn { width: 58px; height: 58px; border-radius: 16px; background: radial-gradient(circle, #f59e0b 0%, #b45309 100%); border: 2.5px solid #fde047; color: #fff; font-size: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; margin-bottom: 8px; }\n    .gear-lever-box { width: 62px; height: 128px; background: #0f172a; border: 2px solid #475569; border-radius: 16px; padding: 6px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; margin-bottom: 4px; position: relative; }\n    .gear-slot-track { width: 10px; height: 64px; background: #1e293b; border-radius: 99px; position: relative; display: flex; justify-content: center; }\n    .gear-knob { width: 38px; height: 24px; border-radius: 8px; background: #ef4444; border: 2px solid #fca5a5; color: #fff; font-size: 10px; font-weight: 900; display: flex; align-items: center; justify-content: center; position: absolute; left: -15px; top: 20px; cursor: pointer; }\n    .gear-shift-tap { width: 100%; height: 22px; background: #1e293b; border: 1px solid #475569; border-radius: 6px; color: #38bdf8; font-size: 10px; font-weight: 900; display: flex; align-items: center; justify-content: center; cursor: pointer; }\n    .car-pedal { position: relative; border-radius: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 12px 6px; }\n    .pedal-accel { width: 64px; height: 135px; background: linear-gradient(180deg, #475569 0%, #0f172a 100%); border: 3px solid #94a3b8; }\n    .pedal-accel.pressed { transform: scaleY(0.92); border-color: #10b981; }\n    .pedal-brake-real { width: 78px; height: 92px; background: linear-gradient(180deg, #475569 0%, #0f172a 100%); border: 3px solid #94a3b8; margin-bottom: 4px; }\n    .pedal-brake-real.pressed { transform: scaleY(0.92); border-color: #ef4444; }\n    .pedal-grip { width: 80%; height: 8px; background: #090d16; border-radius: 4px; }\n    #steeringHandleWrap { width: 145px; height: 145px; position: relative; display: flex; align-items: center; justify-content: center; touch-action: none; }\n    #steeringWheelSVG { width: 100%; height: 100%; }\n    .steer-btn { width: 68px; height: 68px; border-radius: 50%; background: #1e293b; border: 3px solid #64748b; color: #fff; font-size: 26px; display: flex; align-items: center; justify-content: center; cursor: pointer; }\n    .garage-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 14px; max-height: 58vh; overflow-y: auto; width: 100%; max-width: 920px; padding: 12px; touch-action: pan-y; }\n    .car-card { background: #1e293b; border: 2px solid #334155; border-radius: 18px; padding: 12px; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; }\n    .car-card.selected { border-color: #f59e0b; }\n    .theme-card { background: #1e293b; border: 2px solid #334155; border-radius: 20px; padding: 16px; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px; }\n    .theme-card.active { border-color: #f59e0b; }\n  \n\n\n  <div id="gameContainer">\n    <div id="homeScreen" class="screen">\n      <div class="flex flex-wrap items-center justify-center gap-3 mb-1">\n        <div class="px-3.5 py-1 rounded-full bg-slate-950 border-2 border-red-500 text-xs font-black text-white uppercase italic">RED THUNDER <span class="text-amber-400">F1\n        <div class="px-3.5 py-1 rounded-full bg-slate-900 border border-amber-500/40 text-amber-400 text-[11px] font-extrabold uppercase"><span id="activeThemeBadge">🏜️ SAHARA DESERT\n        <div class="px-3.5 py-1 rounded-full bg-slate-900 border border-emerald-500/40 text-emerald-400 text-xs font-black">🪙 <span id="homeCoinsBadge">1200\n      \n      <div class="title-animated">APEX TURBO RACING\n      <div class="flex flex-wrap items-center justify-center gap-2 my-1.5 bg-slate-950/85 px-3.5 py-1.5 rounded-full border border-slate-700">\n        <button id="moodBtn_day" class="mood-pill active" onclick="selectWeatherMood('day')">☀️ DAY\n        <button id="moodBtn_night" class="mood-pill" onclick="selectWeatherMood('night')">🌙 NIGHT\n        <button id="moodBtn_rain" class="mood-pill" onclick="selectWeatherMood('rain')">🌧️ RAIN\n        <button id="moodBtn_storm" class="mood-pill" onclick="selectWeatherMood('storm')">⚡ STORM\n      \n      <div class="relative my-2 flex flex-col items-center justify-center">\n        <div class="w-40 h-28 flex items-center justify-center" id="homeCarPreview">\n        <div id="homeCarName" class="text-xs font-black text-amber-300 bg-slate-950 px-4 py-1 rounded-full border border-amber-500/40 -mt-1">Mini Turbo #1\n      \n      <div class="flex flex-wrap items-center justify-center gap-3 my-1.5 max-w-2xl">\n        <button class="arcade-btn btn-green" onclick="startGameSession()">▶ START GRAND PRIX\n        <button class="arcade-btn btn-blue" onclick="openGarage()">🏎️ 50 VEHICLES\n        <button class="arcade-btn" onclick="openThemes()">🌍 TRACKS & MOOD\n        <button class="arcade-btn btn-purple" onclick="openSettings()">⚙️ CONTROLS\n      \n      <div class="mt-2 bg-slate-900 border-2 border-red-500/50 rounded-2xl px-4 py-2 flex items-center justify-between gap-4 max-w-md w-full">\n        <div class="text-left"><div class="text-[10px] font-extrabold uppercase text-red-300">OFFICIAL CREATOR CHANNEL<div class="text-sm font-black text-white">@thegovindgupta\n        <a href="https://youtube.com/@thegovindgupta?si=kD0pUJB_E5iTp2_Z" target="_blank" class="arcade-btn btn-red-yt" style="padding: 6px 14px; font-size: 11px;">SUBSCRIBE\n      \n    \n    <div id="garageScreen" class="screen" style="display:none;">\n      <div class="flex items-center justify-between w-full max-w-4xl mb-3">\n        <button class="arcade-btn" style="padding: 8px 20px;" onclick="closeGarage()">◀ BACK\n        <div class="title-animated" style="font-size: 22px;">50 VEHICLES GARAGE\n        <div class="hud-card hud-card-emerald">🪙 <span id="garageCoins" class="hud-val text-emerald-400">1200\n      \n      <div id="garageGrid" class="garage-grid">\n    \n    <div id="themesScreen" class="screen" style="display:none;">\n      <div class="flex items-center justify-between w-full max-w-3xl mb-4">\n        <button class="arcade-btn" style="padding: 8px 20px;" onclick="closeThemes()">◀ BACK\n        <div class="title-animated" style="font-size: 26px;">SELECT RACING WORLD SCENE\n        <div class="w-20">\n      \n      <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 w-full max-w-3xl">\n        <div class="theme-card active" onclick="selectWorldTheme('desert')"><div class="text-4xl">🏜️<div class="text-white font-black text-sm">SAHARA DESERT\n        <div class="theme-card" onclick="selectWorldTheme('jungle')"><div class="text-4xl">🌲<div class="text-white font-black text-sm">AMAZON JUNGLE\n        <div class="theme-card" onclick="selectWorldTheme('city')"><div class="text-4xl">🌃<div class="text-white font-black text-sm">METRO NIGHT CITY\n        <div class="theme-card" onclick="selectWorldTheme('snow')"><div class="text-4xl">❄️<div class="text-white font-black text-sm">HIMALAYA SNOW\n      \n    \n    <div id="settingsScreen" class="screen" style="display:none;">\n      <div class="title-animated" style="font-size: 26px; margin-bottom: 14px;">CONTROLS & CREATOR HUB\n      <div class="bg-slate-900 border-2 border-slate-700 rounded-3xl p-5 w-full max-w-lg flex flex-col gap-4">\n        <div class="flex justify-between items-center text-white font-black">🛞 STEERING MODE<button class="arcade-btn btn-blue" style="padding: 8px 18px; font-size: 12px;" onclick="cycleControlMode()">F1 YOKE / BUTTONS\n        <div class="flex justify-between items-center text-white font-black">🔊 REAL ENGINE & MUSIC<button class="arcade-btn btn-green" style="padding: 8px 18px; font-size: 12px;" onclick="toggleAudio()">ON / OFF\n      \n      <button class="arcade-btn mt-5" onclick="closeSettings()">◀ BACK TO HOME\n    \n    <div id="hudBar" class="hud-bar">\n      <div class="hud-cluster">\n        <button class="hud-home-btn" onclick="backToHome()">◀ HOME\n        <div class="hud-card"><div class="hud-label">SPEED (KM/H)<span id="uiSpeed" class="hud-val text-sky-400">0\n        <div class="hud-card hud-card-gold"><div class="hud-label">GEAR<div id="uiGear" class="hud-val text-amber-400">1\n      \n      <div class="hud-cluster">\n        <div class="hud-card hud-card-purple"><div class="hud-label">OVERTAKES<div id="uiOvertakes" class="hud-val text-purple-400">0\n        <div class="hud-card hud-card-gold"><div class="hud-label">DIST<div class="hud-val text-amber-300"><span id="uiDist">0m\n        <div class="hud-card hud-card-emerald"><div class="hud-label">COINS<div id="uiCoins" class="hud-val text-emerald-400">1200\n      \n    \n    <div id="gamepad" class="gamepad">\n      <div class="pad-cluster">\n        <div id="steeringHandleWrap">\n          <svg id="steeringWheelSVG" viewBox="0 0 130 120">\n            <rect x="10" y="18" width="110" height="84" rx="20" fill="none" stroke="#1e293b" stroke-width="15"/>\n            <rect x="4" y="30" width="14" height="60" rx="6" fill="#ef4444" stroke="#fca5a5" stroke-width="1.5"/>\n            <rect x="112" y="30" width="14" height="60" rx="6" fill="#ef4444" stroke="#fca5a5" stroke-width="1.5"/>\n            <rect x="42" y="42" width="46" height="36" rx="8" fill="#020617" stroke="#f59e0b" stroke-width="2.5"/>\n            <text x="65" y="65" font-size="9" font-weight="900" text-anchor="middle" fill="#38bdf8">F1 YOKE\n          \n        \n        <div id="buttonSteerWrap" style="display:none; gap: 14px;">\n          <div class="steer-btn" onpointerdown="setSteer(-1)" onpointerup="setSteer(0)" onpointerleave="setSteer(0)">◀\n          <div class="steer-btn" onpointerdown="setSteer(1)" onpointerup="setSteer(0)" onpointerleave="setSteer(0)">▶\n        \n        <div class="horn-btn" onpointerdown="triggerCarHorn(true)" onpointerup="triggerCarHorn(false)">📢\n      \n      <div class="pad-cluster" style="gap: 14px;">\n        <div id="brakePedalEl" class="car-pedal pedal-brake-real" onpointerdown="setBrake(true)" onpointerup="setBrake(false)" onpointerleave="setBrake(false)"><div class="w-4 h-4 rounded-full bg-red-500"><div class="pedal-grip"><div class="pedal-grip">\n        <div id="accelPedalEl" class="car-pedal pedal-accel" onpointerdown="setGas(true)" onpointerup="setGas(false)" onpointerleave="setGas(false)"><div class="w-4 h-4 rounded-full bg-emerald-400"><div class="pedal-grip"><div class="pedal-grip"><div class="pedal-grip">\n      \n    \n    <div id="gameOverScreen" class="screen" style="display:none;">\n      <div class="bg-slate-900 border-2 border-red-500 rounded-3xl p-7 max-w-md w-full text-center flex flex-col items-center">\n        <div class="text-5xl mb-2">💥\n        <div class="title-animated" style="color:#ef4444; font-size:32px;">HIGHWAY COLLISION!\n        <div class="text-slate-300 text-xs font-bold mt-2 mb-4">🏁 DISTANCE: <span id="crashDistText" class="text-amber-400">0m • 🏎️ OVERTAKES: <span id="crashOvertakeText" class="text-purple-400">0\n        <button class="arcade-btn btn-purple w-full justify-center mb-4" onclick="watchAdToRevive()">🎬 REVIVE CAR (AD)\n        <div class="flex gap-4 w-full justify-center">\n          <button class="arcade-btn btn-green flex-1" onclick="startGameSession()">🔄 RESTART\n          <button class="arcade-btn flex-1" onclick="backToHome()">🏠 HOME\n        \n      \n    \n    <canvas id="gameCanvas" width="1280" height="720">\n  \n  \n    const canvas = document.getElementById('gameCanvas');\n    const ctx = canvas.getContext('2d');\n    let lanePositions = [420, 565, 715, 860];\n    let playerX = 565, playerWorldY = 0, cameraWorldY = 0, speed = 0, steerInput = 0;\n    let gasPressed = false, brakePressed = false, totalDistanceMeters = 0, overtakeCount = 0, isRunning = false;\n    let trafficCars = [];\n    let coins = parseInt(localStorage.getItem('desert_coins_v2') || '1200');\n    let activeCarIndex = parseInt(localStorage.getItem('active_car_v2') || '0');\n    let unlockedCars = JSON.parse(localStorage.getItem('unlocked_cars_v2') || '[0]');\n    let currentTheme = 'desert', currentMood = 'day', audioEnabled = true, controlMode = 'handle';\n    const worldThemes = {\n      desert: { label: '🏜️ SAHARA DESERT', groundCenter: '#f59e0b', shoulderColor: '#78350f', roadColor: '#1e293b', laneDash: '#fde047' },\n      jungle: { label: '🌲 AMAZON JUNGLE', groundCenter: '#059669', shoulderColor: '#3f6212', roadColor: '#1c1917', laneDash: '#fef08a' },\n      city: { label: '🌃 METRO NIGHT CITY', groundCenter: '#0f172a', shoulderColor: '#334155', roadColor: '#090d16', laneDash: '#38bdf8' },\n      snow: { label: '❄️ HIMALAYA SNOW', groundCenter: '#f1f5f9', shoulderColor: '#64748b', roadColor: '#334155', laneDash: '#bae6fd' }\n    };\n    const carPalettes = [\n      { body: '#ef4444', stripe: '#fef08a', accent: '#991b1b' },\n      { body: '#0284c7', stripe: '#ffffff', accent: '#0c4a6e' },\n      { body: '#10b981', stripe: '#064e3b', accent: '#047857' },\n      { body: '#f59e0b', stripe: '#0f172a', accent: '#b45309' },\n      { body: '#8b5cf6', stripe: '#ddd6fe', accent: '#4c1d95' }\n    ];\n    let carsData = [];\n    for (let i = 0; i < 50; i++) {\n      let pal = carPalettes[i % carPalettes.length];\n      carsData.push({ id: i, name: 'Apex GT #' + (i + 1), topSpeed: 195 + (i * 3), accel: 1.15 + (i * 0.025), bodyColor: pal.body, stripeColor: pal.stripe, accentColor: pal.accent });\n    }\n    function createCarSVG(car, w = 74, h = 116) {\n      return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 80 140"><rect x="10" y="12" width="60" height="116" rx="16" fill="' + car.bodyColor + '" stroke="' + car.accentColor + '" stroke-width="3"/><rect x="34" y="12" width="12" height="116" fill="' + car.stripeColor + '"/><rect x="18" y="42" width="44" height="46" rx="8" fill="#0f172a"/>';\n    }\n    window.setGas = function(v) { gasPressed = v; document.getElementById('accelPedalEl').classList.toggle('pressed', v); };\n    window.setBrake = function(v) { brakePressed = v; document.getElementById('brakePedalEl').classList.toggle('pressed', v); };\n    window.setSteer = function(d) { steerInput = d; };\n    const handleWrap = document.getElementById('steeringHandleWrap');\n    const wheelSVG = document.getElementById('steeringWheelSVG');\n    let draggingYoke = false;\n    handleWrap.addEventListener('pointerdown', (e) => { draggingYoke = true; handleWrap.setPointerCapture(e.pointerId); });\n    handleWrap.addEventListener('pointermove', (e) => {\n      if (!draggingYoke) return;\n      const rect = handleWrap.getBoundingClientRect();\n      let deg = Math.atan2(e.clientX - (rect.left + rect.width / 2), -(e.clientY - (rect.top + rect.height / 2))) * (180 / Math.PI);\n      deg = Math.max(-75, Math.min(75, deg));\n      wheelSVG.style.transform = 'rotate(' + deg + 'deg)';\n      steerInput = deg / 60;\n    });\n    handleWrap.addEventListener('pointerup', () => { draggingYoke = false; wheelSVG.style.transform = 'rotate(0deg)'; steerInput = 0; });\n    let audioCtx = null;\n    function ensureAudio() {\n      if (!audioEnabled) return null;\n      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();\n      if (audioCtx.state === 'suspended') audioCtx.resume();\n      return audioCtx;\n    }\n    window.playCrashSound = function() {\n      const ctxA = ensureAudio();\n      if (!ctxA) return;\n      try {\n        const now = ctxA.currentTime;\n        const osc = ctxA.createOscillator();\n        const gain = ctxA.createGain();\n        osc.type = 'sawtooth';\n        osc.frequency.setValueAtTime(140, now);\n        osc.frequency.exponentialRampToValueAtTime(22, now + 0.45);\n        gain.gain.setValueAtTime(0.35, now);\n        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.48);\n        osc.connect(gain); gain.connect(ctxA.destination);\n        osc.start(now); osc.stop(now + 0.5);\n      } catch(e) {}\n    };\n    window.triggerCarHorn = function(pressed) {\n      if (!pressed) return;\n      const ctxA = ensureAudio();\n      if (ctxA) {\n        const now = ctxA.currentTime;\n        const osc = ctxA.createOscillator();\n        const g = ctxA.createGain();\n        osc.type = 'triangle';\n        osc.frequency.setValueAtTime(440, now);\n        osc.frequency.setValueAtTime(554, now + 0.1);\n        g.gain.setValueAtTime(0.08, now);\n        g.gain.exponentialRampToValueAtTime(0.001, now + 0.25);\n        osc.connect(g); g.connect(ctxA.destination);\n        osc.start(now); osc.stop(now + 0.26);\n      }\n      trafficCars.forEach(t => {\n        if (playerWorldY - t.worldY > 60 && playerWorldY - t.worldY < 560 && Math.abs(t.x - playerX) < 88) {\n          t.lane = (t.lane + 1) % 4;\n          t.targetX = lanePositions[t.lane];\n        }\n      });\n    };\n    window.updateGlobalUI = function() {\n      document.getElementById('uiCoins').innerText = coins;\n      document.getElementById('garageCoins').innerText = coins;\n      document.getElementById('homeCoinsBadge').innerText = coins;\n      const car = carsData[activeCarIndex] || carsData[0];\n      document.getElementById('homeCarPreview').innerHTML = createCarSVG(car, 90, 145);\n      document.getElementById('homeCarName').innerText = car.name + ' • ⚡' + car.topSpeed + ' KM/H';\n      document.getElementById('activeThemeBadge').innerText = worldThemes[currentTheme].label;\n      localStorage.setItem('desert_coins_v2', coins);\n      localStorage.setItem('active_car_v2', activeCarIndex);\n      localStorage.setItem('unlocked_cars_v2', JSON.stringify(unlockedCars));\n    };\n    window.selectWeatherMood = function(m) { currentMood = m; window.updateGlobalUI(); };\n    window.selectWorldTheme = function(t) { currentTheme = t; window.updateGlobalUI(); window.closeThemes(); };\n    window.openGarage = function() {\n      document.getElementById('homeScreen').style.display = 'none';\n      document.getElementById('garageScreen').style.display = 'flex';\n      const grid = document.getElementById('garageGrid');\n      grid.innerHTML = '';\n      carsData.forEach(c => {\n        let unlocked = unlockedCars.includes(c.id);\n        let div = document.createElement('div');\n        div.className = 'car-card ' + (activeCarIndex === c.id ? 'selected' : '');\n        div.innerHTML = '<div class="text-white font-black text-xs">' + c.name + '<div class="my-1">' + createCarSVG(c, 55, 90) + '' +\n          (unlocked ? '<button class="arcade-btn btn-green" style="padding:4px 10px; font-size:10px;" onclick="selectCar(' + c.id + ')">SELECT' :\n          '<button class="arcade-btn btn-blue" style="padding:4px 10px; font-size:10px;" onclick="unlockWithAd(' + c.id + ')">🎬 AD UNLOCK');\n        grid.appendChild(div);\n      });\n    };\n    window.closeGarage = function() { document.getElementById('garageScreen').style.display = 'none'; document.getElementById('homeScreen').style.display = 'flex'; };\n    window.openThemes = function() { document.getElementById('homeScreen').style.display = 'none'; document.getElementById('themesScreen').style.display = 'flex'; };\n    window.closeThemes = function() { document.getElementById('themesScreen').style.display = 'none'; document.getElementById('homeScreen').style.display = 'flex'; };\n    window.openSettings = function() { document.getElementById('homeScreen').style.display = 'none'; document.getElementById('settingsScreen').style.display = 'flex'; };\n    window.closeSettings = function() { document.getElementById('settingsScreen').style.display = 'none'; document.getElementById('homeScreen').style.display = 'flex'; };\n    window.backToHome = function() {\n      isRunning = false;\n      document.getElementById('gameOverScreen').style.display = 'none';\n      document.getElementById('hudBar').style.display = 'none';\n      document.getElementById('gamepad').style.display = 'none';\n      document.getElementById('homeScreen').style.display = 'flex';\n    };\n    window.selectCar = function(id) { activeCarIndex = id; window.updateGlobalUI(); window.openGarage(); };\n    let adPurpose = null, pendingCar = null;\n    window.unlockWithAd = function(id) {\n      adPurpose = 'unlock'; pendingCar = id;\n      if (window.AdMobBridge) window.AdMobBridge.postMessage('showRewarded');\n      else window.resolveAdReward();\n    };\n    window.watchAdToRevive = function() {\n      adPurpose = 'revive';\n      if (window.AdMobBridge) window.AdMobBridge.postMessage('showRewarded');\n      else window.resolveAdReward();\n    };\n    window.resolveAdReward = function() {\n      if (adPurpose === 'unlock' && pendingCar !== null) {\n        unlockedCars.push(pendingCar); activeCarIndex = pendingCar; window.updateGlobalUI(); window.openGarage();\n      } else if (adPurpose === 'revive') {\n        document.getElementById('gameOverScreen').style.display = 'none';\n        document.getElementById('hudBar').style.display = 'flex';\n        document.getElementById('gamepad').style.display = 'flex';\n        trafficCars.forEach((t, idx) => { t.worldY = playerWorldY - 550 - (idx * 240); });\n        speed = 65; isRunning = true;\n      }\n    };\n    window.cycleControlMode = function() {\n      controlMode = controlMode === 'handle' ? 'buttons' : 'handle';\n      document.getElementById('steeringHandleWrap').style.display = controlMode === 'handle' ? 'flex' : 'none';\n      document.getElementById('buttonSteerWrap').style.display = controlMode === 'buttons' ? 'flex' : 'none';\n    };\n    window.toggleAudio = function() { audioEnabled = !audioEnabled; };\n    function spawnTraffic() {\n      trafficCars = [];\n      for (let i = 0; i < 6; i++) {\n        let ln = i % 4;\n        let pal = carPalettes[i % carPalettes.length];\n        trafficCars.push({ lane: ln, x: lanePositions[ln], targetX: lanePositions[ln], worldY: playerWorldY - 260 - (i * 240), speed: 38 + Math.random() * 25, bodyColor: pal.body, stripeColor: pal.stripe, accentColor: pal.accent });\n      }\n    }\n    window.startGameSession = function() {\n      document.getElementById('homeScreen').style.display = 'none';\n      document.getElementById('gameOverScreen').style.display = 'none';\n      document.getElementById('hudBar').style.display = 'flex';\n      document.getElementById('gamepad').style.display = 'flex';\n      playerX = lanePositions[1]; playerWorldY = 0; totalDistanceMeters = 0; overtakeCount = 0; speed = 0;\n      spawnTraffic();\n      isRunning = true;\n    };\n    function drawCar(sx, sy, cObj) {\n      ctx.save();\n      ctx.translate(sx, sy);\n      ctx.fillStyle = cObj.bodyColor;\n      ctx.beginPath(); ctx.roundRect(-28, -62, 56, 124, 14); ctx.fill();\n      ctx.fillStyle = cObj.stripeColor;\n      ctx.fillRect(-6, -62, 12, 124);\n      ctx.fillStyle = '#0f172a';\n      ctx.fillRect(-20, -24, 40, 44);\n      ctx.restore();\n    }\n    function masterLoop() {\n      const car = carsData[activeCarIndex] || carsData[0];\n      const th = worldThemes[currentTheme] || worldThemes.desert;\n      if (isRunning) {\n        if (gasPressed) speed = Math.min(car.topSpeed, speed + car.accel);\n        else speed = Math.max(0, speed - 0.65);\n        if (brakePressed) speed = Math.max(0, speed - 4.5);\n        let step = speed * 0.24;\n        playerWorldY -= step;\n        if (speed > 0.5) totalDistanceMeters += step / 12;\n        if (speed > 1) playerX = Math.max(385, Math.min(895, playerX + steerInput * 6.5));\n      } else {\n        playerWorldY -= 14;\n      }\n      let pScreenY = 540;\n      cameraWorldY = playerWorldY - pScreenY;\n      ctx.fillStyle = th.groundCenter; ctx.fillRect(0, 0, 1280, 720);\n      ctx.fillStyle = th.shoulderColor; ctx.fillRect(325, 0, 630, 720);\n      ctx.fillStyle = th.roadColor; ctx.fillRect(350, 0, 580, 720);\n      ctx.fillStyle = th.laneDash;\n      let dStart = Math.floor(cameraWorldY / 90) * 90;\n      for (let wy = dStart; wy < cameraWorldY + 810; wy += 90) {\n        let sy = wy - cameraWorldY;\n        ctx.fillRect(492, sy, 6, 48); ctx.fillRect(637, sy, 6, 48); ctx.fillRect(782, sy, 6, 48);\n      }\n      for (let i = 0; i < trafficCars.length; i++) {\n        let t = trafficCars[i];\n        t.worldY -= t.speed * 0.14;\n        t.x += (t.targetX - t.x) * 0.08;\n        let ty = t.worldY - cameraWorldY;\n        if (ty > 860) {\n          if (isRunning) { coins += 25; overtakeCount++; }\n          t.lane = Math.floor(Math.random() * 4);\n          t.targetX = lanePositions[t.lane]; t.x = t.targetX;\n          t.worldY = playerWorldY - 780 - Math.random() * 300;\n        }\n        drawCar(t.x, t.worldY - cameraWorldY, t);\n        if (isRunning && Math.abs(playerX - t.x) < 46 && Math.abs(pScreenY - (t.worldY - cameraWorldY)) < 96) {\n          isRunning = false;\n          window.playCrashSound();\n          document.getElementById('crashDistText').innerText = Math.floor(totalDistanceMeters) + 'm';\n          document.getElementById('crashOvertakeText').innerText = overtakeCount;\n          document.getElementById('hudBar').style.display = 'none';\n          document.getElementById('gamepad').style.display = 'none';\n          document.getElementById('gameOverScreen').style.display = 'flex';\n          if (window.AdMobBridge) window.AdMobBridge.postMessage('showInterstitial');\n        }\n      }\n      drawCar(playerX, pScreenY, car);\n      if (isRunning) {\n        document.getElementById('uiSpeed').innerText = Math.floor(speed);\n        document.getElementById('uiGear').innerText = Math.min(5, 1 + Math.floor(speed / 45));\n        document.getElementById('uiCoins').innerText = coins;\n        document.getElementById('uiDist').innerText = Math.floor(totalDistanceMeters);\n        document.getElementById('uiOvertakes').innerText = overtakeCount;\n      }\n      requestAnimationFrame(masterLoop);\n    }\n    spawnTraffic();\n    window.updateGlobalUI();\n    requestAnimationFrame(masterLoop);\n  \n\n\nEOF\n\ncat << 'EOF' > android/app/build.gradle\nplugins {\n    id "com.android.application"\n    id "kotlin-android"\n    id "dev.flutter.flutter-gradle-plugin"\n}\n\nandroid {\n    namespace = "com.govindgupta.apexturbof1"\n    compileSdk = 34\n    ndkVersion = flutter.ndkVersion\n\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_1_8\n        targetCompatibility = JavaVersion.VERSION_1_8\n    }\n\n    kotlinOptions {\n        jvmTarget = "1.8"\n    }\n\n    defaultConfig {\n        applicationId = "com.govindgupta.apexturbof1"\n        minSdk = 29\n        targetSdk = 34\n        versionCode = 2\n        versionName = "2.0.0"\n        multiDexEnabled = true\n    }\n\n    buildTypes {\n        release {\n            signingConfig = signingConfigs.debug\n            minifyEnabled false\n            shrinkResources false\n        }\n    }\n}\n\nflutter {\n    source = "../.."\n}\nEOF\n\nMANIFEST_FILE="android/app/src/main/AndroidManifest.xml"\nif [ -f "$MANIFEST_FILE" ]; then\n  sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="com.google.android.gms.permission.AD_ID"/>' "$MANIFEST_FILE"\n  sed -i '/<\/application>/i \        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-1590363558146928~3904943143"/>' "$MANIFEST_FILE"\nfi\n\nfind android -name "settings.gradle" -exec sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]"/id "org.jetbrains.kotlin.android" version "1.9.24"/g' {} +\nfind android -name "build.gradle" -exec sed -i "s/ext.kotlin_version = '[^']'/ext.kotlin_version = '1.9.24'/g" {} +\n\nflutter pub get\nflutter build apk --release --no-tree-shake-icons\n"
