              <button class="arcade-btn" style="padding:6px 16px;" onclick="closeGarage()">◀ BACK</button>
              <div class="title-animated" style="font-size:20px;">50 HYPERCARS, BIKES, BUSES & TRUCKS</div>
              <div class="hud-card"><span class="text-emerald-400 font-black">🪙 <span id="garageCoins">1200</span></span></div>
            </div>
            <div id="garageGrid" class="garage-grid"></div>
          </div>

          <!-- SETTINGS SCREEN -->
          <div id="settingsScreen" class="screen" style="display:none;">
            <div class="title-animated" style="font-size:24px; margin-bottom:12px;">F1 COCKPIT SETTINGS</div>
            <div class="bg-slate-900/95 border-2 border-slate-700 rounded-3xl p-5 w-full max-w-md flex flex-col gap-3">
              <div class="flex justify-between items-center text-white font-bold text-sm"><span>🛞 STEERING MODE</span><button id="controlModeBtn" class="arcade-btn btn-blue" style="padding:6px 14px; font-size:11px;" onclick="cycleControlMode()">F1 YOKE HANDLE</button></div>
              <div class="flex justify-between items-center text-white font-bold text-sm"><span>🔊 ENGINE & RACING MUSIC</span><button id="audioToggleBtn" class="arcade-btn btn-green" style="padding:6px 14px; font-size:11px;" onclick="toggleAudio()">LOUD ON</button></div>
              <a href="https://youtube.com/@thegovindgupta?si=kD0pUJB_E5iTp2_Z" target="_blank" class="arcade-btn btn-red w-full justify-center" style="text-decoration:none;">📺 SUBSCRIBE @THEGOVINDGUPTA</a>
            </div>
            <button class="arcade-btn mt-4" onclick="closeSettings()">◀ BACK</button>
          </div>

          <!-- HUD -->
          <div id="hudBar" class="hud-bar">
            <div class="hud-cluster">
              <button class="hud-exit-btn" onclick="backToHome()">◀ HOME</button>
              <div class="hud-card"><span class="text-sky-400 font-black text-base" id="uiSpeed">0</span><span class="text-[10px] text-slate-400">KM/H</span><div class="w-12 h-2 bg-slate-800 rounded-full overflow-hidden"><div id="uiSpeedBar" class="h-full bg-sky-400" style="width:0%;"></div></div></div>
              <div class="hud-card"><span class="text-[10px] text-slate-400">GEAR</span><span id="uiGear" class="text-amber-400 font-black text-base">1</span></div>
            </div>
            <div class="hud-cluster">
              <div class="hud-card"><span class="text-[10px] text-slate-400">PASS</span><span id="uiOvertakes" class="text-purple-400 font-black text-base">0</span></div>
              <div class="hud-card"><span id="uiDist" class="text-amber-300 font-black text-base">0</span><span class="text-[10px] text-slate-400">m</span></div>
              <div class="hud-card">🪙 <span id="uiCoins" class="text-emerald-400 font-black text-base">1200</span></div>
            </div>
          </div>

          <!-- GAMEPAD -->
          <div id="gamepad" class="gamepad">
            <div class="pad-cluster">
              <div id="steeringHandleWrap">
                <svg id="steeringWheelSVG" viewBox="0 0 140 110" class="w-full h-full filter drop-shadow-[0_6px_12px_rgba(0,0,0,0.8)]">
                  <rect x="10" y="18" width="120" height="74" rx="18" fill="none" stroke="#0f172a" stroke-width="12"/>
                  <rect x="10" y="28" width="18" height="54" rx="6" fill="#ef4444"/>
                  <rect x="112" y="28" width="18" height="54" rx="6" fill="#ef4444"/>
                  <rect x="36" y="42" width="68" height="28" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
                  <circle cx="55" cy="56" r="4" fill="#10b981"/><circle cx="70" cy="56" r="4" fill="#f59e0b"/><circle cx="85" cy="56" r="4" fill="#ef4444"/>
                </svg>
