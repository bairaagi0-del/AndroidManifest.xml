            // RICH SCENERY RENDERER FOR BOTH HOME AND GAMEPLAY
            function renderRichScenery(targetCtx, themeObj, animFrame) {
              const skyGrad = targetCtx.createLinearGradient(0, 0, 0, V_H * 0.66);
              skyGrad.addColorStop(0, themeObj.skyTop);
              skyGrad.addColorStop(1, themeObj.skyBottom);
              targetCtx.fillStyle = skyGrad;
              targetCtx.fillRect(0, 0, V_W, V_H * 0.66);

              // Glowing Sun / Moon
              targetCtx.fillStyle = themeObj.sunColor;
              targetCtx.globalAlpha = 0.25;
              targetCtx.beginPath(); targetCtx.arc(V_W * 0.78, 175, 76, 0, Math.PI * 2); targetCtx.fill();
              targetCtx.globalAlpha = 0.85;
              targetCtx.beginPath(); targetCtx.arc(V_W * 0.78, 175, 46, 0, Math.PI * 2); targetCtx.fill();
              targetCtx.globalAlpha = 1.0;

              // Clouds
              targetCtx.fillStyle = 'rgba(255, 255, 255, 0.28)';
              homeClouds.forEach(c => {
                c.x += c.speed;
                if (c.x > V_W + 120) c.x = -140;
                targetCtx.beginPath();
                targetCtx.ellipse(c.x, c.y, c.w * 0.5, c.h * 0.5, 0, 0, Math.PI * 2);
                targetCtx.fill();
              });

              // Distant 3D Mountain Peaks
              targetCtx.fillStyle = themeObj.mountColor;
              targetCtx.beginPath();
              targetCtx.moveTo(0, V_H * 0.66);
              targetCtx.lineTo(140, V_H * 0.44);
              targetCtx.lineTo(310, V_H * 0.60);
              targetCtx.lineTo(510, V_H * 0.40);
              targetCtx.lineTo(V_W, V_H * 0.56);
              targetCtx.lineTo(V_W, V_H * 0.66);
              targetCtx.closePath();
              targetCtx.fill();

              // Pine Tree Forest Line on Horizon
              targetCtx.fillStyle = themeObj.treeColor;
              for (let tx = 0; tx < V_W; tx += 36) {
                const treeH = 55 + (tx % 3) * 18;
                targetCtx.beginPath();
                targetCtx.moveTo(tx, V_H * 0.66);
                targetCtx.lineTo(tx + 18, V_H * 0.66 - treeH);
                targetCtx.lineTo(tx + 36, V_H * 0.66);
                targetCtx.fill();
              }

              // Lake Water
              const waterGrad = targetCtx.createLinearGradient(0, V_H * 0.66, 0, V_H);
              waterGrad.addColorStop(0, themeObj.waterTop);
              waterGrad.addColorStop(1, themeObj.waterBottom);
              targetCtx.fillStyle = waterGrad;
              targetCtx.fillRect(0, V_H * 0.66, V_W, V_H * 0.34);

              // Animated Water Shimmer Waves
              targetCtx.fillStyle = 'rgba(255, 255, 255, 0.16)';
              for (let wy = V_H * 0.69; wy < V_H - 90; wy += 38) {
                const waveOffset = Math.sin(animFrame * 0.04 + wy) * 30;
                targetCtx.fillRect(120 + waveOffset, wy, 160, 3);
                targetCtx.fillRect(420 - waveOffset, wy + 16, 190, 3);
              }
            }

            // DETAILED REALISTIC DUCK PAINTER
            function paintDetailedDuck(targetCtx, baseSize, wingY, isBoss, isDead, hpRatio) {
              if (!isDead) {
                targetCtx.fillStyle = 'rgba(0,0,0,0.22)';
                targetCtx.beginPath(); targetCtx.ellipse(0, baseSize * 0.72, baseSize * 0.65, 9, 0, 0, Math.PI * 2); targetCtx.fill();
              }

              // Tail feathers
              targetCtx.fillStyle = '#451a03';
              targetCtx.beginPath();
              targetCtx.moveTo(-baseSize * 0.75, 0);
              targetCtx.lineTo(-baseSize * 1.25, -baseSize * 0.28);
              targetCtx.lineTo(-baseSize * 1.15, baseSize * 0.15);
              targetCtx.fill();

              // Back Wing
              targetCtx.fillStyle = isBoss ? '#451a03' : '#92400e';
              targetCtx.beginPath();
              targetCtx.ellipse(-8, -wingY * 0.7, baseSize * 0.45, baseSize * 0.24, -0.3, 0, Math.PI * 2);
              targetCtx.fill();

              // Main Plumage Body
              targetCtx.fillStyle = isBoss ? '#78350f' : '#d97706';
              targetCtx.beginPath();
              targetCtx.ellipse(0, 0, baseSize, baseSize * 0.58, 0, 0, Math.PI * 2);
              targetCtx.fill();

              // White Neck Ring
              targetCtx.strokeStyle = '#ffffff';
              targetCtx.lineWidth = 4;
              targetCtx.beginPath();
              targetCtx.arc(baseSize * 0.48, -baseSize * 0.14, baseSize * 0.18, 0.3, 1.8);
              targetCtx.stroke();

              // Iridescent Mallard Green Head
              targetCtx.fillStyle = isBoss ? '#14532d' : '#047857';
              targetCtx.beginPath();
              targetCtx.arc(baseSize * 0.62, -baseSize * 0.32, baseSize * 0.36, 0, Math.PI * 2);
              targetCtx.fill();

              // Yellow/Orange Beak
              targetCtx.fillStyle = isBoss ? '#ef4444' : '#f97316';
              targetCtx.beginPath();
              targetCtx.moveTo(baseSize * 0.88, -baseSize * 0.38);
              targetCtx.lineTo(baseSize * 1.38, -baseSize * 0.24);
              targetCtx.lineTo(baseSize * 0.88, -baseSize * 0.12);
              targetCtx.fill();

              // Eyes (X_X if shot dead, else glossy eye)
              if (isDead) {
                targetCtx.strokeStyle = '#000';
                targetCtx.lineWidth = 3;
                const ex = baseSize * 0.72; const ey = -baseSize * 0.38;
                targetCtx.beginPath();
                targetCtx.moveTo(ex - 5, ey - 5); targetCtx.lineTo(ex + 5, ey + 5);
                targetCtx.moveTo(ex + 5, ey - 5); targetCtx.lineTo(ex - 5, ey + 5);
                targetCtx.stroke();
              } else {
                targetCtx.fillStyle = '#fff';
                targetCtx.beginPath(); targetCtx.arc(baseSize * 0.72, -baseSize * 0.38, 5.5, 0, Math.PI * 2); targetCtx.fill();
                targetCtx.fillStyle = '#000';
                targetCtx.beginPath(); targetCtx.arc(baseSize * 0.75, -baseSize * 0.38, 2.8, 0, Math.PI * 2); targetCtx.fill();
              }

              // Foreground Articulated Flapping Wing
              targetCtx.fillStyle = isBoss ? '#9a3412' : '#f59e0b';
              targetCtx.beginPath();
              targetCtx.ellipse(-6, wingY, baseSize * 0.55, baseSize * 0.3, -0.15, 0, Math.PI * 2);
              targetCtx.fill();

              if (isBoss && !isDead) {
                targetCtx.fillStyle = '#facc15';
                targetCtx.font = 'bold 22px sans-serif';
                targetCtx.fillText('👑', baseSize * 0.45, -baseSize * 0.72);

                const barW = 76;
                targetCtx.fillStyle = 'rgba(0,0,0,0.75)';
                targetCtx.fillRect(-barW / 2, -baseSize * 0.95, barW, 9);
                targetCtx.fillStyle = '#ef4444';
                targetCtx.fillRect(-barW / 2, -baseSize * 0.95, barW * hpRatio, 9);
              }
            }

            function drawHomeDynamicBackground() {
              if (isRunning) return;
              frame++;
              const curTheme = THEMES[activeTheme] || THEMES[0];
              renderRichScenery(homeCtx, curTheme, frame);

              homeDucks.forEach(d => {
                d.x += d.speed;
                d.y += Math.sin(frame * 0.06) * 0.9;
                d.wing += 0.28;
                if (d.x > V_W + 90) { d.x = -90; d.y = 150 + Math.random() * 240; }
                homeCtx.save();
                homeCtx.translate(d.x, d.y);
                homeCtx.scale(d.z, d.z);
                paintDetailedDuck(homeCtx, 46, Math.sin(d.wing) * 18, false, false, 1);
                homeCtx.restore();
              });

              // Foreground Marsh Reeds
              homeCtx.fillStyle = curTheme.reeds;
              for (let r = 0; r < V_W; r += 16) {
                const rH = 75 + Math.sin(r + frame * 0.04) * 18;
                homeCtx.fillRect(r, V_H - rH, 6, rH);
              }

              requestAnimationFrame(drawHomeDynamicBackground);
            }

            class Duck3D {
              constructor(lvlCfg, isBoss = false) {
                this.isBoss = isBoss;
                this.dir = Math.random() > 0.5 ? 1 : -1;
                this.z = isBoss ? 1.45 : (0.75 + Math.random() * 0.55);
                this.baseSize = isBoss ? 68 : 52;
                this.x = this.dir === 1 ? -110 : V_W + 110;
                this.y = 160 + Math.random() * 380;
                this.speed = (isBoss ? 1.45 : (2.1 + Math.random() * 0.55)) * (this.isBoss ? 1 : this.z);
                this.vx = this.speed * this.dir;
                this.vy = (Math.random() - 0.5) * (isBoss ? 0.8 : 1.4);
                this.maxHp = isBoss ? (5 + Math.floor(currentLvl / 10) * 2) : 1;
                this.hp = this.maxHp;
                this.points = isBoss ? 60 : 15;
                this.wingAngle = 0;
                this.quackTimer = Math.floor(Math.random() * 75) + 15;
              }
              update() {
                this.x += this.vx * (isReloading ? 0.4 : 1.0);
                this.y += Math.sin(frame * 0.07) * (this.isBoss ? 1.2 : 2.0) + this.vy;
                this.wingAngle += this.isBoss ? 0.24 : 0.38;
                this.quackTimer--;
                if (this.quackTimer <= 0 && isRunning) {
                  playQuackSound(this.isBoss);
                  this.quackTimer = 150 + Math.floor(Math.random() * 110);
                }
              }
              draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.scale(this.z * (this.dir < 0 ? -1 : 1), this.z);
                const wingSpread = Math.sin(this.wingAngle) * (this.isBoss ? 25 : 20);
                paintDetailedDuck(ctx, this.baseSize, wingSpread, this.isBoss, false, this.hp / this.maxHp);
                ctx.restore();
              }
            }

            // REALISTIC SHOCK + UPSIDE-DOWN SPIRAL FALLING DUCK
            class FallingDuck {
              constructor(x, y, z, dir, isBoss) {
                this.x = x; this.y = y; this.z = z; this.dir = dir;
                this.isBoss = isBoss;
                this.baseSize = isBoss ? 68 : 52;
                this.shockFrames = 10; // Freezes in shock first
                this.vy = -4.5; // Pops up slightly when shot, then plummets
                this.vx = dir * 1.5;
                this.rotation = 0;
                this.wingFlap = 0;
                this.splashed = false;
              }
              update() {
                if (this.shockFrames > 0) {
                  this.shockFrames--;
                  return;
                }
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.62; // Realistic gravity acceleration
                // Flips upside down (PI) and rocks slightly
                if (this.rotation < Math.PI) {
                  this.rotation += 0.14;
                } else {
                  this.rotation = Math.PI + Math.sin(frame * 0.3) * 0.2;
                }
                this.wingFlap += 0.65;

                // Trigger Water Splash when hitting lake surface
                if (!this.splashed && this.y >= V_H * 0.72) {
                  this.splashed = true;
                  playSound('splash');
                  for (let s = 0; s < 14; s++) {
                    splashes.push(new WaterSplash(this.x, this.y));
                  }
                }
              }
              draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.scale(this.z * (this.dir < 0 ? -1 : 1), this.z);
                const wingY = Math.sin(this.wingFlap) * 18;
                paintDetailedDuck(ctx, this.baseSize, wingY, this.isBoss, true, 0);
                ctx.restore();
              }
            }

            class WaterSplash {
              constructor(x, y) {
                this.x = x; this.y = y;
                this.vx = (Math.random() - 0.5) * 10;
                this.vy = -Math.random() * 11 - 3;
                this.alpha = 1.0;
                this.rad = 4 + Math.random() * 5;
              }
              update() {
                this.x += this.vx; this.y += this.vy;
                this.vy += 0.5; this.alpha -= 0.035;
              }
              draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = '#e0f2fe';
                ctx.beginPath(); ctx.arc(this.x, this.y, this.rad, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
              }
            }

            class ObstaclePipe {
              constructor(x, speed) {
                this.x = x; this.w = 52; this.y = 120; this.h = 400; this.speed = speed; this.dir = 1;
              }
              update() {
                this.y += this.speed * this.dir;
                if (this.y < 80 || this.y > 260) this.dir *= -1;
              }
              draw() {
                ctx.save();
                const pipeGrad = ctx.createLinearGradient(this.x, 0, this.x + this.w, 0);
                pipeGrad.addColorStop(0, '#3f2e21'); pipeGrad.addColorStop(0.5, '#78553a'); pipeGrad.addColorStop(1, '#291d14');
                ctx.fillStyle = pipeGrad;
                ctx.fillRect(this.x, this.y, this.w, this.h);
                ctx.fillStyle = '#a8a29e';
                ctx.fillRect(this.x - 4, this.y + 15, this.w + 8, 10);
                ctx.fillRect(this.x - 4, this.y + this.h - 25, this.w + 8, 10);
                ctx.restore();
              }
            }

            class FeatherParticle {
              constructor(x, y, color) {
                this.x = x; this.y = y;
                this.vx = (Math.random() - 0.5) * 14;
                this.vy = (Math.random() - 0.5) * 12 - 2;
                this.alpha = 1.0;
                this.rot = Math.random() * Math.PI;
                this.color = color || (Math.random() > 0.4 ? '#fde047' : '#ffffff');
              }
              update() {
                this.x += this.vx; this.y += this.vy;
                this.vy += 0.25; this.rot += 0.12; this.alpha -= 0.03;
              }
              draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rot);
                ctx.fillStyle = this.color;
                ctx.beginPath(); ctx.ellipse(0, 0, 9, 4, 0, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
              }
            }

            // CRISP FIRST-PERSON (FPS) WEAPON BARREL RENDERER
            function drawCrispFirstPersonGun(gunObj) {
              ctx.save();
              ctx.translate(V_W / 2, V_H - 35 + recoilY);

              // Muzzle Flash on Shoot
              if (muzzleFlashFrame > 0) {
                muzzleFlashFrame--;
                ctx.fillStyle = gunObj.sound === 'plasma' ? '#38bdf8' : '#fde047';
                ctx.beginPath();
                ctx.arc(0, -155, 42, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(0, -155, 22, 0, Math.PI * 2);
                ctx.fill();
              }

              // Weapon Stock / Body Base
              ctx.fillStyle = gunObj.accent;
              ctx.beginPath();
              ctx.roundRect(-34, -65, 68, 80, 12);
              ctx.fill();
              ctx.lineWidth = 4;
              ctx.strokeStyle = '#0f172a';
              ctx.stroke();

              // Main Dual or Single Barrel
              const bGrad = ctx.createLinearGradient(-22, 0, 22, 0);
              bGrad.addColorStop(0, '#0f172a');
              bGrad.addColorStop(0.5, gunObj.barrelColor);
              bGrad.addColorStop(1, '#0f172a');
              ctx.fillStyle = bGrad;

              if (gunObj.sound === 'shotgun') {
                ctx.fillRect(-24, -150, 20, 95);
                ctx.fillRect(4, -150, 20, 95);
              } else {
                ctx.fillRect(-16, -155, 32, 100);
              }

              // Iron Sight & Scope Rail
              ctx.fillStyle = '#e2e8f0';
              ctx.fillRect(-6, -145, 12, 55);
              ctx.fillStyle = '#ef4444';
              ctx.beginPath(); ctx.arc(0, -152, 5, 0, Math.PI * 2); ctx.fill();

              ctx.restore();
            }

            function getLevelConfig(lvl) {
              return { 
                targetScore: 100 + lvl * 35, 
                spawnInterval: Math.max(45, 75 - Math.min(lvl, 25)),
                hasBoss: (lvl + 1) % 5 === 0,
                obstacleCount: Math.min(2, Math.floor(lvl / 4))
              };
            }

            function updateHud() {
              const cfg = getLevelConfig(currentLvl);
              document.getElementById('uiLvl').innerText = `${currentLvl + 1}/100`;
              document.getElementById('uiScore').innerText = `${levelScore}/${cfg.targetScore}`;
              document.getElementById('uiLives').innerText = '❤'.repeat(Math.max(0, lives));
              document.getElementById('uiAmmo').innerText = isReloading ? 'RELOAD...' : `${ammo}/${maxAmmo}`;
              document.getElementById('hubCoins').innerText = coins;
              document.getElementById('homeCoinsDisplay').innerText = coins;
              document.getElementById('homeStageDisplay').innerText = maxUnlockedLvl + 1;
            }

            function setGameplayUiVisible(visible) {
              document.getElementById('gameCanvas').style.display = visible ? 'block' : 'none';
              document.getElementById('gameplayHud').style.display = visible ? 'flex' : 'none';
              document.getElementById('gameplayControls').style.display = visible ? 'flex' : 'none';
            }

            function startMission(lvlIndex) {
              initAudio(); playTapSound();
              currentLvl = lvlIndex; levelScore = 0; lives = 3;
              maxAmmo = REAL_GUNS[equippedGun]?.mag || 15; ammo = maxAmmo;
              isReloading = false; ducks = []; fallingDucks = []; particles = []; splashes = []; obstacles = []; 
              frame = 0; isRunning = true; recoilY = 0;

              const cfg = getLevelConfig(currentLvl);
              if (cfg.obstacleCount >= 1) obstacles.push(new ObstaclePipe(V_W * 0.32, 1.2));
              if (cfg.obstacleCount >= 2) obstacles.push(new ObstaclePipe(V_W * 0.65, 1.6));

              document.getElementById('homeScreen').style.display = 'none';
              document.getElementById('homeCanvasBg').style.display = 'none';
              document.getElementById('hubScreen').style.display = 'none';
              document.getElementById('winScreen').style.display = 'none';
              document.getElementById('gameOverScreen').style.display = 'none';
              setGameplayUiVisible(true);
              updateHud();
              loop();
            }

            function showWinScreen() {
              isRunning = false; playSound('win');
              if (currentLvl + 1 > maxUnlockedLvl) {
                maxUnlockedLvl = Math.min(99, currentLvl + 1);
                selectedLevel = maxUnlockedLvl;
              }
              coins += 50; saveState();
              document.getElementById('winScreen').style.display = 'flex';
              triggerAdMobInterstitial();
            }

            function endGame() {
              isRunning = false;
              document.getElementById('gameOverScreen').style.display = 'flex';
              triggerAdMobInterstitial();
            }

            function handleShoot(clientX, clientY) {
              if (!isRunning) return;
              initAudio();
              const rect = canvas.getBoundingClientRect();
              const tx = (clientX - rect.left) * (V_W / rect.width);
              const ty = (clientY - rect.top) * (V_H / rect.height);

              if (ammo <= 0 || isReloading) {
                isReloading = true; updateHud();
                playSound('reload');
                setTimeout(() => { ammo = maxAmmo; isReloading = false; updateHud(); }, 360);
                return;
              }

              ammo--; recoilY = 32; muzzleFlashFrame = 3;
              const gunObj = REAL_GUNS[equippedGun];
              playRealGunSound(gunObj.sound || 'pistol');

              let hitObstacle = false;
              for (let obs of obstacles) {
                if (tx >= obs.x && tx <= obs.x + obs.w && ty >= obs.y && ty <= obs.y + obs.h) {
                  hitObstacle = true;
                  playDeflectSound();
                  for (let p = 0; p < 8; p++) particles.push(new FeatherParticle(tx, ty, '#cbd5e1'));
                  break;
                }
              }

              if (!hitObstacle) {
                for (let i = ducks.length - 1; i >= 0; i--) {
                  const d = ducks[i];
                  if (Math.hypot(tx - d.x, ty - d.y) < d.baseSize * d.z * 1.38) {
                    d.hp -= gunObj.damage;
                    for (let p = 0; p < 14; p++) particles.push(new FeatherParticle(d.x, d.y));
                    
                    if (d.hp <= 0) {
                      levelScore += d.points; 
                      coins += d.isBoss ? 25 : 4; 
                      saveState();
                      playSound('hit');
                      fallingDucks.push(new FallingDuck(d.x, d.y, d.z, d.dir, d.isBoss));
                      ducks.splice(i, 1);
                    } else {
                      playSound('hit');
                      d.vx *= 1.15;
                    }
                    break;
                  }
                }
              }

              if (ammo <= 0) {
                isReloading = true; playSound('reload');
                setTimeout(() => { ammo = maxAmmo; isReloading = false; updateHud(); }, 360);
              }
              updateHud();
              if (levelScore >= getLevelConfig(currentLvl).targetScore) setTimeout(showWinScreen, 350);
            }

            function loop() {
              if (!isRunning) return;
              frame++;
              if (recoilY > 0) recoilY -= 3.2;

              ctx.clearRect(0, 0, V_W, V_H);
              const curTheme = THEMES[activeTheme] || THEMES[0];
              renderRichScenery(ctx, curTheme, frame);

              const cfg = getLevelConfig(currentLvl);
              if (frame % cfg.spawnInterval === 0 && ducks.length < 5) {
                const spawnBoss = cfg.hasBoss && !ducks.some(d => d.isBoss) && Math.random() > 0.4;
                ducks.push(new Duck3D(cfg, spawnBoss));
              }

              for (let i = ducks.length - 1; i >= 0; i--) {
                const d = ducks[i]; d.update(); d.draw();
                if ((d.dir === 1 && d.x > V_W + 130) || (d.dir === -1 && d.x < -130)) {
                  ducks.splice(i, 1); 
                  lives -= d.isBoss ? 2 : 1; 
                  updateHud();
                  if (lives <= 0) { endGame(); return; }
                }
              }

              for (let obs of obstacles) { obs.update(); obs.draw(); }
              for (let i = fallingDucks.length - 1; i >= 0; i--) {
                const fd = fallingDucks[i]; fd.update(); fd.draw();
                if (fd.y > V_H + 90) fallingDucks.splice(i, 1);
              }
              for (let i = splashes.length - 1; i >= 0; i--) {
                splashes[i].update(); splashes[i].draw();
                if (splashes[i].alpha <= 0) splashes.splice(i, 1);
              }
              for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update(); particles[i].draw();
                if (particles[i].alpha <= 0) particles.splice(i, 1);
              }

              // Foreground Marsh Reeds
              ctx.fillStyle = curTheme.reeds;
              for (let r = 0; r < V_W; r += 18) {
                const rH = 82 + Math.sin(r + frame * 0.05) * 20;
                ctx.fillRect(r, V_H - rH, 7, rH);
              }

              drawCrispFirstPersonGun(REAL_GUNS[equippedGun]);
              requestAnimationFrame(loop);
            }

            window.switchHub = function(tab) {
              playTapSound();
              const road = document.getElementById('hubListRoad');
              const armory = document.getElementById('hubListArmory');
              const themes = document.getElementById('hubListThemes');
              const btnRoad = document.getElementById('tabLevels');
              const btnArmory = document.getElementById('tabGuns');
              const btnThemes = document.getElementById('tabThemes');

              road.style.display = tab === 'levels' ? 'block' : 'none';
              armory.style.display = tab === 'guns' ? 'grid' : 'none';
              themes.style.display = tab === 'themes' ? 'grid' : 'none';

              btnRoad.className = tab === 'levels' ? 'cookie-btn' : 'cookie-btn cookie-btn-blue';
              btnArmory.className = tab === 'guns' ? 'cookie-btn' : 'cookie-btn cookie-btn-blue';
              btnThemes.className = tab === 'themes' ? 'cookie-btn' : 'cookie-btn cookie-btn-purple';

              if (tab === 'levels') renderRoad();
              if (tab === 'guns') renderArmory();
              if (tab === 'themes') renderThemes();
            };

            function renderRoad() {
              const container = document.getElementById('hubListRoad');
              container.innerHTML = '';
              for (let i = 0; i < 100; i++) {
                const row = document.createElement('div');
                row.className = 'flow-node-row';
                const offsetPercent = 50 + Math.sin(i * 0.7) * 32;
                const isBossStage = (i + 1) % 5 === 0;
                const bubble = document.createElement('div');
                bubble.className = `level-bubble ${i <= maxUnlockedLvl ? '' : 'locked'} ${selectedLevel === i ? 'active-node' : ''} ${isBossStage ? 'boss-node' : ''}`;
                bubble.style.left = `${offsetPercent}%`;
                bubble.innerHTML = isBossStage 
                  ? `<small style="font-size:9px; color:#fee2e2;">BOSS</small><b style="font-size:16px;">${i + 1}</b>`
                  : `<small style="font-size:10px;">LVL</small><b style="font-size:17px;">${i + 1}</b>`;
                if (i <= maxUnlockedLvl) {
                  bubble.onclick = () => { playTapSound(); selectedLevel = i; renderRoad(); };
                }
                row.appendChild(bubble); container.appendChild(row);
              }
            }

            // ARMORY WITH BOTH COIN BUY & AD UNLOCK OPTIONS
            function renderArmory() {
              const container = document.getElementById('hubListArmory');
              container.innerHTML = '';
              REAL_GUNS.forEach(g => {
                const card = document.createElement('div');
                card.className = `hub-card ${equippedGun === g.id ? 'active-item' : ''}`;
                const isUnlocked = unlockedGuns.includes(g.id);
                card.innerHTML = `
                  <strong style="color:#fef08a; font-size:13px;">${g.name}</strong>
                  <div class="gun-svg-box"><img src="${g.src}" alt="${g.name}"></div>
                  <div style="font-size:10px; color:#a7f3d0; font-weight:800; margin-bottom:6px;">DMG: ${g.damage}x | AMMO: ${g.mag}</div>
                  ${
                    isUnlocked
                      ? `<button class="cookie-btn ${equippedGun === g.id ? 'cookie-btn-green' : 'cookie-btn-blue'}" style="width:100\%; padding:7px 0; font-size:11px;" onclick="equipGun(${g.id})">
                          ${equippedGun === g.id ? '✔ EQUIPPED' : 'EQUIP'}
                        </button>`
                      : `<div style="display:flex; flex-direction:column; gap:5px; width:100%;">
                          <button class="cookie-btn" style="width:100%; padding:5px 0; font-size:10px;" onclick="buyGun(${g.id},${g.cost})">
                            🪙 ${g.cost} COINS
                          </button>
                          <button class="cookie-btn cookie-btn-purple" style="width:100%; padding:5px 0; font-size:10px;" onclick="requestRewardedAd('unlock_gun', ${g.id})">
                            🎬 AD UNLOCK
                          </button>
                        </div>`
                  }
                `;
                container.appendChild(card);
              });
            }

            function renderThemes() {
              const container = document.getElementById('hubListThemes');
              container.innerHTML = '';
              THEMES.forEach(t => {
                const card = document.createElement('div');
                card.className = `hub-card ${activeTheme === t.id ? 'active-item' : ''}`;
                const isUnlocked = unlockedThemes.includes(t.id);
                card.innerHTML = `
                  <strong style="color:#fef08a; font-size:13px;">${t.name}</strong>
                  <div class="theme-preview-box" style="background: linear-gradient(180deg, ${t.skyTop} 0%, ${t.skyBottom} 55%, ${t.waterTop} 55%, ${t.waterBottom} 100%);">
                    <div style="position:absolute; top:10px; right:14px; width:18px; height:18px; border-radius:50%; background:${t.sunColor};"></div>
                    <div style="position:absolute; bottom:0; left:0; right:0; height:16px; background:${t.reeds};"></div>
                  </div>
                  ${
                    isUnlocked
                      ? `<button class="cookie-btn ${activeTheme === t.id ? 'cookie-btn-green' : 'cookie-btn-blue'}" style="width:100\%; padding:7px 0; font-size:11px;" onclick="equipTheme(${t.id})">
                          ${activeTheme === t.id ? '✔ SELECTED' : 'SELECT'}
                        </button>`
                      : `<div style="display:flex; flex-direction:column; gap:5px; width:100%;">
                          <button class="cookie-btn" style="padding:5px; font-size:10px;" onclick="buyTheme(${t.id}, ${t.cost})">🪙 ${t.cost} COINS</button>
                          <button class="cookie-btn cookie-btn-purple" style="padding:5px; font-size:10px;" onclick="requestRewardedAd('unlock_theme', ${t.id})">🎬 AD UNLOCK</button>
                        </div>`
                  }
                `;
                container.appendChild(card);
              });
            }

            window.equipGun = function(id) { playTapSound(); equippedGun = id; saveState(); renderArmory(); };
            window.buyGun = function(id, cost) {
              playTapSound();
              if (coins >= cost) {
                coins -= cost; unlockedGuns.push(id); equippedGun = id; saveState(); renderArmory();
              } else { alert('Coins kam hain! 🎬 AD UNLOCK button dabayein ya ducks shoot karein.'); }
            };

            window.equipTheme = function(id) { playTapSound(); activeTheme = id; saveState(); renderThemes(); };
            window.buyTheme = function(id, cost) {
              playTapSound();
              if (coins >= cost) {
                coins -= cost; unlockedThemes.push(id); activeTheme = id; saveState(); renderThemes();
              } else { alert('Coins kam hain! 🎬 AD UNLOCK button se turant kholein.'); }
            };

            canvas.addEventListener('pointerdown', (e) => handleShoot(e.clientX, e.clientY));
            document.getElementById('reloadBtn').addEventListener('pointerdown', (e) => {
              e.stopPropagation(); isReloading = true; updateHud();
              playSound('reload');
              setTimeout(() => { ammo = maxAmmo; isReloading = false; updateHud(); }, 360);
            });
            document.getElementById('btnAbortExit').onclick = () => {
              playTapSound(); isRunning = false; 
              setGameplayUiVisible(false);
              document.getElementById('hubScreen').style.display = 'flex'; switchHub('levels');
            };
            document.getElementById('btnEnterHub').onclick = () => {
              initAudio(); playTapSound();
              selectedLevel = maxUnlockedLvl; // Auto-select highest unlocked stage
              document.getElementById('homeScreen').style.display = 'none';
              document.getElementById('homeCanvasBg').style.display = 'none';
              setGameplayUiVisible(false);
              document.getElementById('hubScreen').style.display = 'flex'; switchHub('levels');
            };
            document.getElementById('btnBackToHome').onclick = () => {
              playTapSound(); document.getElementById('hubScreen').style.display = 'none';
              setGameplayUiVisible(false);
              document.getElementById('homeScreen').style.display = 'flex';
              document.getElementById('homeCanvasBg').style.display = 'block';
              drawHomeDynamicBackground();
            };
            document.getElementById('btnStartMission').onclick = () => startMission(selectedLevel);
            document.getElementById('btnNextLevel').onclick = () => startMission(currentLvl + 1);
            document.getElementById('btnWinHub').onclick = () => {
              playTapSound(); document.getElementById('winScreen').style.display = 'none';
              setGameplayUiVisible(false);
              document.getElementById('hubScreen').style.display = 'flex'; switchHub('levels');
            };
            document.getElementById('btnRetry').onclick = () => startMission(currentLvl);
            document.getElementById('btnHubReturn').onclick = () => {
              playTapSound(); document.getElementById('gameOverScreen').style.display = 'none';
              setGameplayUiVisible(false);
              document.getElementById('hubScreen').style.display = 'flex'; switchHub('levels');
            };

            saveState();
            drawHomeDynamicBackground();
          </script>
        </body>
        </html>
        EOF

    - name: Automatically Find & Apply Custom App Icon
      run: |
        python3 -m pip install --upgrade Pillow
        python3 - << 'EOF'
        import os, glob
        from PIL import Image

        candidates = glob.glob('assets/*.[pP][nN][gG]') + glob.glob('*.[pP][nN][gG]')
        valid_icon = None
        for path in candidates:
            try:
                img = Image.open(path)
                img.verify()
                valid_icon = path
                print(f"Found valid app icon at: {valid_icon}")
                break
            except Exception:
                continue

        if valid_icon:
            src = Image.open(valid_icon).convert("RGBA")
            sizes = {
                'mipmap-mdpi': 48,
                'mipmap-hdpi': 72,
                'mipmap-xhdpi': 96,
                'mipmap-xxhdpi': 144,
                'mipmap-xxxhdpi': 192
            }
            res_dir = 'android/app/src/main/res'
            for folder, sz in sizes.items():
                target_folder = os.path.join(res_dir, folder)
                os.makedirs(target_folder, exist_ok=True)
                resized = src.resize((sz, sz), Image.Resampling.LANCZOS)
                resized.save(os.path.join(target_folder, 'ic_launcher.png'), 'PNG')
            print("Successfully injected custom app icons into all mipmap directories!")
        EOF

    - name: Fix Kotlin & Gradle Versions
      run: |
        find android -name "settings.gradle" -exec sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.24"/g' {} +
        find android -name "build.gradle" -exec sed -i "s/ext.kotlin_version = '[^']*'/ext.kotlin_version = '1.9.24'/g" {} +

    - name: Configure AdMob in AndroidManifest
      run: |
        MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
        if [ -f "$MANIFEST_FILE" ]; then
          if ! grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MANIFEST_FILE"; then
            sed -i '/<\/application>/i \        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-1590363558146928~3904943143"/>' "$MANIFEST_FILE"
          fi
        fi

    - name: Get Dependencies
      run: flutter pub get

    - name: Build Release APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: duck-shooter-release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
