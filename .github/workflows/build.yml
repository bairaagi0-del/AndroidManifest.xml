              <button id="authBtn" onclick="handleAuthStep()" class="w-full emerald-gradient btn-press text-white font-black py-3 rounded-xl shadow-lg text-sm uppercase tracking-wider mt-1">📲 SEND VERIFICATION OTP</button>
            </div>
          </div>

          <div id="mainApp" style="display:none;" class="p-4 max-w-md mx-auto flex flex-col gap-4">
            <div class="flex items-center justify-between glass-card px-4 py-3">
              <div>
                <div class="flex items-center gap-1.5">
                  <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                  <span id="uiUserName" class="font-black text-sm text-white">User</span>
                </div>
                <div id="uiUserContact" class="text-[10px] text-slate-400">user@gmail.com</div>
              </div>
              <button onclick="logoutUser()" class="bg-slate-800 text-slate-300 text-[10px] font-bold px-3 py-1.5 rounded-lg border border-slate-700">LOGOUT</button>
            </div>

            <div class="glass-card p-5 relative overflow-hidden border-2 border-amber-500/40">
