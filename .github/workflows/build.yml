name: Build Duck Shooter Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.x'
        channel: 'stable'

    - name: Recreate Android Project Structure
      run: |
        flutter create . --org com.rahulgupta --project-name duckshooter2

    - name: Ensure Assets Folder & File Exist
      run: |
        mkdir -p assets
        if [ ! -f assets/index.html ]; then
          echo "<!DOCTYPE html><html><head><meta name='viewport' content='width=device-width, initial-scale=1.0'></head><body style='background:#140904;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;'><h1>Duck Shooter 3D</h1></body></html>" > assets/index.html
        fi

    - name: Inject Duck Shooter Icon
      run: |
        # Download and place uploaded app_icon if present, else fallback
        mkdir -p assets
        if [ ! -s assets/app_icon.png ]; then
          curl -sL "https://raw.githubusercontent.com/${{ github.repository }}/main/assets/app_icon.png" -o assets/app_icon.png || true
        fi
        
        # Configuration setup for Launcher Icons generator
        cat << 'EOF' > flutter_launcher_icons.yaml
        flutter_launcher_icons:
          android: "launcher_icon"
          ios: false
          image_path: "assets/app_icon.png"
          min_sdk_android: 21
          adaptive_icon_background: "#140904"
          adaptive_icon_foreground: "assets/app_icon.png"
        EOF

    - name: Fix Kotlin & Gradle Versions
      run: |
        find android -name "settings.gradle" -exec sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.24"/g' {} +
        find android -name "build.gradle" -exec sed -i "s/ext.kotlin_version = '[^']*'/ext.kotlin_version = '1.9.24'/g" {} +

    - name: Configure AdMob in AndroidManifest
      run: |
        MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
        if [ -f "$MANIFEST_FILE" ]; then
          if ! grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MANIFEST_FILE"; then
            sed -i '/<\/application>/i \        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-1590363558146928~3904943143"/>' "$MANIFEST_FILE"
          fi
        fi

    - name: Get Dependencies & Generate App Icons
      run: |
        flutter pub get
        dart run flutter_launcher_icons

    - name: Build Release APK
      run: flutter build apk --release --no-tree-shake-icons --build-name=2.0.1 --build-number=30401

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: duck-shooter-release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
