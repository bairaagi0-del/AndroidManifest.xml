        window.renderGarageGrid = function() {
          const grid = document.getElementById('garageGrid');
          if (!grid) return;
          grid.innerHTML = '';
          document.getElementById('garageCoins').innerText = coins;
          carsData.forEach((car) => {
            let isUnlocked = unlockedCars.includes(car.id);
            let isSelected = activeCarIndex === car.id;
            let card = document.createElement('div');
            card.className = `car-card ${isSelected ? 'selected' : ''} ${!isUnlocked ? 'locked' : ''}`;
            card.innerHTML = `
