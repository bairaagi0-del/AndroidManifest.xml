name: Build Watch And Earn APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Write Clean pubspec.yaml
        run: |
          cat << 'EOF' > pubspec.yaml
          name: watchearn
          description: TaskTube Watch and Earn Rewards App
          publish_to: 'none'
          version: 1.2.1+4

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            webview_flutter: ^4.8.0
            webview_flutter_android: ^3.16.0
            google_mobile_ads: ^5.1.0

          flutter:
            uses-material-design: true
            assets:
              - assets/index.html
          EOF

      - name: Recreate Android Project Structure
        run: flutter create . --org com.rahulgupta --project-name watchearn

      - name: Generate Watch & Earn Launcher Icon
        run: |
          pip install Pillow
          python3 -c "
          import os, shutil
          from PIL import Image, ImageDraw

          anydpi_dir = 'android/app/src/main/res/mipmap-anydpi-v26'
          if os.path.exists(anydpi_dir):
              shutil.rmtree(anydpi_dir, ignore_errors=True)

          sizes = {'mipmap-mdpi': 48, 'mipmap-hdpi': 72, 'mipmap-xhdpi': 96, 'mipmap-xxhdpi': 144, 'mipmap-xxxhdpi': 192}
          for folder, size in sizes.items():
              d_path = f'android/app/src/main/res/{folder}'
              os.makedirs(d_path, exist_ok=True)
              img = Image.new('RGBA', (size, size), (0, 0, 0, 0))
              draw = ImageDraw.Draw(img)
              m = int(size * 0.04)
              draw.rounded_rectangle([m, m, size - m, size - m], radius=int(size * 0.22), fill=(6, 78, 59, 255), outline=(250, 204, 21, 255), width=max(2, int(size * 0.045)))
              cx, cy = size // 2, size // 2
              r = int(size * 0.30)
              draw.ellipse([cx - r, cy - r, cx + r, cy + r], fill=(245, 158, 11, 255), outline=(254, 240, 138, 255), width=max(2, int(size * 0.03)))
              p1 = (cx - int(r * 0.32), cy - int(r * 0.45))
              p2 = (cx - int(r * 0.32), cy + int(r * 0.45))
              p3 = (cx + int(r * 0.48), cy)
              draw.polygon([p1, p2, p3], fill=(6, 78, 59, 255))
              img.save(f'{d_path}/ic_launcher.png')
              img.save(f'{d_path}/ic_launcher_round.png')
          "

      - name: Fix Android Gradle Properties & Wrapper
        run: |
          echo "android.useAndroidX=true" > android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError" >> android/gradle.properties
          mkdir -p android/gradle/wrapper
          cat << 'EOF' > android/gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=gradle/wrapper
          EOF

      - name: Write lib/main.dart with Online Check & AdMob Bridge
        run: |
          mkdir -p lib
          cat << 'EOF' > lib/main.dart
          import 'dart:async';
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          import 'package:webview_flutter_android/webview_flutter_android.dart';
          import 'package:google_mobile_ads/google_mobile_ads.dart';

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await MobileAds.instance.initialize();
            SystemChrome.setPreferredOrientations([DeviceOrientation.portraitUp]);
            runApp(const MaterialApp(debugShowCheckedModeBanner: false, home: WatchEarnApp()));
          }

          class WatchEarnApp extends StatefulWidget {
            const WatchEarnApp({super.key});
            @override
            State<WatchEarnApp> createState() => _WatchEarnState();
          }

          class _WatchEarnState extends State<WatchEarnApp> {
            late final WebViewController _controller;
            BannerAd? _bannerAd;
            bool _isBannerReady = false;
            RewardedAd? _rewardedAd;
            InterstitialAd? _interstitialAd;
            bool _isOnline = true;
            Timer? _netTimer;

            final String _realBannerId = 'ca-app-pub-1590363558146928/9630631281';
            final String _realInterstitialId = 'ca-app-pub-1590363558146928/7196039630';
            final String _realRewardedId = 'ca-app-pub-1590363558146928/2274885449';

            @override
            void initState() {
              super.initState();
              _checkInternetConnection();
              _netTimer = Timer.periodic(const Duration(seconds: 5), (_) => _checkInternetConnection());
              _loadBannerAd();
              _loadInterstitialAd();
              _loadRewardedAd();

              _controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setBackgroundColor(const Color(0xFF06131F))
                ..addJavaScriptChannel(
                  'AdMobBridge',
                  onMessageReceived: (JavaScriptMessage message) {
                    if (message.message == 'showInterstitial') {
                      _showInterstitialAd();
                    } else if (message.message == 'showRewarded30') {
                      _showRewardedAd(30);
                    } else if (message.message == 'showRewarded60') {
                      _showRewardedAd(60);
                    } else if (message.message == 'showSpinAd') {
                      _showSpinInterstitial();
                    }
                  },
                );

              if (_controller.platform is AndroidWebViewController) {
                (_controller.platform as AndroidWebViewController).setMediaPlaybackRequiresUserGesture(false);
              }
              _initWebView();
            }

            Future<void> _checkInternetConnection() async {
              try {
                final result = await InternetAddress.lookup('google.com').timeout(const Duration(seconds: 3));
                bool connected = result.isNotEmpty && result[0].rawAddress.isNotEmpty;
                if (connected != _isOnline && mounted) setState(() => _isOnline = connected);
              } catch (_) {
                if (_isOnline && mounted) setState(() => _isOnline = false);
              }
            }

            Future<void> _initWebView() async {
              await _controller.clearCache();
              await _controller.loadFlutterAsset('assets/index.html');
            }

            void _loadBannerAd() {
              _bannerAd?.dispose();
              _bannerAd = BannerAd(
                adUnitId: _realBannerId,
                request: const AdRequest(),
                size: AdSize.banner,
                listener: BannerAdListener(
                  onAdLoaded: (ad) { if (mounted) setState(() => _isBannerReady = true); },
                  onAdFailedToLoad: (ad, err) { ad.dispose(); if (mounted) setState(() => _isBannerReady = false); Future.delayed(const Duration(seconds: 4), _loadBannerAd); },
                ),
              )..load();
            }

            void _loadInterstitialAd() {
              InterstitialAd.load(
                adUnitId: _realInterstitialId,
                request: const AdRequest(),
                adLoadCallback: InterstitialAdLoadCallback(
                  onAdLoaded: (ad) => _interstitialAd = ad,
                  onAdFailedToLoad: (err) { _interstitialAd = null; Future.delayed(const Duration(seconds: 4), _loadInterstitialAd); },
                ),
              );
            }

            void _showInterstitialAd() {
              if (_interstitialAd != null) {
                _interstitialAd!.fullScreenContentCallback = FullScreenContentCallback(
                  onAdDismissedFullScreenContent: (ad) { ad.dispose(); _interstitialAd = null; _loadInterstitialAd(); },
                  onAdFailedToShowFullScreenContent: (ad, err) { ad.dispose(); _interstitialAd = null; _loadInterstitialAd(); },
                );
                _interstitialAd!.show();
                _interstitialAd = null;
              } else {
                _loadInterstitialAd();
              }
            }

            void _showSpinInterstitial() {
              if (_interstitialAd != null) {
                _interstitialAd!.fullScreenContentCallback = FullScreenContentCallback(
                  onAdDismissedFullScreenContent: (ad) {
                    ad.dispose();
                    _interstitialAd = null;
                    _loadInterstitialAd();
                    _controller.runJavaScript("if(window.onSpinAdClosed) window.onSpinAdClosed();");
                  },
                  onAdFailedToShowFullScreenContent: (ad, err) {
                    ad.dispose();
                    _interstitialAd = null;
                    _loadInterstitialAd();
                    _controller.runJavaScript("if(window.onSpinAdClosed) window.onSpinAdClosed();");
                  },
                );
                _interstitialAd!.show();
                _interstitialAd = null;
              } else {
                _loadInterstitialAd();
                _controller.runJavaScript("if(window.onSpinAdClosed) window.onSpinAdClosed();");
              }
            }

            void _loadRewardedAd() {
              RewardedAd.load(
                adUnitId: _realRewardedId,
                request: const AdRequest(),
                rewardedAdLoadCallback: RewardedAdLoadCallback(
                  onAdLoaded: (ad) => _rewardedAd = ad,
                  onAdFailedToLoad: (err) { _rewardedAd = null; Future.delayed(const Duration(seconds: 4), _loadRewardedAd); },
                ),
              );
            }

            void _showRewardedAd(int secondsType) {
              if (!_isOnline) {
                _controller.runJavaScript("if(window.onAdFailed) window.onAdFailed('No Internet Connection!');");
                return;
              }
              if (_rewardedAd != null) {
                bool rewardEarned = false;
                _rewardedAd!.fullScreenContentCallback = FullScreenContentCallback(
                  onAdDismissedFullScreenContent: (ad) {
                    ad.dispose();
                    _rewardedAd = null;
                    _loadRewardedAd();
                    if (rewardEarned) {
                      _controller.runJavaScript("if(window.onAdCompletedSuccess) window.onAdCompletedSuccess($secondsType);");
                    } else {
                      _controller.runJavaScript("if(window.onAdFailed) window.onAdFailed('Ad poora nahi dekha gaya!');");
                    }
                  },
                  onAdFailedToShowFullScreenContent: (ad, err) {
                    ad.dispose();
                    _rewardedAd = null;
                    _controller.runJavaScript("if(window.onAdFailed) window.onAdFailed('Ad show nahi ho paya.');");
                    _loadRewardedAd();
                  },
                );
                _rewardedAd!.show(onUserEarnedReward: (AdWithoutView ad, RewardItem reward) { rewardEarned = true; });
                _rewardedAd = null;
              } else {
                _controller.runJavaScript("if(window.onAdFailed) window.onAdFailed('Ad load ho raha hai, 2 second baad click karein.');");
                _loadRewardedAd();
              }
            }

            @override
            void dispose() {
              _netTimer?.cancel();
              _bannerAd?.dispose();
              _interstitialAd?.dispose();
              _rewardedAd?.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF06131F),
                body: SafeArea(
                  child: Stack(
                    children: [
                      Column(
                        children: [
                          Expanded(child: WebViewWidget(controller: _controller)),
                          Container(
                            width: double.infinity, height: 52, color: const Color(0xFF040D16), alignment: Alignment.center,
                            child: (_isBannerReady && _bannerAd != null)
                                ? SizedBox(width: _bannerAd!.size.width.toDouble(), height: _bannerAd!.size.height.toDouble(), child: AdWidget(ad: _bannerAd!))
                                : const Text('SPONSORED ADMOB BANNER ACTIVE', style: TextStyle(color: Color(0xFF64748B), fontSize: 10, fontWeight: FontWeight.bold, letterSpacing: 1.2)),
                          ),
                        ],
                      ),
                      if (!_isOnline)
                        Container(
                          color: const Color(0xF5040D16), width: double.infinity, height: double.infinity, padding: const EdgeInsets.all(28),
                          child: Column(
                            mainAxisAlignment: MainAxisAlignment.center,
                            children: [
                              const Icon(Icons.wifi_off_rounded, color: Color(0xFFEF4444), size: 78),
                              const SizedBox(height: 18),
                              const Text('INTERNET REQUIRED!', style: TextStyle(color: Colors.white, fontSize: 24, fontWeight: FontWeight.w900)),
                              const SizedBox(height: 10),
                              const Text('Yeh Watch & Earn app kewal ONLINE mode me chalta hai. Internet on karein.', textAlign: TextAlign.center, style: TextStyle(color: Color(0xFF94A3B8), fontSize: 14)),
                              const SizedBox(height: 24),
                              ElevatedButton(style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF10B981)), onPressed: _checkInternetConnection, child: const Text('RETRY CONNECTION', style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold)))
                            ],
                          ),
                        ),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

