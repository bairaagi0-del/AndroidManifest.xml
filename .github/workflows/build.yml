name: Build Online Mafia City Wars Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.x'
        channel: 'stable'

    - name: Write Clean pubspec.yaml with Firebase
      run: |
        cat << 'EOF' > pubspec.yaml
        name: mafiacitywars
        description: Grand Underworld City Wars Online Syndicate
        publish_to: 'none'
        version: 1.0.0+1

        environment:
          sdk: '>=3.0.0 <4.0.0'

        dependencies:
          flutter:
            sdk: flutter
          webview_flutter: ^4.8.0
          google_mobile_ads: ^5.1.0
          firebase_core: ^3.1.1
          firebase_database: ^11.0.2
          connectivity_plus: ^6.0.3

        flutter:
          uses-material-design: true
          assets:
            - assets/index.html
        EOF

    - name: Recreate Android Project Structure
      run: |
        flutter create . --org com.rahulgupta --project-name mafiacitywars

    - name: Fix Android Gradle Properties & Wrapper
      run: |
        echo "android.useAndroidX=true" > android/gradle.properties
        echo "android.enableJetifier=true" >> android/gradle.properties
        echo "org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError" >> android/gradle.properties
        
        mkdir -p android/gradle/wrapper
        cat << 'EOF' > android/gradle/wrapper/gradle-wrapper.properties
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
        networkTimeout=10000
        validateDistributionUrl=true
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=gradle/wrapper
        EOF

    - name: Write Clean lib/main.dart (Online & Connectivity Check)
      run: |
        mkdir -p lib
        cat << 'EOF' > lib/main.dart
        import 'dart:async';
        import 'package:flutter/material.dart';
        import 'package:flutter/services.dart';
        import 'package:webview_flutter/webview_flutter.dart';
        import 'package:google_mobile_ads/google_mobile_ads.dart';
        import 'package:connectivity_plus/connectivity_plus.dart';

        void main() async {
          WidgetsFlutterBinding.ensureInitialized();
          await MobileAds.instance.initialize();
          SystemChrome.setPreferredOrientations([
            DeviceOrientation.landscapeLeft,
            DeviceOrientation.landscapeRight,
          ]);
          runApp(const MaterialApp(
            debugShowCheckedModeBanner: false,
            home: MafiaOnlineApp(),
          ));
        }

        class MafiaOnlineApp extends StatefulWidget {
          const MafiaOnlineApp({super.key});

          @override
          State<MafiaOnlineApp> createState() => _MafiaOnlineState();
        }

        class _MafiaOnlineState extends State<MafiaOnlineApp> {
          late final WebViewController _controller;
          BannerAd? _bannerAd;
          bool _isBannerReady = false;
          RewardedAd? _rewardedAd;
          InterstitialAd? _interstitialAd;
          bool _isOnline = true;

          final String _realBannerId = 'ca-app-pub-1590363558146928/9630631281';
          final String _realInterstitialId = 'ca-app-pub-1590363558146928/7196039630';
          final String _realRewardedId = 'ca-app-pub-1590363558146928/2274885449';

          @override
          void initState() {
            super.initState();
            _checkConnectivity();
            _loadBannerAd();
            _loadInterstitialAd();
            _loadRewardedAd();

            _controller = WebViewController()
              ..setJavaScriptMode(JavaScriptMode.unrestricted)
              ..setBackgroundColor(const Color(0xFF0b0f19))
              ..addJavaScriptChannel(
                'AdMobBridge',
                onMessageReceived: (JavaScriptMessage message) {
                  if (message.message == 'showInterstitial') {
                    _showInterstitialAd();
                  } else if (message.message == 'showRewarded') {
                    _showRewardedAd();
                  }
                },
              );

            _initWebView();
          }

          Future<void> _checkConnectivity() async {
            var connectivityResult = await (Connectivity().checkConnectivity());
            if (connectivityResult.contains(ConnectivityResult.none)) {
              setState(() { _isOnline = false; });
            }
          }

          Future<void> _initWebView() async {
            await _controller.clearCache();
            await _controller.loadFlutterAsset('assets/index.html');
          }

          void _loadBannerAd() {
            _bannerAd = BannerAd(
              adUnitId: _realBannerId,
              request: const AdRequest(),
              size: AdSize.banner,
              listener: BannerAdListener(
                onAdLoaded: (ad) { setState(() { _isBannerReady = true; }); },
                onAdFailedToLoad: (ad, err) {
                  ad.dispose();
                  setState(() { _isBannerReady = false; });
                  Future.delayed(const Duration(seconds: 6), _loadBannerAd);
                },
              ),
            )..load();
          }

          void _loadInterstitialAd() {
            InterstitialAd.load(
              adUnitId: _realInterstitialId,
              request: const AdRequest(),
              adLoadCallback: InterstitialAdLoadCallback(
                onAdLoaded: (ad) { _interstitialAd = ad; },
                onAdFailedToLoad: (error) { _interstitialAd = null; Future.delayed(const Duration(seconds: 6), _loadInterstitialAd); },
              ),
            );
          }

          void _showInterstitialAd() {
            if (_interstitialAd != null) {
              _interstitialAd!.fullScreenContentCallback = FullScreenContentCallback(
                onAdDismissedFullScreenContent: (ad) { ad.dispose(); _interstitialAd = null; _loadInterstitialAd(); },
                onAdFailedToShowFullScreenContent: (ad, error) { ad.dispose(); _interstitialAd = null; _loadInterstitialAd(); },
              );
              _interstitialAd!.show();
              _interstitialAd = null;
            } else {
              _loadInterstitialAd();
            }
          }

          void _loadRewardedAd() {
            RewardedAd.load(
              adUnitId: _realRewardedId,
              request: const AdRequest(),
              rewardedAdLoadCallback: RewardedAdLoadCallback(
                onAdLoaded: (ad) { _rewardedAd = ad; },
                onAdFailedToLoad: (error) { _rewardedAd = null; Future.delayed(const Duration(seconds: 5), _loadRewardedAd); },
              ),
            );
          }

          void _showRewardedAd() {
            if (_rewardedAd != null) {
              _rewardedAd!.fullScreenContentCallback = FullScreenContentCallback(
                onAdDismissedFullScreenContent: (ad) { ad.dispose(); _rewardedAd = null; _loadRewardedAd(); },
                onAdFailedToShowFullScreenContent: (ad, error) { ad.dispose(); _rewardedAd = null; _loadRewardedAd(); },
              );
              _rewardedAd!.show(
                onUserEarnedReward: (AdWithoutView ad, RewardItem reward) {
                  _controller.runJavaScript('window.onRewardedAdReward();');
                },
              );
              _rewardedAd = null;
            } else {
              _loadRewardedAd();
            }
          }

          @override
          Widget build(BuildContext context) {
            return Scaffold(
              backgroundColor: const Color(0xFF0b0f19),
              body: SafeArea(
                child: !_isOnline
                    ? Center(
                        child: Column(
                          mainAxisAlignment: MainAxisAlignment.center,
                          children: [
                            const Text('🌐', style: TextStyle(fontSize: 50)),
                            const SizedBox(height: 10),
                            const Text('Internet Connection Required!', style: TextStyle(color: Colors.white, fontSize: 18, fontWeight: FontWeight.bold)),
                            const SizedBox(height: 10),
                            ElevatedButton(
                              onPressed: () async {
                                var res = await Connectivity().checkConnectivity();
                                if (!res.contains(ConnectivityResult.none)) {
                                  setState(() { _isOnline = true; });
                                  _initWebView();
                                }
                              },
                              child: const Text('RETRY'),
                            ),
                          ],
                        ),
                      )
                    : Column(
                        children: [
                          Expanded(
                            child: WebViewWidget(controller: _controller),
                          ),
                          if (_isBannerReady && _bannerAd != null)
                            Container(
                              color: Colors.black,
                              width: _bannerAd!.size.width.toDouble(),
                              height: _bannerAd!.size.height.toDouble(),
                              child: AdWidget(ad: _bannerAd!),
                            ),
                        ],
                      ),
              ),
            );
          }
        }
        EOF

    - name: Create Online HTML Game Engine
      run: |
        mkdir -p assets
        cat << 'EOF' > assets/index.html
        <!DOCTYPE html>
        <html lang="hi">
        <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
          <title>Grand Underworld: Online Wars</title>
          <style>
            * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
            html, body { width: 100%; height: 100%; overflow: hidden; background: #080b12; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
            #gameContainer { position: relative; width: 100vw; height: 100vh; background: #0b0f19; overflow: hidden; display: flex; align-items: center; justify-content: center; }
            canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
            .screen { position: absolute; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; background: rgba(11, 15, 25, 0.94); }
            .title-glow { font-size: 38px; font-weight: 900; letter-spacing: 2px; color: #f59e0b; text-transform: uppercase; text-shadow: 0 0 20px rgba(245, 158, 11, 0.6); }
            .subtitle-badge { font-size: 12px; font-weight: 800; color: #cbd5e1; background: #1e293b; padding: 4px 16px; border-radius: 12px; border: 1px solid #334155; margin-top: 6px; letter-spacing: 3px; }
            .mafia-btn { background: linear-gradient(180deg, #f59e0b 0%, #b45309 100%); border: 2px solid #fde047; color: #fff; font-size: 15px; font-weight: 900; padding: 12px 30px; border-radius: 24px; cursor: pointer; box-shadow: 0 6px 0 #78350f, 0 10px 20px rgba(0,0,0,0.7); text-transform: uppercase; margin: 8px; }
            .btn-green { background: linear-gradient(180deg, #10b981 0%, #047857 100%); border-color: #6ee7b7; box-shadow: 0 6px 0 #064e3b; }
            .btn-blue { background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%); border-color: #93c5fd; box-shadow: 0 6px 0 #1e3a8a; }
            .btn-red { background: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%); border-color: #fca5a5; box-shadow: 0 6px 0 #7f1d1d; }
            .hud-bar { position: absolute; top: 12px; left: 16px; right: 16px; display: none; justify-content: space-between; align-items: center; z-index: 30; pointer-events: none; }
            .hud-pill { background: rgba(15, 23, 42, 0.88); border: 2px solid #334155; color: #f8fafc; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
            .gamepad { position: absolute; bottom: 16px; left: 16px; right: 16px; display: none; justify-content: space-between; align-items: flex-end; z-index: 30; pointer-events: none; }
            .pad-cluster { display: flex; gap: 10px; pointer-events: auto; }
            .control-circle-btn { width: 56px; height: 56px; border-radius: 50%; background: rgba(30, 41, 59, 0.9); border: 2px solid #64748b; color: #fff; font-size: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
          </style>
        </head>
        <body>
          <div id="gameContainer">
            <div id="homeScreen" class="screen">
              <div class="title-glow">ONLINE SYNDICATE</div>
              <div class="subtitle-badge">CLOUD CLAN WARS</div>
              <div style="margin: 20px 0; display: flex; gap: 15px;">
                <button class="mafia-btn btn-green" onclick="startGame()">🌐 ONLINE RAID</button>
              </div>
              <div style="color: #10b981; font-size: 12px; font-weight: 700; margin-top: 10px;">🟢 SERVER STATUS: ONLINE</div>
            </div>

            <div id="hudBar" class="hud-bar">
              <div class="hud-pill">🛡️ HEALTH: <span id="uiHealth" style="color:#ef4444;">100%</span></div>
              <div class="hud-pill">🌐 SYNC CLAN SCORE: <span id="uiScore" style="color:#f59e0b;">0/10</span></div>
              <button class="mafia-btn btn-red" style="padding: 4px 12px; font-size: 11px; margin:0; pointer-events:auto;" onclick="abortGame()">EXIT</button>
            </div>

            <div id="gamepad" class="gamepad">
              <div class="pad-cluster">
                <div class="control-circle-btn" ontouchstart="movePlayer(-1)" onmousedown="movePlayer(-1)">◀</div>
                <div class="control-circle-btn" ontouchstart="movePlayer(1)" onmousedown="movePlayer(1)">▶</div>
              </div>
              <div class="pad-cluster">
                <div class="control-circle-btn" style="background:#b91c1c; border-color:#fca5a5;" ontouchstart="playerShoot()" onmousedown="playerShoot()">🔥</div>
              </div>
            </div>

            <canvas id="gameCanvas" width="1280" height="720"></canvas>

            <div id="gameOverScreen" class="screen" style="display:none;">
              <div class="title-glow" style="color:#ef4444;">RAID FAILED</div>
              <button class="mafia-btn btn-green" onclick="startGame()">RETRY RAID</button>
              <button class="mafia-btn btn-blue" onclick="backToHome()">MAIN MENU</button>
            </div>

            <div id="winScreen" class="screen" style="display:none;">
              <div class="title-glow" style="color:#10b981;">CLOUD TERRITORY SECURED!</div>
              <button class="mafia-btn btn-green" onclick="startGame()">NEXT RAID</button>
              <button class="mafia-btn btn-blue" onclick="backToHome()">MAIN MENU</button>
            </div>
          </div>

          <script>
            let isRunning = false;
            let playerX = 150, playerY = 520, playerHealth = 100, score = 0, targetScore = 10;
            let bullets = [], enemies = [];
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');

            function updateUI() {
              document.getElementById('uiHealth').innerText = playerHealth + '%';
              document.getElementById('uiScore').innerText = score + '/' + targetScore;
            }

            function backToHome() {
              document.getElementById('gameOverScreen').style.display = 'none';
              document.getElementById('winScreen').style.display = 'none';
              document.getElementById('homeScreen').style.display = 'flex';
            }

            function startGame() {
              document.getElementById('homeScreen').style.display = 'none';
              document.getElementById('gameOverScreen').style.display = 'none';
              document.getElementById('winScreen').style.display = 'none';
              document.getElementById('hudBar').style.display = 'flex';
              document.getElementById('gamepad').style.display = 'flex';
              playerHealth = 100; score = 0; playerX = 150; bullets = []; enemies = [];
              isRunning = true;
              for(let i=0; i<4; i++) enemies.push({ x: 700 + i * 140, y: 520, vx: -1.2, health: 2 });
              gameLoop();
            }

            function abortGame() {
              isRunning = false;
              document.getElementById('hudBar').style.display = 'none';
              document.getElementById('gamepad').style.display = 'none';
              backToHome();
            }

            function movePlayer(dir) { playerX = Math.max(50, Math.min(1000, playerX + dir * 35)); }
            function playerShoot() { bullets.push({ x: playerX + 40, y: playerY - 20, vx: 16 }); }

            function gameLoop() {
              if (!isRunning) return;
              ctx.fillStyle = '#0b0f19'; ctx.fillRect(0, 0, 1280, 720);
              ctx.fillStyle = '#1e293b'; ctx.fillRect(100, 200, 180, 360); ctx.fillRect(680, 250, 200, 310);
              ctx.fillStyle = '#111827'; ctx.fillRect(0, 560, 1280, 160);
              ctx.fillStyle = '#f59e0b'; ctx.fillRect(0, 556, 1280, 4);

              ctx.fillStyle = '#f59e0b'; ctx.beginPath(); ctx.arc(playerX, playerY - 45, 18, 0, Math.PI*2); ctx.fill();
              ctx.fillStyle = '#1e3a8a'; ctx.fillRect(playerX - 16, playerY - 30, 32, 45);

              ctx.fillStyle = '#fde047';
              for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i]; b.x += b.vx; ctx.fillRect(b.x, b.y, 12, 4);
                if (b.x > 1280) bullets.splice(i, 1);
              }

              for (let i = enemies.length - 1; i >= 0; i--) {
                let en = enemies[i]; en.x += en.vx;
                ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(en.x, en.y - 45, 18, 0, Math.PI*2); ctx.fill();
                
                for (let j = bullets.length - 1; j >= 0; j--) {
                  let b = bullets[j];
                  if (Math.hypot(b.x - en.x, b.y - en.y) < 35) {
                    en.health--; bullets.splice(j, 1);
                    if (en.health <= 0) {
                      enemies.splice(i, 1); score++; updateUI();
                      if (score >= targetScore) {
                        isRunning = false;
                        document.getElementById('hudBar').style.display = 'none';
                        document.getElementById('gamepad').style.display = 'none';
                        document.getElementById('winScreen').style.display = 'flex';
                        return;
                      }
                      setTimeout(() => { if(isRunning) enemies.push({ x: 1250, y: 520, vx: -1.4, health: 2 }); }, 1000);
                    }
                    break;
                  }
                }
              }
              requestAnimationFrame(gameLoop);
            }
          </script>
        </body>
        </html>
        EOF

    - name: Configure Gradle & SDK 34
      run: |
        cat << 'EOF' > android/app/build.gradle
        plugins {
            id "com.android.application"
            id "kotlin-android"
            id "dev.flutter.flutter-gradle-plugin"
        }

        android {
            namespace = "com.rahulgupta.mafiacitywars"
            compileSdk = 34
            ndkVersion = flutter.ndkVersion

            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_1_8
                targetCompatibility = JavaVersion.VERSION_1_8
            }

            kotlinOptions {
                jvmTarget = "1.8"
            }

            defaultConfig {
                applicationId = "com.rahulgupta.mafiacitywars"
                minSdk = 24
                targetSdk = 34
                versionCode = 1
                versionName = "1.0.0"
                multiDexEnabled = true
            }

            buildTypes {
                release {
                    signingConfig = signingConfigs.debug
                    minifyEnabled false
                    shrinkResources false
                }
            }
        }

        flutter {
            source = "../.."
        }
        EOF

    - name: Configure AdMob & Permissions in AndroidManifest
      run: |
        MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
        if [ -f "$MANIFEST_FILE" ]; then
          if ! grep -q "android.permission.INTERNET" "$MANIFEST_FILE"; then
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="com.google.android.gms.permission.AD_ID"/>' "$MANIFEST_FILE"
          fi
          if ! grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MANIFEST_FILE"; then
            sed -i '/<\/application>/i \        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-1590363558146928~3904943143"/>' "$MANIFEST_FILE"
          fi
        fi

    - name: Fix Kotlin & Gradle Versions
      run: |
        find android -name "settings.gradle" -exec sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.24"/g' {} +
        find android -name "build.gradle" -exec sed -i "s/ext.kotlin_version = '[^']*'/ext.kotlin_version = '1.9.24'/g" {} +

    - name: Get Dependencies
      run: flutter pub get

    - name: Build Release APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: mafia-online-apk
        path: build/app/outputs/flutter-apk/app-release.apk
