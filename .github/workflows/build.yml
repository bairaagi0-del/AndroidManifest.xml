              <button id="tabBtnRefer" onclick="switchTab('refer')" class="py-2 rounded-xl font-black text-[11px] text-slate-400">🤝 REFER</button>
              <button id="tabBtnWallet" onclick="switchTab('wallet')" class="py-2 rounded-xl font-black text-[11px] text-slate-400">💳 REDEEM</button>
            </div>

