name: Build Apex Turbo F1 Release APK

on:
push:
branches: [ main, master ]
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
- name: Checkout Code
  uses: actions/checkout@v4

- name: Set up Java
  uses: actions/setup-java@v4
  with:
    distribution: 'zulu'
    java-version: '17'

- name: Set up Flutter
  uses: subosito/flutter-action@v2
  with:
    flutter-version: '3.22.x'
    channel: 'stable'

- name: Write Clean pubspec.yaml
  run: |
    cat << 'EOF' > pubspec.yaml
    name: apexturbof1
    description: Apex Turbo F1 & GT - Android 10+ Edition
    publish_to: 'none'
    version: 2.0.0+2

    environment:
      sdk: '>=3.0.0 <4.0.0'

    dependencies:
      flutter:
        sdk: flutter
      webview_flutter: ^4.8.0
      google_mobile_ads: ^5.1.0
      url_launcher: ^6.3.0

    flutter:
      uses-material-design: true
      assets:
        - assets/index.html
    EOF

- name: Recreate Android Project Structure
  run: |
    flutter create . --org com.govindgupta --project-name apexturbof1

- name: Fix Android Gradle Properties & Wrapper
  run: |
    echo "android.useAndroidX=true" > android/gradle.properties
    echo "android.enableJetifier=true" >> android/gradle.properties
    echo "org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError" >> android/gradle.properties
    
    mkdir -p android/gradle/wrapper
    cat << 'EOF' > android/gradle/wrapper/gradle-wrapper.properties
    distributionBase=GRADLE_USER_HOME
    distributionPath=wrapper/dists
    distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
    networkTimeout=10000
    validateDistributionUrl=true
    zipStoreBase=GRADLE_USER_HOME
    zipStorePath=gradle/wrapper
    EOF

- name: Write Clean lib/main.dart (Landscape Mode & AdMob Bridge)
  run: |
    mkdir -p lib
    cat << 'EOF' > lib/main.dart
    import 'dart:async';
    import 'package:flutter/material.dart';
    import 'package:flutter/services.dart';
    import 'package:webview_flutter/webview_flutter.dart';
    import 'package:google_mobile_ads/google_mobile_ads.dart';
    import 'package:url_launcher/url_launcher.dart';

    void main() async {
      WidgetsFlutterBinding.ensureInitialized();
      await MobileAds.instance.initialize();
      await SystemChrome.setPreferredOrientations([
        DeviceOrientation.landscapeLeft,
        DeviceOrientation.landscapeRight,
      ]);
      await SystemChrome.setEnabledSystemUIMode(SystemUiMode.immersiveSticky);
      runApp(const MaterialApp(
        debugShowCheckedModeBanner: false,
        home: ApexTurboRacingApp(),
      ));
    }

    class ApexTurboRacingApp extends StatefulWidget {
      const ApexTurboRacingApp({super.key});

      @override
      State<ApexTurboRacingApp> createState() => _ApexTurboRacingAppState();
    }

    class _ApexTurboRacingAppState extends State<ApexTurboRacingApp> {
      late final WebViewController _controller;
      BannerAd? _bannerAd;
      bool _isBannerReady = false;
      RewardedAd? _rewardedAd;
      InterstitialAd? _interstitialAd;

      final String _realBannerId = 'ca-app-pub-1590363558146928/9630631281';
      final String _realInterstitialId = 'ca-app-pub-1590363558146928/7196039630';
      final String _realRewardedId = 'ca-app-pub-1590363558146928/2274885449';

      @override
      void initState() {
        super.initState();
        _loadBannerAd();
        _loadInterstitialAd();
        _loadRewardedAd();

        _controller = WebViewController()
          ..setJavaScriptMode(JavaScriptMode.unrestricted)
          ..setBackgroundColor(const Color(0xFF030712))
          ..setNavigationDelegate(
            NavigationDelegate(
              onNavigationRequest: (NavigationRequest request) async {
                if (request.url.contains('youtube.com') || request.url.contains('youtu.be')) {
                  final Uri uri = Uri.parse(request.url);
                  if (await canLaunchUrl(uri)) {
                    await launchUrl(uri, mode: LaunchMode.externalApplication);
                  }
                  return NavigationDecision.prevent;
                }
                return NavigationDecision.navigate;
              },
            ),
          )
          ..addJavaScriptChannel(
            'AdMobBridge',
            onMessageReceived: (JavaScriptMessage message) {
              if (message.message == 'showInterstitial') {
                _showInterstitialAd();
              } else if (message.message == 'showRewarded') {
                _showRewardedAd();
              }
            },
          );

        _initWebView();
      }

      Future<void> _initWebView() async {
        await _controller.clearCache();
        await _controller.loadFlutterAsset('assets/index.html');
      }

      void _loadBannerAd() {
        _bannerAd = BannerAd(
          adUnitId: _realBannerId,
          request: const AdRequest(),
          size: AdSize.banner,
          listener: BannerAdListener(
            onAdLoaded: (ad) { setState(() { _isBannerReady = true; }); },
            onAdFailedToLoad: (ad, err) {
              ad.dispose();
              setState(() { _isBannerReady = false; });
              Future.delayed(const Duration(seconds: 6), _loadBannerAd);
            },
          ),
        )..load();
      }

      void _loadInterstitialAd() {
        InterstitialAd.load(
          adUnitId: _realInterstitialId,
          request: const AdRequest(),
          adLoadCallback: InterstitialAdLoadCallback(
            onAdLoaded: (ad) { _interstitialAd = ad; },
            onAdFailedToLoad: (error) { _interstitialAd = null; Future.delayed(const Duration(seconds: 6), _loadInterstitialAd); },
          ),
        );
      }

      void _showInterstitialAd() {
        if (_interstitialAd != null) {
          _interstitialAd!.fullScreenContentCallback = FullScreenContentCallback(
            onAdDismissedFullScreenContent: (ad) { ad.dispose(); _interstitialAd = null; _loadInterstitialAd(); },
            onAdFailedToShowFullScreenContent: (ad, error) { ad.dispose(); _interstitialAd = null; _loadInterstitialAd(); },
          );
          _interstitialAd!.show();
          _interstitialAd = null;
        } else {
          _loadInterstitialAd();
        }
      }

      void _loadRewardedAd() {
        RewardedAd.load(
          adUnitId: _realRewardedId,
          request: const AdRequest(),
          rewardedAdLoadCallback: RewardedAdLoadCallback(
            onAdLoaded: (ad) { _rewardedAd = ad; },
            onAdFailedToLoad: (error) { _rewardedAd = null; Future.delayed(const Duration(seconds: 5), _loadRewardedAd); },
          ),
        );
      }

      void _showRewardedAd() {
        if (_rewardedAd != null) {
          _rewardedAd!.fullScreenContentCallback = FullScreenContentCallback(
            onAdDismissedFullScreenContent: (ad) { ad.dispose(); _rewardedAd = null; _loadRewardedAd(); },
            onAdFailedToShowFullScreenContent: (ad, error) { ad.dispose(); _rewardedAd = null; _loadRewardedAd(); },
          );
          _rewardedAd!.show(
            onUserEarnedReward: (AdWithoutView ad, RewardItem reward) {
              _controller.runJavaScript('if(window.resolveAdReward) window.resolveAdReward();');
            },
          );
          _rewardedAd = null;
        } else {
          _loadRewardedAd();
        }
      }

      @override
      void dispose() {
        _bannerAd?.dispose();
        _interstitialAd?.dispose();
        _rewardedAd?.dispose();
        super.dispose();
      }

      @override
      Widget build(BuildContext context) {
        return Scaffold(
          backgroundColor: const Color(0xFF030712),
          body: SafeArea(
            child: Stack(
              children: [
                Positioned.fill(
                  child: WebViewWidget(controller: _controller),
                ),
                if (_isBannerReady && _bannerAd != null)
                  Align(
                    alignment: Alignment.bottomCenter,
                    child: Container(
                      color: Colors.black87,
                      width: _bannerAd!.size.width.toDouble(),
                      height: _bannerAd!.size.height.toDouble(),
                      child: AdWidget(ad: _bannerAd!),
                    ),
                  ),
              ],
            ),
          ),
        );
      }
    }
    EOF

- name: Create Apex Turbo F1 HTML Game Asset
  run: |
    mkdir -p assets
    cat << 'EOF' > assets/index.html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
      <title>Apex Turbo F1 & GT - Android 10+ Edition</title>
      <script src="https://cdn.tailwindcss.com"></script>
      <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
      <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
      <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; touch-action: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #030712; font-family: 'Inter', system-ui, sans-serif; }
        #gameContainer { position: relative; width: 100vw; height: 100vh; background: #030712; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; }
        .screen { position: absolute; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; background: radial-gradient(circle at center, rgba(15, 23, 42, 0.88) 0%, rgba(3, 7, 18, 0.96) 100%); backdrop-filter: blur(12px); }
        #homeScreen { background: radial-gradient(circle at center, rgba(9, 13, 22, 0.42) 0%, rgba(3, 7, 18, 0.88) 100%); backdrop-filter: blur(3px); }
        @keyframes glowPulse {
          0%, 100% { text-shadow: 0 0 20px rgba(239, 68, 68, 0.85), 0 0 40px rgba(245, 158, 11, 0.6), 0 4px 12px rgba(0,0,0,0.95); transform: scale(1); }
          50% { text-shadow: 0 0 35px rgba(245, 158, 11, 1), 0 0 70px rgba(239, 68, 68, 0.95); transform: scale(1.03); }
        }
        @keyframes floatCar {
          0%, 100% { transform: translateY(0px) rotate(0deg); }
          50% { transform: translateY(-6px) rotate(1deg); }
        }
        .title-animated { font-size: clamp(28px, 5vw, 54px); font-weight: 900; letter-spacing: 3px; color: #facc15; text-transform: uppercase; animation: glowPulse 2.5s infinite ease-in-out; text-align: center; font-style: italic; }
        .live-hero-car { animation: floatCar 2.4s infinite ease-in-out; }
        .arcade-btn { background: linear-gradient(180deg, #f59e0b 0%, #b45309 100%); border: 2px solid #fde047; color: #fff; font-size: 14px; font-weight: 900; padding: 11px 26px; border-radius: 999px; cursor: pointer; box-shadow: 0 5px 0 #78350f, 0 10px 20px rgba(0,0,0,0.8); text-transform: uppercase; transition: all 0.1s ease; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
        .arcade-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #78350f; }
        .btn-green { background: linear-gradient(180deg, #10b981 0%, #047857 100%); border-color: #6ee7b7; box-shadow: 0 5px 0 #064e3b, 0 10px 20px rgba(0,0,0,0.8); }
        .btn-blue { background: linear-gradient(180deg, #0284c7 0%, #0369a1 100%); border-color: #7dd3fc; box-shadow: 0 5px 0 #0c4a6e, 0 10px 20px rgba(0,0,0,0.8); }
        .btn-purple { background: linear-gradient(180deg, #8b5cf6 0%, #6d28d9 100%); border-color: #c4b5fd; box-shadow: 0 5px 0 #4c1d95, 0 10px 20px rgba(0,0,0,0.8); }
        .btn-red-yt { background: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%); border-color: #fca5a5; box-shadow: 0 5px 0 #7f1d1d, 0 10px 20px rgba(0,0,0,0.8); }
      </style>
    </head>
    <body>
      <div id="gameContainer">
        <div id="homeScreen" class="screen">
          <div class="title-animated">APEX TURBO RACING</div>
          <button class="arcade-btn btn-green" onclick="startGameSession()"><span>▶ START GAME</span></button>
        </div>
        <canvas id="gameCanvas" width="1280" height="720"></canvas>
      </div>
      <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let isRunning = false;
        function startGameSession() {
          document.getElementById('homeScreen').style.display = 'none';
          isRunning = true;
          gameLoop();
        }
        function gameLoop() {
          if (!isRunning) return;
          ctx.fillStyle = '#1e293b';
          ctx.fillRect(0, 0, 1280, 720);
          requestAnimationFrame(gameLoop);
        }
      </script>
    </body>
    </html>
    EOF

- name: Configure Gradle & SDK 34
  run: |
    cat << 'EOF' > android/app/build.gradle
    plugins {
        id "com.android.application"
        id "kotlin-android"
        id "dev.flutter.flutter-gradle-plugin"
    }

    android {
        namespace = "com.govindgupta.apexturbof1"
        compileSdk = 34
        ndkVersion = flutter.ndkVersion

        compileOptions {
            sourceCompatibility = JavaVersion.VERSION_1_8
            targetCompatibility = JavaVersion.VERSION_1_8
        }

        kotlinOptions {
            jvmTarget = "1.8"
        }

        defaultConfig {
            applicationId = "com.govindgupta.apexturbof1"
            minSdk = 29
            targetSdk = 34
            versionCode = 2
            versionName = "2.0.0"
            multiDexEnabled = true
        }

        buildTypes {
            release {
                signingConfig = signingConfigs.debug
                minifyEnabled false
                shrinkResources false
            }
        }
    }

    flutter {
        source = "../.."
    }
    EOF

- name: Configure AndroidManifest Permissions & AdMob App ID
  run: |
    MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
    if [ -f "$MANIFEST_FILE" ]; then
      if ! grep -q "android.permission.INTERNET" "$MANIFEST_FILE"; then
        sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="com.google.android.gms.permission.AD_ID"/>' "$MANIFEST_FILE"
      fi
      if ! grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MANIFEST_FILE"; then
        sed -i '/<\/application>/i \        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-1590363558146928~3904943143"/>' "$MANIFEST_FILE"
      fi
    fi

- name: Fix Kotlin & Gradle Versions
  run: |
    find android -name "settings.gradle" -exec sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.24"/g' {} +
    find android -name "build.gradle" -exec sed -i "s/ext.kotlin_version = '[^']*'/ext.kotlin_version = '1.9.24'/g" {} +

- name: Get Flutter Packages
  run: flutter pub get

- name: Build Release APK
  run: flutter build apk --release --no-tree-shake-icons

- name: Upload Release APK Artifact
  uses: actions/upload-artifact@v4
  with:
    name: apex-turbo-f1-release-apk
    path: build/app/outputs/flutter-apk/app-release.apk
