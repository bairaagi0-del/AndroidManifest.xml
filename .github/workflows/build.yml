name: Build Car Racing Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Write Clean pubspec.yaml
        run: |
          cat << 'EOF' > pubspec.yaml
          name: speedracer
          description: Apex Turbo F1 Highway Racing
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            webview_flutter: ^4.8.0
            google_mobile_ads: ^5.1.0

          flutter:
            uses-material-design: true
            assets:
              - assets/index.html
          EOF

      - name: Recreate Android Project Structure
        run: flutter create . --org com.rahulgupta --project-name speedracer

      - name: Apply Uploaded Red Bull Car Emblem as Official Launcher Icon
        run: |
          pip install Pillow
          python3 -c "
          import os, glob, shutil
          from PIL import Image

          # Remove adaptive icon XML folder so Android uses our PNG icon directly
          anydpi_dir = 'android/app/src/main/res/mipmap-anydpi-v26'
          if os.path.exists(anydpi_dir):
              shutil.rmtree(anydpi_dir, ignore_errors=True)

          # Search repository for the uploaded Red Bull Racing Speed Emblem image
          candidates = []
          for ext in ('*.png', '*.jpg', '*.jpeg', '**/*.png', '**/*.jpg'):
              for f in glob.glob(ext, recursive=True):
                  if 'android/' in f or 'build/' in f or 'ios/' in f or 'web/' in f:
                      continue
                  candidates.append(f)

          source_img = None
          for f in candidates:
              low = os.path.basename(f).lower()
              if 'red bull' in low or 'emblem' in low or 'racing' in low:
                  source_img = f
                  break
          if not source_img and candidates:
              source_img = candidates[0]

          print(f'Selected Uploaded Icon File: {source_img}')

          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192
          }
          for folder, size in sizes.items():
              d_path = f'android/app/src/main/res/{folder}'
              os.makedirs(d_path, exist_ok=True)
              if source_img and os.path.exists(source_img):
                  img = Image.open(source_img).convert('RGBA')
                  img = img.resize((size, size), Image.Resampling.LANCZOS)
                  img.save(f'{d_path}/ic_launcher.png')
                  img.save(f'{d_path}/ic_launcher_round.png')
          print('Launcher icons updated successfully!')
          "

      - name: Fix Android Gradle Properties & Wrapper
        run: |
          echo "android.useAndroidX=true" > android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError" >> android/gradle.properties
          mkdir -p android/gradle/wrapper
          cat << 'EOF' > android/gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=gradle/wrapper
          EOF

      - name: Write Clean lib/main.dart with Active Banner & Preloaded Ads
        run: |
          mkdir -p lib
          cat << 'EOF' > lib/main.dart
          import 'dart:async';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          import 'package:google_mobile_ads/google_mobile_ads.dart';

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await MobileAds.instance.initialize();
            SystemChrome.setPreferredOrientations([
              DeviceOrientation.landscapeLeft,
              DeviceOrientation.landscapeRight,
            ]);
            SystemChrome.setEnabledSystemUIMode(SystemUiMode.immersiveSticky);
            runApp(const MaterialApp(
              debugShowCheckedModeBanner: false,
              home: CarRacingApp(),
            ));
          }

          class CarRacingApp extends StatefulWidget {
            const CarRacingApp({super.key});
            @override
            State<CarRacingApp> createState() => _CarRacingState();
          }

          class _CarRacingState extends State<CarRacingApp> {
            late final WebViewController _controller;
            BannerAd? _bannerAd;
            bool _isBannerReady = false;
            RewardedAd? _rewardedAd;
            InterstitialAd? _interstitialAd;

            final String _realBannerId = 'ca-app-pub-1590363558146928/9630631281';
            final String _realInterstitialId = 'ca-app-pub-1590363558146928/7196039630';
            final String _realRewardedId = 'ca-app-pub-1590363558146928/2274885449';

            @override
            void initState() {
              super.initState();
              _loadBannerAd();
              _loadInterstitialAd();
              _loadRewardedAd();

              _controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setBackgroundColor(const Color(0xFF030712))
                ..addJavaScriptChannel(
                  'AdMobBridge',
                  onMessageReceived: (JavaScriptMessage message) {
                    if (message.message == 'showInterstitial') {
                      _showInterstitialAd();
                    } else if (message.message == 'showRewarded') {
                      _showRewardedAd();
                    }
                  },
                );
              _initWebView();
            }

            Future<void> _initWebView() async {
              await _controller.clearCache();
              await _controller.loadFlutterAsset('assets/index.html');
            }

            void _loadBannerAd() {
              _bannerAd?.dispose();
              _bannerAd = BannerAd(
                adUnitId: _realBannerId,
                request: const AdRequest(),
                size: AdSize.banner,
                listener: BannerAdListener(
                  onAdLoaded: (ad) {
                    if (mounted) {
                      setState(() { _isBannerReady = true; });
                    }
                  },
                  onAdFailedToLoad: (ad, err) {
                    ad.dispose();
                    if (mounted) {
                      setState(() { _isBannerReady = false; });
                    }
                    Future.delayed(const Duration(seconds: 4), _loadBannerAd);
                  },
                ),
              )..load();
            }

            void _loadInterstitialAd() {
              InterstitialAd.load(
                adUnitId: _realInterstitialId,
                request: const AdRequest(),
                adLoadCallback: InterstitialAdLoadCallback(
                  onAdLoaded: (ad) { _interstitialAd = ad; },
                  onAdFailedToLoad: (error) {
                    _interstitialAd = null;
                    Future.delayed(const Duration(seconds: 4), _loadInterstitialAd);
                  },
                ),
              );
            }

            void _showInterstitialAd() {
              if (_interstitialAd != null) {
                _interstitialAd!.fullScreenContentCallback = FullScreenContentCallback(
                  onAdDismissedFullScreenContent: (ad) {
                    ad.dispose();
                    _interstitialAd = null;
                    _loadInterstitialAd();
                  },
                  onAdFailedToShowFullScreenContent: (ad, error) {
                    ad.dispose();
                    _interstitialAd = null;
                    _loadInterstitialAd();
                  },
                );
                _interstitialAd!.show();
                _interstitialAd = null;
              } else {
                _loadInterstitialAd();
              }
            }

            void _loadRewardedAd() {
              RewardedAd.load(
                adUnitId: _realRewardedId,
                request: const AdRequest(),
                rewardedAdLoadCallback: RewardedAdLoadCallback(
                  onAdLoaded: (ad) { _rewardedAd = ad; },
                  onAdFailedToLoad: (error) {
                    _rewardedAd = null;
                    Future.delayed(const Duration(seconds: 4), _loadRewardedAd);
                  },
                ),
              );
            }

            void _showRewardedAd() {
              if (_rewardedAd != null) {
                _rewardedAd!.fullScreenContentCallback = FullScreenContentCallback(
                  onAdDismissedFullScreenContent: (ad) {
                    ad.dispose();
                    _rewardedAd = null;
                    _loadRewardedAd();
                  },
                  onAdFailedToShowFullScreenContent: (ad, error) {
                    ad.dispose();
                    _rewardedAd = null;
                    _controller.runJavaScript("if(window.onAdNotLoaded) window.onAdNotLoaded();");
                    _loadRewardedAd();
                  },
                );
                _rewardedAd!.show(
                  onUserEarnedReward: (AdWithoutView ad, RewardItem reward) {
                    _controller.runJavaScript('if(window.onRewardedAdReward) window.onRewardedAdReward();');
                  },
                );
                _rewardedAd = null;
              } else {
                _controller.runJavaScript("if(window.onAdNotLoaded) window.onAdNotLoaded();");
                _loadRewardedAd();
              }
            }

            @override
            void dispose() {
              _bannerAd?.dispose();
              _interstitialAd?.dispose();
              _rewardedAd?.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF030712),
                body: SafeArea(
                  child: Column(
                    children: [
                      Expanded(child: WebViewWidget(controller: _controller)),
                      Container(
                        width: double.infinity,
                        height: 50,
                        color: const Color(0xFF090D16),
                        alignment: Alignment.center,
                        child: (_isBannerReady && _bannerAd != null)
                            ? SizedBox(
                                width: _bannerAd!.size.width.toDouble(),
                                height: _bannerAd!.size.height.toDouble(),
                                child: AdWidget(ad: _bannerAd!),
                              )
                            : const Text(
                                'SPONSORED • AD LOADING...',
                                style: TextStyle(color: Color(0xFF475569), fontSize: 10, fontWeight: FontWeight.bold, letterSpacing: 1.5),
                              ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

      - name: Create Apex Turbo F1 HTML Engine
        run: |
          mkdir -p assets
          cat << 'EOF' > assets/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
          <title>Apex Turbo F1 - Ultimate Edition</title>
          <script src="https://cdn.tailwindcss.com"></script>
          <style>
          * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; touch-action: none; }
          html, body { width: 100%; height: 100%; overflow: hidden; background: #030712; font-family: system-ui, -apple-system, sans-serif; }
          #gameContainer { position: relative; width: 100vw; height: 100vh; background: #030712; overflow: hidden; }
          canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; }
          .screen { position: absolute; inset: 0; z-index: 40; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px 16px; background: radial-gradient(circle at center, rgba(15, 23, 42, 0.82) 0%, rgba(3, 7, 18, 0.96) 100%); backdrop-filter: blur(8px); }
          .title-animated { font-size: clamp(22px, 4vw, 38px); font-weight: 900; letter-spacing: 2px; color: #f59e0b; text-transform: uppercase; font-style: italic; text-shadow: 0 0 20px rgba(239, 68, 68, 0.9), 0 4px 10px #000; text-align: center; line-height: 1.1; }
          .arcade-btn { background: linear-gradient(180deg, #f59e0b 0%, #b45309 100%); border: 2px solid #fde047; color: #fff; font-size: 12px; font-weight: 900; padding: 8px 18px; border-radius: 999px; cursor: pointer; box-shadow: 0 4px 0 #78350f, 0 6px 14px rgba(0,0,0,0.8); text-transform: uppercase; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
          .arcade-btn:active { transform: translateY(3px); }
          .btn-green { background: linear-gradient(180deg, #10b981 0%, #047857 100%); border-color: #6ee7b7; box-shadow: 0 4px 0 #064e3b; }
          .btn-blue { background: linear-gradient(180deg, #0284c7 0%, #0369a1 100%); border-color: #7dd3fc; box-shadow: 0 4px 0 #0c4a6e; }
          .btn-purple { background: linear-gradient(180deg, #8b5cf6 0%, #6d28d9 100%); border-color: #c4b5fd; box-shadow: 0 4px 0 #4c1d95; }
          .btn-red { background: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%); border-color: #fca5a5; box-shadow: 0 4px 0 #7f1d1d; }
          .choice-chip { background: rgba(15, 23, 42, 0.9); border: 2px solid #334155; color: #cbd5e1; font-size: 10px; font-weight: 800; padding: 6px 11px; border-radius: 12px; cursor: pointer; transition: all 0.15s; display: inline-flex; align-items: center; gap: 5px; }
          .choice-chip.active-theme { border-color: #f59e0b; background: rgba(245, 158, 11, 0.22); color: #fde047; box-shadow: 0 0 12px rgba(245, 158, 11, 0.45); transform: scale(1.04); }
          .choice-chip.active-mood { border-color: #38bdf8; background: rgba(56, 189, 248, 0.22); color: #bae6fd; box-shadow: 0 0 12px rgba(56, 189, 248, 0.45); transform: scale(1.04); }
          .hud-bar { position: absolute; top: 8px; left: 14px; right: 14px; display: none; justify-content: space-between; align-items: center; z-index: 30; pointer-events: none; gap: 8px; }
          .hud-cluster { display: flex; align-items: center; gap: 8px; }
          .hud-card { background: rgba(15, 23, 42, 0.92); border: 1.5px solid rgba(56, 189, 248, 0.4); border-bottom: 3px solid #0284c7; color: #f8fafc; padding: 4px 11px; border-radius: 12px; display: flex; align-items: center; gap: 7px; box-shadow: 0 6px 15px rgba(0,0,0,0.7); }
          .hud-exit-btn { pointer-events: auto; cursor: pointer; background: linear-gradient(180deg, #ef4444 0%, #991b1b 100%); border: 2px solid #fca5a5; color: #fff; font-weight: 900; font-size: 11px; padding: 6px 12px; border-radius: 10px; box-shadow: 0 4px 12px rgba(239,68,68,0.5); }
          .gamepad { position: absolute; bottom: 10px; left: 18px; right: 18px; display: none; justify-content: space-between; align-items: flex-end; z-index: 30; pointer-events: none; }
          .pad-cluster { display: flex; gap: 14px; pointer-events: auto; align-items: flex-end; }
          .horn-btn { width: 52px; height: 52px; border-radius: 50%; background: radial-gradient(circle, #f59e0b 0%, #b45309 100%); border: 3px solid #fde047; color: #fff; font-size: 20px; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 0 #78350f; cursor: pointer; margin-bottom: 6px; }
          .car-pedal { position: relative; border-radius: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 10px 6px; box-shadow: 0 8px 20px rgba(0,0,0,0.9); }
          .pedal-accel { width: 56px; height: 118px; background: linear-gradient(180deg, #475569 0%, #0f172a 100%); border: 3px solid #94a3b8; }
          .pedal-accel.pressed { transform: scaleY(0.92); border-color: #10b981; box-shadow: 0 0 18px #10b981; }
          .pedal-brake-real { width: 68px; height: 82px; background: linear-gradient(180deg, #475569 0%, #0f172a 100%); border: 3px solid #94a3b8; }
          .pedal-brake-real.pressed { transform: scaleY(0.92); border-color: #ef4444; box-shadow: 0 0 18px #ef4444; }
          .pedal-grip { width: 80%; height: 6px; background: #090d16; border-radius: 4px; }
          #steeringHandleWrap { width: 136px; height: 110px; position: relative; display: flex; align-items: center; justify-content: center; touch-action: none; cursor: grab; }
          .steer-btn { width: 58px; height: 58px; border-radius: 50%; background: #1e293b; border: 3px solid #64748b; color: #fff; font-size: 22px; display: flex; align-items: center; justify-content: center; }
          .garage-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); gap: 12px; max-height: 58vh; overflow-y: auto; width: 100%; max-width: 880px; padding: 10px; touch-action: pan-y; }
          .car-card { background: #1e293b; border: 2px solid #334155; border-radius: 16px; padding: 10px; text-align: center; display: flex; flex-direction: column; align-items: center; }
          .car-card.selected { border-color: #f59e0b; box-shadow: 0 0 16px rgba(245, 158, 11, 0.5); }
          #customModal { position: absolute; inset: 0; background: rgba(3, 7, 18, 0.92); z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
          </style>
          </head>
          <body>
          <div id="gameContainer">
          <canvas id="gameCanvas" width="1280" height="720"></canvas>

          <!-- HOME SCREEN WITH SEPARATE THEME & WEATHER BUTTONS -->
          <div id="homeScreen" class="screen">
            <div class="flex items-center gap-2 bg-slate-900/90 border border-red-500/50 px-3 py-1 rounded-full mb-1 shadow-lg">
              <svg width="32" height="16" viewBox="0 0 120 60"><circle cx="60" cy="30" r="22" fill="#facc15"/><path d="M12 38 L42 22 L55 32 L38 44 Z" fill="#ef4444"/><path d="M108 38 L78 22 L65 32 L82 44 Z" fill="#ef4444"/></svg>
              <span class="text-[10px] font-black tracking-widest text-amber-400 uppercase">RED BULL F1 TURBO CHAMPIONSHIP</span>
            </div>
            <div class="title-animated">APEX TURBO F1 & GT</div>

            <div class="flex items-center justify-center gap-6 my-1 w-full max-w-3xl">
              <div id="homeCarPreview" class="w-24 h-24 flex items-center justify-center filter drop-shadow-[0_8px_18px_rgba(245,158,11,0.55)]"></div>

              <div class="flex flex-col gap-2 bg-slate-900/80 border border-slate-700/80 p-2.5 rounded-2xl">
                <div class="text-[10px] font-black text-amber-400 tracking-wider uppercase text-left">🌍 SELECT WORLD TRACK (ALAG-ALAG THEMES):</div>
                <div class="flex flex-wrap gap-1.5" id="themeButtonsWrap">
                  <button class="choice-chip active-theme" onclick="selectTheme(0)">🏜️ SAHARA DESERT</button>
                  <button class="choice-chip" onclick="selectTheme(1)">🌴 AMAZON JUNGLE</button>
                  <button class="choice-chip" onclick="selectTheme(2)">🌃 CYBER CITY</button>
                  <button class="choice-chip" onclick="selectTheme(3)">🏔️ HIMALAYA SNOW</button>
                </div>

                <div class="text-[10px] font-black text-sky-400 tracking-wider uppercase text-left mt-1">🌦️ SELECT WEATHER MOOD:</div>
                <div class="flex flex-wrap gap-1.5" id="moodButtonsWrap">
                  <button class="choice-chip active-mood" onclick="selectMood(0)">☀️ SUNNY DAY</button>
                  <button class="choice-chip" onclick="selectMood(1)">🌙 MIDNIGHT</button>
                  <button class="choice-chip" onclick="selectMood(2)">🌧️ HEAVY RAIN</button>
                  <button class="choice-chip" onclick="selectMood(3)">⛈️ THUNDER STORM</button>
                </div>
              </div>
            </div>

            <div class="flex flex-wrap items-center justify-center gap-2.5 mt-2">
