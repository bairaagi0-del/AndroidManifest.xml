              </div>
              <div>
                <label class="text-[11px] font-bold text-slate-300 block mb-1">📱 MOBILE NUMBER (+91)</label>
                <div class="flex gap-2">
                  <span class="bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm font-bold text-amber-400">+91</span>
                  <input id="inpPhone" type="tel" maxlength="10" placeholder="10-digit mobile number" class="flex-1 bg-slate-900/90 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:border-emerald-400">
                </div>
              </div>
              <div>
                <label class="text-[11px] font-bold text-slate-300 block mb-1">📧 GMAIL ADDRESS</label>
                <input id="inpGmail" type="email" placeholder="example@gmail.com" class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:border-emerald-400">
              </div>
              <div id="otpBox" style="display:none;">
                <label class="text-[11px] font-bold text-amber-300 block mb-1">🔑 ENTER 4-DIGIT OTP</label>
                <input id="inpOtp" type="number" placeholder="Enter OTP: 4829" class="w-full bg-slate-900 border-2 border-amber-400 rounded-xl px-3.5 py-2.5 text-sm text-white font-black tracking-widest text-center">
                <p id="otpHint" class="text-[11px] text-emerald-400 mt-1 text-center font-bold"></p>
              </div>
              <div>
                <label class="text-[11px] font-bold text-slate-400 block mb-1">🎁 REFERRAL CODE (OPTIONAL)</label>
                <input id="inpRef" type="text" placeholder="Ex: EARN2026" class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-3.5 py-2 text-xs text-amber-300 uppercase">
              </div>
