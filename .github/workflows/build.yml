      <script type="py">
        import js

        def compute_python_car_performance(car_idx, raw_speed):
            drag_factor = 0.996 - (car_idx * 0.0002)
            optimal_gear = 1
            if raw_speed > 210:
                optimal_gear = 5
            elif raw_speed > 155:
                optimal_gear = 4
            elif raw_speed > 95:
                optimal_gear = 3
            elif raw_speed > 45:
                optimal_gear = 2
            return optimal_gear

        js.window.pyCalculateGear = compute_python_car_performance
      </script>

      <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let lanePositions = [420, 565, 715, 860];
        let playerX = 640;
        let playerWorldY = 0;
        let cameraWorldY = 0;
        let speed = 0;
        let gear = 1;
        let steerInput = 0;
        let gasPressed = false;
        let brakePressed = false;
        let totalDistanceMeters = 0;
        let overtakeCount = 0;
        let isRunning = false;
        let trafficCars = [];
        let sceneryObjects = [];
        let windStreaks = [];
        let rainDrops = [];

        window.setGas = function(val) {
          gasPressed = val;
          const el = document.getElementById('accelPedalEl');
          if (el) el.classList.toggle('pressed', val);
        };

        window.setBrake = function(val) {
          brakePressed = val;
          const el = document.getElementById('brakePedalEl');
          if (el) el.classList.toggle('pressed', val);
        };

        let coins = parseInt(localStorage.getItem('desert_coins_v2') || '1200');
        let activeCarIndex = parseInt(localStorage.getItem('active_car_v2') || '0');
        let unlockedCars = JSON.parse(localStorage.getItem('unlocked_cars_v2') || '[0]');
        let currentTheme = localStorage.getItem('desert_theme_v2') || 'desert';
        let currentMood = localStorage.getItem('desert_mood_v2') || 'day';
        let audioEnabled = true;
        let controlMode = 'handle';
        let manualGearMode = false;
        let manualGearVal = 1;
        let showGearLever = true;
        const wheelSVG = document.getElementById('steeringWheelSVG');
        const handleWrap = document.getElementById('steeringHandleWrap');

        window.updateGearLeverUI = function() {
          const knob = document.getElementById('gearKnobEl');
          if (!knob) return;
          let displayGear = manualGearMode ? manualGearVal : gear;
          knob.innerText = (manualGearMode ? 'M' : 'A') + displayGear;
          let numG = typeof displayGear === 'number' ? displayGear : 1;
          knob.style.top = (40 - (numG - 1) * 9) + 'px';
          knob.style.background = manualGearMode
            ? 'linear-gradient(180deg, #8b5cf6 0%, #4c1d95 100%)'
            : 'linear-gradient(180deg, #ef4444 0%, #991b1b 100%)';
        };

        window.toggleAutoManualGear = function() {
          manualGearMode = !manualGearMode;
          if (manualGearMode) {
            manualGearVal = typeof gear === 'number' ? gear : 1;
            gear = manualGearVal;
          }
          window.updateGearLeverUI();
        };

        window.manualShiftGear = function(delta) {
          manualGearMode = true;
          manualGearVal = Math.max(1, Math.min(5, manualGearVal + delta));
          gear = manualGearVal;
          window.updateGearLeverUI();
        };

        window.toggleGearBoxMode = function() {
          showGearLever = !showGearLever;
          const w = document.getElementById('gearLeverWidget');
          const b = document.getElementById('gearModeBtn');
          if (w) w.style.display = showGearLever ? 'flex' : 'none';
          if (b) b.innerText = showGearLever ? 'SHOW LEVER (AUTO/MAN)' : 'HIDDEN (AUTO ONLY)';
        };

        window.setSteer = function(dir) {
          steerInput = dir;
        };

        if (handleWrap && wheelSVG) {
          let draggingYoke = false;
          const updateYoke = (e) => {
            if (!draggingYoke) return;
            const rect = handleWrap.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            let deg = Math.atan2(e.clientX - cx, -(e.clientY - cy)) * (180 / Math.PI);
            deg = Math.max(-75, Math.min(75, deg));
            wheelSVG.style.transform = `rotate(${deg}deg)`;
            steerInput = deg / 60;
          };
          handleWrap.addEventListener('pointerdown', (e) => {
            draggingYoke = true;
            try { handleWrap.setPointerCapture(e.pointerId); } catch(err) {}
            updateYoke(e);
          });
          handleWrap.addEventListener('pointermove', updateYoke);
          const resetYoke = () => {
            draggingYoke = false;
            wheelSVG.style.transform = 'rotate(0deg)';
            steerInput = 0;
          };
          handleWrap.addEventListener('pointerup', resetYoke);
          handleWrap.addEventListener('pointercancel', resetYoke);
        }

