name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK manually
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk
          echo "ANDROID_HOME=/usr/lib/android-sdk" >> "$GITHUB_ENV"
          echo "/usr/lib/android-sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Android SDK configuration
        run: |
          sdkmanager --version || true
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android project
        run: |
          if [ ! -f index.html ]; then
            echo "ERROR: index.html not found in repository root"
            exit 1
          fi

          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html

          if [ ! -f settings.gradle ]; then
            echo "ERROR: Android project files are missing. A complete Gradle project is required."
            exit 1
          fi

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
