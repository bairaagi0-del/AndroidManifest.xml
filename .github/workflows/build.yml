          <!-- GAME OVER -->
          <div id="gameOverScreen" class="screen" style="display:none;">
            <div class="bg-slate-900/95 border-2 border-red-500 rounded-3xl p-6 max-w-md w-full text-center flex flex-col items-center shadow-2xl">
              <div class="text-4xl mb-1 animate-bounce">💥</div>
              <div class="title-animated" style="color:#ef4444; font-size:28px;">HIGHWAY CRASH!</div>
              <div class="text-slate-300 text-xs font-bold my-2 bg-slate-950 px-3 py-1.5 rounded-xl">🏁 DIST: <span id="crashDistText" class="text-amber-400">0m</span> • 🏎️ PASSES: <span id="crashOvertakeText" class="text-purple-400">0</span></div>
              <button class="arcade-btn btn-purple w-full my-2" onclick="watchAdToRevive()">🎬 WATCH AD & REVIVE</button>
              <div class="flex gap-3 w-full mt-2">
                <button class="arcade-btn btn-green flex-1" onclick="startGameSession()">🔄 RETRY</button>
                <button class="arcade-btn flex-1" onclick="backToHome()">🏠 HOME</button>
              </div>
            </div>
          </div>

          <!-- AD MODAL -->
          <div id="customModal">
            <div class="bg-slate-900 border-2 border-amber-500 p-6 rounded-3xl text-center max-w-sm w-full shadow-2xl">
              <div id="modalTitle" class="text-amber-400 font-black text-lg mb-2">SPONSORED REWARD AD</div>
              <div id="modalMsg" class="text-slate-300 text-xs mb-3">Loading AdMob Rewarded Ad...</div>
              <div class="flex gap-3 justify-center mt-3">
                <button id="modalCloseBtn" class="arcade-btn btn-red" onclick="closeModal()">✖ CLOSE</button>
              </div>
            </div>
          </div>
          </div>

          <script>
          const canvas = document.getElementById('gameCanvas');
          const ctx = canvas.getContext('2d');
          let coins = parseInt(localStorage.getItem('apex_coins_v7') || '1200');
          let activeCarIndex = parseInt(localStorage.getItem('apex_car_v7') || '0');
          let unlockedCars = JSON.parse(localStorage.getItem('apex_unlocked_v7') || '[0]');
          let audioEnabled = true;
          let controlMode = 'handle';
          let isRunning = false;
          let playerX = 565;
          let playerWorldY = 0;
          let totalDistanceMeters = 0;
          let overtakeCount = 0;
          let cameraWorldY = -560;
          let speed = 0;
          let gear = 1;
          let steerInput = 0;
          let gasPressed = false;
          let brakePressed = false;
          let lanePositions = [420, 565, 715, 860];
          let trafficCars = [];
          let sceneryItems = [];
          let hornWaves = [];
          let weatherParticles = [];
          let lightningAlpha = 0;
          let pedalPhase = 0;

          const worldThemes = [
            { id: 'desert', name: 'SAHARA DESERT', ground1: '#d97706', ground2: '#b45309', road: '#1e293b', shoulder: '#92400e', kerb1: '#ef4444', kerb2: '#fef08a' },
            { id: 'jungle', name: 'AMAZON JUNGLE', ground1: '#15803d', ground2: '#14532d', road: '#1e293b', shoulder: '#3f6212', kerb1: '#ef4444', kerb2: '#f8fafc' },
            { id: 'city', name: 'CYBER CITY', ground1: '#090d16', ground2: '#1e1b4b', road: '#0f172a', shoulder: '#0284c7', kerb1: '#38bdf8', kerb2: '#f43f5e' },
            { id: 'snow', name: 'HIMALAYA SNOW', ground1: '#e2e8f0', ground2: '#cbd5e1', road: '#334155', shoulder: '#64748b', kerb1: '#ef4444', kerb2: '#ffffff' }
          ];
          let currentThemeIdx = 0;
          const weatherMoods = ['SUNNY DAY', 'MIDNIGHT', 'HEAVY RAIN', 'THUNDER STORM'];
          let currentMoodIdx = 0;

          // 6 Distinct Vehicle Types: F1, GT Car, Superbike, SUV, Tour Bus, Heavy Truck
          const vehicleCategories = [
            { typeId: 2, vKind: 'f1', className: 'F1 HYPERCAR', prefix: 'RedBull RB20', w: 54, h: 118 },
            { typeId: 1, vKind: 'car', className: 'GT SUPERCAR', prefix: 'Ferrari GT', w: 54, h: 116 },
            { typeId: 0, vKind: 'bike', className: 'SUPERBIKE', prefix: 'Hayabusa 1300', w: 28, h: 74 },
            { typeId: 3, vKind: 'suv', className: 'MONSTER SUV', prefix: 'Defender 4x4', w: 58, h: 124 },
            { typeId: 4, vKind: 'bus', className: 'LUXURY BUS', prefix: 'Volvo Coach', w: 64, h: 166 },
            { typeId: 5, vKind: 'truck', className: 'CARGO TRUCK', prefix: 'Titan 18-Wheeler', w: 66, h: 182 }
          ];

          // Traffic also includes Bicycles ('cycle') + Bikes + Cars + Buses + Trucks
          const trafficBlueprints = [
            { vKind: 'cycle', w: 22, h: 54, minSpd: 22, maxSpd: 35 },
            { vKind: 'bike', w: 28, h: 72, minSpd: 68, maxSpd: 105 },
            { vKind: 'car', w: 54, h: 114, minSpd: 58, maxSpd: 96 },
            { vKind: 'f1', w: 54, h: 116, minSpd: 75, maxSpd: 115 },
            { vKind: 'suv', w: 58, h: 124, minSpd: 52, maxSpd: 86 },
            { vKind: 'bus', w: 64, h: 166, minSpd: 42, maxSpd: 68 },
            { vKind: 'truck', w: 66, h: 182, minSpd: 36, maxSpd: 60 }
          ];

          const carPalettes = [
            { body: '#1e1b4b', stripe: '#facc15', accent: '#ef4444' },
            { body: '#ef4444', stripe: '#ffffff', accent: '#7f1d1d' },
            { body: '#0284c7', stripe: '#fde047', accent: '#0c4a6e' },
            { body: '#10b981', stripe: '#ecfdf5', accent: '#064e3b' },
            { body: '#f59e0b', stripe: '#0f172a', accent: '#78350f' },
            { body: '#8b5cf6', stripe: '#f3e8ff', accent: '#4c1d95' }
          ];

          let carsData = [];
          for (let i = 0; i < 50; i++) {
            let pal = carPalettes[i % carPalettes.length];
            let cat = vehicleCategories[i % vehicleCategories.length];
            carsData.push({
              id: i,
              name: cat.prefix + ' #' + (i + 1),
              categoryLabel: cat.className,
              vKind: cat.vKind,
              w: cat.w,
              h: cat.h,
              topSpeed: 210 + i * 3,
              accel: 1.35 + i * 0.025,
              bodyColor: pal.body,
              stripeColor: pal.stripe,
              accentColor: pal.accent,
              price: i === 0 ? 0 : i * 350
            });
          }

          function initScenery() {
            sceneryItems = [];
            for (let i = 0; i < 36; i++) {
              let isLeft = (i % 2 === 0);
              let x = isLeft ? (35 + Math.random() * 245) : (1000 + Math.random() * 245);
              let wy = -i * 95;
              sceneryItems.push({ x: x, worldY: wy, size: 22 + Math.random() * 22, variant: i % 3 });
            }
          }
          initScenery();

          // ==================== LOUD PRO AUDIO ENGINE ====================
          let audioCtx = null;
          let masterCompressor = null;
          let engineOsc1 = null, engineOsc2 = null, engineGain = null;
          let hornOsc1 = null, hornOsc2 = null, hornGain = null;
          let musicTimer = null, musicStep = 0;

          function ensureAudio() {
            try {
              if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                masterCompressor = audioCtx.createDynamicsCompressor();
                masterCompressor.threshold.setValueAtTime(-14, audioCtx.currentTime);
                masterCompressor.knee.setValueAtTime(12, audioCtx.currentTime);
                masterCompressor.ratio.setValueAtTime(6, audioCtx.currentTime);
                masterCompressor.attack.setValueAtTime(0.003, audioCtx.currentTime);
                masterCompressor.release.setValueAtTime(0.15, audioCtx.currentTime);
                masterCompressor.connect(audioCtx.destination);
              }
              if (audioCtx.state === 'suspended') {
                audioCtx.resume();
              }
            } catch (e) {}
          }

          window.unlockAndStartAudio = function() {
            ensureAudio();
            if (!isRunning && audioEnabled && !musicTimer) {
              startHomeMusic();
            }
          };

          ['touchstart', 'pointerdown', 'mousedown', 'click'].forEach(evt => {
            window.addEventListener(evt, () => {
              ensureAudio();
              if (!isRunning && audioEnabled && !musicTimer) {
                startHomeMusic();
              }
              if (isRunning && audioEnabled && !engineOsc1) {
                startEngineAudio();
              }
            }, { passive: true });
          });

          function startEngineAudio() {
            if (!audioEnabled) return;
            try {
              ensureAudio();
              if (engineOsc1) return;
              engineOsc1 = audioCtx.createOscillator();
              engineOsc2 = audioCtx.createOscillator();
              const filter = audioCtx.createBiquadFilter();
              engineGain = audioCtx.createGain();

              engineOsc1.type = 'sawtooth';
              engineOsc2.type = 'square';
              engineOsc1.frequency.value = 95;
              engineOsc2.frequency.value = 190;

              filter.type = 'lowpass';
              filter.frequency.value = 950;

              engineGain.gain.value = 0.001;

              engineOsc1.connect(filter);
              engineOsc2.connect(filter);
              filter.connect(engineGain);
              engineGain.connect(masterCompressor);

              engineOsc1.start();
              engineOsc2.start();
            } catch (e) {}
          }

          function updateEngineAudio() {
            if (!engineOsc1 || !engineOsc2 || !engineGain || !audioCtx) return;
            if (!isRunning || !audioEnabled) {
              engineGain.gain.setTargetAtTime(0.0001, audioCtx.currentTime, 0.06);
              return;
            }
            // Simulate realistic gear RPM sweep (loud & audible on phone speakers)
            let gearRatio = (speed % 42) / 42;
            let baseFreq = 85 + (speed * 1.15) + (gearRatio * 65) + (gasPressed ? 35 : 0);
            let targetVol = gasPressed ? 0.34 : (speed > 5 ? 0.18 : 0.09);
            engineOsc1.frequency.setTargetAtTime(baseFreq, audioCtx.currentTime, 0.04);
            engineOsc2.frequency.setTargetAtTime(baseFreq * 1.5, audioCtx.currentTime, 0.04);
            engineGain.gain.setTargetAtTime(targetVol, audioCtx.currentTime, 0.05);
          }

          function playBrakeScreech() {
            if (!audioEnabled || speed < 60) return;
            try {
              ensureAudio();
              const now = audioCtx.currentTime;
              const osc = audioCtx.createOscillator();
              const g = audioCtx.createGain();
              osc.type = 'sawtooth';
              osc.frequency.setValueAtTime(1150, now);
              osc.frequency.linearRampToValueAtTime(880, now + 0.18);
              g.gain.setValueAtTime(0.16, now);
              g.gain.exponentialRampToValueAtTime(0.005, now + 0.18);
              osc.connect(g); g.connect(masterCompressor);
              osc.start(now); osc.stop(now + 0.18);
            } catch (e) {}
          }

          // Loud Multi-Layered Crash Sound (Metallic Impact + Noise Crunch + Bass Boom)
          function playCrashSound() {
            if (!audioEnabled) return;
            try {
              ensureAudio();
              const now = audioCtx.currentTime;

              // 1. Heavy Sub-Bass & Mid Boom
              const boomOsc = audioCtx.createOscillator();
              const boomGain = audioCtx.createGain();
              boomOsc.type = 'sawtooth';
              boomOsc.frequency.setValueAtTime(180, now);
              boomOsc.frequency.exponentialRampToValueAtTime(32, now + 0.65);
              boomGain.gain.setValueAtTime(0.65, now);
              boomGain.gain.exponentialRampToValueAtTime(0.005, now + 0.65);
              boomOsc.connect(boomGain); boomGain.connect(masterCompressor);
              boomOsc.start(now); boomOsc.stop(now + 0.65);

              // 2. White Noise Metallic Crunch & Glass Shatter
              const bufSize = audioCtx.sampleRate * 0.55;
              const noiseBuf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
              const output = noiseBuf.getChannelData(0);
              for (let i = 0; i < bufSize; i++) {
                output[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * 0.18));
              }
              const whiteNoise = audioCtx.createBufferSource();
              whiteNoise.buffer = noiseBuf;
              const noiseGain = audioCtx.createGain();
              noiseGain.gain.setValueAtTime(0.75, now);
              noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.55);
              whiteNoise.connect(noiseGain); noiseGain.connect(masterCompressor);
              whiteNoise.start(now);
            } catch (e) {}
          }

          // Loud Synthwave Racing Home Screen Music (Kick + Snare + Bass + Lead)
          function startHomeMusic() {
            stopHomeMusic();
            if (!audioEnabled || isRunning) return;
            const bassNotes = [110, 110, 130.81, 130.81, 146.83, 146.83, 164.81, 130.81];
            const leadNotes = [440, 523.25, 659.25, 523.25, 587.33, 659.25, 783.99, 659.25];
            musicTimer = setInterval(() => {
              if (isRunning || !audioEnabled || !audioCtx) return;
              try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const now = audioCtx.currentTime;
                const step = musicStep % 8;

                // Punchy Kick Drum on even steps
                if (step % 2 === 0) {
                  const kOsc = audioCtx.createOscillator();
                  const kGain = audioCtx.createGain();
                  kOsc.type = 'sine';
                  kOsc.frequency.setValueAtTime(150, now);
                  kOsc.frequency.exponentialRampToValueAtTime(42, now + 0.14);
                  kGain.gain.setValueAtTime(0.45, now);
                  kGain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                  kOsc.connect(kGain); kGain.connect(masterCompressor);
                  kOsc.start(now); kOsc.stop(now + 0.15);
                }

                // Driving Bassline
                const bOsc = audioCtx.createOscillator();
                const bGain = audioCtx.createGain();
                bOsc.type = 'sawtooth';
                bOsc.frequency.setValueAtTime(bassNotes[step], now);
                bGain.gain.setValueAtTime(0.24, now);
                bGain.gain.exponentialRampToValueAtTime(0.01, now + 0.16);
                bOsc.connect(bGain); bGain.connect(masterCompressor);
                bOsc.start(now); bOsc.stop(now + 0.16);

                // Racing Lead Synth
                const lOsc = audioCtx.createOscillator();
                const lGain = audioCtx.createGain();
                lOsc.type = 'square';
                lOsc.frequency.setValueAtTime(leadNotes[step], now);
                lGain.gain.setValueAtTime(0.18, now);
                lGain.gain.exponentialRampToValueAtTime(0.008, now + 0.16);
                lOsc.connect(lGain); lGain.connect(masterCompressor);
                lOsc.start(now); lOsc.stop(now + 0.16);

                musicStep++;
              } catch (e) {}
            }, 175);
          }

          function stopHomeMusic() {
            if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
          }

          // Loud Sustained Dual-Tone Car Horn when Horn Icon Pressed
          window.triggerCarHorn = function(pressed) {
            const btn = document.getElementById('hornBtnEl');
            if (btn) btn.classList.toggle('active', pressed);
            if (!pressed) {
              if (hornGain && audioCtx) {
                try {
                  hornGain.gain.setTargetAtTime(0.0001, audioCtx.currentTime, 0.03);
                  setTimeout(() => {
                    try { if (hornOsc1) { hornOsc1.stop(); hornOsc1 = null; } } catch (e) {}
                    try { if (hornOsc2) { hornOsc2.stop(); hornOsc2 = null; } } catch (e) {}
                  }, 60);
                } catch (e) {}
              }
              return;
            }

            hornWaves.push({ x: playerX, y: playerWorldY - 50, radius: 18, alpha: 1.0 });

            if (audioEnabled) {
              try {
                ensureAudio();
                if (hornOsc1) { try { hornOsc1.stop(); } catch (e) {} }
                if (hornOsc2) { try { hornOsc2.stop(); } catch (e) {} }

                const now = audioCtx.currentTime;
                hornOsc1 = audioCtx.createOscillator();
                hornOsc2 = audioCtx.createOscillator();
                hornGain = audioCtx.createGain();

                // Classic Loud Dual-Tone Car/Truck Air Horn (415Hz + 515Hz)
                hornOsc1.type = 'sawtooth';
                hornOsc2.type = 'square';
                hornOsc1.frequency.setValueAtTime(415, now);
                hornOsc2.frequency.setValueAtTime(515, now);

                hornGain.gain.setValueAtTime(0.48, now);

                hornOsc1.connect(hornGain);
                hornOsc2.connect(hornGain);
                hornGain.connect(masterCompressor);

                hornOsc1.start(now);
                hornOsc2.start(now);
              } catch (e) {}
            }

            // Clear lane ahead when honking!
            trafficCars.forEach((t, idx) => {
              let distAhead = playerWorldY - t.worldY;
              if (distAhead > 50 && distAhead < 550 && Math.abs(t.x - playerX) < 80) {
                let candidateLanes = [];
                if (t.lane > 0) candidateLanes.push(t.lane - 1);
                if (t.lane < 3) candidateLanes.push(t.lane + 1);
                for (let cl of candidateLanes) {
                  if (canVehicleEnterLane(idx, cl, t.worldY, true)) {
                    t.lane = cl;
                    t.targetX = lanePositions[cl];
                    t.turnSignal = cl > t.lane ? 1 : -1;
                    t.signalTimer = 45;
                    break;
                  }
                }
              }
            });
          };

          // Clean SVG Preview for Garage & Home Screen
          function createCarSVG(car, w = 72, h = 110) {
            if (car.vKind === 'bike') {
              return '<svg width=\"' + w + '\" height=\"' + h + '\" viewBox=\"0 0 80 140\" xmlns=\"http://www.w3.org/2000/svg\">' +
                '<rect x=\"33\" y=\"8\" width=\"14\" height=\"26\" rx=\"5\" fill=\"#090d16\"/>' +
                '<rect x=\"32\" y=\"104\" width=\"16\" height=\"28\" rx=\"5\" fill=\"#090d16\"/>' +
                '<path d=\"M26 32 Q40 12 54 32 L50 108 L30 108 Z\" fill=\"' + car.bodyColor + '\" stroke=\"' + car.stripeColor + '\" stroke-width=\"2.5\"/>' +
                '<rect x=\"20\" y=\"38\" width=\"40\" height=\"6\" rx=\"3\" fill=\"#94a3b8\"/>' +
                '<ellipse cx=\"40\" cy=\"68\" rx=\"13\" ry=\"16\" fill=\"#0f172a\"/>' +
                '<circle cx=\"40\" cy=\"62\" r=\"9\" fill=\"' + car.stripeColor + '\" stroke=\"#000\" stroke-width=\"2\"/>' +
                '<rect x=\"34\" y=\"16\" width=\"12\" height=\"6\" rx=\"3\" fill=\"#fef08a\"/>' +
              '</svg>';
            }
            if (car.vKind === 'bus' || car.vKind === 'truck') {
              return '<svg width=\"' + w + '\" height=\"' + h + '\" viewBox=\"0 0 90 150\" xmlns=\"http://www.w3.org/2000/svg\">' +
                '<rect x=\"10\" y=\"8\" width=\"70\" height=\"134\" rx=\"10\" fill=\"' + car.bodyColor + '\" stroke=\"' + car.stripeColor + '\" stroke-width=\"2.5\"/>' +
                '<rect x=\"16\" y=\"16\" width=\"58\" height=\"22\" rx=\"5\" fill=\"#0f172a\" stroke=\"#38bdf8\" stroke-width=\"1.5\"/>' +
                '<rect x=\"36\" y=\"8\" width=\"18\" height=\"134\" fill=\"' + car.stripeColor + '\" opacity=\"0.85\"/>' +
                '<rect x=\"24\" y=\"52\" width=\"42\" height=\"28\" rx=\"5\" fill=\"#0f172a\"/>' +
                '<rect x=\"24\" y=\"92\" width=\"42\" height=\"28\" rx=\"5\" fill=\"#0f172a\"/>' +
                '<rect x=\"16\" y=\"10\" width=\"14\" height=\"5\" fill=\"#fef08a\"/><rect x=\"60\" y=\"10\" width=\"14\" height=\"5\" fill=\"#fef08a\"/>' +
              '</svg>';
            }
            if (car.vKind === 'f1') {
              return '<svg width=\"' + w + '\" height=\"' + h + '\" viewBox=\"0 0 90 150\" xmlns=\"http://www.w3.org/2000/svg\">' +
                '<rect x=\"6\" y=\"26\" width=\"16\" height=\"30\" rx=\"5\" fill=\"#090d16\" stroke=\"#facc15\" stroke-width=\"1.5\"/>' +
                '<rect x=\"68\" y=\"26\" width=\"16\" height=\"30\" rx=\"5\" fill=\"#090d16\" stroke=\"#facc15\" stroke-width=\"1.5\"/>' +
                '<rect x=\"6\" y=\"98\" width=\"18\" height=\"34\" rx=\"5\" fill=\"#090d16\" stroke=\"#ef4444\" stroke-width=\"1.5\"/>' +
                '<rect x=\"66\" y=\"98\" width=\"18\" height=\"34\" rx=\"5\" fill=\"#090d16\" stroke=\"#ef4444\" stroke-width=\"1.5\"/>' +
                '<path d=\"M14 18 L76 18 L70 28 L20 28 Z\" fill=\"' + car.accentColor + '\" stroke=\"' + car.stripeColor + '\" stroke-width=\"1.5\"/>' +
                '<path d=\"M36 16 L54 16 L64 62 L66 116 L24 116 L26 62 Z\" fill=\"' + car.bodyColor + '\" stroke=\"' + car.stripeColor + '\" stroke-width=\"2\"/>' +
                '<ellipse cx=\"45\" cy=\"76\" rx=\"11\" ry=\"18\" fill=\"#0f172a\" stroke=\"#38bdf8\" stroke-width=\"1.5\"/>' +
                '<circle cx=\"45\" cy=\"78\" r=\"6\" fill=\"#facc15\"/>' +
                '<rect x=\"18\" y=\"122\" width=\"54\" height=\"14\" rx=\"4\" fill=\"' + car.accentColor + '\" stroke=\"' + car.stripeColor + '\" stroke-width=\"1.5\"/>' +
              '</svg>';
            }
            return '<svg width=\"' + w + '\" height=\"' + h + '\" viewBox=\"0 0 90 150\" xmlns=\"http://www.w3.org/2000/svg\">' +
              '<rect x=\"8\" y=\"28\" width=\"10\" height=\"26\" rx=\"4\" fill=\"#090d16\"/>' +
              '<rect x=\"72\" y=\"28\" width=\"10\" height=\"26\" rx=\"4\" fill=\"#090d16\"/>' +
              '<rect x=\"8\" y=\"98\" width=\"10\" height=\"28\" rx=\"4\" fill=\"#090d16\"/>' +
              '<rect x=\"72\" y=\"98\" width=\"10\" height=\"28\" rx=\"4\" fill=\"#090d16\"/>' +
              '<path d=\"M22 14 Q45 8 68 14 L74 38 L74 124 Q45 132 16 124 L16 38 Z\" fill=\"' + car.bodyColor + '\" stroke=\"' + car.stripeColor + '\" stroke-width=\"2.5\"/>' +
              '<rect x=\"39\" y=\"12\" width=\"12\" height=\"116\" fill=\"' + car.stripeColor + '\" opacity=\"0.9\"/>' +
              '<path d=\"M24 46 Q45 38 66 46 L62 96 Q45 102 28 96 Z\" fill=\"#0f172a\" stroke=\"#38bdf8\" stroke-width=\"1.5\"/>' +
              '<rect x=\"20\" y=\"16\" width=\"12\" height=\"6\" rx=\"3\" fill=\"#fef08a\"/>' +
              '<rect x=\"58\" y=\"16\" width=\"12\" height=\"6\" rx=\"3\" fill=\"#fef08a\"/>' +
            '</svg>';
          }

          function updateGlobalUI() {
            document.getElementById('uiCoins').innerText = coins;
            document.getElementById('garageCoins').innerText = coins;
            document.getElementById('homeCarPreview').innerHTML = createCarSVG(carsData[activeCarIndex], 84, 126);
            localStorage.setItem('apex_coins_v7', coins);
            localStorage.setItem('apex_car_v7', activeCarIndex);
            localStorage.setItem('apex_unlocked_v7', JSON.stringify(unlockedCars));
          }

          window.selectTheme = function(idx) {
            currentThemeIdx = idx;
            const btns = document.querySelectorAll('#themeButtonsWrap .choice-chip');
            btns.forEach((b, i) => b.classList.toggle('active-theme', i === idx));
