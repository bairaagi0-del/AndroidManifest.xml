        window.unlockWithCoins = function(id) {
          let car = carsData[id];
          if (coins >= car.price) {
            coins -= car.price;
            if (!unlockedCars.includes(id)) unlockedCars.push(id);
            activeCarIndex = id;
            window.updateGlobalUI();
            window.renderGarageGrid();
          } else {
            window.unlockWithAd(id);
          }
        };

