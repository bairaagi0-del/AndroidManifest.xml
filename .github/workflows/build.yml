          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
          <title>TaskTube Watch & Earn</title>
          <script src="https://cdn.tailwindcss.com"></script>
          <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
          <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
          <style>
            * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
            body { background: #06131f; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; min-height: 100vh; overflow-x: hidden; }
            .glass-card { background: linear-gradient(145deg, rgba(15, 33, 52, 0.95), rgba(8, 20, 33, 0.95)); border: 1.5px solid rgba(56, 189, 248, 0.22); border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
            .gold-gradient { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
            .emerald-gradient { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
            .purple-gradient { background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%); }
            .btn-press:active { transform: scale(0.97); }
            input { outline: none; }
          </style>
          </head>
          <body class="pb-20">

          <div id="authScreen" class="min-h-screen flex flex-col items-center justify-center p-5">
            <div class="w-20 h-20 rounded-3xl emerald-gradient flex items-center justify-center shadow-lg shadow-emerald-500/30 mb-3 border-2 border-amber-300">
              <span class="text-4xl">▶️</span>
            </div>
            <h1 class="text-2xl font-black tracking-wide text-amber-400 uppercase">TASKTUBE REWARDS</h1>
