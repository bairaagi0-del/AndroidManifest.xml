            </div>
          </div>
          <div class="title-animated">APEX TURBO RACING</div>
          <div class="flex flex-wrap items-center justify-center gap-2 my-1.5 bg-slate-950/85 px-3.5 py-1.5 rounded-full border border-slate-700/80">
            <span class="text-[10px] font-black text-slate-400 uppercase mr-1">WEATHER MOOD:</span>
            <button id="moodBtn_day" class="mood-pill active" onclick="selectWeatherMood('day')">☀️ DAY</button>
            <button id="moodBtn_night" class="mood-pill" onclick="selectWeatherMood('night')">🌙 NIGHT</button>
            <button id="moodBtn_rain" class="mood-pill" onclick="selectWeatherMood('rain')">🌧️ RAIN</button>
            <button id="moodBtn_storm" class="mood-pill" onclick="selectWeatherMood('storm')">⚡ STORM</button>
          </div>
          <div class="relative my-2 flex flex-col items-center justify-center">
            <div class="w-40 h-28 flex items-center justify-center live-hero-car" id="homeCarPreview"></div>
            <div id="homeCarName" class="text-xs font-black text-amber-300 bg-slate-950/90 px-4 py-1 rounded-full border border-amber-500/40 -mt-1">Mini Turbo #1</div>
          </div>
          <div class="flex flex-wrap items-center justify-center gap-3 my-1.5 max-w-2xl">
            <button class="arcade-btn btn-green" onclick="startGameSession()"><span>▶ START GRAND PRIX</span></button>
            <button class="arcade-btn btn-blue" onclick="openGarage()"><span>🏎️ 50 VEHICLES</span></button>
            <button class="arcade-btn" onclick="openThemes()"><span>🌍 TRACKS & MOOD</span></button>
            <button class="arcade-btn btn-purple" onclick="openSettings()"><span>⚙️ CONTROLS</span></button>
          </div>
          <div class="mt-2 bg-gradient-to-r from-red-950/90 via-slate-900/95 to-red-950/90 border-2 border-red-500/50 rounded-2xl px-4 py-2 flex items-center justify-between gap-4 max-w-md w-full">
            <div class="flex items-center gap-3">
              <div class="w-9 h-9 rounded-xl bg-red-600 flex items-center justify-center text-white font-black text-lg">▶</div>
              <div class="text-left">
                <div class="text-[10px] font-extrabold uppercase text-red-300">OFFICIAL CREATOR CHANNEL</div>
                <div class="text-sm font-black text-white">@thegovindgupta</div>
              </div>
            </div>
            <a href="https://youtube.com/@thegovindgupta?si=kD0pUJB_E5iTp2_Z" target="_blank" rel="noopener noreferrer" class="arcade-btn btn-red-yt" style="padding: 6px 14px; font-size: 11px;"><span>SUBSCRIBE</span></a>
          </div>
        </div>

        <div id="garageScreen" class="screen" style="display:none;">
          <div class="flex items-center justify-between w-full max-w-4xl mb-3">
            <button class="arcade-btn" style="padding: 8px 20px;" onclick="closeGarage()">◀ BACK</button>
            <div class="title-animated" style="font-size: 22px;">50 VEHICLES GARAGE</div>
            <div class="hud-card hud-card-emerald"><span class="text-lg">🪙</span> <span id="garageCoins" class="hud-val text-emerald-400">1200</span></div>
          </div>
          <div id="garageGrid" class="garage-grid"></div>
        </div>

        <div id="themesScreen" class="screen" style="display:none;">
          <div class="flex items-center justify-between w-full max-w-3xl mb-4">
            <button class="arcade-btn" style="padding: 8px 20px;" onclick="closeThemes()">◀ BACK</button>
            <div class="title-animated" style="font-size: 26px;">SELECT RACING WORLD SCENE</div>
            <div class="w-20"></div>
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 w-full max-w-3xl">
            <div id="themeCard_desert" class="theme-card active" onclick="selectWorldTheme('desert')"><div class="text-4xl">🏜️</div><div class="text-white font-black text-sm">SAHARA DESERT</div></div>
            <div id="themeCard_jungle" class="theme-card" onclick="selectWorldTheme('jungle')"><div class="text-4xl">🌲</div><div class="text-white font-black text-sm">AMAZON JUNGLE</div></div>
            <div id="themeCard_city" class="theme-card" onclick="selectWorldTheme('city')"><div class="text-4xl">🌃</div><div class="text-white font-black text-sm">METRO NIGHT CITY</div></div>
            <div id="themeCard_snow" class="theme-card" onclick="selectWorldTheme('snow')"><div class="text-4xl">❄️</div><div class="text-white font-black text-sm">HIMALAYA SNOW</div></div>
          </div>
        </div>

        <div id="settingsScreen" class="screen" style="display:none;">
          <div class="title-animated" style="font-size: 26px; margin-bottom: 14px;">CONTROLS & CREATOR HUB</div>
          <div class="bg-slate-900/95 border-2 border-slate-700 rounded-3xl p-5 w-full max-w-lg flex flex-col gap-4">
            <div class="flex justify-between items-center text-white font-black">
              <span>🛞 STEERING MODE</span>
              <button id="controlModeBtn" class="arcade-btn btn-blue" style="padding: 8px 18px; font-size: 12px;" onclick="cycleControlMode()">F1 YOKE (SQUARE)</button>
            </div>
            <div class="flex justify-between items-center text-white font-black">
              <span>🕹️ GEAR LEVER MODE</span>
              <button id="gearModeBtn" class="arcade-btn btn-purple" style="padding: 8px 18px; font-size: 12px;" onclick="toggleGearBoxMode()">SHOW LEVER (AUTO/MAN)</button>
            </div>
            <div class="flex justify-between items-center text-white font-black">
              <span>🔊 REAL ENGINE & MUSIC</span>
              <button id="audioToggleBtn" class="arcade-btn btn-green" style="padding: 8px 18px; font-size: 12px;" onclick="toggleAudio()">ON</button>
            </div>
          </div>
          <button class="arcade-btn mt-5" onclick="closeSettings()">◀ BACK TO HOME</button>
        </div>

        <div id="hudBar" class="hud-bar">
          <div class="hud-cluster">
            <button class="hud-home-btn" onclick="backToHome()"><span>◀ HOME</span></button>
            <div class="hud-card">
              <div>
                <div class="hud-label">SPEED (KM/H)</div>
                <div class="flex items-baseline gap-2">
                  <span id="uiSpeed" class="hud-val text-sky-400">0</span>
                  <div class="w-14 h-2 bg-slate-800 rounded-full overflow-hidden"><div id="uiSpeedBar" class="h-full bg-sky-400" style="width: 0%;"></div></div>
                </div>
              </div>
            </div>
            <div class="hud-card hud-card-gold">
              <div><div class="hud-label">GEAR</div><div id="uiGear" class="hud-val text-amber-400">N</div></div>
            </div>
          </div>
          <div class="hud-cluster">
            <div class="hud-card hud-card-purple"><div><div class="hud-label">OVERTAKES</div><div id="uiOvertakes" class="hud-val text-purple-400">0</div></div></div>
            <div class="hud-card hud-card-gold"><div><div class="hud-label">SCORE / DIST</div><div class="hud-val text-amber-300"><span id="uiDist">0</span>m</div></div></div>
            <div class="hud-card hud-card-emerald"><div><div class="hud-label">COINS</div><div id="uiCoins" class="hud-val text-emerald-400">1200</div></div></div>
          </div>
        </div>

        <div id="gamepad" class="gamepad">
          <div class="pad-cluster">
            <div id="steeringHandleWrap">
              <svg id="steeringWheelSVG" viewBox="0 0 130 120">
                <rect x="10" y="18" width="110" height="84" rx="20" fill="none" stroke="#1e293b" stroke-width="15"/>
                <rect x="4" y="30" width="14" height="60" rx="6" fill="#ef4444" stroke="#fca5a5" stroke-width="1.5"/>
                <rect x="112" y="30" width="14" height="60" rx="6" fill="#ef4444" stroke="#fca5a5" stroke-width="1.5"/>
                <rect x="42" y="42" width="46" height="36" rx="8" fill="#020617" stroke="#f59e0b" stroke-width="2.5"/>
                <text x="65" y="65" font-size="9" font-weight="900" text-anchor="middle" fill="#38bdf8">F1 YOKE</text>
              </svg>
            </div>
            <div id="buttonSteerWrap" style="display:none; gap: 14px;">
              <div class="steer-btn" onpointerdown="setSteer(-1)" onpointerup="setSteer(0)" onpointerleave="setSteer(0)">◀</div>
              <div class="steer-btn" onpointerdown="setSteer(1)" onpointerup="setSteer(0)" onpointerleave="setSteer(0)">▶</div>
            </div>
            <div id="hornBtnEl" class="horn-btn" onpointerdown="triggerCarHorn(true)" onpointerup="triggerCarHorn(false)" onpointerleave="triggerCarHorn(false)">📢</div>
          </div>
          <div class="pad-cluster" style="gap: 14px;">
            <div id="gearLeverWidget" class="gear-lever-box">
              <div class="gear-shift-tap" onpointerdown="manualShiftGear(1)">▲ +</div>
              <div class="gear-slot-track"><div id="gearKnobEl" class="gear-knob" onclick="toggleAutoManualGear()">A1</div></div>
              <div class="gear-shift-tap" onpointerdown="manualShiftGear(-1)">▼ -</div>
            </div>
            <div id="brakePedalEl" class="car-pedal pedal-brake-real" onpointerdown="setBrake(true)" onpointerup="setBrake(false)" onpointerleave="setBrake(false)">
              <div class="w-4 h-4 rounded-full bg-red-500"></div><div class="pedal-grip"></div><div class="pedal-grip"></div>
            </div>
            <div id="accelPedalEl" class="car-pedal pedal-accel" onpointerdown="setGas(true)" onpointerup="setGas(false)" onpointerleave="setGas(false)">
              <div class="w-4 h-4 rounded-full bg-emerald-400"></div><div class="pedal-grip"></div><div class="pedal-grip"></div><div class="pedal-grip"></div>
            </div>
          </div>
        </div>

        <div id="adMobBannerBar">
          <span class="ad-badge">Ad</span>
          <span class="font-bold text-amber-300">Apex Turbo GT Official Sponsor</span>
          <a href="https://youtube.com/@thegovindgupta?si=kD0pUJB_E5iTp2_Z" target="_blank" rel="noopener noreferrer" class="ml-auto px-2.5 py-0.5 rounded bg-red-600 text-white font-black text-[10px] uppercase">Watch @thegovindgupta ↗</a>
        </div>

        <div id="customModal">
          <div class="bg-slate-900 border-2 border-amber-500 p-7 rounded-3xl text-center max-w-sm w-full flex flex-col items-center">
            <div id="modalTitle" class="text-amber-400 font-black text-lg uppercase">SPONSORED REWARD AD</div>
            <div id="adCountdown" class="text-3xl font-black text-sky-400 my-2 font-mono">30s</div>
            <div class="flex gap-3 mt-4 w-full justify-center">
              <button id="modalActionBtn" class="arcade-btn btn-green" style="display:none;" onclick="resolveAdReward()">CLAIM REWARD</button>
              <button id="modalCloseBtn" class="arcade-btn" onclick="closeModal()">CANCEL</button>
            </div>
          </div>
        </div>

        <div id="gameOverScreen" class="screen" style="display:none;">
          <div class="bg-slate-900/95 border-2 border-red-500/80 rounded-3xl p-7 max-w-md w-full text-center flex flex-col items-center">
            <div class="text-5xl mb-2">💥</div>
            <div class="title-animated" style="color:#ef4444; font-size:32px;">HIGHWAY COLLISION!</div>
            <div class="text-slate-300 text-xs font-bold mt-2 mb-4">
              🏁 DISTANCE: <span id="crashDistText" class="text-amber-400">0m</span> • 🏎️ OVERTAKES: <span id="crashOvertakeText" class="text-purple-400">0</span>
            </div>
            <button class="arcade-btn btn-purple w-full justify-center mb-4" onclick="watchAdToRevive()"><span>🎬 REVIVE CAR (30s AD)</span></button>
            <div class="flex gap-4 w-full justify-center">
              <button class="arcade-btn btn-green flex-1" onclick="startGameSession()"><span>🔄 RESTART</span></button>
              <button class="arcade-btn flex-1" onclick="backToHome()"><span>🏠 HOME</span></button>
            </div>
          </div>
        </div>

        <canvas id="gameCanvas" width="1280" height="720"></canvas>
      </div>

      <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let lanePositions = [420, 565, 715, 860];
        let playerX = 565, playerWorldY = 0, cameraWorldY = 0, speed = 0, gear = 1, steerInput = 0;
        let gasPressed = false, brakePressed = false, totalDistanceMeters = 0, overtakeCount = 0, isRunning = false;
        let trafficCars = [], sceneryObjects = [], hornWaves = [];
        let coins = parseInt(localStorage.getItem('desert_coins_v2') || '1200');
        let activeCarIndex = parseInt(localStorage.getItem('active_car_v2') || '0');
        let unlockedCars = JSON.parse(localStorage.getItem('unlocked_cars_v2') || '[0]');
        let currentTheme = localStorage.getItem('desert_theme_v2') || 'desert';
        let currentMood = localStorage.getItem('desert_mood_v2') || 'day';
        let audioEnabled = true, controlMode = 'handle', manualGearMode = false, manualGearVal = 1, showGearLever = true;

        const worldThemes = {
          desert: { label: '🏜️ SAHARA DESERT', groundLeft: '#d97706', groundCenter: '#f59e0b', shoulderColor: '#78350f', roadColor: '#1e293b', curbA: '#ef4444', curbB: '#f8fafc', laneDash: '#fde047' },
          jungle: { label: '🌲 AMAZON JUNGLE', groundLeft: '#065f46', groundCenter: '#059669', shoulderColor: '#3f6212', roadColor: '#1c1917', curbA: '#eab308', curbB: '#22c55e', laneDash: '#fef08a' },
          city: { label: '🌃 METRO NIGHT CITY', groundLeft: '#090d16', groundCenter: '#0f172a', shoulderColor: '#334155', roadColor: '#090d16', curbA: '#06b6d4', curbB: '#ec4899', laneDash: '#38bdf8' },
          snow: { label: '❄️ HIMALAYA SNOW', groundLeft: '#cbd5e1', groundCenter: '#f1f5f9', shoulderColor: '#64748b', roadColor: '#334155', curbA: '#0284c7', curbB: '#ffffff', laneDash: '#bae6fd' }
        };

        const vehicleCategories = [
          { typeId: 0, className: 'MINI HATCH', prefix: 'Mini Turbo', scaleW: 0.84, scaleH: 0.78 },
          { typeId: 1, className: 'FORD MUSCLE', prefix: 'Ford Mustang GT', scaleW: 1.02, scaleH: 1.0 },
          { typeId: 2, className: 'HYPERCAR GT', prefix: 'Aero Apex', scaleW: 1.0, scaleH: 1.02 },
          { typeId: 3, className: 'RAPTOR PICKUP', prefix: 'Ford F-150', scaleW: 1.08, scaleH: 1.12 },
          { typeId: 4, className: 'MONSTER SUV', prefix: 'Titan 4x4', scaleW: 1.12, scaleH: 1.06 },
          { typeId: 5, className: 'JUMBO TRUCK', prefix: 'Jumbo Hauler', scaleW: 1.26, scaleH: 1.38 }
        ];

        const carPalettes = [
          { body: '#ef4444', stripe: '#fef08a', accent: '#991b1b' },
          { body: '#0284c7', stripe: '#ffffff', accent: '#0c4a6e' },
          { body: '#10b981', stripe: '#064e3b', accent: '#047857' },
          { body: '#f59e0b', stripe: '#0f172a', accent: '#b45309' },
          { body: '#8b5cf6', stripe: '#ddd6fe', accent: '#4c1d95' }
        ];

        let carsData = [];
        for (let i = 0; i < 50; i++) {
          let pal = carPalettes[i % carPalettes.length];
          let cat = vehicleCategories[i % vehicleCategories.length];
          carsData.push({
            id: i, name: `${cat.prefix} #${i + 1}`, categoryLabel: cat.className,
            bodyStyle: cat.typeId, scaleW: cat.scaleW, scaleH: cat.scaleH,
            topSpeed: 195 + (i * 3), accel: 1.15 + (i * 0.025),
            bodyColor: pal.body, stripeColor: pal.stripe, accentColor: pal.accent,
            price: i === 0 ? 0 : i * 380
          });
        }

        function createCarSVG(car, w = 74, h = 116) {
          return `<svg width="${w}" height="${h}" viewBox="0 0 80 140"><rect x="10" y="12" width="60" height="116" rx="16" fill="${car.bodyColor}" stroke="${car.accentColor}" stroke-width="3"/><rect x="34" y="12" width="12" height="116" fill="${car.stripeColor}"/><rect x="18" y="42" width="44" height="46" rx="8" fill="#0f172a"/></svg>`;
        }

        window.setGas = function(v) { gasPressed = v; document.getElementById('accelPedalEl').classList.toggle('pressed', v); };
        window.setBrake = function(v) { brakePressed = v; document.getElementById('brakePedalEl').classList.toggle('pressed', v); };
        window.setSteer = function(d) { steerInput = d; };

        const handleWrap = document.getElementById('steeringHandleWrap');
        const wheelSVG = document.getElementById('steeringWheelSVG');
        let draggingYoke = false;
        handleWrap.addEventListener('pointerdown', (e) => { draggingYoke = true; handleWrap.setPointerCapture(e.pointerId); });
        handleWrap.addEventListener('pointermove', (e) => {
          if (!draggingYoke) return;
          const rect = handleWrap.getBoundingClientRect();
          let deg = Math.atan2(e.clientX - (rect.left + rect.width / 2), -(e.clientY - (rect.top + rect.height / 2))) * (180 / Math.PI);
          deg = Math.max(-75, Math.min(75, deg));
          wheelSVG.style.transform = `rotate(${deg}deg)`;
          steerInput = deg / 60;
        });
        handleWrap.addEventListener('pointerup', () => { draggingYoke = false; wheelSVG.style.transform = 'rotate(0deg)'; steerInput = 0; });

        let audioCtx = null, engineOsc1 = null, engineGain = null;
        function ensureAudio() {
          if (!audioEnabled) return null;
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === 'suspended') audioCtx.resume();
          return audioCtx;
        }

        window.playCrashSound = function() {
          const ctxA = ensureAudio();
          if (!ctxA) return;
          try {
            const now = ctxA.currentTime;
            const osc = ctxA.createOscillator();
            const gain = ctxA.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(140, now);
            osc.frequency.exponentialRampToValueAtTime(22, now + 0.45);
            gain.gain.setValueAtTime(0.35, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.48);
            osc.connect(gain); gain.connect(ctxA.destination);
            osc.start(now); osc.stop(now + 0.5);
          } catch(e) {}
        };

        window.triggerCarHorn = function(pressed) {
          if (!pressed) return;
          hornWaves.push({ x: playerX, y: playerWorldY - 40, radius: 18, alpha: 1.0 });
          const ctxA = ensureAudio();
          if (ctxA) {
            const now = ctxA.currentTime;
            const osc = ctxA.createOscillator();
            const g = ctxA.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(440, now);
            osc.frequency.setValueAtTime(554, now + 0.1);
            g.gain.setValueAtTime(0.08, now);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
            osc.connect(g); g.connect(ctxA.destination);
            osc.start(now); osc.stop(now + 0.26);
          }
          trafficCars.forEach(t => {
            if (playerWorldY - t.worldY > 60 && playerWorldY - t.worldY < 560 && Math.abs(t.x - playerX) < 88) {
              t.lane = (t.lane + 1) % 4;
              t.targetX = lanePositions[t.lane];
            }
          });
        };

        window.updateGlobalUI = function() {
          document.getElementById('uiCoins').innerText = coins;
          document.getElementById('garageCoins').innerText = coins;
          document.getElementById('homeCoinsBadge').innerText = coins;
          const car = carsData[activeCarIndex] || carsData[0];
          document.getElementById('homeCarPreview').innerHTML = createCarSVG(car, 90, 145);
          document.getElementById('homeCarName').innerText = `${car.name} • ⚡${car.topSpeed} KM/H`;
          document.getElementById('activeThemeBadge').innerText = worldThemes[currentTheme].label;
          localStorage.setItem('desert_coins_v2', coins);
          localStorage.setItem('active_car_v2', activeCarIndex);
          localStorage.setItem('unlocked_cars_v2', JSON.stringify(unlockedCars));
        };

        window.selectWeatherMood = function(m) { currentMood = m; window.updateGlobalUI(); };
        window.selectWorldTheme = function(t) { currentTheme = t; window.updateGlobalUI(); };
        window.openGarage = function() {
          document.getElementById('homeScreen').style.display = 'none';
          document.getElementById('garageScreen').style.display = 'flex';
          const grid = document.getElementById('garageGrid');
          grid.innerHTML = '';
          carsData.forEach(c => {
            let unlocked = unlockedCars.includes(c.id);
            let div = document.createElement('div');
            div.className = `car-card ${activeCarIndex === c.id ? 'selected' : ''}`;
            div.innerHTML = `<div class="text-white font-black text-xs">${c.name}</div><div class="my-1">${createCarSVG(c, 55, 90)}</div>
              ${unlocked ? `<button class="arcade-btn btn-green" style="padding:4px 10px; font-size:10px;" onclick="selectCar(${c.id})">SELECT</button>` :
              `<button class="arcade-btn btn-blue" style="padding:4px 10px; font-size:10px;" onclick="unlockWithAd(${c.id})">🎬 AD UNLOCK</button>`}`;
            grid.appendChild(div);
          });
        };
        window.closeGarage = function() { document.getElementById('garageScreen').style.display = 'none'; document.getElementById('homeScreen').style.display = 'flex'; };
        window.openThemes = function() { document.getElementById('homeScreen').style.display = 'none'; document.getElementById('themesScreen').style.display = 'flex'; };
        window.closeThemes = function() { document.getElementById('themesScreen').style.display = 'none'; document.getElementById('homeScreen').style.display = 'flex'; };
        window.openSettings = function() { document.getElementById('homeScreen').style.display = 'none'; document.getElementById('settingsScreen').style.display = 'flex'; };
        window.closeSettings = function() { document.getElementById('settingsScreen').style.display = 'none'; document.getElementById('homeScreen').style.display = 'flex'; };
        window.backToHome = function() {
          isRunning = false;
          document.getElementById('gameOverScreen').style.display = 'none';
          document.getElementById('hudBar').style.display = 'none';
          document.getElementById('gamepad').style.display = 'none';
          document.getElementById('homeScreen').style.display = 'flex';
        };

        window.selectCar = function(id) { activeCarIndex = id; window.updateGlobalUI(); window.openGarage(); };
        let adPurpose = null, pendingCar = null;
        window.unlockWithAd = function(id) {
          adPurpose = 'unlock'; pendingCar = id;
          if (window.AdMobBridge) window.AdMobBridge.postMessage('showRewarded');
          else window.resolveAdReward();
        };
        window.watchAdToRevive = function() {
          adPurpose = 'revive';
          if (window.AdMobBridge) window.AdMobBridge.postMessage('showRewarded');
          else window.resolveAdReward();
        };
        window.resolveAdReward = function() {
          document.getElementById('customModal').style.display = 'none';
          if (adPurpose === 'unlock' && pendingCar !== null) {
            unlockedCars.push(pendingCar); activeCarIndex = pendingCar; window.updateGlobalUI(); window.openGarage();
          } else if (adPurpose === 'revive') {
            document.getElementById('gameOverScreen').style.display = 'none';
            document.getElementById('hudBar').style.display = 'flex';
            document.getElementById('gamepad').style.display = 'flex';
            trafficCars.forEach((t, idx) => { t.worldY = playerWorldY - 550 - (idx * 240); });
            speed = 65; isRunning = true;
          }
        };
        window.closeModal = function() { document.getElementById('customModal').style.display = 'none'; };
        window.cycleControlMode = function() {
          controlMode = controlMode === 'handle' ? 'buttons' : 'handle';
          document.getElementById('steeringHandleWrap').style.display = controlMode === 'handle' ? 'flex' : 'none';
          document.getElementById('buttonSteerWrap').style.display = controlMode === 'buttons' ? 'flex' : 'none';
        };
        window.toggleGearBoxMode = function() {
          showGearLever = !showGearLever;
          document.getElementById('gearLeverWidget').style.display = showGearLever ? 'flex' : 'none';
        };
        window.toggleAutoManualGear = function() { manualGearMode = !manualGearMode; };
        window.manualShiftGear = function(d) { manualGearMode = true; manualGearVal = Math.max(1, Math.min(5, manualGearVal + d)); gear = manualGearVal; };
        window.toggleAudio = function() { audioEnabled = !audioEnabled; };

        function spawnTraffic() {
          trafficCars = [];
          for (let i = 0; i < 6; i++) {
            let ln = i % 4;
            let pal = carPalettes[i % carPalettes.length];
            let cat = vehicleCategories[i % vehicleCategories.length];
            trafficCars.push({
              lane: ln, x: lanePositions[ln], targetX: lanePositions[ln],
              worldY: playerWorldY - 260 - (i * 240), speed: 38 + Math.random() * 25,
              bodyColor: pal.body, stripeColor: pal.stripe, accentColor: pal.accent,
              scaleW: cat.scaleW, scaleH: cat.scaleH
            });
          }
        }

        window.startGameSession = function() {
          document.getElementById('homeScreen').style.display = 'none';
          document.getElementById('gameOverScreen').style.display = 'none';
          document.getElementById('hudBar').style.display = 'flex';
          document.getElementById('gamepad').style.display = 'flex';
          playerX = lanePositions[1]; playerWorldY = 0; totalDistanceMeters = 0; overtakeCount = 0; speed = 0;
          spawnTraffic();
          isRunning = true;
        };

        function drawCar(sx, sy, cObj) {
          ctx.save();
          ctx.translate(sx, sy);
          ctx.scale(cObj.scaleW || 1, cObj.scaleH || 1);
          ctx.fillStyle = cObj.bodyColor;
          ctx.beginPath(); ctx.roundRect(-28, -62, 56, 124, 14); ctx.fill();
          ctx.fillStyle = cObj.stripeColor;
          ctx.fillRect(-6, -62, 12, 124);
          ctx.fillStyle = '#0f172a';
          ctx.fillRect(-20, -24, 40, 44);
          ctx.restore();
        }

        function masterLoop() {
          const car = carsData[activeCarIndex] || carsData[0];
          const th = worldThemes[currentTheme] || worldThemes.desert;
          if (isRunning) {
            if (gasPressed) speed = Math.min(car.topSpeed, speed + car.accel);
            else speed = Math.max(0, speed - 0.65);
            if (brakePressed) speed = Math.max(0, speed - 4.5);
            let step = speed * 0.24;
            playerWorldY -= step;
            if (speed > 0.5) totalDistanceMeters += step / 12;
            if (speed > 1) playerX = Math.max(385, Math.min(895, playerX + steerInput * 6.5));
          } else {
            playerWorldY -= 14;
          }
          let pScreenY = 540;
          cameraWorldY = playerWorldY - pScreenY;

          ctx.fillStyle = th.groundCenter; ctx.fillRect(0, 0, 1280, 720);
          ctx.fillStyle = th.shoulderColor; ctx.fillRect(325, 0, 630, 720);
          ctx.fillStyle = th.roadColor; ctx.fillRect(350, 0, 580, 720);

          ctx.fillStyle = th.laneDash;
          let dStart = Math.floor(cameraWorldY / 90) * 90;
          for (let wy = dStart; wy < cameraWorldY + 810; wy += 90) {
            let sy = wy - cameraWorldY;
            ctx.fillRect(492, sy, 6, 48); ctx.fillRect(637, sy, 6, 48); ctx.fillRect(782, sy, 6, 48);
          }

          for (let i = 0; i < trafficCars.length; i++) {
            let t = trafficCars[i];
            t.worldY -= t.speed * 0.14;
            t.x += (t.targetX - t.x) * 0.08;
            let ty = t.worldY - cameraWorldY;
            if (ty > 860) {
              if (isRunning) { coins += 25; overtakeCount++; }
              t.lane = Math.floor(Math.random() * 4);
              t.targetX = lanePositions[t.lane]; t.x = t.targetX;
              t.worldY = playerWorldY - 780 - Math.random() * 300;
            }
            drawCar(t.x, t.worldY - cameraWorldY, t);
            if (isRunning && Math.abs(playerX - t.x) < 46 && Math.abs(pScreenY - (t.worldY - cameraWorldY)) < 96) {
              isRunning = false;
              window.playCrashSound();
              document.getElementById('crashDistText').innerText = Math.floor(totalDistanceMeters) + 'm';
              document.getElementById('crashOvertakeText').innerText = overtakeCount;
              document.getElementById('hudBar').style.display = 'none';
              document.getElementById('gamepad').style.display = 'none';
              document.getElementById('gameOverScreen').style.display = 'flex';
              if (window.AdMobBridge) window.AdMobBridge.postMessage('showInterstitial');
            }
          }

          drawCar(playerX, pScreenY, car);

          if (isRunning) {
            document.getElementById('uiSpeed').innerText = Math.floor(speed);
            document.getElementById('uiSpeedBar').style.width = Math.min(100, (speed / car.topSpeed) * 100) + '%';
            document.getElementById('uiGear').innerText = Math.min(5, 1 + Math.floor(speed / 45));
            document.getElementById('uiCoins').innerText = coins;
            document.getElementById('uiDist').innerText = Math.floor(totalDistanceMeters);
            document.getElementById('uiOvertakes').innerText = overtakeCount;
          }
          requestAnimationFrame(masterLoop);
        }

        spawnTraffic();
        window.updateGlobalUI();
        requestAnimationFrame(masterLoop);
      </script>
    </body>
    </html>
    EOF

- name: Configure Gradle & SDK 34
  run: |
    cat << 'EOF' > android/app/build.gradle
    plugins {
        id "com.android.application"
        id "kotlin-android"
        id "dev.flutter.flutter-gradle-plugin"
    }

    android {
        namespace = "com.govindgupta.apexturbof1"
        compileSdk = 34
        ndkVersion = flutter.ndkVersion

        compileOptions {
            sourceCompatibility = JavaVersion.VERSION_1_8
            targetCompatibility = JavaVersion.VERSION_1_8
        }

        kotlinOptions {
            jvmTarget = "1.8"
        }

        defaultConfig {
            applicationId = "com.govindgupta.apexturbof1"
            minSdk = 29
            targetSdk = 34
            versionCode = 2
            versionName = "2.0.0"
            multiDexEnabled = true
        }

        buildTypes {
            release {
                signingConfig = signingConfigs.debug
                minifyEnabled false
                shrinkResources false
            }
        }
    }

    flutter {
        source = "../.."
    }
    EOF

- name: Configure AndroidManifest Permissions & AdMob App ID
  run: |
    MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
    if [ -f "$MANIFEST_FILE" ]; then
      if ! grep -q "android.permission.INTERNET" "$MANIFEST_FILE"; then
        sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="com.google.android.gms.permission.AD_ID"/>' "$MANIFEST_FILE"
      fi
      if ! grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MANIFEST_FILE"; then
        sed -i '/<\/application>/i \        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-1590363558146928~3904943143"/>' "$MANIFEST_FILE"
      fi
    fi

- name: Fix Kotlin & Gradle Versions
  run: |
    find android -name "settings.gradle" -exec sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.24"/g' {} +
    find android -name "build.gradle" -exec sed -i "s/ext.kotlin_version = '[^']*'/ext.kotlin_version = '1.9.24'/g" {} +

- name: Get Flutter Packages
  run: flutter pub get

- name: Build Release APK
  run: flutter build apk --release --no-tree-shake-icons

- name: Upload Release APK Artifact
  uses: actions/upload-artifact@v4
  with:
    name: apex-turbo-f1-release-apk
    path: build/app/outputs/flutter-apk/app-release.apk
