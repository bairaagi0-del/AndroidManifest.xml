{
"name": "Build Car Racing Release APK",
"on": {
"push": { "branches": ["main", "master"] },
"workflow_dispatch": {}
},
"jobs": {
"build": {
"runs-on": "ubuntu-latest",
"steps": [
{
"name": "Checkout Code",
"uses": "actions/checkout@v4"
},
{
"name": "Set up Java",
"uses": "actions/setup-java@v4",
"with": {
"distribution": "zulu",
"java-version": "17"
}
},
{
"name": "Set up Flutter",
"uses": "subosito/flutter-action@v2",
"with": {
"flutter-version": "3.22.x",
"channel": "stable"
}
},
{
"name": "Write Clean pubspec.yaml",
"run": "cat << 'EOF' > pubspec.yaml\nname: speedracer\ndescription: Apex Turbo F1 Highway Racing\npublish_to: 'none'\nversion: 1.0.0+1\n\nenvironment:\n  sdk: '>=3.0.0 <4.0.0'\n\ndependencies:\n  flutter:\n    sdk: flutter\n  webview_flutter: ^4.8.0\n  google_mobile_ads: ^5.1.0\n\nflutter:\n  uses-material-design: true\n  assets:\n    - assets/index.html\nEOF\n"
},
{
"name": "Recreate Android Project Structure",
"run": "flutter create . --org com.rahulgupta --project-name speedracer"
},
{
"name": "Fix Android Gradle Properties & Wrapper",
"run": "echo 'android.useAndroidX=true' > android/gradle.properties\necho 'android.enableJetifier=true' >> android/gradle.properties\necho 'org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError' >> android/gradle.properties\nmkdir -p android/gradle/wrapper\ncat << 'EOF' > android/gradle/wrapper/gradle-wrapper.properties\ndistributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https\\://services.gradle.org/distributions/gradle-8.5-bin.zip\nnetworkTimeout=10000\nvalidateDistributionUrl=true\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=gradle/wrapper\nEOF\n"
},
{
"name": "Write Clean lib/main.dart",
"run": "mkdir -p lib\ncat << 'EOF' > lib/main.dart\nimport 'dart:async';\nimport 'package:flutter/material.dart';\nimport 'package:flutter/services.dart';\nimport 'package:webview_flutter/webview_flutter.dart';\nimport 'package:google_mobile_ads/google_mobile_ads.dart';\n\nvoid main() async {\n  WidgetsFlutterBinding.ensureInitialized();\n  await MobileAds.instance.initialize();\n  SystemChrome.setPreferredOrientations([\n    DeviceOrientation.landscapeLeft,\n    DeviceOrientation.landscapeRight,\n  ]);\n  SystemChrome.setEnabledSystemUIMode(SystemUiMode.immersiveSticky);\n  runApp(const MaterialApp(\n    debugShowCheckedModeBanner: false,\n    home: CarRacingApp(),\n  ));\n}\n\nclass CarRacingApp extends StatefulWidget {\n  const CarRacingApp({super.key});\n  @override\n  State<CarRacingApp> createState() => _CarRacingState();\n}\n\nclass _CarRacingState extends State<CarRacingApp> {\n  late final WebViewController _controller;\n  BannerAd? _bannerAd;\n  bool _isBannerReady = false;\n  RewardedAd? _rewardedAd;\n  InterstitialAd? _interstitialAd;\n\n  final String _realBannerId = 'ca-app-pub-1590363558146928/9630631281';\n  final String _realInterstitialId = 'ca-app-pub-1590363558146928/7196039630';\n  final String _realRewardedId = 'ca-app-pub-1590363558146928/2274885449';\n\n  @override\n  void initState() {\n    super.initState();\n    _loadBannerAd();\n    _loadInterstitialAd();\n    _loadRewardedAd();\n\n    _controller = WebViewController()\n      ..setJavaScriptMode(JavaScriptMode.unrestricted)\n      ..setBackgroundColor(const Color(0xFF030712))\n      ..addJavaScriptChannel(\n        'AdMobBridge',\n        onMessageReceived: (JavaScriptMessage message) {\n          if (message.message == 'showInterstitial') {\n            _showInterstitialAd();\n          } else if (message.message == 'showRewarded') {\n            _showRewardedAd();\n          }\n        },\n      );\n    _initWebView();\n  }\n\n  Future<void> _initWebView() async {\n    await _controller.clearCache();\n    await _controller.loadFlutterAsset('assets/index.html');\n  }\n\n  void _loadBannerAd() {\n    _bannerAd = BannerAd(\n      adUnitId: _realBannerId,\n      request: const AdRequest(),\n      size: AdSize.banner,\n      listener: BannerAdListener(\n        onAdLoaded: (ad) { setState(() { _isBannerReady = true; }); },\n        onAdFailedToLoad: (ad, err) {\n          ad.dispose();\n          setState(() { _isBannerReady = false; });\n          Future.delayed(const Duration(seconds: 6), _loadBannerAd);\n        },\n      ),\n    )..load();\n  }\n\n  void _loadInterstitialAd() {\n    InterstitialAd.load(\n      adUnitId: _realInterstitialId,\n      request: const AdRequest(),\n      adLoadCallback: InterstitialAdLoadCallback(\n        onAdLoaded: (ad) { _interstitialAd = ad; },\n        onAdFailedToLoad: (error) { _interstitialAd = null; Future.delayed(const Duration(seconds: 6), _loadInterstitialAd); },\n      ),\n    );\n  }\n\n  void _showInterstitialAd() {\n    if (_interstitialAd != null) {\n      _interstitialAd!.fullScreenContentCallback = FullScreenContentCallback(\n        onAdDismissedFullScreenContent: (ad) { ad.dispose(); _interstitialAd = null; _loadInterstitialAd(); },\n        onAdFailedToShowFullScreenContent: (ad, error) { ad.dispose(); _interstitialAd = null; _loadInterstitialAd(); },\n      );\n      _interstitialAd!.show();\n      _interstitialAd = null;\n    } else {\n      _loadInterstitialAd();\n    }\n  }\n\n  void _loadRewardedAd() {\n    RewardedAd.load(\n      adUnitId: _realRewardedId,\n      request: const AdRequest(),\n      rewardedAdLoadCallback: RewardedAdLoadCallback(\n        onAdLoaded: (ad) { _rewardedAd = ad; },\n        onAdFailedToLoad: (error) { _rewardedAd = null; Future.delayed(const Duration(seconds: 5), _loadRewardedAd); },\n      ),\n    );\n  }\n\n  void _showRewardedAd() {\n    if (_rewardedAd != null) {\n      _rewardedAd!.fullScreenContentCallback = FullScreenContentCallback(\n        onAdDismissedFullScreenContent: (ad) { ad.dispose(); _rewardedAd = null; _loadRewardedAd(); },\n        onAdFailedToShowFullScreenContent: (ad, error) { ad.dispose(); _rewardedAd = null; _loadRewardedAd(); },\n      );\n      _rewardedAd!.show(\n        onUserEarnedReward: (AdWithoutView ad, RewardItem reward) {\n          _controller.runJavaScript('if(window.onRewardedAdReward) window.onRewardedAdReward();');\n        },\n      );\n      _rewardedAd = null;\n    } else {\n      _loadRewardedAd();\n    }\n  }\n\n  @override\n  void dispose() {\n    _bannerAd?.dispose();\n    _interstitialAd?.dispose();\n    _rewardedAd?.dispose();\n    super.dispose();\n  }\n\n  @override\n  Widget build(BuildContext context) {\n    return Scaffold(\n      backgroundColor: const Color(0xFF030712),\n      body: SafeArea(\n        child: Column(\n          children: [\n            Expanded(child: WebViewWidget(controller: _controller)),\n            if (_isBannerReady && _bannerAd != null)\n              Container(\n                color: Colors.black,\n                width: _bannerAd!.size.width.toDouble(),\n                height: _bannerAd!.size.height.toDouble(),\n                child: AdWidget(ad: _bannerAd!),\n              ),\n          ],\n        ),\n      ),\n    );\n  }\n}\nEOF\n"
},
{
"name": "Create Apex Turbo F1 HTML Engine",
"run": "mkdir -p assets\ncat << 'EOF' > assets/index.html\n<!DOCTYPE html>\n<html lang='en'>\n<head>\n<meta charset='UTF-8'>\n<meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover'>\n<title>Apex Turbo F1 - Ultimate Edition</title>\n<script src='https://cdn.tailwindcss.com'></script>\n<style>\n* { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; touch-action: none; }\nhtml, body { width: 100%; height: 100%; overflow: hidden; background: #030712; font-family: system-ui, -apple-system, sans-serif; }\n#gameContainer { position: relative; width: 100vw; height: 100vh; background: #030712; overflow: hidden; }\ncanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; }\n.screen { position: absolute; inset: 0; z-index: 40; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 14px; background: radial-gradient(circle at center, rgba(15, 23, 42, 0.72) 0%, rgba(3, 7, 18, 0.92) 100%); backdrop-filter: blur(6px); }\n.title-animated { font-size: clamp(24px, 4.5vw, 44px); font-weight: 900; letter-spacing: 2px; color: #f59e0b; text-transform: uppercase; font-style: italic; text-shadow: 0 0 25px rgba(239, 68, 68, 0.9), 0 4px 12px #000; text-align: center; }\n.arcade-btn { background: linear-gradient(180deg, #f59e0b 0%, #b45309 100%); border: 2px solid #fde047; color: #fff; font-size: 13px; font-weight: 900; padding: 10px 22px; border-radius: 999px; cursor: pointer; box-shadow: 0 4px 0 #78350f, 0 8px 16px rgba(0,0,0,0.8); text-transform: uppercase; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }\n.arcade-btn:active { transform: translateY(3px); }\n.btn-green { background: linear-gradient(180deg, #10b981 0%, #047857 100%); border-color: #6ee7b7; box-shadow: 0 4px 0 #064e3b; }\n.btn-blue { background: linear-gradient(180deg, #0284c7 0%, #0369a1 100%); border-color: #7dd3fc; box-shadow: 0 4px 0 #0c4a6e; }\n.btn-purple { background: linear-gradient(180deg, #8b5cf6 0%, #6d28d9 100%); border-color: #c4b5fd; box-shadow: 0 4px 0 #4c1d95; }\n.btn-red { background: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%); border-color: #fca5a5; box-shadow: 0 4px 0 #7f1d1d; }\n.hud-bar { position: absolute; top: 10px; left: 14px; right: 14px; display: none; justify-content: space-between; align-items: center; z-index: 30; pointer-events: none; gap: 8px; }\n.hud-cluster { display: flex; align-items: center; gap: 8px; }\n.hud-card { background: rgba(15, 23, 42, 0.9); border: 1.5px solid rgba(56, 189, 248, 0.4); border-bottom: 3px solid #0284c7; color: #f8fafc; padding: 5px 12px; border-radius: 14px; display: flex; align-items: center; gap: 8px; box-shadow: 0 6px 15px rgba(0,0,0,0.7); }\n.hud-exit-btn { pointer-events: auto; cursor: pointer; background: linear-gradient(180deg, #ef4444 0%, #991b1b 100%); border: 2px solid #fca5a5; color: #fff; font-weight: 900; font-size: 12px; padding: 8px 14px; border-radius: 12px; box-shadow: 0 4px 12px rgba(239,68,68,0.5); }\n.gamepad { position: absolute; bottom: 14px; left: 18px; right: 18px; display: none; justify-content: space-between; align-items: flex-end; z-index: 30; pointer-events: none; }\n.pad-cluster { display: flex; gap: 14px; pointer-events: auto; align-items: flex-end; }\n.horn-btn { width: 54px; height: 54px; border-radius: 50%; background: radial-gradient(circle, #f59e0b 0%, #b45309 100%); border: 3px solid #fde047; color: #fff; font-size: 22px; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 0 #78350f; cursor: pointer; margin-bottom: 8px; }\n.car-pedal { position: relative; border-radius: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 10px 6px; box-shadow: 0 8px 20px rgba(0,0,0,0.9); }\n.pedal-accel { width: 58px; height: 124px; background: linear-gradient(180deg, #475569 0%, #0f172a 100%); border: 3px solid #94a3b8; }\n.pedal-accel.pressed { transform: scaleY(0.92); border-color: #10b981; box-shadow: 0 0 18px #10b981; }\n.pedal-brake-real { width: 70px; height: 86px; background: linear-gradient(180deg, #475569 0%, #0f172a 100%); border: 3px solid #94a3b8; }\n.pedal-brake-real.pressed { transform: scaleY(0.92); border-color: #ef4444; box-shadow: 0 0 18px #ef4444; }\n.pedal-grip { width: 80%; height: 7px; background: #090d16; border-radius: 4px; }\n#steeringHandleWrap { width: 140px; height: 115px; position: relative; display: flex; align-items: center; justify-content: center; touch-action: none; cursor: grab; }\n.steer-btn { width: 62px; height: 62px; border-radius: 50%; background: #1e293b; border: 3px solid #64748b; color: #fff; font-size: 24px; display: flex; align-items: center; justify-content: center; }\n.gear-shifter-box { background: rgba(15, 23, 42, 0.92); border: 2px solid #475569; border-radius: 16px; padding: 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; margin-bottom: 6px; }\n.gear-btn { width: 36px; height: 28px; border-radius: 8px; background: #1e293b; border: 1.5px solid #64748b; color: #38bdf8; font-weight: 900; font-size: 12px; }\n.garage-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); gap: 12px; max-height: 56vh; overflow-y: auto; width: 100%; max-width: 880px; padding: 10px; touch-action: pan-y; }\n.car-card { background: #1e293b; border: 2px solid #334155; border-radius: 16px; padding: 10px; text-align: center; display: flex; flex-direction: column; align-items: center; }\n.car-card.selected { border-color: #f59e0b; box-shadow: 0 0 16px rgba(245, 158, 11, 0.5); }\n#customModal { position: absolute; inset: 0; background: rgba(3, 7, 18, 0.92); z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }\n</style>\n</head>\n<body>\n<div id='gameContainer'>\n<canvas id='gameCanvas' width='1280' height='720'></canvas>\n<div id='homeScreen' class='screen'>\n<div class='flex items-center gap-3 bg-slate-900/90 border border-red-500/50 px-4 py-1.5 rounded-full mb-1 shadow-lg'>\n<svg width='42' height='22' viewBox='0 0 120 60'><circle cx='60' cy='30' r='22' fill='#facc15'/><path d='M12 38 L42 22 L55 32 L38 44 Z' fill='#ef4444'/><path d='M108 38 L78 22 L65 32 L82 44 Z' fill='#ef4444'/></svg>\n<span class='text-xs font-black tracking-widest text-amber-400 uppercase'>RED BULL F1 TURBO CHAMPIONSHIP</span>\n</div>\n<div class='title-animated'>APEX TURBO F1 & GT</div>\n<div id='homeCarPreview' class='my-2 w-28 h-24 flex items-center justify-center'></div>\n<div class='flex flex-wrap items-center justify-center gap-2 my-1'>\n<button class='arcade-btn btn-blue' style='padding:6px 14px; font-size:11px;' onclick='cycleTheme()'>🌍 <span id='homeThemeLabel'>SAHARA DESERT</span></button>\n<button class='arcade-btn btn-purple' style='padding:6px 14px; font-size:11px;' onclick='cycleMood()'>🌦️ <span id='homeMoodLabel'>SUNNY DAY</span></button>\n</div>\n<div class='flex flex-wrap items-center justify-center gap-3 my-2'>\n<button class='arcade-btn btn-green' onclick='startGameSession()'>🏁 START RACE</button>\n<button class='arcade-btn btn-blue' onclick='openGarage()'>🏎️ 50 CARS</button>\n<button class='arcade-btn btn-purple' onclick='openSettings()'>⚙️ CONTROLS</button>\n<a href='https://youtube.com/@thegovindgupta?si=kD0pUJB_E5iTp2_Z' target='_blank' class='arcade-btn btn-red' style='text-decoration:none;'>▶️ @THEGOVINDGUPTA</a>\n</div>\n</div>\n<div id='garageScreen' class='screen' style='display:none;'>\n<div class='flex items-center justify-between w-full max-w-4xl mb-2'>\n<button class='arcade-btn' style='padding:6px 16px;' onclick='closeGarage()'>◀ BACK</button>\n<div class='title-animated' style='font-size:20px;'>50 HYPERCARS & TRUCKS</div>\n<div class='hud-card'><span class='text-emerald-400 font-black'>🪙 <span id='garageCoins'>1200</span></span></div>\n</div>\n<div id='garageGrid' class='garage-grid'></div>\n</div>\n<div id='settingsScreen' class='screen' style='display:none;'>\n<div class='title-animated' style='font-size:24px; margin-bottom:12px;'>F1 COCKPIT SETTINGS</div>\n<div class='bg-slate-900/95 border-2 border-slate-700 rounded-3xl p-5 w-full max-w-md flex flex-col gap-3'>\n<div class='flex justify-between items-center text-white font-bold text-sm'><span>🛞 STEERING MODE</span><button id='controlModeBtn' class='arcade-btn btn-blue' style='padding:6px 14px; font-size:11px;' onclick='cycleControlMode()'>F1 YOKE HANDLE</button></div>\n<div class='flex justify-between items-center text-white font-bold text-sm'><span>⚙️ GEAR LEVER</span><button id='gearToggleBtn' class='arcade-btn btn-green' style='padding:6px 14px; font-size:11px;' onclick='toggleGearShifter()'>VISIBLE</button></div>\n<div class='flex justify-between items-center text-white font-bold text-sm'><span>🔊 ENGINE & MUSIC</span><button id='audioToggleBtn' class='arcade-btn btn-green' style='padding:6px 14px; font-size:11px;' onclick='toggleAudio()'>ON</button></div>\n<a href='https://youtube.com/@thegovindgupta?si=kD0pUJB_E5iTp2_Z' target='_blank' class='arcade-btn btn-red w-full justify-center' style='text-decoration:none;'>📺 SUBSCRIBE @THEGOVINDGUPTA</a>\n</div>\n<button class='arcade-btn mt-4' onclick='closeSettings()'>◀ BACK</button>\n</div>\n<div id='hudBar' class='hud-bar'>\n<div class='hud-cluster'>\n<button class='hud-exit-btn' onclick='backToHome()'>◀ HOME</button>\n<div class='hud-card'><span class='text-sky-400 font-black text-base' id='uiSpeed'>0</span><span class='text-[10px] text-slate-400'>KM/H</span><div class='w-12 h-2 bg-slate-800 rounded-full overflow-hidden'><div id='uiSpeedBar' class='h-full bg-sky-400' style='width:0%;'></div></div></div>\n<div class='hud-card'><span class='text-[10px] text-slate-400'>GEAR</span><span id='uiGear' class='text-amber-400 font-black text-base'>1</span></div>\n</div>\n<div class='hud-cluster'>\n<div class='hud-card'><span class='text-[10px] text-slate-400'>PASS</span><span id='uiOvertakes' class='text-purple-400 font-black text-base'>0</span></div>\n<div class='hud-card'><span id='uiDist' class='text-amber-300 font-black text-base'>0</span><span class='text-[10px] text-slate-400'>m</span></div>\n<div class='hud-card'>🪙 <span id='uiCoins' class='text-emerald-400 font-black text-base'>1200</span></div>\n</div>\n</div>\n<div id='gamepad' class='gamepad'>\n<div class='pad-cluster'>\n<div id='steeringHandleWrap'>\n<svg id='steeringWheelSVG' viewBox='0 0 140 110' class='w-full h-full'>\n<rect x='10' y='18' width='120' height='74' rx='18' fill='none' stroke='#0f172a' stroke-width='12'/>\n<rect x='10' y='28' width='18' height='54' rx='6' fill='#ef4444'/>\n<rect x='112' y='28' width='18' height='54' rx='6' fill='#ef4444'/>\n<rect x='36' y='42' width='68' height='28' rx='8' fill='#1e293b' stroke='#f59e0b' stroke-width='2'/>\n<circle cx='55' cy='56' r='4' fill='#10b981'/><circle cx='70' cy='56' r='4' fill='#f59e0b'/><circle cx='85' cy='56' r='4' fill='#ef4444'/>\n</svg>\n</div>\n<div id='buttonSteerWrap' style='display:none; gap:12px;'>\n<div class='steer-btn' onpointerdown='setSteer(-1)' onpointerup='setSteer(0)' onpointerleave='setSteer(0)'>◀</div>\n<div class='steer-btn' onpointerdown='setSteer(1)' onpointerup='setSteer(0)' onpointerleave='setSteer(0)'>▶</div>\n</div>\n<div id='hornBtnEl' class='horn-btn' onpointerdown='triggerCarHorn(true)' onpointerup='triggerCarHorn(false)'>📢</div>\n</div>\n<div class='pad-cluster'>\n<div id='gearShifterEl' class='gear-shifter-box'>\n<button class='gear-btn' onclick='shiftGearManual(1)'>▲+</button>\n<div id='gearModeKnob' onclick='toggleGearMode()' class='px-2 py-1 rounded bg-amber-500 text-slate-950 font-black text-[10px] cursor-pointer'>AUTO</div>\n<button class='gear-btn' onclick='shiftGearManual(-1)'>▼-</button>\n</div>\n<div id='brakePedalEl' class='car-pedal pedal-brake-real' onpointerdown='setBrake(true)' onpointerup='setBrake(false)' onpointerleave='setBrake(false)'><div class='w-3 h-3 rounded-full bg-red-500'></div><div class='pedal-grip'></div><div class='pedal-grip'></div></div>\n<div id='accelPedalEl' class='car-pedal pedal-accel' onpointerdown='setGas(true)' onpointerup='setGas(false)' onpointerleave='setGas(false)'><div class='w-3 h-3 rounded-full bg-emerald-400'></div><div class='pedal-grip'></div><div class='pedal-grip'></div><div class='pedal-grip'></div></div>\n</div>\n</div>\n<div id='gameOverScreen' class='screen' style='display:none;'>\n<div class='bg-slate-900/95 border-2 border-red-500 rounded-3xl p-6 max-w-md w-full text-center flex flex-col items-center'>\n<div class='text-4xl mb-1'>💥</div>\n<div class='title-animated' style='color:#ef4444; font-size:28px;'>HIGHWAY CRASH!</div>\n<div class='text-slate-300 text-xs font-bold my-2'>🏁 DIST: <span id='crashDistText' class='text-amber-400'>0m</span> • 🏎️ PASSES: <span id='crashOvertakeText' class='text-purple-400'>0</span></div>\n<button class='arcade-btn btn-purple w-full my-2' onclick='watchAdToRevive()'>🎬 REVIVE HERE (WATCH AD)</button>\n<div class='flex gap-3 w-full mt-2'>\n<button class='arcade-btn btn-green flex-1' onclick='startGameSession()'>🔄 RETRY</button>\n<button class='arcade-btn flex-1' onclick='backToHome()'>🏠 HOME</button>\n</div>\n</div>\n</div>\n<div id='customModal'>\n<div class='bg-slate-900 border-2 border-amber-500 p-6 rounded-3xl text-center max-w-sm w-full'>\n<div id='modalTitle' class='text-amber-400 font-black text-lg mb-2'>SPONSORED REWARD</div>\n<div id='adCountdown' class='text-3xl font-black text-white my-4'>5s</div>\n<div class='flex gap-3 justify-center'>\n<button id='modalActionBtn' class='arcade-btn btn-green' style='display:none;' onclick='resolveAdReward()'>🎁 CLAIM</button>\n<button id='modalCloseBtn' class='arcade-btn btn-red' onclick='closeModal()'>✖ CANCEL</button>\n</div>\n</div>\n</div>\n</div>\n<script>\nconst canvas = document.getElementById('gameCanvas');\nconst ctx = canvas.getContext('2d');\nlet coins = parseInt(localStorage.getItem('apex_coins_v3') || '1200');\nlet activeCarIndex = parseInt(localStorage.getItem('apex_car_v3') || '0');\nlet unlockedCars = JSON.parse(localStorage.getItem('apex_unlocked_v3') || '[0]');\nlet audioEnabled = true;\nlet controlMode = 'handle';\nlet showGearShifter = true;\nlet manualGearMode = false;\nlet manualGear = 1;\nlet isRunning = false;\nlet playerX = 565;\nlet playerWorldY = 0;\nlet totalDistanceMeters = 0;\nlet overtakeCount = 0;\nlet cameraWorldY = -560;\nlet speed = 0;\nlet gear = 1;\nlet steerInput = 0;\nlet gasPressed = false;\nlet brakePressed = false;\nlet lanePositions = [420, 565, 715, 860];\nlet trafficCars = [];\nlet sceneryObjects = [];\nlet hornWaves = [];\nlet weatherParticles = [];\nlet lightningAlpha = 0;\nconst worldThemes = [\n  { id: 'desert', name: 'SAHARA DESERT', ground1: '#d97706', ground2: '#f59e0b', road: '#1e293b', shoulder: '#78350f' },\n  { id: 'jungle', name: 'AMAZON JUNGLE', ground1: '#14532d', ground2: '#166534', road: '#1e293b', shoulder: '#3f6212' },\n  { id: 'city', name: 'CYBER NIGHT CITY', ground1: '#090d16', ground2: '#1e1b4b', road: '#0f172a', shoulder: '#38bdf8' },\n  { id: 'snow', name: 'HIMALAYA SNOW', ground1: '#cbd5e1', ground2: '#f8fafc', road: '#334155', shoulder: '#94a3b8' }\n];\nlet currentThemeIdx = 0;\nconst weatherMoods = ['SUNNY DAY', 'MIDNIGHT', 'HEAVY RAIN', 'THUNDER STORM'];\nlet currentMoodIdx = 0;\nconst vehicleCategories = [\n  { typeId: 0, className: 'MINI HATCH', prefix: 'Mini Cooper S', scaleW: 0.85, scaleH: 0.8 },\n  { typeId: 1, className: 'FORD MUSCLE', prefix: 'Mustang GT', scaleW: 1.0, scaleH: 1.0 },\n  { typeId: 2, className: 'F1 HYPERCAR', prefix: 'RedBull RB20', scaleW: 1.02, scaleH: 1.04 },\n  { typeId: 3, className: 'RAPTOR PICKUP', prefix: 'Ford F-150', scaleW: 1.08, scaleH: 1.12 },\n  { typeId: 4, className: 'MONSTER SUV', prefix: 'Defender 4x4', scaleW: 1.1, scaleH: 1.06 },\n  { typeId: 5, className: 'JUMBO TRUCK', prefix: 'Titan Semi', scaleW: 1.24, scaleH: 1.36 }\n];\nconst carPalettes = [\n  { body: '#ef4444', stripe: '#fde047', accent: '#991b1b' },\n  { body: '#0284c7', stripe: '#ffffff', accent: '#0c4a6e' },\n  { body: '#10b981', stripe: '#064e3b', accent: '#047857' },\n  { body: '#f59e0b', stripe: '#0f172a', accent: '#b45309' },\n  { body: '#8b5cf6', stripe: '#ddd6fe', accent: '#4c1d95' },\n  { body: '#ec4899', stripe: '#fbcfe8', accent: '#831843' }\n];\nlet carsData = [];\nfor (let i = 0; i < 50; i++) {\n  let pal = carPalettes[i % carPalettes.length];\n  let cat = vehicleCategories[i % vehicleCategories.length];\n  carsData.push({ id: i, name: cat.prefix + ' #' + (i + 1), categoryLabel: cat.className, bodyStyle: cat.typeId, scaleW: cat.scaleW, scaleH: cat.scaleH, topSpeed: 205 + i * 3, accel: 1.25 + i * 0.025, bodyColor: pal.body, stripeColor: pal.stripe, accentColor: pal.accent, price: i === 0 ? 0 : i * 350 });\n}\nlet audioCtx = null;\nlet engineOsc = null;\nlet engineGain = null;\nlet musicTimer = null;\nlet musicStep = 0;\nfunction ensureAudio() {\n  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();\n  if (audioCtx.state === 'suspended') audioCtx.resume();\n}\nfunction startEngineAudio() {\n  if (!audioEnabled) return;\n  try {\n    ensureAudio();\n    if (engineOsc) return;\n    engineOsc = audioCtx.createOscillator();\n    engineGain = audioCtx.createGain();\n    engineOsc.type = 'sawtooth';\n    engineOsc.frequency.value = 55;\n    engineGain.gain.value = 0.001;\n    engineOsc.connect(engineGain);\n    engineGain.connect(audioCtx.destination);\n    engineOsc.start();\n  } catch (e) {}\n}\nfunction updateEngineAudio() {\n  if (!engineOsc || !engineGain) return;\n  if (!isRunning || !audioEnabled) {\n    engineGain.gain.setTargetAtTime(0.0001, audioCtx.currentTime, 0.08);\n    return;\n  }\n  let rpmFreq = 52 + (speed * 0.85) + (gasPressed ? 28 : 0);\n  let vol = gasPressed ? 0.085 : (speed > 5 ? 0.035 : 0.012);\n  engineOsc.frequency.setTargetAtTime(rpmFreq, audioCtx.currentTime, 0.05);\n  engineGain.gain.setTargetAtTime(vol, audioCtx.currentTime, 0.06);\n}\nfunction playCrashSound() {\n  if (!audioEnabled) return;\n  try {\n    ensureAudio();\n    const now = audioCtx.currentTime;\n    const osc = audioCtx.createOscillator();\n    const g = audioCtx.createGain();\n    osc.type = 'sawtooth';\n    osc.frequency.setValueAtTime(140, now);\n    osc.frequency.exponentialRampToValueAtTime(28, now + 0.45);\n    g.gain.setValueAtTime(0.28, now);\n    g.gain.exponentialRampToValueAtTime(0.005, now + 0.45);\n    osc.connect(g); g.connect(audioCtx.destination);\n    osc.start(now); osc.stop(now + 0.45);\n  } catch (e) {}\n}\nfunction startHomeMusic() {\n  stopHomeMusic();\n  if (!audioEnabled || isRunning) return;\n  const notes = [146.83, 174.61, 220.0, 261.63, 293.66, 261.63, 220.0, 174.61];\n  musicTimer = setInterval(() => {\n    if (isRunning || !audioEnabled || !audioCtx || audioCtx.state !== 'running') return;\n    try {\n      const now = audioCtx.currentTime;\n      const osc = audioCtx.createOscillator();\n      const g = audioCtx.createGain();\n      osc.type = 'triangle';\n      osc.frequency.setValueAtTime(notes[musicStep % notes.length], now);\n      g.gain.setValueAtTime(0.035, now);\n      g.gain.exponentialRampToValueAtTime(0.002, now + 0.16);\n      osc.connect(g); g.connect(audioCtx.destination);\n      osc.start(now); osc.stop(now + 0.16);\n      musicStep++;\n    } catch (e) {}\n  }, 180);\n}\nfunction stopHomeMusic() { if (musicTimer) { clearInterval(musicTimer); musicTimer = null; } }\nwindow.addEventListener('pointerdown', () => { ensureAudio(); if (!isRunning && !musicTimer) startHomeMusic(); }, { once: true });\nfunction createCarSVG(car, w = 66, h = 104) {\n  return `<svg width='${w}' height='${h}' viewBox='0 0 80 140'><rect x='10' y='12' width='60' height='116' rx='16' fill='${car.bodyColor}' stroke='${car.accentColor}' stroke-width='3'/><rect x='34' y='12' width='12' height='116' fill='${car.stripeColor}'/><rect x='18' y='42' width='44' height='48' rx='10' fill='#0f172a'/><rect x='14' y='14' width='12' height='4' fill='#fef08a'/><rect x='54' y='14' width='12' height='4' fill='#fef08a'/></svg>`;\n}\nfunction updateGlobalUI() {\n  document.getElementById('uiCoins').innerText = coins;\n  document.getElementById('garageCoins').innerText = coins;\n  document.getElementById('homeCarPreview').innerHTML = createCarSVG(carsData[activeCarIndex], 78, 120);\n  localStorage.setItem('apex_coins_v3', coins);\n  localStorage.setItem('apex_car_v3', activeCarIndex);\n  localStorage.setItem('apex_unlocked_v3', JSON.stringify(unlockedCars));\n}\nwindow.cycleTheme = function() {\n  currentThemeIdx = (currentThemeIdx + 1) % worldThemes.length;\n  document.getElementById('homeThemeLabel').innerText = worldThemes[currentThemeIdx].name;\n};\nwindow.cycleMood = function() {\n  currentMoodIdx = (currentMoodIdx + 1) % weatherMoods.length;\n  document.getElementById('homeMoodLabel').innerText = weatherMoods[currentMoodIdx];\n};\nwindow.toggleGearShifter = function() {\n  showGearShifter = !showGearShifter;\n  document.getElementById('gearToggleBtn').innerText = showGearShifter ? 'VISIBLE' : 'HIDDEN';\n  document.getElementById('gearShifterEl').style.display = showGearShifter ? 'flex' : 'none';\n};\nwindow.toggleGearMode = function() {\n  manualGearMode = !manualGearMode;\n  document.getElementById('gearModeKnob').innerText = manualGearMode ? 'MANUAL' : 'AUTO';\n};\nwindow.shiftGearManual = function(delta) {\n  manualGearMode = true;\n  document.getElementById('gearModeKnob').innerText = 'MANUAL';\n  manualGear = Math.max(1, Math.min(6, manualGear + delta));\n};\nwindow.triggerCarHorn = function(pressed) {\n  if (!pressed) return;\n  hornWaves.push({ x: playerX, y: playerWorldY - 45, radius: 16, alpha: 1.0 });\n  if (audioEnabled) {\n    try {\n      ensureAudio();\n      const now = audioCtx.currentTime;\n      [440, 554].forEach(f => {\n        const o = audioCtx.createOscillator();\n        const g = audioCtx.createGain();\n        o.type = 'triangle'; o.frequency.setValueAtTime(f, now);\n        g.gain.setValueAtTime(0.06, now); g.gain.exponentialRampToValueAtTime(0.005, now + 0.22);\n        o.connect(g); g.connect(audioCtx.destination);\n        o.start(now); o.stop(now + 0.22);\n      });\n    } catch (e) {}\n  }\n  trafficCars.forEach(t => {\n    let distAhead = playerWorldY - t.worldY;\n    if (distAhead > 60 && distAhead < 520 && Math.abs(t.x - playerX) < 75) {\n      let alt = t.lane === 0 ? 1 : t.lane === 3 ? 2 : (t.lane + 1);\n      t.lane = alt; t.targetX = lanePositions[alt];\n    }\n  });\n};\nfunction getPlayerClosestLane() {\n  let best = 0, minD = 9999;\n  lanePositions.forEach((lx, idx) => { let d = Math.abs(playerX - lx); if (d < minD) { minD = d; best = idx; } });\n  return best;\n}\nfunction isSlotFree(lane, wy, ignoreIdx = -1) {\n  for (let i = 0; i < trafficCars.length; i++) {\n    if (i === ignoreIdx) continue;\n    if (trafficCars[i].lane === lane && Math.abs(trafficCars[i].worldY - wy) < 210) return false;\n  }\n  return true;\n}\nfunction createTrafficVehicle(lane, worldY, forceDirectX = false) {\n  let pal = carPalettes[Math.floor(Math.random() * carPalettes.length)];\n  let cat = vehicleCategories[Math.floor(Math.random() * vehicleCategories.length)];\n  let spd = cat.typeId === 5 ? (32 + Math.random() * 16) : (42 + Math.random() * 28);\n  let startX = forceDirectX ? playerX : lanePositions[lane];\n  return { lane, x: startX, targetX: startX, worldY, speed: spd, bodyColor: pal.body, stripeColor: pal.stripe, accentColor: pal.accent, bodyStyle: cat.typeId, scaleW: cat.scaleW, scaleH: cat.scaleH, changeCooldown: 120 + Math.floor(Math.random() * 140) };\n}\nfunction spawnTrafficAhead() {\n  trafficCars = [];\n  let pLane = getPlayerClosestLane();\n  for (let i = 0; i < 6; i++) {\n    let lane = (i === 0 || i === 3) ? pLane : (i % 4);\n    let wy = playerWorldY - 300 - (i * 240);\n    trafficCars.push(createTrafficVehicle(lane, wy, i === 0));\n  }\n}\nwindow.startGameSession = function() {\n  stopHomeMusic();\n  startEngineAudio();\n  document.getElementById('homeScreen').style.display = 'none';\n  document.getElementById('gameOverScreen').style.display = 'none';\n  document.getElementById('hudBar').style.display = 'flex';\n  document.getElementById('gamepad').style.display = 'flex';\n  playerX = lanePositions[1];\n  playerWorldY = 0; totalDistanceMeters = 0; overtakeCount = 0; speed = 0; gear = 1;\n  setGas(false); setBrake(false);\n  spawnTrafficAhead();\n  isRunning = true;\n};\nwindow.backToHome = function() {\n  isRunning = false;\n  updateEngineAudio();\n  startHomeMusic();\n  document.getElementById('gameOverScreen').style.display = 'none';\n  document.getElementById('hudBar').style.display = 'none';\n  document.getElementById('gamepad').style.display = 'none';\n  document.getElementById('homeScreen').style.display = 'flex';\n  updateGlobalUI();\n  if (window.AdMobBridge) { try { window.AdMobBridge.postMessage('showInterstitial'); } catch (e) {} }\n};\nwindow.openGarage = function() {\n  document.getElementById('homeScreen').style.display = 'none';\n  document.getElementById('garageScreen').style.display = 'flex';\n  renderGarageGrid();\n};\nwindow.closeGarage = function() {\n  document.getElementById('garageScreen').style.display = 'none';\n  document.getElementById('homeScreen').style.display = 'flex';\n  updateGlobalUI();\n};\nwindow.openSettings = function() {\n  document.getElementById('homeScreen').style.display = 'none';\n  document.getElementById('settingsScreen').style.display = 'flex';\n};\nwindow.closeSettings = function() {\n  document.getElementById('settingsScreen').style.display = 'none';\n  document.getElementById('homeScreen').style.display = 'flex';\n};\nfunction renderGarageGrid() {\n  const grid = document.getElementById('garageGrid');\n  grid.innerHTML = '';\n  carsData.forEach(car => {\n    let unlocked = unlockedCars.includes(car.id);\n    let selected = activeCarIndex === car.id;\n    let d = document.createElement('div');\n    d.className = 'car-card ' + (selected ? 'selected' : '');\n    d.innerHTML = `<div class='text-[9px] text-amber-300 font-bold'>${car.categoryLabel}</div>${createCarSVG(car, 54, 86)}<div class='text-white font-black text-xs mt-1'>${car.name}</div><div class='text-sky-400 text-[10px] font-bold'>⚡ ${car.topSpeed} KM/H</div><div class='mt-2 w-full'>${selected ? '<span class=\"text-amber-400 font-black text-xs\">✔ ACTIVE</span>' : unlocked ? `<button class=\"arcade-btn btn-green w-full\" style=\"padding:4px 8px;font-size:10px;\" onclick=\"selectCar(${car.id})\">SELECT</button>` : `<button class=\"arcade-btn btn-blue w-full mb-1\" style=\"padding:4px;font-size:10px;\" onclick=\"unlockWithCoins(${car.id})\">🪙 ${car.price}</button><button class=\"arcade-btn btn-purple w-full\" style=\"padding:4px;font-size:10px;\" onclick=\"unlockWithAd(${car.id})\">🎬 WATCH AD</button>`}</div>`;\n    grid.appendChild(d);\n  });\n}\nwindow.selectCar = function(id) { activeCarIndex = id; updateGlobalUI(); renderGarageGrid(); };\nwindow.unlockWithCoins = function(id) {\n  if (coins >= carsData[id].price) { coins -= carsData[id].price; unlockedCars.push(id); activeCarIndex = id; updateGlobalUI(); renderGarageGrid(); }\n  else window.unlockWithAd(id);\n};\nlet adPurpose = null, pendingUnlockCarId = null, adInterval = null;\nwindow.unlockWithAd = function(id) { adPurpose = 'unlock'; pendingUnlockCarId = id; startAdModal(15, 'UNLOCK ' + carsData[id].name); };\nwindow.watchAdToRevive = function() { adPurpose = 'revive'; startAdModal(15, 'REVIVE & CONTINUE'); };\nwindow.onRewardedAdReward = function() { resolveAdReward(); };\nfunction startAdModal(sec, title) {\n  document.getElementById('customModal').style.display = 'flex';\n  document.getElementById('modalTitle').innerText = title;\n  const act = document.getElementById('modalActionBtn');\n  const cnt = document.getElementById('adCountdown');\n  act.style.display = 'none';\n  let left = sec; cnt.innerText = left + 's';\n  if (window.AdMobBridge) { try { window.AdMobBridge.postMessage('showRewarded'); } catch (e) {} }\n  if (adInterval) clearInterval(adInterval);\n  adInterval = setInterval(() => {\n    left--;\n    if (left > 0) cnt.innerText = left + 's';\n    else { clearInterval(adInterval); cnt.innerText = '✔'; act.style.display = 'inline-flex'; }\n  }, 1000);\n}\nwindow.resolveAdReward = function() {\n  if (adInterval) clearInterval(adInterval);\n  document.getElementById('customModal').style.display = 'none';\n  if (adPurpose === 'unlock' && pendingUnlockCarId !== null) {\n    if (!unlockedCars.includes(pendingUnlockCarId)) unlockedCars.push(pendingUnlockCarId);\n    activeCarIndex = pendingUnlockCarId; updateGlobalUI(); renderGarageGrid();\n  } else if (adPurpose === 'revive') {\n    document.getElementById('gameOverScreen').style.display = 'none';\n    document.getElementById('hudBar').style.display = 'flex';\n    document.getElementById('gamepad').style.display = 'flex';\n    trafficCars.forEach((t, idx) => { t.worldY = playerWorldY - 500 - idx * 230; });\n    speed = 70; isRunning = true;\n  }\n};\nwindow.closeModal = function() { if (adInterval) clearInterval(adInterval); document.getElementById('customModal').style.display = 'none'; };\nwindow.toggleAudio = function() {\n  audioEnabled = !audioEnabled;\n  document.getElementById('audioToggleBtn').innerText = audioEnabled ? 'ON' : 'OFF';\n  if (!audioEnabled) stopHomeMusic(); else startHomeMusic();\n};\nwindow.cycleControlMode = function() {\n  controlMode = controlMode === 'handle' ? 'buttons' : 'handle';\n  document.getElementById('controlModeBtn').innerText = controlMode === 'handle' ? 'F1 YOKE HANDLE' : 'BUTTONS (◀ ▶)';\n  document.getElementById('steeringHandleWrap').style.display = controlMode === 'handle' ? 'flex' : 'none';\n  document.getElementById('buttonSteerWrap').style.display = controlMode === 'buttons' ? 'flex' : 'none';\n};\nwindow.setSteer = function(d) { steerInput = d; };\nwindow.setGas = function(v) { gasPressed = v; ensureAudio(); startEngineAudio(); document.getElementById('accelPedalEl').classList.toggle('pressed', v); };\nwindow.setBrake = function(v) { brakePressed = v; document.getElementById('brakePedalEl').classList.toggle('pressed', v); };\nconst handleWrap = document.getElementById('steeringHandleWrap');\nconst wheelSVG = document.getElementById('steeringWheelSVG');\nlet draggingWheel = false;\nhandleWrap.addEventListener('pointerdown', e => { draggingWheel = true; handleWrap.setPointerCapture(e.pointerId); });\nhandleWrap.addEventListener('pointermove', e => {\n  if (!draggingWheel) return;\n  const r = handleWrap.getBoundingClientRect();\n  let deg = Math.atan2(e.clientX - (r.left + r.width / 2), -(e.clientY - (r.top + r.height / 2))) * (180 / Math.PI);\n  deg = Math.max(-75, Math.min(75, deg));\n  wheelSVG.style.transform = `rotate(${deg}deg)`;\n  steerInput = deg / 55;\n});\nconst relWheel = () => { draggingWheel = false; wheelSVG.style.transform = 'rotate(0deg)'; steerInput = 0; };\nhandleWrap.addEventListener('pointerup', relWheel); handleWrap.addEventListener('pointercancel', relWheel);\nfor (let i = 0; i < 65; i++) weatherParticles.push({ x: Math.random() * 1280, y: Math.random() * 720, len: 18 + Math.random() * 18, vy: 14 + Math.random() * 8 });\nspawnTrafficAhead();\nfunction drawVehicle(sx, sy, v, isPlayer, tilt) {\n  ctx.save(); ctx.translate(sx, sy); ctx.rotate(tilt); ctx.scale(v.scaleW || 1, v.scaleH || 1);\n  if (currentMoodIdx >= 1) {\n    let g = ctx.createLinearGradient(0, -60, 0, -240);\n    g.addColorStop(0, 'rgba(254, 240, 138, 0.45)'); g.addColorStop(1, 'rgba(254, 240, 138, 0)');\n    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(-22, -60); ctx.lineTo(-70, -240); ctx.lineTo(70, -240); ctx.lineTo(22, -60); ctx.fill();\n  }\n  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(-32, -64, 64, 128);\n  ctx.fillStyle = '#090d16';\n  ctx.fillRect(-36, -46, 9, 24); ctx.fillRect(27, -46, 9, 24);\n  ctx.fillRect(-36, 20, 9, 24); ctx.fillRect(27, 20, 9, 24);\n  ctx.fillStyle = v.bodyColor; ctx.fillRect(-28, -62, 56, 124);\n  ctx.fillStyle = v.stripeColor; ctx.fillRect(-6, -62, 12, 124);\n  ctx.fillStyle = '#0f172a'; ctx.fillRect(-20, -26, 40, 46);\n  ctx.fillStyle = '#fef08a'; ctx.fillRect(-24, -64, 10, 4); ctx.fillRect(14, -64, 10, 4);\n  ctx.fillStyle = (isPlayer && brakePressed) ? '#ff0000' : '#ef4444';\n  ctx.fillRect(-24, 58, 12, 4); ctx.fillRect(12, 58, 12, 4);\n  ctx.restore();\n}\nfunction masterLoop() {\n  const activeCar = carsData[activeCarIndex];\n  const theme = worldThemes[currentThemeIdx];\n  if (isRunning) {\n    let maxSpd = manualGearMode ? (manualGear * (activeCar.topSpeed / 6)) : activeCar.topSpeed;\n    if (gasPressed) speed = Math.min(maxSpd, speed + activeCar.accel);\n    else speed = Math.max(0, speed - 0.6);\n    if (brakePressed) speed = Math.max(0, speed - 4.2);\n    gear = manualGearMode ? manualGear : (speed < 2 ? 'N' : Math.min(6, 1 + Math.floor(speed / 42)));\n    let step = speed * 0.24;\n    playerWorldY -= step;\n    if (speed > 0.5) totalDistanceMeters += step / 12;\n    if (speed > 1) playerX += steerInput * (6.2 + speed * 0.02);\n    playerX = Math.max(385, Math.min(895, playerX));\n  } else {\n    speed = 75; playerWorldY -= 12;\n  }\n  updateEngineAudio();\n  let playerScreenY = 555 - (gasPressed ? Math.min(80, speed * 0.28) : 20);\n  cameraWorldY = playerWorldY - playerScreenY;\n  ctx.fillStyle = theme.ground1; ctx.fillRect(0, 0, 1280, 720);\n  ctx.fillStyle = theme.shoulder; ctx.fillRect(325, 0, 630, 720);\n  ctx.fillStyle = theme.road; ctx.fillRect(350, 0, 580, 720);\n  ctx.fillStyle = '#fde047';\n  let dashStart = Math.floor(cameraWorldY / 90) * 90;\n  for (let wy = dashStart; wy < cameraWorldY + 810; wy += 90) {\n    let sy = wy - cameraWorldY;\n    ctx.fillRect(492, sy, 6, 48); ctx.fillRect(637, sy, 6, 48); ctx.fillRect(782, sy, 6, 48);\n  }\n  for (let i = 0; i < trafficCars.length; i++) {\n    let t = trafficCars[i];\n    for (let j = 0; j < trafficCars.length; j++) {\n      if (i === j) continue;\n      let o = trafficCars[j];\n      if (t.lane === o.lane && t.worldY > o.worldY && (t.worldY - o.worldY) < 195) {\n        t.speed = Math.min(t.speed, o.speed);\n        t.worldY = o.worldY + 195;\n      }\n    }\n    t.worldY -= t.speed * 0.14;\n    let distAhead = playerWorldY - t.worldY;\n    if (t.changeCooldown > 0) t.changeCooldown--;\n    else if (distAhead > 250 && distAhead < 650 && Math.random() < 0.015) {\n      let nl = t.lane === 0 ? 1 : t.lane === 3 ? 2 : (t.lane + (Math.random() > 0.5 ? 1 : -1));\n      if (isSlotFree(nl, t.worldY, i)) { t.lane = nl; t.targetX = lanePositions[nl]; t.changeCooldown = 200; }\n    }\n    t.x += (t.targetX - t.x) * 0.1;\n    let sy = t.worldY - cameraWorldY;\n    if (sy > 860) {\n      if (isRunning) { coins += 25; overtakeCount++; }\n      let forcePath = Math.random() < 0.7;\n      let nl = forcePath ? getPlayerClosestLane() : Math.floor(Math.random() * 4);\n      let nwy = playerWorldY - 760 - Math.random() * 360;\n      if (!isSlotFree(nl, nwy, i)) nwy -= 240;\n      trafficCars[i] = createTrafficVehicle(nl, nwy, forcePath);\n      continue;\n    } else if (sy < -1100) { t.worldY = playerWorldY - 680 - Math.random() * 300; }\n    drawVehicle(t.x, t.worldY - cameraWorldY, t, false, 0);\n    if (isRunning && Math.abs(playerX - t.x) < 46 && Math.abs(playerScreenY - (t.worldY - cameraWorldY)) < 96) {\n      isRunning = false; setGas(false); setBrake(false); playCrashSound(); updateGlobalUI();\n      document.getElementById('crashDistText').innerText = Math.floor(totalDistanceMeters) + 'm';\n      document.getElementById('crashOvertakeText').innerText = overtakeCount;\n      document.getElementById('hudBar').style.display = 'none';\n      document.getElementById('gamepad').style.display = 'none';\n      document.getElementById('gameOverScreen').style.display = 'flex';\n      if (window.AdMobBridge) { try { window.AdMobBridge.postMessage('showInterstitial'); } catch (e) {} }\n    }\n  }\n  for (let h = hornWaves.length - 1; h >= 0; h--) {\n    let hw = hornWaves[h]; hw.radius += 7; hw.alpha -= 0.04;\n    ctx.strokeStyle = `rgba(253, 224, 71, ${hw.alpha})`; ctx.lineWidth = 4;\n    ctx.beginPath(); ctx.arc(hw.x, hw.y - cameraWorldY, hw.radius, -Math.PI * 0.85, -Math.PI * 0.15); ctx.stroke();\n    if (hw.alpha <= 0) hornWaves.splice(h, 1);\n  }\n  drawVehicle(playerX, playerScreenY, activeCar, true, steerInput * 0.12);\n  if (currentMoodIdx >= 1) { ctx.fillStyle = 'rgba(2, 6, 23, 0.45)'; ctx.fillRect(0, 0, 1280, 720); }\n  if (currentMoodIdx >= 2) {\n    ctx.strokeStyle = 'rgba(186, 230, 253, 0.55)'; ctx.lineWidth = 2;\n    weatherParticles.forEach(p => {\n      p.y += p.vy; p.x -= 3; if (p.y > 720) { p.y = -20; p.x = Math.random() * 1280; }\n      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - 4, p.y + p.len); ctx.stroke();\n    });\n    if (currentMoodIdx === 3 && Math.random() < 0.012) lightningAlpha = 0.8;\n    if (lightningAlpha > 0) { ctx.fillStyle = `rgba(255,255,255,${lightningAlpha})`; ctx.fillRect(0, 0, 1280, 720); lightningAlpha -= 0.08; }\n  }\n  if (isRunning) {\n    document.getElementById('uiSpeed').innerText = Math.floor(speed);\n    document.getElementById('uiSpeedBar').style.width = Math.min(100, (speed / activeCar.topSpeed) * 100) + '%';\n    document.getElementById('uiGear').innerText = gear;\n    document.getElementById('uiCoins').innerText = coins;\n    document.getElementById('uiDist').innerText = Math.floor(totalDistanceMeters);\n    document.getElementById('uiOvertakes').innerText = overtakeCount;\n  }\n  requestAnimationFrame(masterLoop);\n}\nupdateGlobalUI();\nrequestAnimationFrame(masterLoop);\n</script>\n</body>\n</html>\nEOF\n"
},
