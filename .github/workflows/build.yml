name: Build Duck Shooter Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.x'
        channel: 'stable'

    - name: Recreate Android Project Structure
      run: |
        flutter create . --org com.rahulgupta --project-name duckshooter2

    - name: Create Complete Game Assets & HTML
      run: |
        mkdir -p assets
        cat << 'EOF' > assets/index.html
        <!DOCTYPE html>
        <html lang="hi">
        <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
          <title>Duck Shooter 3D Ultimate</title>
          <style>
            * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
            html, body { width: 100%; height: 100%; overflow: hidden; background: #0c0502; display: flex; align-items: center; justify-content: center; font-family: 'Trebuchet MS', sans-serif; }
            #phoneContainer { position: relative; width: 100vw; height: 100vh; max-width: 480px; aspect-ratio: 9/16; background: #081226; overflow: hidden; display: flex; flex-direction: column; }
            canvas { width: 100%; height: 100%; display: block; cursor: crosshair; }
            .screen { position: absolute; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 18px; text-align: center; background: radial-gradient(circle at 50% 30%, #5a2a18 0%, #200d04 75%, #0c0502 100%); }
            .screen.hidden { display: none !important; }
            .cookie-board-window { background: #c68642; border: 8px solid #5a2a18; outline: 5px solid #ffbe53; border-radius: 36px; padding: 22px 16px; position: relative; max-width: 92%; box-shadow: 0 12px 30px rgba(0,0,0,0.8); }
            .cookie-btn { background: linear-gradient(180deg, #ffc857 0%, #ff9800 45%, #d86900 100%); border: 3px solid #fff5c0; color: #542200; font-size: 15px; font-weight: 900; padding: 12px 22px; border-radius: 28px; cursor: pointer; box-shadow: 0 6px 0 #7b3200; display: inline-flex; align-items: center; justify-content: center; text-transform: uppercase; }
            .cookie-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #7b3200; }
            .cookie-btn-green { background: linear-gradient(180deg, #9ae630 0%, #68bf08 45%, #3c8200 100%); border-color: #f1ffd6; color: #173800; box-shadow: 0 6px 0 #1b4d00; }
            .cookie-btn-blue { background: linear-gradient(180deg, #4ed3ff 0%, #0099e6 45%, #006096 100%); border-color: #d8f5ff; color: #fff; box-shadow: 0 6px 0 #003657; }
            .cookie-btn-red { background: linear-gradient(180deg, #ff6b6b 0%, #e82727 45%, #a50b0b 100%); border-color: #ffd8d8; color: #fff; box-shadow: 0 6px 0 #5b0505; }
            .ribbon-banner { background: linear-gradient(180deg, #ffdc33 0%, #f39c12 50%, #d35400 100%); border: 3px solid #fff2a3; border-radius: 18px; padding: 8px 30px; color: #fff; font-size: 22px; font-weight: 900; margin-top: -38px; margin-bottom: 12px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
            .ribbon-banner.lose { background: linear-gradient(180deg, #ff7675 0%, #d63031 50%, #7c0b0b 100%); border-color: #ffcccc; }
            .stars-cluster { display: flex; justify-content: center; gap: 10px; margin: 8px 0 14px 0; }
            .star-3d { font-size: 38px; opacity: 0.25; filter: grayscale(1); }
            .star-3d.lit { opacity: 1; transform: scale(1.15); filter: drop-shadow(0 0 16px #facc15) grayscale(0); }
            .gameplay-hud { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; z-index: 30; pointer-events: none; }
            .hud-cookie-pill { background: linear-gradient(180deg, #5a2a18 0%, #3a170a 100%); border: 2px solid #e08b26; color: #fff; padding: 4px 10px; border-radius: 16px; font-size: 11px; display: flex; flex-direction: column; align-items: center; box-shadow: 0 3px 6px rgba(0,0,0,0.4); }
            .gameplay-controls { position: absolute; bottom: 18px; left: 14px; right: 14px; display: flex; justify-content: space-between; z-index: 30; pointer-events: none; }
            
            /* S-CURVE FLOATING ROAD */
            .flow-map-container { flex: 1; width: 100%; overflow-y: auto; overflow-x: hidden; padding: 20px 0 80px 0; display: flex; flex-direction: column-reverse; align-items: center; position: relative; }
            .flow-node-row { width: 100%; height: 85px; position: relative; display: flex; align-items: center; }
            .level-bubble { width: 64px; height: 64px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; background: linear-gradient(180deg, #ffc857 0%, #d86900 100%); border: 3.5px solid #fff5c0; box-shadow: 0 6px 0 #7b3200, 0 8px 18px rgba(0,0,0,0.5); color: #542200; font-weight: 900; position: absolute; transform: translateX(-50%); transition: transform 0.15s ease; }
            .level-bubble:active { transform: translateX(-50%) scale(0.92); }
            .level-bubble.locked { background: linear-gradient(180deg, #64748b 0%, #334155 100%); border-color: #94a3b8; box-shadow: 0 6px 0 #1e293b; color: #cbd5e1; opacity: 0.7; }
            .level-bubble.active-node { border-color: #4ade80; box-shadow: 0 6px 0 #15803d, 0 0 20px #4ade80; animation: bounceFloat 1.2s infinite alternate; }
            @keyframes bounceFloat { 0% { transform: translateX(-50%) translateY(0); } 100% { transform: translateX(-50%) translateY(-6px); } }

            /* ARMORY WEAPONS GRID */
            .armory-grid { flex: 1; width: 100%; overflow-y: auto; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 10px 4px 80px 4px; }
            .hub-card { background: rgba(74, 34, 14, 0.9); border: 3px solid #b45309; border-radius: 20px; padding: 12px 8px; display: flex; flex-direction: column; align-items: center; box-shadow: 0 6px 12px rgba(0,0,0,0.4); }
            .hub-card.active-item { border-color: #facc15; background: rgba(120, 53, 15, 0.95); box-shadow: 0 0 16px rgba(250, 204, 21, 0.5); }
            .hub-card img { width: 110px; height: 60px; object-fit: contain; margin: 8px 0; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6)); }
          </style>
        </head>
        <body>
          <div id="phoneContainer">
            <!-- HOME SCREEN -->
            <div id="homeScreen" class="screen">
              <h1 style="font-size:32px; font-weight:900; color:#fff; margin-bottom:12px; background:linear-gradient(180deg, #ffdf79, #f39c12); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">DUCK SHOOTER 3D</h1>
              <div class="cookie-board-window" style="width:230px; margin-bottom:18px;">
                <div style="font-size:75px; filter: drop-shadow(0 8px 12px rgba(0,0,0,0.5));">🦆</div>
                <div style="color:#fff3cc; font-size:13px; font-weight:900; letter-spacing:1px; margin-top:4px;">COOKIE EXPEDITION</div>
              </div>
              <button id="btnEnterHub" class="cookie-btn" style="width:240px; font-size:16px;">▶ PLAY GAME</button>
              <button id="btnWatchAd" onclick="requestRewardedAd()" class="cookie-btn cookie-btn-green" style="width:240px; font-size:12px; margin-top:10px;">🎬 FREE 100 COINS</button>
              <a href="https://youtube.com/@thegovindgupta?si=gXoJJdVou07U7r1m" target="_blank" style="color:#ff9999; text-decoration:none; font-weight:800; font-size:12px; margin-top:16px;">🔴 Channel: @thegovindgupta</a>
            </div>

            <!-- HUB / EXPEDITION & ARMORY SCREEN -->
            <div id="hubScreen" class="screen hidden" style="justify-content: flex-start; padding-top: 14px;">
              <div style="width:100%; display:flex; justify-content:space-between; align-items:center;">
                <h2 style="color:#ffdf79; font-size:16px; font-weight:900;">EXPEDITION MAP</h2>
                <div style="background:rgba(20,8,3,0.9); border:2px solid #d97706; border-radius:24px; padding:4px 14px; color:#fef08a; font-weight:900;">🪙 <span id="hubCoins">0</span></div>
              </div>
              <div style="display:flex; width:100%; gap:8px; margin:10px 0;">
                <button id="tabLevels" class="cookie-btn" style="flex:1; padding:8px 0; font-size:12px;" onclick="switchHub('levels')">🗺️ ISLAND ROAD</button>
                <button id="tabGuns" class="cookie-btn cookie-btn-blue" style="flex:1; padding:8px 0; font-size:12px;" onclick="switchHub('guns')">🔫 ARMORY</button>
              </div>
              
              <div id="hubListRoad" class="flow-map-container"></div>
              <div id="hubListArmory" class="armory-grid hidden"></div>

              <div style="position:absolute; bottom:14px; left:16px; right:16px; display:flex; gap:10px;">
                <button id="btnBackToHome" class="cookie-btn cookie-btn-blue" style="flex:1; padding:10px; font-size:13px;">◀ HOME</button>
                <button id="btnStartMission" class="cookie-btn cookie-btn-green" style="flex:2; padding:10px; font-size:14px;">START MISSION ▶</button>
              </div>
            </div>

            <!-- GAMEPLAY HUD -->
            <div class="gameplay-hud">
              <button id="btnAbortExit" class="cookie-btn cookie-btn-red" style="pointer-events:auto; padding:5px 12px; font-size:11px;">✖ EXIT</button>
              <div class="hud-cookie-pill"><small>STAGE</small><strong id="uiLvl">1/100</strong></div>
              <div class="hud-cookie-pill"><small>TARGET</small><strong id="uiScore" style="color:#4ade80;">0/100</strong></div>
              <div class="hud-cookie-pill"><small>LIVES</small><strong id="uiLives" style="color:#ff6b6b;">❤❤❤</strong></div>
            </div>

            <div class="gameplay-controls">
              <div class="hud-cookie-pill" style="padding:6px 14px;"><span style="color:#4ade80; font-weight:900;">AMMO: <b id="uiAmmo">15/15</b></span></div>
              <button id="reloadBtn" class="cookie-btn cookie-btn-green" style="pointer-events:auto; padding:6px 16px; font-size:12px;">⚡ RELOAD</button>
            </div>

            <canvas id="gameCanvas" width="720" height="1280"></canvas>

            <!-- WIN SCREEN -->
            <div id="winScreen" class="screen hidden">
              <div class="cookie-board-window" style="width:300px; display:flex; flex-direction:column; align-items:center;">
                <div class="ribbon-banner">VICTORY!</div>
                <div class="stars-cluster"><div id="winStar1" class="star-3d">⭐</div><div id="winStar2" class="star-3d">⭐</div><div id="winStar3" class="star-3d">⭐</div></div>
                <button id="btnNextLevel" class="cookie-btn cookie-btn-green" style="width:100%; margin-bottom:10px;">NEXT STAGE ▶</button>
                <button id="btnWinHub" class="cookie-btn cookie-btn-blue" style="width:100%;">STAGES MAP</button>
              </div>
            </div>

            <!-- GAME OVER SCREEN -->
            <div id="gameOverScreen" class="screen hidden">
              <div class="cookie-board-window" style="width:300px; display:flex; flex-direction:column; align-items:center;">
                <div class="ribbon-banner lose">FAILED!</div>
                <div style="font-size:48px; margin:8px 0;">🦆💨</div>
                <button id="btnRetry" class="cookie-btn" style="width:100%; margin-bottom:10px;">RETRY STAGE</button>
                <button id="btnHubReturn" class="cookie-btn cookie-btn-blue" style="width:100%;">STAGES MAP</button>
              </div>
            </div>
          </div>

          <script>
            // AUDIO SYNTHESIZER (NO EXTERNAL AUDIO FILES NEEDED)
            let audioCtx = null;
            function initAudio() {
              if (!audioCtx) {
                const AudioClass = window.AudioContext || window.webkitAudioContext;
                if (AudioClass) audioCtx = new AudioClass();
              }
              if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
              }
            }

            function playSound(type) {
              try {
                initAudio();
                if (!audioCtx) return;
                const now = audioCtx.currentTime;

                if (type === 'shoot') {
                  const osc = audioCtx.createOscillator();
                  const gain = audioCtx.createGain();
                  osc.type = 'sawtooth';
                  osc.frequency.setValueAtTime(320, now);
                  osc.frequency.exponentialRampToValueAtTime(40, now + 0.12);
                  gain.gain.setValueAtTime(0.7, now);
                  gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
                  osc.connect(gain);
                  gain.connect(audioCtx.destination);
                  osc.start(now);
                  osc.stop(now + 0.12);
                } else if (type === 'hit') {
                  const osc = audioCtx.createOscillator();
                  const gain = audioCtx.createGain();
                  osc.type = 'triangle';
                  osc.frequency.setValueAtTime(550, now);
                  osc.frequency.exponentialRampToValueAtTime(180, now + 0.18);
                  gain.gain.setValueAtTime(0.8, now);
                  gain.gain.linearRampToValueAtTime(0.01, now + 0.18);
                  osc.connect(gain);
                  gain.connect(audioCtx.destination);
                  osc.start(now);
                  osc.stop(now + 0.18);
                } else if (type === 'reload') {
                  const osc = audioCtx.createOscillator();
                  const gain = audioCtx.createGain();
                  osc.type = 'sine';
                  osc.frequency.setValueAtTime(600, now);
                  osc.frequency.setValueAtTime(900, now + 0.08);
                  gain.gain.setValueAtTime(0.3, now);
                  gain.gain.linearRampToValueAtTime(0.01, now + 0.18);
                  osc.connect(gain);
                  gain.connect(audioCtx.destination);
                  osc.start(now);
                  osc.stop(now + 0.18);
                } else if (type === 'win') {
                  [330, 440, 550, 660].forEach((freq, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.frequency.setValueAtTime(freq, now + i * 0.09);
                    gain.gain.setValueAtTime(0.4, now + i * 0.09);
                    gain.gain.linearRampToValueAtTime(0.01, now + i * 0.09 + 0.15);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + i * 0.09);
                    osc.stop(now + i * 0.09 + 0.15);
                  });
                }
              } catch (e) {}
            }

            // ADMOB COMMUNICATION
            function triggerAdMobInterstitial() {
              try {
                if (window.AdMobBridge) {
                  window.AdMobBridge.postMessage('showInterstitial');
                }
              } catch (e) {}
            }

            function requestRewardedAd() {
              initAudio();
              const btn = document.getElementById('btnWatchAd');
              if (btn) btn.innerText = '⏳ LOADING AD...';
              try {
                if (window.AdMobBridge) {
                  window.AdMobBridge.postMessage('showRewarded');
                } else {
                  alert('Rewarded Ad is only available in the mobile app APK.');
                  if (btn) btn.innerText = '🎬 FREE 100 COINS';
                }
              } catch (e) {
                if (btn) btn.innerText = '🎬 FREE 100 COINS';
              }
              setTimeout(() => {
                const b = document.getElementById('btnWatchAd');
                if (b) b.innerText = '🎬 FREE 100 COINS';
              }, 4000);
            }

            window.onRewardedAdReward = function() {
              coins += 100;
              saveState();
              playSound('win');
              alert('🎉 Badhai ho! 100 Coins mil gaye.');
              const b = document.getElementById('btnWatchAd');
              if (b) b.innerText = '🎬 FREE 100 COINS';
            };

            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const V_W = 720; const V_H = 1280;

            let coins = parseInt(localStorage.getItem('ds3d_coins') || '150');
            let unlockedGuns = JSON.parse(localStorage.getItem('ds3d_guns') || '[0]');
            let equippedGun = parseInt(localStorage.getItem('ds3d_equipped_gun') || '0');
            let maxUnlockedLvl = parseInt(localStorage.getItem('ds3d_max_lvl') || '0');
            let selectedLevel = 0;

            const REAL_GUNS = [
              { id: 0, name: 'Glock 19', mag: 15, cost: 0, src: "data:image/png;base64," },
              { id: 1, name: 'Colt .45', mag: 6, cost: 120, src: "data:image/png;base64," },
              { id: 2, name: 'Magnum 500', mag: 8, cost: 300, src: "data:image/png;base64," }
            ];

            const gunSprites = [];
            REAL_GUNS.forEach(g => {
              const img = new Image(); img.src = g.src; gunSprites[g.id] = img;
            });

            function saveState() {
              localStorage.setItem('ds3d_coins', coins);
              localStorage.setItem('ds3d_guns', JSON.stringify(unlockedGuns));
              localStorage.setItem('ds3d_equipped_gun', equippedGun);
              localStorage.setItem('ds3d_max_lvl', maxUnlockedLvl);
              const el = document.getElementById('hubCoins');
              if (el) el.innerText = coins;
            }

            let currentLvl = 0; let levelScore = 0; let lives = 3; 
            let maxAmmo = 15; let ammo = 15;
            let isReloading = false; let ducks = []; let particles = []; let frame = 0; let isRunning = false; let recoilY = 0;

            class Duck3D {
              constructor(lvlCfg) {
                this.dir = Math.random() > 0.5 ? 1 : -1;
                this.z = 0.6 + Math.random() * 0.8;
                this.baseSize = 58;
                this.x = this.dir === 1 ? -90 : V_W + 90;
                this.y = 220 + Math.random() * 480;
                this.speed = (lvlCfg.speed + Math.random() * 0.5) * this.z;
                this.vx = this.speed * this.dir;
                this.vy = (Math.random() - 0.5) * 1.6;
                this.points = 15;
                this.wing = 0;
              }
              update() {
                this.x += this.vx * (isReloading ? 0.4 : 1.0);
                this.y += Math.sin(frame * 0.09) * 2.0 + this.vy;
                this.wing += 0.25;
              }
              draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.scale(this.z * (this.dir < 0 ? -1 : 1), this.z);

                // Body Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.beginPath(); ctx.ellipse(0, 35, 40, 10, 0, 0, Math.PI * 2); ctx.fill();

                // Duck Body
                ctx.fillStyle = '#f59e0b';
                ctx.beginPath(); ctx.ellipse(0, 0, this.baseSize, this.baseSize * 0.65, 0, 0, Math.PI * 2); ctx.fill();

                // Wing Flap
                ctx.fillStyle = '#d97706';
                ctx.beginPath();
                ctx.ellipse(-10, Math.sin(this.wing) * 10, 26, 14, -0.2, 0, Math.PI * 2);
                ctx.fill();

                // Duck Head
                ctx.fillStyle = '#047857';
                ctx.beginPath(); ctx.arc(36, -18, 22, 0, Math.PI * 2); ctx.fill();

                // Beak
                ctx.fillStyle = '#ea580c';
                ctx.beginPath(); ctx.moveTo(50, -16); ctx.lineTo(76, -11); ctx.lineTo(50, -4); ctx.fill();

                // Eye
                ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(44, -22, 4.5, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(45.5, -22, 2, 0, Math.PI * 2); ctx.fill();

                ctx.restore();
              }
            }

            class Particle {
              constructor(x, y) {
                this.x = x; this.y = y;
                this.vx = (Math.random() - 0.5) * 12;
                this.vy = (Math.random() - 0.5) * 12;
                this.alpha = 1.0;
                this.color = Math.random() > 0.5 ? '#fde047' : '#f97316';
              }
              update() { this.x += this.vx; this.y += this.vy; this.alpha -= 0.04; }
              draw() {
                ctx.save(); ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color; ctx.fillRect(this.x, this.y, 6, 6);
                ctx.restore();
              }
            }

            function getLevelConfig(lvl) {
              return { targetScore: 100 + lvl * 30, speed: 2.0 + Math.min(lvl * 0.09, 2.8), spawnInterval: Math.max(40, 70 - lvl) };
            }

            function updateHud() {
              const cfg = getLevelConfig(currentLvl);
              document.getElementById('uiLvl').innerText = `${currentLvl + 1}/100`;
              document.getElementById('uiScore').innerText = `${levelScore}/${cfg.targetScore}`;
              document.getElementById('uiLives').innerText = '❤'.repeat(Math.max(0, lives));
              document.getElementById('uiAmmo').innerText = isReloading ? 'RELOAD...' : `${ammo}/${maxAmmo}`;
              document.getElementById('hubCoins').innerText = coins;
            }

            function startMission(lvlIndex) {
              initAudio();
              currentLvl = lvlIndex; levelScore = 0; lives = 3;
              maxAmmo = REAL_GUNS[equippedGun]?.mag || 15; ammo = maxAmmo;
              isReloading = false; ducks = []; particles = []; frame = 0; isRunning = true; recoilY = 0;
              document.getElementById('homeScreen').classList.add('hidden');
              document.getElementById('hubScreen').classList.add('hidden');
              document.getElementById('winScreen').classList.add('hidden');
              document.getElementById('gameOverScreen').classList.add('hidden');
              updateHud();
              loop();
            }

            function showWinScreen() {
              isRunning = false;
              playSound('win');
              if (currentLvl + 1 > maxUnlockedLvl) { maxUnlockedLvl = Math.min(99, currentLvl + 1); saveState(); }
              coins += 35; saveState();
              document.getElementById('winScreen').classList.remove('hidden');
              document.getElementById('winStar1').classList.add('lit');
              document.getElementById('winStar2').classList.add('lit');
              document.getElementById('winStar3').classList.add('lit');
              triggerAdMobInterstitial();
            }

            function endGame() {
              isRunning = false;
              document.getElementById('gameOverScreen').classList.remove('hidden');
              triggerAdMobInterstitial();
            }

            function handleShoot(clientX, clientY) {
              if (!isRunning) return;
              initAudio();
              const rect = canvas.getBoundingClientRect();
              const tx = (clientX - rect.left) * (V_W / rect.width);
              const ty = (clientY - rect.top) * (V_H / rect.height);

              if (ammo <= 0 || isReloading) {
                isReloading = true; updateHud();
                playSound('reload');
                setTimeout(() => { ammo = maxAmmo; isReloading = false; updateHud(); }, 400);
                return;
              }

              ammo--; recoilY = 24;
              playSound('shoot');

              for (let i = ducks.length - 1; i >= 0; i--) {
                const d = ducks[i];
                if (Math.hypot(tx - d.x, ty - d.y) < d.baseSize * d.z * 1.25) {
                  for (let p = 0; p < 12; p++) particles.push(new Particle(d.x, d.y));
                  levelScore += d.points; coins += 3; saveState();
                  playSound('hit');
                  ducks.splice(i, 1);
                  break;
                }
              }

              if (ammo <= 0) {
                isReloading = true;
                playSound('reload');
                setTimeout(() => { ammo = maxAmmo; isReloading = false; updateHud(); }, 400);
              }
              updateHud();
              if (levelScore >= getLevelConfig(currentLvl).targetScore) setTimeout(showWinScreen, 300);
            }

            function loop() {
              if (!isRunning) return;
              frame++;
              if (recoilY > 0) recoilY -= 2.5;

              // Sky & Lake Background
              ctx.clearRect(0, 0, V_W, V_H);
              const skyGrad = ctx.createLinearGradient(0, 0, 0, V_H * 0.65);
              skyGrad.addColorStop(0, '#0284c7'); skyGrad.addColorStop(1, '#38bdf8');
              ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, V_W, V_H * 0.65);

              // Water surface
              const waterGrad = ctx.createLinearGradient(0, V_H * 0.65, 0, V_H);
              waterGrad.addColorStop(0, '#0369a1'); waterGrad.addColorStop(1, '#082f49');
              ctx.fillStyle = waterGrad; ctx.fillRect(0, V_H * 0.65, V_W, V_H * 0.35);

              // Spawn Ducks
              const cfg = getLevelConfig(currentLvl);
              if (frame % cfg.spawnInterval === 0 && ducks.length < 5) ducks.push(new Duck3D(cfg));

              for (let i = ducks.length - 1; i >= 0; i--) {
                const d = ducks[i]; d.update(); d.draw();
                if ((d.dir === 1 && d.x > V_W + 100) || (d.dir === -1 && d.x < -100)) {
                  ducks.splice(i, 1); lives--; updateHud();
                  if (lives <= 0) { endGame(); return; }
                }
              }

              // Particles
              for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update(); particles[i].draw();
                if (particles[i].alpha <= 0) particles.splice(i, 1);
              }

              // Draw Player Weapon
              const gunImg = gunSprites[equippedGun];
              if (gunImg && gunImg.complete) {
                ctx.save();
                ctx.translate(V_W / 2, V_H - 120 + recoilY);
                ctx.drawImage(gunImg, -80, -40, 160, 80);
                ctx.restore();
              }

              requestAnimationFrame(loop);
            }

            // S-CURVE FLOATING ROAD & ARMORY RENDER
            window.switchHub = function(tab) {
              const road = document.getElementById('hubListRoad');
              const armory = document.getElementById('hubListArmory');
              const btnRoad = document.getElementById('tabLevels');
              const btnArmory = document.getElementById('tabGuns');

              if (tab === 'levels') {
                road.classList.remove('hidden');
                armory.classList.add('hidden');
                btnRoad.className = 'cookie-btn';
                btnArmory.className = 'cookie-btn cookie-btn-blue';
                renderRoad();
              } else {
                road.classList.add('hidden');
                armory.classList.remove('hidden');
                btnRoad.className = 'cookie-btn cookie-btn-blue';
                btnArmory.className = 'cookie-btn';
                renderArmory();
              }
            };

            function renderRoad() {
              const container = document.getElementById('hubListRoad');
              container.innerHTML = '';
              for (let i = 0; i < 100; i++) {
                const row = document.createElement('div');
                row.className = 'flow-node-row';
                const offsetPercent = 50 + Math.sin(i * 0.65) * 32;
                const bubble = document.createElement('div');
                bubble.className = `level-bubble ${i <= maxUnlockedLvl ? '' : 'locked'} ${selectedLevel === i ? 'active-node' : ''}`;
                bubble.style.left = `${offsetPercent}%`;
                bubble.innerHTML = `<small style="font-size:9px;">LVL</small><b style="font-size:16px;">${i + 1}</b>`;

                if (i <= maxUnlockedLvl) {
                  bubble.onclick = () => { selectedLevel = i; renderRoad(); };
                }
                row.appendChild(bubble);
                container.appendChild(row);
              }
            }

            function renderArmory() {
              const container = document.getElementById('hubListArmory');
              container.innerHTML = '';
              REAL_GUNS.forEach(g => {
                const card = document.createElement('div');
                card.className = `hub-card ${equippedGun === g.id ? 'active-item' : ''}`;
                const isUnlocked = unlockedGuns.includes(g.id);

                card.innerHTML = `
                  <strong style="color:#ffdf79; font-size:14px;">${g.name}</strong>
                  <img src="${g.src}" alt="${g.name}">
                  <span style="color:#a7f3d0; font-size:11px; font-weight:800; margin-bottom:6px;">AMMO: ${g.mag}</span>
                  ${
                    isUnlocked
                      ? `<button class="cookie-btn ${equippedGun === g.id ? 'cookie-btn-green' : 'cookie-btn-blue'}" style="padding:6px 14px; font-size:11px;" onclick="equipGun(${g.id})">
                          ${equippedGun === g.id ? 'EQUIPPED' : 'EQUIP'}
                        </button>`
                      : `<button class="cookie-btn" style="padding:6px 14px; font-size:11px;" onclick="buyGun(${g.id},${g.cost})">
                          🪙 ${g.cost}
                        </button>`
                  }
                `;
                container.appendChild(card);
              });
            }

            window.equipGun = function(id) {
              equippedGun = id; saveState(); renderArmory();
            };

            window.buyGun = function(id, cost) {
              if (coins >= cost) {
                coins -= cost; unlockedGuns.push(id); equippedGun = id;
                saveState(); renderArmory();
              } else {
                alert('Coins kam hain! Aur ducks shoot karein ya ad dekhein.');
              }
            };

            // Event Listeners
            canvas.addEventListener('pointerdown', (e) => handleShoot(e.clientX, e.clientY));
            document.getElementById('reloadBtn').addEventListener('pointerdown', (e) => {
              e.stopPropagation(); isReloading = true; updateHud();
              playSound('reload');
              setTimeout(() => { ammo = maxAmmo; isReloading = false; updateHud(); }, 400);
            });
            document.getElementById('btnAbortExit').onclick = () => {
              isRunning = false; document.getElementById('hubScreen').classList.remove('hidden'); switchHub('levels');
            };
            document.getElementById('btnEnterHub').onclick = () => {
              initAudio();
              document.getElementById('homeScreen').classList.add('hidden');
              document.getElementById('hubScreen').classList.remove('hidden');
              switchHub('levels');
            };
            document.getElementById('btnBackToHome').onclick = () => {
              document.getElementById('hubScreen').classList.add('hidden');
              document.getElementById('homeScreen').classList.remove('hidden');
            };
            document.getElementById('btnStartMission').onclick = () => startMission(selectedLevel);
            document.getElementById('btnNextLevel').onclick = () => startMission(currentLvl + 1);
            document.getElementById('btnWinHub').onclick = () => {
              document.getElementById('winScreen').classList.add('hidden');
              document.getElementById('hubScreen').classList.remove('hidden');
              switchHub('levels');
            };
            document.getElementById('btnRetry').onclick = () => startMission(currentLvl);
            document.getElementById('btnHubReturn').onclick = () => {
              document.getElementById('gameOverScreen').classList.add('hidden');
              document.getElementById('hubScreen').classList.remove('hidden');
              switchHub('levels');
            };

            saveState();
          </script>
        </body>
        </html>
        EOF

    - name: Automatically Find & Apply Custom App Icon
      run: |
        python3 -m pip install --upgrade Pillow
        python3 - << 'EOF'
        import os, glob
        from PIL import Image

        candidates = glob.glob('assets/*.[pP][nN][gG]') + glob.glob('*.[pP][nN][gG]')
        valid_icon = None
        for path in candidates:
            try:
                img = Image.open(path)
                img.verify()
                valid_icon = path
                print(f"Found valid app icon at: {valid_icon}")
                break
            except Exception:
                continue

        if valid_icon:
            src = Image.open(valid_icon).convert("RGBA")
            sizes = {
                'mipmap-mdpi': 48,
                'mipmap-hdpi': 72,
                'mipmap-xhdpi': 96,
                'mipmap-xxhdpi': 144,
                'mipmap-xxxhdpi': 192
            }
            res_dir = 'android/app/src/main/res'
            for folder, sz in sizes.items():
                target_folder = os.path.join(res_dir, folder)
                os.makedirs(target_folder, exist_ok=True)
                resized = src.resize((sz, sz), Image.Resampling.LANCZOS)
                resized.save(os.path.join(target_folder, 'ic_launcher.png'), 'PNG')
            print("Successfully injected custom app icons into all mipmap directories!")
        EOF

    - name: Fix Kotlin & Gradle Versions
      run: |
        find android -name "settings.gradle" -exec sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.24"/g' {} +
        find android -name "build.gradle" -exec sed -i "s/ext.kotlin_version = '[^']*'/ext.kotlin_version = '1.9.24'/g" {} +

    - name: Configure AdMob in AndroidManifest
      run: |
        MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
        if [ -f "$MANIFEST_FILE" ]; then
          if ! grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MANIFEST_FILE"; then
            sed -i '/<\/application>/i \        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-1590363558146928~3904943143"/>' "$MANIFEST_FILE"
          fi
        fi

    - name: Get Dependencies
      run: flutter pub get

    - name: Build Release APK
      run: flutter build apk --release --no-tree-shake-icons --build-name=2.0.1 --build-number=30401

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: duck-shooter-release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
