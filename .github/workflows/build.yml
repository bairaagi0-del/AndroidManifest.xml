        };

        function updateMoodButtonsUI() {
          ['day', 'night', 'rain', 'storm'].forEach(m => {
            const b1 = document.getElementById('moodBtn_' + m);
            const b2 = document.getElementById('sceneMood_' + m);
            if (b1) b1.classList.toggle('active', m === currentMood);
            if (b2) b2.classList.toggle('active', m === currentMood);
          });
        }

        let audioCtx = null;
        let engineOsc1 = null, engineOsc2 = null, engineSubOsc = null, engineGain = null, engineFilter = null;
        let bgmTimer = null;
        let bgmStep = 0;

        function ensureAudioContext() {
          if (!audioEnabled) return null;
          try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
          } catch (e) { return null; }
        }

        window.playCrashSound = function() {
          if (!audioEnabled) return;
          const ctxA = ensureAudioContext();
          if (!ctxA) return;
          try {
            const now = ctxA.currentTime;
            const thudOsc = ctxA.createOscillator();
            const thudGain = ctxA.createGain();
            thudOsc.type = 'sawtooth';
            thudOsc.frequency.setValueAtTime(140, now);
            thudOsc.frequency.exponentialRampToValueAtTime(22, now + 0.45);
            thudGain.gain.setValueAtTime(0.35, now);
            thudGain.gain.exponentialRampToValueAtTime(0.001, now + 0.48);
            thudOsc.connect(thudGain);
            thudGain.connect(ctxA.destination);
            thudOsc.start(now);
            thudOsc.stop(now + 0.5);

            const bufferSize = Math.floor(ctxA.sampleRate * 0.55);
            const noiseBuffer = ctxA.createBuffer(1, bufferSize, ctxA.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
              output[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctxA.sampleRate * 0.18));
            }
            const whiteNoise = ctxA.createBufferSource();
            whiteNoise.buffer = noiseBuffer;

            const crunchFilter = ctxA.createBiquadFilter();
            crunchFilter.type = 'bandpass';
            crunchFilter.frequency.setValueAtTime(950, now);
            crunchFilter.Q.setValueAtTime(1.4, now);

            const noiseGain = ctxA.createGain();
            noiseGain.gain.setValueAtTime(0.4, now);
            noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.54);

            whiteNoise.connect(crunchFilter);
            crunchFilter.connect(noiseGain);
            noiseGain.connect(ctxA.destination);
            whiteNoise.start(now);

            const glassFreqs = [2400, 3150, 4100, 2850];
            glassFreqs.forEach((gf, idx) => {
              const gOsc = ctxA.createOscillator();
              const gGain = ctxA.createGain();
              gOsc.type = 'triangle';
              const startT = now + 0.05 + (idx * 0.045);
              gOsc.frequency.setValueAtTime(gf, startT);
              gOsc.frequency.exponentialRampToValueAtTime(gf * 0.6, startT + 0.12);
              gGain.gain.setValueAtTime(0.08, startT);
              gGain.gain.exponentialRampToValueAtTime(0.001, startT + 0.13);
              gOsc.connect(gGain);
              gGain.connect(ctxA.destination);
              gOsc.start(startT);
              gOsc.stop(startT + 0.14);
            });
          } catch (e) {}
        };

        window.startHomeMenuMusic = function() {
          if (bgmTimer || !audioEnabled || isRunning) return;
          const bassPattern = [
            73.42, 73.42, 146.83, 73.42,
            87.31, 87.31, 174.61, 87.31,
            98.00, 98.00, 196.00, 98.00,
            110.00, 98.00, 87.31, 82.41
          ];
          const arpMelody = [
            587.33, 440.00, 349.23, 440.00,
            698.46, 523.25, 440.00, 523.25,
            783.99, 587.33, 440.00, 587.33,
            880.00, 783.99, 698.46, 659.25
          ];
          bgmTimer = setInterval(() => {
            if (!audioEnabled || isRunning) return;
            const ctxA = ensureAudioContext();
            if (!ctxA) return;
            try {
              const now = ctxA.currentTime;
              const step = bgmStep % 16;
              const bFreq = bassPattern[step];
              const mFreq = arpMelody[step];

              const bOsc = ctxA.createOscillator();
              const bFilter = ctxA.createBiquadFilter();
              const bGain = ctxA.createGain();
              bOsc.type = 'sawtooth';
              bOsc.frequency.setValueAtTime(bFreq, now);
              bFilter.type = 'lowpass';
              bFilter.frequency.setValueAtTime(420, now);
              bGain.gain.setValueAtTime(0.055, now);
              bGain.gain.exponentialRampToValueAtTime(0.002, now + 0.14);
              bOsc.connect(bFilter);
              bFilter.connect(bGain);
              bGain.connect(ctxA.destination);
              bOsc.start(now);
              bOsc.stop(now + 0.15);

              const mOsc = ctxA.createOscillator();
              const mGain = ctxA.createGain();
              mOsc.type = 'square';
              mOsc.frequency.setValueAtTime(mFreq, now);
              mGain.gain.setValueAtTime(0.022, now);
              mGain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
              mOsc.connect(mGain);
              mGain.connect(ctxA.destination);
              mOsc.start(now);
              mOsc.stop(now + 0.13);

              if (step % 4 === 0) {
                const kickOsc = ctxA.createOscillator();
                const kickGain = ctxA.createGain();
                kickOsc.type = 'sine';
                kickOsc.frequency.setValueAtTime(135, now);
                kickOsc.frequency.exponentialRampToValueAtTime(32, now + 0.11);
                kickGain.gain.setValueAtTime(0.09, now);
                kickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                kickOsc.connect(kickGain);
                kickGain.connect(ctxA.destination);
                kickOsc.start(now);
                kickOsc.stop(now + 0.12);
              }

              bgmStep++;
            } catch (e) {}
          }, 155);
        };

        window.stopHomeMenuMusic = function() {
          if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; }
        };

        window.startRealEngineAudio = function() {
          const ctxA = ensureAudioContext();
          if (!ctxA) return;
          window.stopRealEngineAudio();
          try {
            engineOsc1 = ctxA.createOscillator();
            engineOsc2 = ctxA.createOscillator();
            engineSubOsc = ctxA.createOscillator();
            engineFilter = ctxA.createBiquadFilter();
            engineGain = ctxA.createGain();

            engineOsc1.type = 'sawtooth';
            engineOsc2.type = 'triangle';
            engineSubOsc.type = 'square';

            engineFilter.type = 'lowpass';
            engineFilter.frequency.setValueAtTime(320, ctxA.currentTime);
            engineFilter.Q.setValueAtTime(4.0, ctxA.currentTime);
            engineGain.gain.setValueAtTime(0.015, ctxA.currentTime);

            engineOsc1.connect(engineFilter);
            engineOsc2.connect(engineFilter);
            engineSubOsc.connect(engineFilter);
            engineFilter.connect(engineGain);
            engineGain.connect(ctxA.destination);

            engineOsc1.start();
            engineOsc2.start();
            engineSubOsc.start();
          } catch (e) {}
        };

        window.stopRealEngineAudio = function() {
          try {
            if (engineOsc1) { engineOsc1.stop(); engineOsc1.disconnect(); engineOsc1 = null; }
            if (engineOsc2) { engineOsc2.stop(); engineOsc2.disconnect(); engineOsc2 = null; }
            if (engineSubOsc) { engineSubOsc.stop(); engineSubOsc.disconnect(); engineSubOsc = null; }
          } catch (e) {}
        };

        function updateEngineSoundState() {
          if (!audioEnabled || !engineOsc1 || !audioCtx) return;
          try {
            const now = audioCtx.currentTime;
            let basePitch = 55 + (speed * 0.85);
            if (gasPressed) basePitch *= 1.18;
            engineOsc1.frequency.setTargetAtTime(basePitch, now, 0.05);
            engineOsc2.frequency.setTargetAtTime(basePitch * 0.5, now, 0.05);
            engineSubOsc.frequency.setTargetAtTime(basePitch * 0.25, now, 0.05);

            let targetFilterFreq = 300 + (speed * 9.0) + (gasPressed ? 1400 : 0);
            engineFilter.frequency.setTargetAtTime(targetFilterFreq, now, 0.08);

            let targetGain = gasPressed ? 0.065 : 0.022;
            if (speed < 2) targetGain = 0.012;
            engineGain.gain.setTargetAtTime(targetGain, now, 0.08);
          } catch (e) {}
        }

        let hornActive = false;
        let hornWaves = [];

        function triggerCarHorn(pressed) {
          hornActive = pressed;
          const btn = document.getElementById('hornBtnEl');
          if (btn) btn.classList.toggle('pressed', pressed);

          if (pressed) {
            hornWaves.push({ x: playerX, y: playerWorldY - 40, radius: 18, alpha: 1.0 });
            if (audioEnabled) {
              try {
                const ctxA = ensureAudioContext();
                if (ctxA) {
                  const now = ctxA.currentTime;
                  const osc = ctxA.createOscillator();
                  const gain = ctxA.createGain();
                  osc.type = 'triangle';
                  osc.frequency.setValueAtTime(440, now);
                  osc.frequency.setValueAtTime(554.37, now + 0.1);
                  gain.gain.setValueAtTime(0.08, now);
                  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                  osc.connect(gain);
                  gain.connect(ctxA.destination);
                  osc.start(now);
                  osc.stop(now + 0.26);
                }
              } catch(e) {}
            }

            trafficCars.forEach((t) => {
              let distAhead = playerWorldY - t.worldY;
              if (distAhead > 60 && distAhead < 560 && Math.abs(t.x - playerX) < 88) {
                let candidateLanes = t.lane <= 1 ? [t.lane + 1, 3, 0] : [t.lane - 1, 0, 3];
                for (let cl of candidateLanes) {
                  let targetLaneX = lanePositions[cl];
                  let laneBusy = trafficCars.some(other => other !== t && Math.abs(other.x - targetLaneX) < 75 && Math.abs(other.worldY - t.worldY) < 190);
                  if (!laneBusy) {
                    t.lane = cl;
                    t.targetX = targetLaneX;
                    t.blinkerDir = t.targetX > t.x ? 1 : -1;
                    t.blinkerTimer = 45;
                    break;
                  }
                }
              }
            });
          }
        }

        function getPlayerClosestLane() {
          let closestLane = 1;
          let minDst = 99999;
          for (let i = 0; i < lanePositions.length; i++) {
            let dst = Math.abs(playerX - lanePositions[i]);
            if (dst < minDst) {
              minDst = dst;
              closestLane = i;
            }
          }
          return closestLane;
        }

        function createTrafficVehicle(lane, worldY) {
          let pal = carPalettes[Math.floor(Math.random() * carPalettes.length)];
          let cat = vehicleCategories[Math.floor(Math.random() * vehicleCategories.length)];
          let baseTrafficSpeed = cat.typeId === 5 ? (28 + Math.random() * 18) : (38 + Math.random() * 28);
          let startX = lanePositions[lane];
          return {
            lane: lane,
            x: startX,
            targetX: startX,
            worldY: worldY,
            speed: baseTrafficSpeed,
            bodyColor: pal.body,
            stripeColor: pal.stripe,
            accentColor: pal.accent,
            bodyStyle: cat.typeId,
            scaleW: cat.scaleW,
            scaleH: cat.scaleH,
            laneChangeCooldown: 90 + Math.floor(Math.random() * 130),
            blinkerDir: 0,
            blinkerTimer: 0
          };
        }

        function findNonOverlappingSlot(preferredLane, baseWorldY, ignoreCar = null) {
          let lane = preferredLane;
          let worldY = baseWorldY;
          for (let attempt = 0; attempt < 25; attempt++) {
            let targetX = lanePositions[lane];
            let conflict = false;
            for (let other of trafficCars) {
              if (other === ignoreCar) continue;
              if (Math.abs(other.targetX - targetX) < 85 && Math.abs(other.worldY - worldY) < 220) {
                conflict = true;
                break;
              }
            }
            if (!conflict) return { lane, worldY };
            lane = (lane + 1) % 4;
            if (attempt % 4 === 3) worldY -= 230;
          }
          return { lane, worldY: baseWorldY - 460 };
        }

        function spawnTrafficAhead() {
          trafficCars = [];
          let pLane = getPlayerClosestLane();
          for (let i = 0; i < 7; i++) {
            let desiredLane = (Math.random() < 0.65) ? pLane : (i % 4);
            let desiredY = playerWorldY - 250 - (i * 225);
            let slot = findNonOverlappingSlot(desiredLane, desiredY, null);
            trafficCars.push(createTrafficVehicle(slot.lane, slot.worldY));
          }
        }

        window.startGameSession = function() {
          window.stopHomeMenuMusic();
          window.startRealEngineAudio();
          document.getElementById('homeScreen').style.display = 'none';
          document.getElementById('garageScreen').style.display = 'none';
          document.getElementById('themesScreen').style.display = 'none';
          document.getElementById('settingsScreen').style.display = 'none';
          document.getElementById('gameOverScreen').style.display = 'none';
          document.getElementById('hudBar').style.display = 'flex';
          document.getElementById('gamepad').style.display = 'flex';

          playerX = lanePositions[1];
          playerWorldY = 0;
          totalDistanceMeters = 0;
          overtakeCount = 0;
          cameraWorldY = -560;
          speed = 0;
          gear = 1;
          hornWaves = [];
          window.setGas(false);
          window.setBrake(false);
          updateGearLeverUI();

          spawnTrafficAhead();

          sceneryObjects = [];
          for (let i = 0; i < 18; i++) {
            let side = i % 2 === 0 ? (80 + Math.random() * 190) : (1000 + Math.random() * 200);
            sceneryObjects.push({
              x: side,
              worldY: -i * 160,
              kind: i % 3 === 0 ? 'palm' : i % 3 === 1 ? 'cactus' : 'rock'
            });
          }

          windStreaks = [];
          for (let i = 0; i < 35; i++) {
            windStreaks.push({
              x: Math.random() * 1280,
              y: Math.random() * 720,
              vx: -(8 + Math.random() * 10),
              len: 35 + Math.random() * 55
            });
          }

          rainDrops = [];
          for (let i = 0; i < 95; i++) {
            rainDrops.push({
              x: Math.random() * 1280,
              y: Math.random() * 720,
              len: 18 + Math.random() * 22,
              vy: 16 + Math.random() * 10,
              vx: -3.5
            });
          }

          isRunning = true;
        };

        window.revivePlayerCar = function() {
          window.stopHomeMenuMusic();
          window.startRealEngineAudio();
          document.getElementById('gameOverScreen').style.display = 'none';
          document.getElementById('hudBar').style.display = 'flex';
          document.getElementById('gamepad').style.display = 'flex';
          trafficCars.forEach((t, idx) => {
            if (Math.abs(t.worldY - playerWorldY) < 420) {
              t.worldY = playerWorldY - 550 - (idx * 220);
            }
          });
          speed = 65;
          isRunning = true;
        };

        function drawVehicleOnCanvas(screenX, screenY, vObj, isPlayer, tiltAngle = 0) {
          ctx.save();
          ctx.translate(screenX, screenY);
          ctx.rotate(tiltAngle);
          const sw = vObj.scaleW || 1;
          const sh = vObj.scaleH || 1;
          ctx.scale(sw, sh);

          const st = vObj.bodyStyle || 0;

          ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
          ctx.beginPath();
          ctx.roundRect(-34, -66, 68, 134, st === 5 ? 8 : 20);
          ctx.fill();

          ctx.fillStyle = '#090d16';
          ctx.beginPath();
          ctx.roundRect(-36, -46, 10, 26, 3);
          ctx.roundRect(26, -46, 10, 26, 3);
          ctx.roundRect(-36, 20, 10, 28, 3);
          ctx.roundRect(26, 20, 10, 28, 3);
          if (st === 5) {
            ctx.roundRect(-36, -12, 10, 24, 3);
            ctx.roundRect(26, -12, 10, 24, 3);
          }
          ctx.fill();

          let bodyGrad = ctx.createLinearGradient(-30, -65, 30, 65);
          bodyGrad.addColorStop(0, vObj.bodyColor);
          bodyGrad.addColorStop(1, vObj.accentColor);
          ctx.fillStyle = bodyGrad;
          ctx.strokeStyle = st === 5 ? '#e2e8f0' : '#ffffff44';
          ctx.lineWidth = 2;

          if (st === 5) {
            ctx.beginPath();
            ctx.roundRect(-30, -68, 60, 134, 6);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = '#e2e8f0';
            ctx.fillRect(-22, -69, 44, 6);
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(-27, -2, 54, 64);
            ctx.strokeStyle = vObj.stripeColor;
            ctx.strokeRect(-27, -2, 54, 64);
            ctx.fillStyle = '#e2e8f0';
            ctx.beginPath();
            ctx.arc(-28, -14, 4, 0, Math.PI * 2);
            ctx.arc(28, -14, 4, 0, Math.PI * 2);
            ctx.fill();
          } else if (st === 3) {
            ctx.beginPath();
            ctx.roundRect(-30, -66, 60, 130, 10);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(-24, 14, 48, 44);
            ctx.fillStyle = '#090d16';
            ctx.beginPath();
            ctx.arc(0, 36, 11, 0, Math.PI * 2);
            ctx.fill();
          } else if (st === 1) {
            ctx.beginPath();
            ctx.roundRect(-30, -66, 60, 130, 12);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = vObj.stripeColor;
            ctx.fillRect(-11, -66, 7, 130);
            ctx.fillRect(4, -66, 7, 130);
            ctx.fillStyle = '#090d16';
            ctx.fillRect(-10, -48, 20, 18);
          } else {
            ctx.beginPath();
            ctx.moveTo(-22, -66);
            ctx.quadraticCurveTo(0, -74, 22, -66);
            ctx.lineTo(31, -30);
            ctx.lineTo(28, 56);
            ctx.quadraticCurveTo(0, 66, -28, 56);
            ctx.lineTo(-31, -30);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = vObj.stripeColor;
            ctx.fillRect(-5, -69, 10, 128);
          }

          ctx.fillStyle = '#0f172a';
          ctx.beginPath();
          if (st === 5) {
            ctx.roundRect(-24, -36, 48, 22, 4);
          } else {
            ctx.moveTo(-20, -26);
            ctx.quadraticCurveTo(0, -36, 20, -26);
            ctx.lineTo(17, 18);
            ctx.quadraticCurveTo(0, 26, -17, 18);
            ctx.closePath();
          }
          ctx.fill();

          ctx.fillStyle = 'rgba(56, 189, 248, 0.35)';
          ctx.fillRect(-16, -28, 32, 10);

          if (st === 1 || st === 2) {
            ctx.fillStyle = '#090d16';
            ctx.beginPath();
            ctx.roundRect(-32, 48, 64, 9, 3);
            ctx.fill();
          }

          ctx.fillStyle = '#fef08a';
          ctx.beginPath();
          ctx.ellipse(-18, -64, 5, 2.5, 0, 0, Math.PI * 2);
          ctx.ellipse(18, -64, 5, 2.5, 0, 0, Math.PI * 2);
          ctx.fill();

          if (currentMood === 'night' || currentMood === 'storm' || currentMood === 'rain') {
            let beamAlpha = currentMood === 'rain' ? 0.16 : 0.28;
            let beamGrad = ctx.createLinearGradient(0, -65, 0, -240);
            beamGrad.addColorStop(0, `rgba(254, 240, 138, ${beamAlpha})`);
            beamGrad.addColorStop(1, 'rgba(254, 240, 138, 0)');
            ctx.fillStyle = beamGrad;
            ctx.beginPath();
            ctx.moveTo(-22, -64);
            ctx.lineTo(-58, -240);
            ctx.lineTo(58, -240);
            ctx.lineTo(22, -64);
            ctx.closePath();
            ctx.fill();
          }

          if (isPlayer && gasPressed) {
            ctx.fillStyle = '#f97316';
            ctx.beginPath();
            ctx.arc(-12, 66 + Math.random() * 7, 5.5, 0, Math.PI * 2);
            ctx.arc(12, 66 + Math.random() * 7, 5.5, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.fillStyle = (isPlayer && brakePressed) ? '#ff0000' : '#ef4444';
          ctx.fillRect(-24, 56, 12, 4);
          ctx.fillRect(12, 56, 12, 4);

          if (!isPlayer && vObj.blinkerTimer > 0 && Math.floor(Date.now() / 120) % 2 === 0) {
            ctx.fillStyle = '#facc15';
            if (vObj.blinkerDir < 0) {
              ctx.beginPath();
              ctx.arc(-28, -58, 5, 0, Math.PI * 2);
              ctx.arc(-28, 56, 5, 0, Math.PI * 2);
              ctx.fill();
            } else if (vObj.blinkerDir > 0) {
              ctx.beginPath();
              ctx.arc(28, -58, 5, 0, Math.PI * 2);
              ctx.arc(28, 56, 5, 0, Math.PI * 2);
              ctx.fill();
            }
          }

          ctx.restore();
        }

        function drawSceneryItem(sc, screenY) {
          ctx.save();
          ctx.translate(sc.x, screenY);

          if (currentTheme === 'city') {
            if (sc.kind === 'palm') {
              ctx.fillStyle = '#0f172a';
              ctx.strokeStyle = '#38bdf8';
              ctx.lineWidth = 2;
              ctx.fillRect(-28, -50, 56, 90);
              ctx.strokeRect(-28, -50, 56, 90);
              ctx.fillStyle = '#fde047';
              for (let wy = -38; wy < 25; wy += 18) {
                ctx.fillRect(-16, wy, 10, 8);
                ctx.fillRect(6, wy, 10, 8);
              }
            } else {
              ctx.fillStyle = '#64748b';
              ctx.fillRect(-3, -30, 6, 45);
              ctx.fillStyle = '#ec4899';
              ctx.beginPath();
              ctx.arc(0, -30, 10, 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.restore();
            return;
          }

          if (currentTheme === 'snow') {
            if (sc.kind === 'rock') {
              ctx.fillStyle = '#94a3b8';
              ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI * 2); ctx.fill();
              ctx.fillStyle = '#f8fafc';
              ctx.beginPath(); ctx.arc(-5, -5, 14, 0, Math.PI * 2); ctx.fill();
            } else {
              ctx.fillStyle = '#475569';
              ctx.fillRect(-5, 0, 10, 20);
              ctx.fillStyle = '#0f766e';
              ctx.beginPath(); ctx.moveTo(0, -45); ctx.lineTo(-24, 5); ctx.lineTo(24, 5); ctx.closePath(); ctx.fill();
              ctx.fillStyle = '#f8fafc';
              ctx.beginPath(); ctx.moveTo(0, -45); ctx.lineTo(-12, -20); ctx.lineTo(12, -20); ctx.closePath(); ctx.fill();
            }
            ctx.restore();
            return;
          }

          if (sc.kind === 'palm') {
            ctx.fillStyle = '#78350f';
            ctx.fillRect(-6, -20, 12, 42);
            ctx.fillStyle = currentTheme === 'jungle' ? '#047857' : '#15803d';
            for (let a = 0; a < 6; a++) {
              ctx.save();
              ctx.translate(0, -20);
              ctx.rotate((a * Math.PI) / 3);
              ctx.beginPath();
              ctx.ellipse(22, 0, 22, 7, 0, 0, Math.PI * 2);
              ctx.fill();
              ctx.restore();
            }
          } else if (sc.kind === 'cactus') {
            ctx.fillStyle = currentTheme === 'jungle' ? '#15803d' : '#166534';
            ctx.beginPath();
            ctx.roundRect(-8, -35, 16, 65, 8);
            ctx.roundRect(-24, -18, 18, 10, 4);
            ctx.roundRect(-24, -32, 10, 20, 4);
            ctx.roundRect(8, -12, 18, 10, 4);
            ctx.roundRect(16, -28, 10, 22, 4);
            ctx.fill();
          } else {
            ctx.fillStyle = currentTheme === 'jungle' ? '#3f6212' : '#9a3412';
            ctx.beginPath();
            ctx.arc(0, 0, 24, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = currentTheme === 'jungle' ? '#65a30d' : '#c2410c';
            ctx.beginPath();
            ctx.arc(-6, -6, 15, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }

        window.addEventListener('keydown', (e) => {
          if (e.key === 'ArrowLeft' || e.key === 'a') { steerInput = -1; wheelSVG.style.transform = 'rotate(-55deg)'; }
          if (e.key === 'ArrowRight' || e.key === 'd') { steerInput = 1; wheelSVG.style.transform = 'rotate(55deg)'; }
          if (e.key === 'ArrowUp' || e.key === 'w') window.setGas(true);
          if (e.key === 'ArrowDown' || e.key === 's') window.setBrake(true);
          if (e.key === 'h' || e.key === 'H' || e.key === ' ') window.triggerCarHorn(true);
        });
        window.addEventListener('keyup', (e) => {
          if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'ArrowRight' || e.key === 'd') { steerInput = 0; wheelSVG.style.transform = 'rotate(0deg)'; }
          if (e.key === 'ArrowUp' || e.key === 'w') window.setGas(false);
          if (e.key === 'ArrowDown' || e.key === 's') window.setBrake(false);
          if (e.key === 'h' || e.key === 'H' || e.key === ' ') window.triggerCarHorn(false);
        });

        function masterLoop() {
          const activeCar = carsData[activeCarIndex] || carsData[0];
          const theme = worldThemes[currentTheme] || worldThemes.desert;

          if (isRunning) {
            let gearSpeedCap = manualGearMode
              ? Math.min(activeCar.topSpeed, (typeof gear === 'number' ? gear : 1) * (activeCar.topSpeed / 5) + 15)
              : activeCar.topSpeed;

            if (gasPressed) {
              let gearAccelFactor = manualGearMode ? (1.15 - ((typeof gear === 'number' ? gear : 1) * 0.08)) : 1.0;
              speed = Math.min(gearSpeedCap, speed + activeCar.accel * gearAccelFactor);
            } else {
              speed = Math.max(0, speed - 0.65);
            }

            if (brakePressed) {
              speed = Math.max(0, speed - 4.5);
            }

            if (!manualGearMode) {
              if (speed < 1) {
                gear = 'N';
              } else if (window.pyCalculateGear) {
                try { gear = window.pyCalculateGear(activeCarIndex, speed); } catch (e) { gear = Math.min(5, 1 + Math.floor(speed / 48)); }
              } else {
                gear = Math.min(5, 1 + Math.floor(speed / 48));
              }
            }
            updateGearLeverUI();

            let forwardStep = speed * 0.24;
            playerWorldY -= forwardStep;
            if (speed > 0.5) {
              totalDistanceMeters += forwardStep / 12;
            }

            if (speed > 1) {
              playerX += steerInput * (5.8 + speed * 0.018);
            }
            playerX = Math.max(385, Math.min(895, playerX));
          } else {
            let demoSpeed = 115;
            playerWorldY -= demoSpeed * 0.16;
            playerX = 640 + Math.sin(Date.now() * 0.0015) * 140;
          }

          let accelSurgeOffset = (isRunning && gasPressed) ? Math.min(95, speed * 0.32) : Math.min(35, speed * 0.14);
          let playerScreenY = 560 - accelSurgeOffset;
          cameraWorldY = playerWorldY - playerScreenY;

          let groundGrad = ctx.createLinearGradient(0, 0, 1280, 0);
          groundGrad.addColorStop(0, theme.groundLeft);
          groundGrad.addColorStop(0.25, theme.groundCenter);
          groundGrad.addColorStop(0.75, theme.groundCenter);
          groundGrad.addColorStop(1, theme.groundLeft);
          ctx.fillStyle = groundGrad;
          ctx.fillRect(0, 0, 1280, 720);

          ctx.fillStyle = theme.rippleColor;
          let firstRippleY = Math.floor(cameraWorldY / 180) * 180;
          for (let wy = firstRippleY; wy < cameraWorldY + 900; wy += 180) {
            let sy = wy - cameraWorldY;
            ctx.beginPath();
            ctx.ellipse(160, sy, 140, 28, 0.1, 0, Math.PI * 2);
            ctx.ellipse(1120, sy + 60, 140, 28, -0.1, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.fillStyle = theme.shoulderColor;
          ctx.fillRect(325, 0, 630, 720);

          ctx.fillStyle = theme.roadColor;
          ctx.fillRect(350, 0, 580, 720);

          let curbStart = Math.floor(cameraWorldY / 80) * 80;
          for (let wy = curbStart; wy < cameraWorldY + 800; wy += 40) {
            let sy = wy - cameraWorldY;
            let isRed = Math.floor(Math.abs(wy) / 40) % 2 === 0;
            ctx.fillStyle = isRed ? theme.curbA : theme.curbB;
            ctx.fillRect(338, sy, 12, 40);
            ctx.fillRect(930, sy, 12, 40);
          }

          ctx.fillStyle = theme.laneDash;
          let dashStart = Math.floor(cameraWorldY / 90) * 90;
          for (let wy = dashStart; wy < cameraWorldY + 810; wy += 90) {
            let sy = wy - cameraWorldY;
            ctx.fillRect(492, sy, 6, 48);
            ctx.fillRect(637, sy, 6, 48);
            ctx.fillRect(782, sy, 6, 48);
          }

          for (let sc of sceneryObjects) {
            let sy = sc.worldY - cameraWorldY;
            if (sy > 820) {
              sc.worldY = playerWorldY - 750 - Math.random() * 400;
              sc.x = Math.random() > 0.5 ? (70 + Math.random() * 210) : (1000 + Math.random() * 210);
            }
            drawSceneryItem(sc, sy);
          }

          for (let i = 0; i < trafficCars.length; i++) {
            let t = trafficCars[i];
            t.worldY -= t.speed * 0.14;

            let distAheadOfPlayer = playerWorldY - t.worldY;

            t.laneChangeCooldown = (t.laneChangeCooldown || 90) - 1;
            if (t.laneChangeCooldown <= 0) {
              t.laneChangeCooldown = 120 + Math.floor(Math.random() * 140);
              if (distAheadOfPlayer > 230 && distAheadOfPlayer < 900) {
                let deltaLane = Math.random() > 0.5 ? 1 : -1;
                let candidateLane = Math.max(0, Math.min(3, t.lane + deltaLane));
                if (candidateLane !== t.lane) {
                  let candX = lanePositions[candidateLane];
                  let occupiedByAI = trafficCars.some(other => other !== t && (other.lane === candidateLane || Math.abs(other.x - candX) < 80) && Math.abs(other.worldY - t.worldY) < 210);
                  let unsafeForPlayer = (distAheadOfPlayer < 340 && Math.abs(candX - playerX) < 85);
                  if (!occupiedByAI && !unsafeForPlayer) {
                    t.lane = candidateLane;
                    t.targetX = candX;
                    t.blinkerDir = deltaLane;
                    t.blinkerTimer = 55;
                  }
                }
              }
            }

            if (distAheadOfPlayer < 175 && Math.abs(t.targetX - playerX) < 75 && Math.abs(t.x - playerX) >= 75) {
              t.targetX = lanePositions[t.lane];
              t.blinkerTimer = 0;
            }

            for (let j = 0; j < trafficCars.length; j++) {
              if (i === j) continue;
              let other = trafficCars[j];
              if (Math.abs(t.x - other.x) < 72 || Math.abs(t.targetX - other.targetX) < 72) {
                let gapY = t.worldY - other.worldY;
                if (gapY > 0 && gapY < 195) {
                  t.worldY = other.worldY + 195;
                  t.speed = Math.min(t.speed, other.speed);
                }
              }
            }

            if (t.blinkerTimer > 0) t.blinkerTimer--;
            if (t.targetX !== undefined) {
              t.x += (t.targetX - t.x) * 0.085;
            }

            let tScreenY = t.worldY - cameraWorldY;

            if (tScreenY > 880) {
              if (isRunning) {
                coins += 25;
                overtakeCount++;
              }
              let playerLaneNow = getPlayerClosestLane();
              let desiredLane = (Math.random() < 0.72) ? playerLaneNow : (i % 4);
              let desiredWorldY = playerWorldY - 760 - Math.random() * 360;
              let slot = findNonOverlappingSlot(desiredLane, desiredWorldY, t);
              trafficCars[i] = createTrafficVehicle(slot.lane, slot.worldY);
              continue;
            } else if (tScreenY < -1150) {
              let playerLaneNow = getPlayerClosestLane();
              let desiredLane = (Math.random() < 0.7) ? playerLaneNow : t.lane;
              let desiredWorldY = playerWorldY - 680 - Math.random() * 320;
              let slot = findNonOverlappingSlot(desiredLane, desiredWorldY, t);
              t.lane = slot.lane;
              t.x = lanePositions[slot.lane];
              t.targetX = t.x;
              t.worldY = slot.worldY;
            }

            tScreenY = t.worldY - cameraWorldY;
            if (tScreenY > -190 && tScreenY < 860) {
              let aiTilt = (t.targetX - t.x) * 0.004;
              drawVehicleOnCanvas(t.x, tScreenY, t, false, aiTilt);
            }

            if (isRunning) {
              let hitWidth = 46 * ((activeCar.scaleW + (t.scaleW || 1)) * 0.5);
              let hitHeight = 98 * ((activeCar.scaleH + (t.scaleH || 1)) * 0.5);
              if (Math.abs(playerX - t.x) < hitWidth && Math.abs(playerScreenY - tScreenY) < hitHeight) {
                isRunning = false;
                window.stopRealEngineAudio();
                window.playCrashSound();
                window.setGas(false);
                window.setBrake(false);
                window.updateGlobalUI();
                if (window.AdMobBridge) {
                  try { window.AdMobBridge.postMessage('showInterstitial'); } catch(e) {}
                }
                document.getElementById('crashDistText').innerText = Math.floor(totalDistanceMeters) + 'm';
                document.getElementById('crashOvertakeText').innerText = overtakeCount;
                document.getElementById('hudBar').style.display = 'none';
                document.getElementById('gamepad').style.display = 'none';
                document.getElementById('gameOverScreen').style.display = 'flex';
              }
            }
          }

          for (let h = hornWaves.length - 1; h >= 0; h--) {
            let hw = hornWaves[h];
            hw.radius += 7;
            hw.alpha -= 0.04;
            let hScreenY = hw.y - cameraWorldY;
            ctx.save();
            ctx.strokeStyle = `rgba(253, 224, 71, ${hw.alpha})`;
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(hw.x, hScreenY, hw.radius, -Math.PI * 0.85, -Math.PI * 0.15);
            ctx.stroke();
            ctx.restore();
            if (hw.alpha <= 0) hornWaves.splice(h, 1);
          }

          let playerTilt = isRunning ? (steerInput * 0.12) : (Math.cos(Date.now() * 0.0015) * 0.06);
          drawVehicleOnCanvas(playerX, playerScreenY, activeCar, true, playerTilt);

          if (currentMood === 'night' || currentMood === 'storm') {
            ctx.fillStyle = currentMood === 'storm' ? 'rgba(2, 6, 23, 0.58)' : 'rgba(2, 6, 23, 0.52)';
            ctx.fillRect(0, 0, 1280, 720);
          } else if (currentMood === 'rain') {
            ctx.fillStyle = 'rgba(15, 23, 42, 0.28)';
            ctx.fillRect(0, 0, 1280, 720);
          }

          if (isRunning) {
            document.getElementById('uiSpeed').innerText = Math.floor(speed);
            document.getElementById('uiSpeedBar').style.width = Math.min(100, (speed / activeCar.topSpeed) * 100) + '%';
            document.getElementById('uiGear').innerText = gear;
            document.getElementById('uiCoins').innerText = coins;
            document.getElementById('uiDist').innerText = Math.floor(totalDistanceMeters);
            document.getElementById('uiOvertakes').innerText = overtakeCount;
            updateEngineSoundState();
          }

          requestAnimationFrame(masterLoop);
        }

        spawnTrafficAhead();
        window.updateGlobalUI();
        window.startHomeMenuMusic();
        requestAnimationFrame(masterLoop);
      </script>
    </body>
    </html>
    EOF

- name: Configure Gradle & SDK 34 (Android 10+ Target)
  run: |
    cat << 'EOF' > android/app/build.gradle
    plugins {
        id "com.android.application"
        id "kotlin-android"
        id "dev.flutter.flutter-gradle-plugin"
    }

    android {
        namespace = "com.govindgupta.apexturbof1"
        compileSdk = 34
        ndkVersion = flutter.ndkVersion

        compileOptions {
            sourceCompatibility = JavaVersion.VERSION_1_8
            targetCompatibility = JavaVersion.VERSION_1_8
        }

        kotlinOptions {
            jvmTarget = "1.8"
        }

        defaultConfig {
            applicationId = "com.govindgupta.apexturbof1"
            minSdk = 29
            targetSdk = 34
            versionCode = 2
            versionName = "2.0.0"
            multiDexEnabled = true
        }

        buildTypes {
            release {
                signingConfig = signingConfigs.debug
                minifyEnabled false
                shrinkResources false
            }
        }
    }

    flutter {
        source = "../.."
    }
    EOF

- name: Configure AdMob Application ID & Permissions in AndroidManifest
  run: |
    MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
    if [ -f "$MANIFEST_FILE" ]; then
      if ! grep -q "android.permission.INTERNET" "$MANIFEST_FILE"; then
        sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="com.google.android.gms.permission.AD_ID"/>' "$MANIFEST_FILE"
      fi
      if ! grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MANIFEST_FILE"; then
        sed -i '/<\/application>/i \        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-1590363558146928~3904943143"/>' "$MANIFEST_FILE"
      fi
    fi

- name: Fix Kotlin & Gradle Versions
  run: |
    find android -name "settings.gradle" -exec sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.24"/g' {} +
    find android -name "build.gradle" -exec sed -i "s/ext.kotlin_version = '[^']*'/ext.kotlin_version = '1.9.24'/g" {} +

- name: Get Flutter Dependencies
  run: flutter pub get

- name: Build Release APK
  run: flutter build apk --release --no-tree-shake-icons

- name: Upload Release APK Artifact
  uses: actions/upload-artifact@v4
  with:
    name: apex-turbo-f1-release-apk
    path: build/app/outputs/flutter-apk/app-release.apk
