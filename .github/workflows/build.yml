name: Build Duck Shooter Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.x'
        channel: 'stable'

    - name: Write Clean pubspec.yaml
      run: |
        cat << 'EOF' > pubspec.yaml
        name: duckshooter3d
        description: Duck Hunter 3D Ultimate Expedition
        publish_to: 'none'
        version: 1.9.8+18

        environment:
          sdk: '>=3.0.0 <4.0.0'

        dependencies:
          flutter:
            sdk: flutter
          webview_flutter: ^4.8.0
          google_mobile_ads: ^5.1.0

        flutter:
          uses-material-design: true
          assets:
            - assets/index.html
        EOF

    - name: Recreate Android Project Structure
      run: |
        flutter create . --org com.rahulgupta --project-name duckshooter3d

    - name: Fix Android Gradle Properties & Wrapper
      run: |
        echo "android.useAndroidX=true" > android/gradle.properties
        echo "android.enableJetifier=true" >> android/gradle.properties
        echo "org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError" >> android/gradle.properties
        
        mkdir -p android/gradle/wrapper
        cat << 'EOF' > android/gradle/wrapper/gradle-wrapper.properties
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
        networkTimeout=10000
        validateDistributionUrl=true
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=gradle/wrapper
        EOF

    - name: Write Clean lib/main.dart (Duck Shooter 2 Working Ad IDs)
      run: |
        mkdir -p lib
        cat << 'EOF' > lib/main.dart
        import 'dart:async';
        import 'package:flutter/material.dart';
        import 'package:flutter/services.dart';
        import 'package:webview_flutter/webview_flutter.dart';
        import 'package:google_mobile_ads/google_mobile_ads.dart';

        void main() async {
          WidgetsFlutterBinding.ensureInitialized();
          await MobileAds.instance.initialize();
          SystemChrome.setPreferredOrientations([
            DeviceOrientation.portraitUp,
            DeviceOrientation.portraitDown,
          ]);
          runApp(const MaterialApp(
            debugShowCheckedModeBanner: false,
            home: DuckShooterGame(),
          ));
        }

        class DuckShooterGame extends StatefulWidget {
          const DuckShooterGame({super.key});

          @override
          State<DuckShooterGame> createState() => _DuckShooterGameState();
        }

        class _DuckShooterGameState extends State<DuckShooterGame> {
          late final WebViewController _controller;
          BannerAd? _bannerAd;
          bool _isBannerReady = false;
          RewardedAd? _rewardedAd;
          InterstitialAd? _interstitialAd;
          bool _isRewardedLoading = false;

          // WORKING AD UNIT IDS FROM DUCK SHOOTER 2
          final String _realBannerId = 'ca-app-pub-1590363558146928/9630631281';
          final String _realInterstitialId = 'ca-app-pub-1590363558146928/7196039630';
          final String _realRewardedId = 'ca-app-pub-1590363558146928/2274885449';

          @override
          void initState() {
            super.initState();
            _loadBannerAd();
            _loadInterstitialAd();
            _loadRewardedAd();

            _controller = WebViewController()
              ..setJavaScriptMode(JavaScriptMode.unrestricted)
              ..setBackgroundColor(const Color(0xFF080301))
              ..addJavaScriptChannel(
                'AdMobBridge',
                onMessageReceived: (JavaScriptMessage message) {
                  if (message.message == 'showInterstitial') {
                    _showInterstitialAd();
                  } else if (message.message == 'showRewarded') {
                    _showRewardedAd();
                  }
                },
              );

            _initWebViewKeepingSaveData();
          }

          Future<void> _initWebViewKeepingSaveData() async {
            await _controller.clearCache();
            await _controller.loadFlutterAsset('assets/index.html');
          }

          void _loadBannerAd() {
            _bannerAd = BannerAd(
              adUnitId: _realBannerId,
              request: const AdRequest(),
              size: AdSize.banner,
              listener: BannerAdListener(
                onAdLoaded: (ad) {
                  setState(() {
                    _isBannerReady = true;
                  });
                },
                onAdFailedToLoad: (ad, err) {
                  ad.dispose();
                  setState(() {
                    _isBannerReady = false;
                  });
                  Future.delayed(const Duration(seconds: 6), _loadBannerAd);
                },
              ),
            )..load();
          }

          void _loadInterstitialAd() {
            InterstitialAd.load(
              adUnitId: _realInterstitialId,
              request: const AdRequest(),
              adLoadCallback: InterstitialAdLoadCallback(
                onAdLoaded: (ad) {
                  _interstitialAd = ad;
                },
                onAdFailedToLoad: (error) {
                  _interstitialAd = null;
                  Future.delayed(const Duration(seconds: 6), _loadInterstitialAd);
                },
              ),
            );
          }

          void _showInterstitialAd() {
            if (_interstitialAd != null) {
              _interstitialAd!.fullScreenContentCallback = FullScreenContentCallback(
                onAdDismissedFullScreenContent: (ad) {
                  ad.dispose();
                  _interstitialAd = null;
                  _loadInterstitialAd();
                },
                onAdFailedToShowFullScreenContent: (ad, error) {
                  ad.dispose();
                  _interstitialAd = null;
                  _loadInterstitialAd();
                },
              );
              _interstitialAd!.show();
              _interstitialAd = null;
            } else {
              _loadInterstitialAd();
            }
          }

          void _loadRewardedAd() {
            if (_isRewardedLoading || _rewardedAd != null) return;
            _isRewardedLoading = true;

            RewardedAd.load(
              adUnitId: _realRewardedId,
              request: const AdRequest(),
              rewardedAdLoadCallback: RewardedAdLoadCallback(
                onAdLoaded: (ad) {
                  _rewardedAd = ad;
                  _isRewardedLoading = false;
                },
                onAdFailedToLoad: (error) {
                  _rewardedAd = null;
                  _isRewardedLoading = false;
                  Future.delayed(const Duration(seconds: 5), _loadRewardedAd);
                },
              ),
            );
          }

          void _showRewardedAd() {
            if (_rewardedAd != null) {
              _rewardedAd!.fullScreenContentCallback = FullScreenContentCallback(
                onAdDismissedFullScreenContent: (ad) {
                  ad.dispose();
                  _rewardedAd = null;
                  _loadRewardedAd();
                },
                onAdFailedToShowFullScreenContent: (ad, error) {
                  ad.dispose();
                  _rewardedAd = null;
                  _loadRewardedAd();
                },
              );

              _rewardedAd!.show(
                onUserEarnedReward: (AdWithoutView ad, RewardItem reward) {
                  _controller.runJavaScript('window.onRewardedAdReward();');
                },
              );
              _rewardedAd = null;
            } else {
              _loadRewardedAd();
              ScaffoldMessenger.of(context).showSnackBar(
                const SnackBar(content: Text('Ad load ho raha hai, 2 second baad dobara dabayein!'), duration: Duration(seconds: 2)),
              );
            }
          }

          @override
          void dispose() {
            _bannerAd?.dispose();
            _interstitialAd?.dispose();
            _rewardedAd?.dispose();
            super.dispose();
          }

          @override
          Widget build(BuildContext context) {
            return Scaffold(
              backgroundColor: const Color(0xFF080301),
              body: SafeArea(
                child: Column(
                  children: [
                    Expanded(
                      child: WebViewWidget(controller: _controller),
                    ),
                    if (_isBannerReady && _bannerAd != null)
                      Container(
                        color: Colors.black,
                        width: _bannerAd!.size.width.toDouble(),
                        height: _bannerAd!.size.height.toDouble(),
                        child: AdWidget(ad: _bannerAd!),
                      ),
                  ],
                ),
              ),
            );
          }
        }
        EOF

    - name: Configure Hardcoded SDK and Gradle (API 34)
      run: |
        cat << 'EOF' > android/app/build.gradle
        plugins {
            id "com.android.application"
            id "kotlin-android"
            id "dev.flutter.flutter-gradle-plugin"
        }

        android {
            namespace = "com.rahulgupta.duckshooter3d"
            compileSdk = 34
            ndkVersion = flutter.ndkVersion

            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_1_8
                targetCompatibility = JavaVersion.VERSION_1_8
            }

            kotlinOptions {
                jvmTarget = "1.8"
            }

            defaultConfig {
                applicationId = "com.rahulgupta.duckshooter3d"
                minSdk = 24
                targetSdk = 34
                versionCode = 18
                versionName = "1.9.8"
                multiDexEnabled = true
            }

            buildTypes {
                release {
                    signingConfig = signingConfigs.debug
                    minifyEnabled false
                    shrinkResources false
                }
            }
        }

        flutter {
            source = "../.."
        }
        EOF

    - name: Clean App Icon & Remove White Lines
      run: |
        python3 -m pip install --upgrade Pillow
        python3 - << 'EOF'
        import os, glob
        from PIL import Image

        candidates = glob.glob('assets/*.[pP][nN][gG]') + glob.glob('*.[pP][nN][gG]')
        valid_icon = None
        for path in candidates:
            try:
                img = Image.open(path)
                img.verify()
                valid_icon = path
                break
            except Exception:
                continue

        if valid_icon:
            src = Image.open(valid_icon).convert("RGBA")
            sizes = {
                'mipmap-mdpi': 48,
                'mipmap-hdpi': 72,
                'mipmap-xhdpi': 96,
                'mipmap-xxhdpi': 144,
                'mipmap-xxxhdpi': 192
            }
            res_dir = 'android/app/src/main/res'
            for folder, sz in sizes.items():
                target_folder = os.path.join(res_dir, folder)
                os.makedirs(target_folder, exist_ok=True)
                resized = src.resize((sz, sz), Image.Resampling.LANCZOS)
                resized.save(os.path.join(target_folder, 'ic_launcher.png'), 'PNG')
        EOF

    - name: Fix Kotlin & Gradle Versions
      run: |
        find android -name "settings.gradle" -exec sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.24"/g' {} +
        find android -name "build.gradle" -exec sed -i "s/ext.kotlin_version = '[^']*'/ext.kotlin_version = '1.9.24'/g" {} +

    - name: Configure AdMob & Permissions in AndroidManifest
      run: |
        MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
        if [ -f "$MANIFEST_FILE" ]; then
          if ! grep -q "android.permission.INTERNET" "$MANIFEST_FILE"; then
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="com.google.android.gms.permission.AD_ID"/>' "$MANIFEST_FILE"
          fi
          if ! grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MANIFEST_FILE"; then
            sed -i '/<\/application>/i \        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-1590363558146928~3904943143"/>' "$MANIFEST_FILE"
          fi
        fi

    - name: Get Dependencies
      run: flutter pub get

    - name: Build Release APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: duck-shooter-release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
