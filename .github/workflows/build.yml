          .arcade-btn { background: linear-gradient(180deg, #f59e0b 0%, #b45309 100%); border: 2px solid #fde047; color: #fff; font-size: 13px; font-weight: 900; padding: 10px 22px; border-radius: 999px; cursor: pointer; box-shadow: 0 4px 0 #78350f, 0 8px 16px rgba(0,0,0,0.8); text-transform: uppercase; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
