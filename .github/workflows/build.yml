          </div>
          <div class="title-animated">APEX TURBO F1 & GT</div>
          <div id="homeCarPreview" class="my-2 w-32 h-24 flex items-center justify-center filter drop-shadow-[0_10px_20px_rgba(245,158,11,0.5)]"></div>
          <div class="flex flex-wrap items-center justify-center gap-2 my-2">
          <button class="arcade-btn btn-blue" style="padding:6px 14px; font-size:11px;" onclick="cycleTheme()">🌍 <span id="homeThemeLabel">SAHARA DESERT</span></button>
